  /* 5.67.12 — анимация возврата свайпом от левого края.
     Анимируем свойство translate (не transform): правило body.in-unit .app { transform:none !important }
     анимации не отменяет, а translate — отдельное свойство и с ним не конфликтует. */
  @keyframes edgeBackOut { from { translate: var(--drag-x, 0px) 0; opacity: 1; } to { translate: 100% 0; opacity: .5; } }
  @keyframes edgeBackIn  { from { translate: -22% 0; opacity: .35; } to { translate: 0 0; opacity: 1; } }

/* My wave — фирменное оформление (промпт) */
:root{
  --mw-menu:#E4F5FE; --mw-active:#D5EFFB; --mw-ink:#123F66;
  --mw-btn:#087DA0; --mw-done:#DDF3E6; --mw-card:#FBFDFF; --mw-line:#BFE3F5;
}
body{ color:var(--mw-ink); }
body::before{ background-image:url('assets/backgrounds/wave-original.jpg') !important; opacity:.55 !important;
  background-position:center center !important; }
body::after{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.26)); }
.app{ position:relative; z-index:1; }
#tabbar, .tabbar, nav.sidebar, .sidebar{ background:var(--mw-menu) !important; }
#tabbar::before, .tabbar::before{
  content:''; display:block; height:44px; margin:10px 12px 6px;
  background:url('assets/brand/my-wave-logo.png') center/contain no-repeat; }
.tab.active{ background:var(--mw-active) !important; border-radius:12px; }
.tab .ic{ width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
.tab .ic-img{ width:24px; height:24px; object-fit:contain; }
.card, .task-card, .unit-card{ background:var(--mw-card); border:1px solid var(--mw-line); border-radius:14px; }
button.btn, .btn-primary, .crs-btn{ background:var(--mw-btn) !important; color:#fff !important; }
.done, .task-card.done, .is-done{ background:var(--mw-done) !important; }

/* ===== Ручные отметки «пройдено» (галочки) =====
   man = { "<unit>": { u:1, p:{ "<partId>":1 } } }  — u: урок пройден, p: части */

const loadMan = () => { try { return JSON.parse(localStorage.getItem(LS_MAN) || '{}'); } catch { return {}; } };

const manUnit = u => !!(man[u.unit] && man[u.unit].u);
const manPart = (u, part) => !!(man[u.unit] && man[u.unit].p && man[u.unit].p[part.id]);

function manToggleUnit(n, ev) {

  const k = String(n); man[k] = man[k] || {};
  const wasDone = !!man[k].u;
  if (man[k].u) delete man[k].u; else man[k].u = 1;
  if (!man[k].u && !(man[k].p && Object.keys(man[k].p).length)) delete man[k];

// «Отметил урок пройденным» → помечаем связанное занятие в расписании «проведённым»,

function crsAutoDoneForUnit(n) {
  try {

    const evs = crsLessonList(from, today).filter(function (ev) {

}
function manTogglePart(n, pid, ev) {

  if (part && (part.kind === 'hw' || part.kind === 'record_hw')) { crsHwToggleDone(crsHwKey(n, pid), ev); return; }
  const k = String(n); man[k] = man[k] || {}; man[k].p = man[k].p || {};
  const p = String(pid);

}
const POS_KEY = 'arina-pos-v1';
const posSave = () => { if (!curUnit || !curPart) return; try { const m = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); m[curUnit.unit + ':' + curPart.id] = Math.round(window.scrollY); saveLocal(POS_KEY, JSON.stringify(m)); } catch (e) {} };
const posRestore = () => { if (!curUnit || !curPart) return; let y = 0; try { const m = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); y = m[curUnit.unit + ':' + curPart.id] || 0; } catch (e) {} window.scrollTo(0, y || 0); };
let _posT = null;
window.addEventListener('scroll', () => { clearTimeout(_posT); _posT = setTimeout(posSave, 250); }, { passive: true });
window.addEventListener('pagehide', posSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') posSave(); });
const favKey = (u, part, ti) => u.unit + ':' + part.id + ':' + ti;
const isFav = (u, part, ti) => loadFavs().includes(favKey(u, part, ti));
const favKeyPart = (u, part) => u.unit + ':' + part.id;
const isFavPart = (u, part) => loadFavs().includes(favKeyPart(u, part));
const APP_VER = '1.5.4';
// crmuro.ru снова на GitHub Pages (static), поэтому API — на своём поддомене api.crmuro.ru (D1-воркер)
const API_HOSTS = CrmSyncTransport.HOSTS;
const syncTransport = CrmSyncTransport.create();
let API_BASE = API_HOSTS[0];
async function apiFetch(path, opts) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const host=/^\/api\/(push\/|tingli-check|tingli-speak)/.test(path)?'https://tingli-api.crmuro.ru':API_BASE;
    const r = await fetch(host + path, Object.assign({}, opts || {}, {cache:'no-store', signal:ctrl.signal}));
    if (!r.ok) throw new Error('HTTP ' + r.status);

  } finally { clearTimeout(timer); }
}
async function syncRequest(path, opts) {

}

const EXTRA = (typeof EXTRA_UNITS !== 'undefined') ? EXTRA_UNITS : [];
const unitLabel = u => u.label || ('Урок ' + u.unit);
const unitName = u => { const l = unitLabel(u); if (!u.ru) return l; const sep = /^Урок[\s.]/.test(l) ? '. ' : (/^\d/.test(l) ? ' ' : ' · '); return l + sep + u.ru; };
let prog = load();
let tab = 'lessons';
let curUnit = null, curPart = null, curTi = 0, slideDir = 'next';
const app = document.getElementById('app');
const EMOJI = ['', '🎓', '🏫', '🏠', '✈️', '🎧', '🍽️', '🍲', '🔑', '🥚', '💡', '📱', '💻', '😟', '📝', '📚', '🛋️', '🛒', '⚖️', '✂️', '🩺', '🏦', '🚌', '🛍️', '🛫', '🚄', '🏨', '💸', '😠', '💌', '🎉'];
const TINTS = ['', ];

/* ===== Плеер ===== */
const audio = new Audio();
audio.preload = 'auto';
let partAudioKey = null;
// Кэш blob-URL: грузим файл целиком через fetch → seek/skip работают без серверного Range
const audioBlobCache = {};
// Версионированный URL аудио: новый номер версии = обход кэша (старые mp3 не залипают)
const AUDIO_BASE = 'https://raw.githubusercontent.com/Abramson2000/tingli-media/main/audio/';
function audUrl(name) { return AUDIO_BASE + encodeURIComponent(name) + '?v=' + APP_VER; }
const AUDIO_CACHE = 'arina-audio-v1';
async function getAudioUrl(name) {
  if (audioBlobCache[name]) return audioBlobCache[name];
  const url = audUrl(name);
  let resp = null;
  try {
    if (typeof caches !== 'undefined') {
      const c = await caches.open(AUDIO_CACHE);
      resp = await c.match(url);
      if (!resp) {
        const net = await fetch(url);
        if (net.ok) { try { await c.put(url, net.clone()); } catch (_) {} resp = net; }
      }
    } else {
      const net = await fetch(url);
      if (net.ok) resp = net;
    }
  } catch (e) {
    // офлайн: пробуем кэш без метки версии
    try {
      const c = await caches.open(AUDIO_CACHE);
      resp = await c.match(url) || await c.match(AUDIO_BASE + encodeURIComponent(name));
    } catch (_) {}
  }
  if (!resp || !resp.ok) return AUDIO_BASE + encodeURIComponent(name);
  const blobUrl = URL.createObjectURL(await resp.blob());
  audioBlobCache[name] = blobUrl;
  return blobUrl;
}
/* 5.96.16: аудио для офлайна. Прогреваем кэш всех файлов уроков. */
async function prefetchAllAudio(onProgress) {
  if (typeof caches === 'undefined') return { ok: 0, total: 0 };
  const names = [];
  (typeof ALL_UNITS !== 'undefined' ? ALL_UNITS : []).forEach(function (u) {
    (u.parts || []).forEach(function (pt) { if (pt.audio && names.indexOf(pt.audio) < 0) names.push(pt.audio); });
  });
  let ok = 0;
  for (let i = 0; i < names.length; i++) {
    try { await getAudioUrl(names[i]); ok++; } catch (e) {}
    if (onProgress) onProgress(i + 1, names.length);
  }
  return { ok: ok, total: names.length };
}
function audioUnitKey(u) {
  return (u && u.src ? u.src : 'main') + ':' + (u ? u.unit : '');
}
function setPartAudio(u, part) {
  if (!part.audio) { partAudioKey = null; showPlayer(false); return; }
  const key = audioUnitKey(u) + ':' + part.id + ':' + part.audio;
  if (partAudioKey === key) return; // тот же файл — не прерываем
  partAudioKey = key;
  audio.loop = true;
  document.getElementById('loopBtn').classList.add('loop-on');
  setSpeed(audio.playbackRate);
  getAudioUrl(part.audio).then(url => {
    if (partAudioKey !== key) return; // уже переключились на другое аудио
    audio.src = url;
    audio.load();
    updatePlayerUI();

}
function showPlayer(show) {

}
// idv-уроки: аудио урока висит на всех страницах/заданиях, не сбрасывается.
// Если у части своё аудио — играет оно; иначе — уже установленный трек не трогаем.
function ensureLessonAudio(u, part) {
  const ap = (part && part.audio) ? part : null;
  if (ap) { setPartAudio(u, ap); showPlayer(true); return; }
  const prefix = audioUnitKey(u) + ':';
  if (!partAudioKey || !partAudioKey.startsWith(prefix)) {
    const first = u && u.parts && u.parts.find(p => p.audio);
    if (first) { setPartAudio(u, first); showPlayer(true); return; }

function partDone(u, part) {
  if (part.kind === 'hw' || part.kind === 'record_hw') return crsHwState(crsHwKey(u.unit, part.id)) === 'done';
  if (manPart(u, part)) return true;
  const p = prog[u.unit] && prog[u.unit][part.id];
  if (!p) return false;
  if (part.kind === 'match') return !!(p.done);
  return part.tasks ? part.tasks.every((t, i) => p[i] === true) : false;
}
function partStats(u, part) {
  const p = prog[u.unit] && prog[u.unit][part.id];
  if (part.kind === 'hw' || part.kind === 'record_hw') {
    const total = part.kind === 'record_hw' ? (part.lines || []).length : (part.questions || []).length;
    if (crsHwState(crsHwKey(u.unit, part.id)) === 'done') return { done: total, total };
    if (part.kind === 'record_hw') return { done: (part.lines || []).filter((_, i) => recHwHasSync(u, part, i)).length, total };
    if (part.voiceHomework) return { done: voiceHwFlags(u.unit, part.id, total).filter(Boolean).length, total };
    return { done: (part.questions || []).filter((_, i) => hwLoad(u.unit, part.id, i).trim()).length, total };
  }
  if (part.kind === 'match') return { done: manPart(u, part) || p && p.done ? 1 : 0, total: 1 };
  const total = (part.tasks || []).length;
  return { done: manPart(u, part) ? total : (part.tasks || []).filter((_, i) => p && p[i] === true).length, total };
}
function unitStats(u) {
  let done = 0, total = 0;
  u.parts.forEach(part => { const s = partStats(u, part); done += s.done; total += s.total; });
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}

/* Свайпы: колонка уезжает влево / возвращается от левого края */
(function () {
  let sbTouch = null;
  const sbEl = () => document.getElementById('tabbar');
  const isNarrow = () => window.innerWidth < 900;
  document.addEventListener('touchstart', function (e) {
    if (window.TingliWritingFocus && window.TingliWritingFocus.isOpen()) { sbTouch = null; return; }
    if (!isNarrow()) return;
    const sb = sbEl();
    if (!sb || getComputedStyle(sb).display === 'none') return;
    const t = e.touches[0];
    const off = document.body.classList.contains('sb-off');
    const onSb = e.target && e.target.closest && e.target.closest('#tabbar');
    /* тащим колонку только если палец лёг на неё саму (закрыть) или у самого левого края (открыть) */
    if (!off && onSb) sbTouch = { x: t.clientX, y: t.clientY, mode: 'close', armed: true };
    else if (off && t.clientX < 24) sbTouch = { x: t.clientX, y: t.clientY, mode: 'open', armed: false };
    if (sbTouch && sbTouch.armed) sb.classList.add('sb-drag');
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!sbTouch) return;
    const t = e.touches[0];
    const dx = t.clientX - sbTouch.x;
    const dy = Math.abs(t.clientY - sbTouch.y);
    const sb = sbEl();
    const w = sb.offsetWidth;
    if (!sbTouch.armed) {
      /* пока палец не пошёл явно вбок — колонку не трогаем (иначе она дрожит при прокрутке) */
      if (Math.abs(dx) < 10 || Math.abs(dx) < dy) return;

    else sb.style.transform = 'translateX(' + Math.max(-w, dx - w) + 'px)';
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!sbTouch) return;
    const sb = sbEl();
    const dx = e.changedTouches[0].clientX - sbTouch.x;
    const armed = sbTouch.armed;
    sb.classList.remove('sb-drag');
    sb.style.transform = '';

      if (sbTouch.mode === 'close' && dx < -55) sbClose();

(function () {

  function paintShift(px) {
    const a = appEl(); if (!a) return;
    a.classList.add('edge-drag');

  }
  function clearShift(animated) {
    const a = appEl(); if (!a) return;

    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = Math.abs(t.clientY - st.y);

function mergeProgress(a, b) {
  const out = {};
  const units = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const u of units) {
    const pa = (a && a[u]) || {}, pb = (b && b[u]) || {};
    const parts = new Set([...Object.keys(pa), ...Object.keys(pb)]);
    const po = {};
    for (const pt of parts) {
      const ia = pa[pt] || {}, ib = pb[pt] || {};
      const items = new Set([...Object.keys(ia), ...Object.keys(ib)]);
      const io = {};
      for (const it of items) io[it] = !!(ia[it] || ib[it]);
      po[pt] = io;
    }
    out[u] = po;
  }
  return out;
}
function mergeMan(a, b) {
  const out = {};
  for (const u of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const A = (a && a[u]) || {}, B = (b && b[u]) || {};
    const o = {};
    if (A.u || B.u) o.u = 1;
    const p = {}, ks = new Set([...Object.keys(A.p || {}), ...Object.keys(B.p || {})]);
    for (const k of ks) if ((A.p && A.p[k]) || (B.p && B.p[k])) p[k] = 1;
    if (Object.keys(p).length) o.p = p;
    if (o.u || Object.keys(p).length) out[u] = o;
  }
  return out;
}

      if (typeof v['arina-manual-v1'] === 'string') { const o = JSON.parse(v['arina-manual-v1']) || {}; let uu = 0, pp = 0; Object.keys(o).forEach(function (u) { const x = o[u] || {}; if (x.u === 1) uu++; const p = x.p || {}; Object.keys(p).forEach(function (y) { if (p[y] === 1) pp++; }); }); rep.cloudManual = { units: uu, parts: pp }; }
      if (typeof v['arina-progress-v1'] === 'string') { const o = JSON.parse(v['arina-progress-v1']) || {}; let it = 0, dn = 0; Object.keys(o).forEach(function (u) { const parts = o[u] || {}; Object.keys(parts).forEach(function (pt) { const arr = parts[pt] || {}; Object.keys(arr).forEach(function (k) { it++; if (arr[k] === true) dn++; }); }); }); rep.cloudProgress = { items: it, done: dn }; }
      if (typeof v['arina-schedule-v1'] === 'string') { const o = JSON.parse(v['arina-schedule-v1']) || {}; const hs = o.hwstate || {}; let dn = 0; Object.keys(hs).forEach(function (k) { if (hs[k] && hs[k].state === 'done') dn++; }); rep.cloudHwstate = { total: Object.keys(hs).length, done: dn };
        const cp = o.payments || {}; rep.cloudPayments = { count: Object.keys(cp).length, ids: Object.keys(cp).slice(0, 80),
          rows: Object.keys(cp).slice(0, 80).map(function (id) { const x = cp[id] || {}; return [id, x.program, x.date, x.amount, x.lessons, x.closed ? 1 : 0].join('|'); }) };
        rep.cloudLessons = Object.keys(o.lessons || {}).length; rep.cloudSeries = Object.keys(o.series || {}).length; }
    }
  } catch (e) { rep.cloudErr = String((e && e.message) || e); }
  try { await apiFetch('/api/_report', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(rep) }); syncToast('📊 Диагностика отправлена'); } catch (e) { syncToast('⚠️ Диагностика не ушла'); }
}

function dictLoad() { try { return Object.values(JSON.parse(localStorage.getItem(DICT_KEY) || '{}')); } catch (e) { return []; } }
function dictSave(d) { try { saveLocal(DICT_KEY, JSON.stringify(Object.fromEntries(d.map(w => [w.zh, w])))); } catch (e) { alert('Не удалось сохранить слово на устройстве: '+e.message);throw e; } }

function dictAdd(items,label){
  const d=dictLoad();let added=0,dup=0;

}

 }

function dictCopyText(txt, btnSelector) {
  const done = () => {
    const b = document.querySelector(btnSelector);
    if (!b) return;
    const old = b.textContent;
    b.textContent = '✅ Скопировано';
    setTimeout(() => { b.textContent = old; }, 1500);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { alert('Не удалось скопировать.'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}
function dictCopyExcel() {
  // Формат для Excel (по просьбе Саши, 27.09.2026): две колонки.
  // A = иероглифы слова, B = «(пиньинь) перевод». Табуляция = разделитель колонок, перевод строки = новая строка.
  const d = dictLoad();
  if (!d.length) return;
  const clean = (v) => String(v == null ? '' : v).replace(/\t/g, ' ').replace(/\r?\n/g, ' ').trim();
  const txt = d.map(w => {
    const zh = clean(w.zh);
    const py = clean(w.py);
    const ru = clean(w.ru);
    return zh + '\t' + (py ? '(' + py + ') ' : '') + ru;
  }).join('\n');
  dictCopyText(txt, '.dict-export .btn.ghost');
}

// Единые значки частей во всех уроках (иероглифы в красном чипе):
// 句 фразы · 词 слова · 业 ДЗ · 文 текст/разбор · 话 диалог · 听 аудирование без скрипта · 检 проверка
const ICO_FRAZ = '句', ICO_WORD = '词', ICO_HW = '业', ICO_TEXT = '文', ICO_DLG = '话', ICO_LISTEN = '听', ICO_CHECK = '检';
function hasTxt(part) { return !!(part && part.text && String(part.text).trim()); }
function isDlg(part) {
  const t = (part.title || ''), tz = (part.titleZh || '');
  return /^\s*диалог/i.test(t) || /对话/.test(tz) || /对话/.test(t);
}
function isChk(part) {
  const t = (part.title || '') + ' ' + (part.titleZh || '');
  return /проверь себя|проверк|练习|соедини|连线|итоговое упражн/i.test(t);
}
function partNum(part) {
  if (part && part.ico) return part.ico;   // своя иконка части (напр. 音 у задания «Слушать»)
  if (part.kind === 'hw' || part.kind === 'record_hw') return ICO_HW;
  if (part.kind === 'words') return partIco(part);
  if (!hasTxt(part) && part.audio) return ICO_LISTEN;   // слушать без скрипта / задание на прослушивание
  if (isDlg(part)) return ICO_DLG;
  if (isChk(part)) return ICO_CHECK;
  if (hasTxt(part)) return ICO_TEXT;
  // остаток: номер части = номер аудио: '2-5-1.mp3' → '5-1'
  return (part.audio || '').replace(/^\d+-/, '').replace(/\.mp3$/, '');
}
function partIco(part) {
  const t = (part.title || ''), tz = (part.titleZh || '');
  if (/фраз/i.test(t) || /短语/.test(tz) || /短语/.test(t)) return ICO_FRAZ;
  return ICO_WORD;
}
let originTab = 'lessons';
function openUnit(n) {
  const u = ALL_UNITS.find(x => x.unit === n); if (!u) return;
  const fromList = !curUnit;
  curUnit = u; curPart = null;

  }
  if ((u.src === 'idv' || u.src === 'team')) ensureLessonAudio(u); else showPlayer(false);
  const uStat = unitStats(u), uMan = manUnit(u);
  app.innerHTML = `
    <div class="topbar"><button class="back" onclick="goBack()">←</button>
      <div><div class="u-title">${esc(unitName(u))}</div><div class="u-sub">${esc(u.zh)}</div></div></div>

let _rec = null, _chunks = [], _recBlob = null, _recT0 = 0, _recTimer = null;

async function speakToggle() {
  const btn = document.getElementById('speakRec');
  if (_rec && _rec.state === 'recording') { try { _rec.stop(); } catch (e) {} return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    speakMsg('Этот браузер не умеет записывать звук — открой в Safari или Chrome.', true); return;
  }
  let stream;

  catch (e) { speakMsg('Нет доступа к микрофону — разреши его для этого сайта.', true); return; }
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
  let mime = '';
  for (const t of types) { try { if (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { mime = t; break; } } catch (e) {} }
  try { _rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (e) { _rec = new MediaRecorder(stream); }
  _chunks = [];
  _rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) _chunks.push(ev.data); };
  _rec.onstop = () => {
    try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    _recBlob = new Blob(_chunks, { type: (_rec && _rec.mimeType) || 'audio/webm' });
    const a = document.getElementById('speakAud');
    if (a) { try { a.src = URL.createObjectURL(_recBlob); a.style.display = 'block'; } catch (e) {} }

    clearInterval(_recTimer);
    speakMsg('Записано ' + Math.max(1, Math.round((_recBlob ? _recBlob.size : 0) / 1024)) + ' КБ. Послушай себя и жми «Проверить ИИ».');

async function speakSend() {

    });
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) throw new Error((j && j.error) || 'не удалось распознать запись');
    const heard = String(j.text || '').trim();
    if (!heard) { speakMsg('Речь не распозналась — говори ближе к микрофону и чуть громче.', true); if (btn) btn.disabled = false; return; }

function matchPick(side, k) {

  if (side === 'l') {

    return;
  }

    const r0 = tile('R');
    r0.classList.add('badflash'); setTimeout(() => r0.classList.remove('badflash'), 450);
    return;
  }
  if (ms.selL === k) {
    // верно — пара собрана

    const lt = tile('L'), rt = tile('R');
    lt.classList.remove('sel'); lt.classList.add('matched'); rt.classList.add('matched');
    const pair = curPart.pairs[k];

/* ===== Устное ДЗ: пофразовая запись, сохранение на устройстве, отправка через Share Sheet ===== */
const REC_DB_NAME = 'arina-local-recordings-v1';
const REC_DB_STORE = 'clips';
let recHwRecorder = null, recHwStream = null, recHwChunks = [], recHwIndex = -1, recHwUrls = {};

function recHwKey(u, p, i) { return u.unit + '-' + p.id + '-' + i; }
function recHwMetaKey(u, p, i) { return 'tingliLocalRecMeta-' + recHwKey(u, p, i); }
function recHwHasSync(u, p, i) { try { return !!localStorage.getItem(recHwMetaKey(u,p,i)); } catch (e) { return false; } }
function recHwAllDoneSync(u, p) { return !!(p && p.lines && p.lines.length) && p.lines.every(function (_,i) { return recHwHasSync(u,p,i); }); }

function recHwDb() {
  return new Promise(function (resolve, reject) {
    const q = indexedDB.open(REC_DB_NAME, 1);
    q.onupgradeneeded = function () { if (!q.result.objectStoreNames.contains(REC_DB_STORE)) q.result.createObjectStore(REC_DB_STORE); };
    q.onsuccess = function () { resolve(q.result); };
    q.onerror = function () { reject(q.error); };
  });
}
async function recHwPut(key, blob) {
  const db = await recHwDb();
  await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readwrite');
    tx.objectStore(REC_DB_STORE).put(blob, key);
    tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
  });
  try { db.close(); } catch (e) {}
}
async function recHwGet(key) {
  const db = await recHwDb();
  const v = await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readonly');
    const q = tx.objectStore(REC_DB_STORE).get(key);
    q.onsuccess = function () { resolve(q.result || null); }; q.onerror = function () { reject(q.error); };
  });
  try { db.close(); } catch (e) {}
  return v;
}
async function recHwDel(key) {
  const db = await recHwDb();
  await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readwrite');
    tx.objectStore(REC_DB_STORE).delete(key);
    tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
  });
  try { db.close(); } catch (e) {}
}
function recHwMetaWrite(u,p,i,blob) {
  const m = { mime: blob.type || 'audio/webm', size: blob.size || 0, ts: Date.now() };
  try { localStorage.setItem(recHwMetaKey(u,p,i), JSON.stringify(m)); } catch (e) {}
}
function recHwClearUrls() {
  Object.keys(recHwUrls).forEach(function (k) { try { URL.revokeObjectURL(recHwUrls[k]); } catch (e) {} });
  recHwUrls = {};
}
function renderRecordHw(u, part) {
  showTabbar(false); partAudioKey = null; showPlayer(false);
  curUnit = u; curPart = part;
  recHwClearUrls();
  const done = (part.lines || []).filter(function (_,i) { return recHwHasSync(u,part,i); }).length;
  app.innerHTML = '<div class="topbar"><button class="back" onclick="goBack()">←</button>' +
    '<div style="flex:1;min-width:0"><div class="u-title">' + esc(part.title) + '</div><div class="u-sub">' + esc(u.zh || '') + '</div></div></div>' +
    dueBarHtml(u, part) +
    '<div class="rec-hw-intro">' + esc(part.text || '') + '<br><b>Записи хранятся локально на этом устройстве.</b></div>' +
    (part.lines || []).map(function (line,i) {
      const saved = recHwHasSync(u,part,i);
      return '<div class="rec-hw-item"><div class="rec-hw-top"><div class="rec-hw-num">' + (i+1) + '</div><div class="rec-hw-phrase">' + esc(line) + '</div></div>' +
        '<div class="rec-hw-state' + (saved ? ' saved' : '') + '" id="recHwState-' + i + '">' + (saved ? '✓ Запись сохранена' : 'Ещё не записано') + '</div>' +
        '<div class="rec-hw-actions"><button class="rec-hw-b rec" id="recHwBtn-' + i + '" onclick="recHwToggle(' + i + ')">' + (saved ? '🎤 Перезаписать' : '🎤 Записать') + '</button>' +
        (saved ? '<button class="rec-hw-b del" onclick="recHwDelete(' + i + ')">Удалить</button>' : '') + '</div>' +
        '<audio class="rec-hw-audio" id="recHwAudio-' + i + '" controls></audio></div>';
    }).join('') +
    '<div class="rec-hw-share"><div class="rec-hw-progress">Готово: ' + done + '/' + (part.lines || []).length + '</div>' +
      '<button class="btn" onclick="recHwShare()">Отправить в Telegram</button>' +
      '<div class="rec-hw-fallback" id="recHwFallback">Откроется системное меню «Поделиться» — выбери Telegram.</div></div>';
  recHwHydrate(u, part);
  window.scrollTo(0,0);
}
async function recHwHydrate(u, part) {
  for (let i = 0; i < (part.lines || []).length; i++) {
    if (!recHwHasSync(u,part,i)) continue;
    try {
      const blob = await recHwGet(recHwKey(u,part,i));
      const a = document.getElementById('recHwAudio-' + i);
      if (!blob || !a) continue;
      const url = URL.createObjectURL(blob); recHwUrls[i] = url; a.src = url; a.style.display = 'block';
    } catch (e) {}
  }
}
async function recHwToggle(i) {
  if (recHwRecorder && recHwRecorder.state === 'recording') {
    if (recHwIndex === i) { try { recHwRecorder.stop(); } catch (e) {} }
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    alert('Запись звука недоступна в этом браузере. Открой Tingli в Safari или Chrome.'); return;
  }
  try { recHwStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { alert('Нет доступа к микрофону. Разреши микрофон для Tingli.'); return; }
  const types = ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
  let mime = '';
  for (const t of types) { try { if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { mime = t; break; } } catch (e) {} }
  try { recHwRecorder = mime ? new MediaRecorder(recHwStream,{mimeType:mime}) : new MediaRecorder(recHwStream); }
  catch (e) { recHwRecorder = new MediaRecorder(recHwStream); }
  recHwIndex = i; recHwChunks = [];
  recHwRecorder.ondataavailable = function (e) { if (e.data && e.data.size) recHwChunks.push(e.data); };
  recHwRecorder.onstop = async function () {
    const idx0 = recHwIndex;
    const type = (recHwRecorder && recHwRecorder.mimeType) || mime || 'audio/webm';
    const blob = new Blob(recHwChunks,{type:type});
    try { if (recHwStream) recHwStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    recHwStream = null; recHwRecorder = null; recHwIndex = -1;
    if (blob.size < 800) { alert('Запись слишком короткая. Запиши фразу ещё раз.'); renderRecordHw(curUnit,curPart); return; }
    await recHwPut(recHwKey(curUnit,curPart,idx0), blob);
    recHwMetaWrite(curUnit,curPart,idx0,blob);
    renderRecordHw(curUnit,curPart);
  };
  recHwRecorder.start();
  const b = document.getElementById('recHwBtn-' + i); if (b) b.textContent = '⏹ Остановить';
  const s = document.getElementById('recHwState-' + i); if (s) { s.textContent = '● идёт запись…'; s.className = 'rec-hw-state live'; }
}
async function recHwDelete(i) {
  try { await recHwDel(recHwKey(curUnit,curPart,i)); } catch (e) {}
  try { localStorage.removeItem(recHwMetaKey(curUnit,curPart,i)); } catch (e) {}
  renderRecordHw(curUnit,curPart);
}
function recHwExt(mime) {
  mime = String(mime || '');
  if (mime.indexOf('mp4') >= 0 || mime.indexOf('m4a') >= 0) return 'm4a';
  if (mime.indexOf('ogg') >= 0) return 'ogg';
  if (mime.indexOf('mpeg') >= 0) return 'mp3';
  return 'webm';
}
async function recHwShare() {
  const lines = (curPart && curPart.lines) || [];
  const files = [];
  for (let i = 0; i < lines.length; i++) {
    if (!recHwHasSync(curUnit,curPart,i)) { alert('Сначала запиши все фразы. Не хватает записи № ' + (i+1)); return; }
    const blob = await recHwGet(recHwKey(curUnit,curPart,i));
    if (!blob) { alert('Не удалось найти запись № ' + (i+1) + ' на этом устройстве. Перезапиши её.'); return; }
    const ext = recHwExt(blob.type);
    files.push(new File([blob], 'Tingli_' + (curUnit ? curUnit.unit : 'hw') + '_hw_' + (i+1) + '.' + ext, {type:blob.type || 'audio/webm'}));
  }

      await navigator.share({title:((curUnit && curUnit.label) || 'ДЗ') + ' · аудио-ДЗ', text:'ДЗ Tingli: ' + ((curUnit && curUnit.label) || 'аудио') + ' — ' + files.length + ' зап.', files:files});

  if (!box) return;
  box.innerHTML = 'Прямое меню «Поделиться» недоступно. Скачай записи и отправь их в Telegram:' +
    files.map(function (f) {
      const url = URL.createObjectURL(f);
      return '<a href="' + url + '" download="' + esc(f.name) + '">Скачать ' + esc(f.name) + '</a>';
    }).join('');
}

function dueFmt(d) { if (!d) return ''; const p = String(d).split('-'); return p.length === 3 ? (p[2] + '.' + p[1] + '.' + p[0].slice(2)) : d; }

const VHW_DB = 'arina-voice-hw-v1', VHW_STORE = 'rec';
let _vhwRec = null, _vhwChunks = [], _vhwIdx = -1, _vhwStream = null;
function voiceHwFlagKey(unitN, partId) { return 'arina-vhw-' + unitN + '-' + partId; }
function voiceHwFlags(unitN, partId, n) {
  try {
    const a = JSON.parse(localStorage.getItem(voiceHwFlagKey(unitN, partId)) || '[]');
    return Array.from({length:n}, (_,i) => !!a[i]);
  } catch(e) { return Array(n).fill(false); }
}
function voiceHwSetFlag(unitN, partId, i, val, n) {
  const a = voiceHwFlags(unitN, partId, n); a[i] = !!val;
  saveLocal(voiceHwFlagKey(unitN, partId), JSON.stringify(a));
  const answered = a.filter(Boolean).length;
  let meta = {}; try { meta = JSON.parse(localStorage.getItem('arina-hwmeta-' + unitN + '-' + partId) || '{}'); } catch (_) {}
  saveLocal('arina-hwmeta-' + unitN + '-' + partId, JSON.stringify(Object.assign({},meta,{n:n, done:crsHwState(crsHwKey(unitN, partId)) === 'done', answered:answered})));
  updateAppBadge();
}
function voiceDb() {
  return new Promise((resolve,reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB недоступен'));
    const q = indexedDB.open(VHW_DB, 1);
    q.onupgradeneeded = () => { const db=q.result; if(!db.objectStoreNames.contains(VHW_STORE)) db.createObjectStore(VHW_STORE); };
    q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error || new Error('DB error'));
  });
}
function voiceRecKey(unitN, partId, i) { return unitN + '-' + partId + '-' + i; }
async function voicePut(unitN, partId, i, blob) {
  const db=await voiceDb();
  await new Promise((resolve,reject) => { const tx=db.transaction(VHW_STORE,'readwrite'); tx.objectStore(VHW_STORE).put({blob:blob,type:blob.type,ts:Date.now()}, voiceRecKey(unitN,partId,i)); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
  db.close();
}
async function voiceGet(unitN, partId, i) {
  try {
    const db=await voiceDb();
    const v=await new Promise((resolve,reject)=>{ const tx=db.transaction(VHW_STORE,'readonly'); const q=tx.objectStore(VHW_STORE).get(voiceRecKey(unitN,partId,i)); q.onsuccess=()=>resolve(q.result||null); q.onerror=()=>reject(q.error); });
    db.close(); return v;
  } catch(e) { return null; }
}
async function voiceDel(unitN, partId, i) {
  try {
    const db=await voiceDb();
    await new Promise((resolve,reject)=>{ const tx=db.transaction(VHW_STORE,'readwrite'); tx.objectStore(VHW_STORE).delete(voiceRecKey(unitN,partId,i)); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
    db.close();
  } catch(e) {}
}
function voiceExt(type) {
  type=String(type||'').toLowerCase();
  if(type.indexOf('mp4')>=0 || type.indexOf('m4a')>=0) return 'm4a';
  if(type.indexOf('mpeg')>=0 || type.indexOf('mp3')>=0) return 'mp3';
  if(type.indexOf('ogg')>=0) return 'ogg';
  return 'webm';
}
function voiceFile(rec, i) {
  const ext=voiceExt(rec && (rec.type || (rec.blob && rec.blob.type)));
  return new File([rec.blob], 'Tingli_214_A' + (i+1) + '.' + ext, {type:(rec.type || rec.blob.type || 'audio/webm')});
}
function voiceFallbackDownload(file) {
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function voiceHwToggle(i) {
  if(_vhwRec && _vhwRec.state==='recording'){
    if(_vhwIdx===i){ try{_vhwRec.stop();}catch(e){} }
    else alert('Сначала останови текущую запись.');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ alert('На этом устройстве запись через браузер недоступна.'); return; }
  try { _vhwStream=await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ alert('Разреши доступ к микрофону для Tingli.'); return; }
  const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/mpeg']; let mime='';
  for(const t of types){try{if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)){mime=t;break;}}catch(e){}}
  try{_vhwRec=mime?new MediaRecorder(_vhwStream,{mimeType:mime}):new MediaRecorder(_vhwStream);}catch(e){_vhwRec=new MediaRecorder(_vhwStream);}
  _vhwChunks=[]; _vhwIdx=i;
  const btn=document.getElementById('vhwRec'+i), st=document.getElementById('vhwState'+i);
  _vhwRec.ondataavailable=e=>{if(e.data&&e.data.size)_vhwChunks.push(e.data);};
  _vhwRec.onstop=async()=>{
    try{_vhwStream.getTracks().forEach(t=>t.stop());}catch(e){}
    const blob=new Blob(_vhwChunks,{type:_vhwRec.mimeType||mime||'audio/webm'});
    if(blob.size>1000){
      await voicePut(curUnit.unit,curPart.id,i,blob);
      voiceHwSetFlag(curUnit.unit,curPart.id,i,true,curPart.questions.length);
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    }
    _vhwRec=null; _vhwIdx=-1; _vhwStream=null;
    await voiceHwRefresh();
    const b=document.getElementById('vhwRec'+i); if(b)b.textContent='🎙 Перезаписать';
  };
  _vhwRec.start();
  if(btn) btn.textContent='⏹ Остановить и сохранить';
  if(st){st.textContent='● идёт запись…';st.className='vhw-state';}
}

/* Тип задания — по префиксу вопроса, для компактной группировки ДЗ. */
function hwQType(q) {
  const s = String(q || '').trim();
  if (/^собери/i.test(s)) return { id: 'build', label: 'собери предложение' };
  if (/^переведи/i.test(s)) return { id: 'tr', label: 'переведи' };
  if (/^вставь/i.test(s)) return { id: 'fill', label: 'вставь иероглиф' };
  if (/^выбери/i.test(s)) return { id: 'choose', label: 'выбери верное' };
  if (/^(составь|опиши|расскажи|напиши|ответь|преврати|назови|задай|спроси)/i.test(s)) return { id: 'say', label: 'опиши' };

async function hwCheck(i) {
  const part = curPart;
  const q0 = part.questions[i];
  const q = typeof q0 === 'string' ? q0 : q0.q;
  // Эталонный ответ (если он есть у задания) — ИИ сверяется с ним, а не угадывает по тексту
  const ref = (q0 && typeof q0 === 'object' && q0.ex) ? String(q0.ex) : '';
  const a = hwLoad(curUnit.unit, part.id, i).trim();
  const btn = document.querySelector('.hw-chk[data-i="' + i + '"]');
  const vd = document.querySelector('.hw-vd[data-i="' + i + '"]');
  if (!vd) return;
  if (!a) { vd.textContent = '— Сначала напиши ответ'; vd.className = 'hw-vd bad'; return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Проверяю…'; }
  vd.textContent = ''; vd.className = 'hw-vd';
  try {
    const r = await apiFetch('/api/tingli-check', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ q, a, ref, text: part.fullText || '' })
    });
    if (!r.ok) {
      // Сервер вернул ошибку — пробуем прочитать JSON, если не выйдет — общее сообщение
      let msg = 'Ошибка сервера (' + r.status + ')';
      try { const d = await r.json(); if (d.error) msg = d.error; } catch (_) {}
      vd.textContent = '⚠️ ' + msg; vd.className = 'hw-vd bad'; return;
    }
    const d = await r.json();
    if (!d.ok) { vd.textContent = '⚠️ ' + (d.error || 'ошибка сервера'); vd.className = 'hw-vd bad'; return; }
    vd.innerHTML = (d.correct ? '✅ ' : '❌ ') + esc(d.comment);
    vd.className = 'hw-vd ' + (d.correct ? 'good' : 'bad');
  } catch (e) {
    // Разные типы ошибок — разные сообщения
    var msg = 'Не удалось соединиться';
    if (e && e.name === 'AbortError') msg = 'Сервер долго отвечает, попробуй ещё раз';
    else if (e && e.message === 'Failed to fetch') msg = 'Нет связи — проверь интернет';
    vd.textContent = '⚠️ ' + msg; vd.className = 'hw-vd bad';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Проверить'; }
  }
}

function crsLessonList(fromYmd, toYmd) {

  });

    const end = crsParse(s.to && s.to < toYmd ? s.to : toYmd);
    for (let d = crsWeekStart(start); d <= end; d = crsAddDays(d, 1)) {
      const ymd = crsYmd(d);

      if (ymd < fromYmd || ymd > toYmd) continue;
      const dow = crsDow(ymd);

      const weeks = Math.floor((crsParse(ymd) - crsWeekStart(crsParse(s.from))) / (7 * 864e5));
      if (s.every === 2 && weeks % 2 !== 0) continue;

        continue;

    Object.keys(s.except || {}).forEach(function (fromDay) {
      const ex = s.except[fromDay];
      if (!ex || typeof ex !== 'object' || !ex.date) return;
      if (ex.date >= fromYmd && ex.date <= toYmd) out.push(Object.assign({}, s, { evId: 's:' + sid + ':' + ex.date, id: sid, date: ex.date, time: ex.time || s.time, status: 'moved', seriesId: sid, movedFrom: fromDay }));

}

  return Object.keys(st.payments || {}).map(function (id) {
    return Object.assign({ id: id }, st.payments[id] || {});
  }).filter(function (p) { return crsPayIsPaidProgram(p.program) && (!program || p.program === program); })
    .sort(function (a, b) { return ((a.date || '') + String(a.created || 0)).localeCompare((b.date || '') + String(b.created || 0)); });
}
function crsPayLedger(program) {
  const pays = crsPayList(program).filter(function (p) { return +p.lessons > 0; });
  const today = crsYmd(new Date());
  const active = pays.filter(function (p) { return !p.date || p.date <= today; });
  const packs = active.map(function (p) {
    const lessons = Math.max(0, +p.lessons || 0);
    const usedAtEntry = Math.min(lessons, Math.max(0, +p.usedAtEntry || 0));
    return { id: p.id, date: p.date || today, lessons: lessons, left: Math.max(0, lessons - usedAtEntry), amount: +p.amount || 0,
      closed: !!p.closed, allocated: 0, usedAtEntry: usedAtEntry, usedThrough: p.usedThrough || '',
      price: lessons ? ((+p.amount || 0) / lessons) : 0 };
  });
  const first = packs.length ? packs[0].date : '';
  let events = [];
  if (first) {
    try {
      events = crsLessonList(first, today).filter(function (ev) {
        return ev.program === program && ev.status !== 'canceled' && crsLessonState(ev) === 'done';
      }).sort(function (a, b) { return (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')); });
    } catch (e) { events = []; }
  }
  let spent = packs.reduce(function (a, p) { return a + p.usedAtEntry * p.price; }, 0);
  let used = packs.reduce(function (a, p) { return a + p.usedAtEntry; }, 0), unpriced = 0;
  const pricedEvents = [];
  events.forEach(function (ev) {
    // Если занятие уже учтено вручную (usedAtEntry + usedThrough), оно не должно
    // списываться ещё раз — в том числе с нового пакета, добавленного позже.
    // Иначе при внесении новой оплаты старый «проведённый» урок съедает урок из нового пакета.
    const coveredByManual = packs.some(function (p) { return p.usedAtEntry > 0 && p.usedThrough && ev.date <= p.usedThrough; });
    if (coveredByManual) return;
    let pack = null;
    for (let i = 0; i < packs.length; i++) {
      const afterManual = !packs[i].usedThrough || ev.date > packs[i].usedThrough;
      if (packs[i].left > 0 && packs[i].date <= ev.date && afterManual) { pack = packs[i]; break; }
    }
    if (!pack) { unpriced++; return; }
    pack.left--; pack.allocated++; used++; spent += pack.price;
    pricedEvents.push({ date: ev.date, price: pack.price, evId: ev.evId });
  });
  // Для старого аванса можно явно указать, что весь пакет уже выработан.
  // Недостающие старые занятия не обязаны существовать в нынешнем расписании.
  packs.forEach(function (p) {
    if (!p.closed || p.left <= 0) return;
    used += p.left; spent += p.left * p.price; p.left = 0;
  });
  const bought = packs.reduce(function (a, p) { return a + p.lessons; }, 0);
  const left = packs.reduce(function (a, p) { return a + p.left; }, 0);
  const leftMoney = packs.reduce(function (a, p) { return a + p.left * p.price; }, 0);
  const paid = packs.reduce(function (a, p) { return a + p.amount; }, 0);
  return { pays: pays, packs: packs, events: events, pricedEvents: pricedEvents, bought: bought, used: used, left: left,
    paid: paid, spent: spent, leftMoney: leftMoney, unpriced: unpriced };
}

    if (!del.length) return '<div class="crs-cols crs-cols-one"><div class="crs-empty">Удалённых заданий нет</div></div>';

    }).join('') + '</div>';

  return j.key;
}
function crsPushSetStatus(message) {
  const el = document.getElementById('crs-push-status');
  if (!el) { crsPushStatusSheet(message); return; }
  el.textContent = message;
  const s = crsStore();
  const state = document.getElementById('crs-push-state');
  if (state) {
    const perm = (typeof Notification !== 'undefined' && Notification.permission) ? Notification.permission : 'нет';
    state.textContent = 'Web Push: ' + (crsPushSupported() ? 'поддерживается' : 'не поддерживается') + ' · разрешение: ' + perm + ' · подписка: ' + ((s.push && s.push.on) ? 'сохранена' : 'нет');
  }
}
function crsPushWithTimeout(promise, timeoutMs, label) {
  let timer;
  return Promise.race([
    Promise.resolve(promise),
    new Promise(function (_, reject) {
      timer = setTimeout(function () { reject(new Error(label + ' — таймаут ' + Math.round(timeoutMs / 1000) + ' с')); }, timeoutMs);
    })
  ]).finally(function () { clearTimeout(timer); });
}
let crsPushEnableBusy = false;
async function crsPushEnable() {
  if (crsPushEnableBusy) return;
  crsPushEnableBusy = true;
  const button = document.getElementById('crs-push-enable');
  if (button) { button.disabled = true; button.textContent = 'Подключаю…'; }
  try {
    if (!crsPushSupported()) { crsPushSetStatus('Этот браузер не поддерживает Web Push. Открой Tingli в Safari/Chrome; на iPhone — из иконки «На экран Домой».'); return; }
    if (Notification.permission === 'denied') { crsPushSetStatus('Уведомления запрещены для crmuro.ru. Разреши их в настройках браузера и попробуй снова.'); return; }
    let perm = Notification.permission;
    let permissionRequest;
    try { permissionRequest = perm === 'granted' ? Promise.resolve(perm) : Notification.requestPermission(); }
    catch (e) { crsPushSetStatus('Браузер не смог запросить разрешение: ' + (e && e.message ? e.message : e)); return; }
    crsPushSetStatus('Шаг 1/4: ожидаю разрешение браузера…');
    try { perm = await crsPushWithTimeout(permissionRequest, 15000, 'Браузер не ответил на запрос разрешения'); }
    catch (e) { throw e; }
    if (perm !== 'granted') { crsPushSetStatus('Разрешение не выдано. Подписка не создана.'); return; }

    crsPushSetStatus('Шаг 2/4: получаю ключ Web Push…');
    const key = await crsPushWithTimeout(crsPushKey(), 15000, 'Не удалось получить ключ Web Push');
    crsPushSetStatus('Шаг 3/4: жду активный Service Worker…');
    const reg = await crsPushWithTimeout(navigator.serviceWorker.ready, 12000, 'Service Worker не активировался');
    if (!reg || !reg.pushManager) throw new Error('у активного Service Worker нет PushManager');

    crsPushSetStatus('Шаг 3/4: проверяю системную подписку…');
    let sub = await crsPushWithTimeout(reg.pushManager.getSubscription(), 10000, 'Браузер не ответил при проверке push-подписки');
    if (!sub) {
      crsPushSetStatus('Шаг 3/4: создаю системную push-подписку…');
      sub = await crsPushWithTimeout(reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: crsB64ToU8(key) }), 20000, 'Браузер не завершил создание push-подписки');
    }

    crsPushSetStatus('Шаг 4/4: сохраняю подписку на сервере…');
    const body = JSON.stringify({ sub: sub.toJSON(), tz: CRS_LOCAL_TZ, ver: APP_VER, reminders: crsUpcoming().slice(0, 200) });
    const r = await crsPushWithTimeout(crsApi('/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body }), 15000, 'Сервер не подтвердил сохранение подписки');
    const j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.ok !== true) throw new Error((j && j.error) || ('сервер ответил HTTP ' + r.status));

    const st = crsStore(); st.push = { on: true, at: Date.now(), synced: j.reminderCount || 0 }; crsSave(st);
    crsPushSetStatus('Web Push подключён. Сервер подтвердил подписку и сохранил ' + (j.reminderCount || 0) + ' напоминаний.');
  } catch (e) {
    try { const st = crsStore(); st.push = { on: false, at: Date.now() }; crsSave(st, true); } catch (saveErr) {}
    const detail = String(e && e.message ? e.message : e).slice(0, 240);
    console.error('Tingli Web Push activation failed:', detail);
    try { localStorage.setItem('arina-push-enable-error-v1', detail + ' | ' + new Date().toISOString()); } catch (storeErr) {}
    try { crsPushSetStatus('Подключение не удалось: ' + detail + '. Подписка не активна.'); }
    catch (uiErr) { alert('Tingli: Web Push не подключён. ' + detail); }
  } finally {
    crsPushEnableBusy = false;
    const currentButton = document.getElementById('crs-push-enable');
    if (currentButton) { currentButton.disabled = false; currentButton.textContent = 'Включить Web Push'; }
  }
}
let crsPushRefreshTimer = null;
function crsPushRefreshSoon() {
  if (crsPushRefreshTimer) clearTimeout(crsPushRefreshTimer);
  crsPushRefreshTimer = setTimeout(crsPushRefresh, 2500);
}
async function crsPushRefresh() {
  try {
    if (!crsPushSupported() || Notification.permission !== 'granted') return;
    const st = crsStore();
    if (!(st.push && st.push.on)) return;
    const hasScheduleData = Object.keys(st.lessons || {}).length || Object.keys(st.series || {}).length || Object.keys(st.hw || {}).length;
    if (!hasScheduleData) return; // расписание ещё не подтянулось — не затираем очередь на сервере пустым списком
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { st.push = { on: false, at: Date.now() }; crsSave(st, true); return; }
    const r = await crsApi('/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ sub: sub.toJSON(), tz: CRS_LOCAL_TZ, ver: APP_VER, reminders: crsUpcoming().slice(0, 200) })
    });
    const j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.ok !== true) throw new Error('server did not confirm schedule sync');
    st.push.synced = j.reminderCount || 0; st.push.lastSync = Date.now();
    try { localStorage.setItem(CRS_LS, JSON.stringify(st)); crsCache = st; } catch (e) {}
  } catch (e) {
    try { localStorage.setItem('arina-push-sync-error-v1', String(e && e.message || e) + ' | ' + new Date().toISOString()); } catch (x) {}
  }
}
async function crsPushTest() {
  try {
    if (!crsPushSupported() || Notification.permission !== 'granted') { crsPushStatusSheet('Сначала включи Web Push и разреши уведомления.'); return; }
    const st = crsStore();
    if (!(st.push && st.push.on)) { crsPushStatusSheet('Web Push не подключён. Нажми «Включить Web Push».'); return; }
    const reg = await navigator.serviceWorker.ready;
    const key = await crsPushKey();
    let sub = await reg.pushManager.getSubscription();
    // Принудительно пересоздаём подписку: старый endpoint мог протухнуть,
    // а ключ VAPID — смениться. Иначе тест уходит в мёртвую подписку.
    if (sub) { try { await sub.unsubscribe(); } catch (e) {} }
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: crsB64ToU8(key) });
    const testId = 'test-' + Date.now();
    const reminders = crsUpcoming().slice(0, 199);
    reminders.push({ id: testId, key: testId, kind: 'lesson', at: Date.now() + 90000, when: 0, title: 'Тест уведомлений', sub: 'Если пришло — push работает', url: location.href });
    const r = await crsApi('/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ sub: sub.toJSON(), tz: CRS_LOCAL_TZ, ver: APP_VER, reminders: reminders }) });
    const j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.ok !== true) throw new Error((j && j.error) || ('HTTP ' + r.status));
    crsPushStatusSheet('Тест поставлен: уведомление придёт примерно через 1,5 минуты. Можно закрыть приложение.');
  } catch (e) {
    crsPushStatusSheet('Тест не удался: ' + String(e && e.message || e).slice(0, 200));
  }
}
async function crsPushDisable() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { try { await crsApi('/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ endpoint: sub.endpoint }) }); } catch (e) {} await sub.unsubscribe(); }
  } catch (e) {}
  const st = crsStore(); st.push = { on: false, at: Date.now() }; crsSave(st);
  crsPushStatusSheet('Подписка снята. Напоминания будут только внутри приложения.');
}
function crsPushStatusSheet(msg) {
  const st = crsStore();
  const s = crsPushStatus();
  const base = (typeof Notification !== 'undefined' && Notification.permission) ? Notification.permission : 'нет';
  crsSheet('Напоминания', '<div class="crs-note" id="crs-push-status" role="status" aria-live="polite">' + esc(msg) + '</div>' +
    '<div class="crs-note" id="crs-push-state">Web Push: ' + (crsPushSupported() ? 'поддерживается' : 'не поддерживается') + ' · разрешение: ' + esc(base) + ' · подписка: ' + ((st.push && st.push.on) ? 'сохранена' : 'нет') + '</div>' +
    '<div class="crs-note">iPhone: установи Tingli на экран «Домой» и включи системные уведомления. Доставка push требует интернет-соединения.</div>' +
    '<div class="crs-lbl">Напоминания о занятиях</div><div class="crs-chips">' +
      '<button class="crs-chip' + (st.rem.lessons.on ? ' on' : '') + '" onclick="crsRemToggle(\'lessons\')">' + (st.rem.lessons.on ? 'включены' : 'выключены') + '</button>' +
      CRS_OFFSETS.map(function (o) {
        return '<button class="crs-chip' + ((st.rem.lessons.offsets || []).indexOf(o.m) >= 0 ? ' on' : '') + '" onclick="crsRemOff(\'lessons\',' + o.m + ')">' + o.t + '</button>';
      }).join('') + '</div>' +
    '<div class="crs-lbl">Напоминания о ДЗ</div><div class="crs-chips">' +
      '<button class="crs-chip' + (st.rem.hw.on ? ' on' : '') + '" onclick="crsRemToggle(\'hw\')">' + (st.rem.hw.on ? 'включены' : 'выключены') + '</button>' +
      CRS_OFFSETS.map(function (o) {
        return '<button class="crs-chip' + ((st.rem.hw.offsets || []).indexOf(o.m) >= 0 ? ' on' : '') + '" onclick="crsRemOff(\'hw\',' + o.m + ')">' + o.t + '</button>';
      }).join('') + '</div>' +
    '<div class="crs-note">Дальше: ' + (crsUpcoming().slice(0, 3).map(function (r) { return crsRemWord(r.when) + ' — ' + r.title; }).join('; ') || 'пока нечего напоминать') + '</div>' +
    '<div class="crs-actions crs-sticky"><button id="crs-push-enable" class="crs-b p" onclick="crsPushEnable()" style="flex:1">Включить Web Push</button>' +
    '<button class="crs-b s" onclick="crsPushTest()">Проверить уведомления</button>' +
    '<button class="crs-b s" onclick="crsPushDisable()">Снять подписку</button></div>');
}
function crsRemToggle(g) { const st = crsStore(); st.rem[g].on = !st.rem[g].on; crsSave(st); crsPushStatusSheet('Настройка сохранена.'); }
function crsRemOff(g, m) { const st = crsStore(); const a = st.rem[g].offsets || []; const i = a.indexOf(m); if (i < 0) a.push(m); else a.splice(i, 1); st.rem[g].offsets = a; crsSave(st); crsPushStatusSheet('Настройка сохранена.'); }

/* ---------- склейка с приложением ---------- */
function sbToggle() {
  if (document.body.classList.contains('sb-open')) sbClose(); else sbOpen();
}
function crsBoot() {
  try { crsStore(); } catch (e) {}
  // sync на старте оркестрируется в startup(); здесь — только UI/напоминания.
  setTimeout(function () {
    try { crsPushSyncReminders(); } catch (e) {}
    try { crsPushRefreshSoon(); } catch (e) {}
    setTimeout(function () { try { crsPushRefreshSoon(); } catch (e) {} }, 8000);
  }, 2000);
}
document.addEventListener('DOMContentLoaded', crsBoot);
let crsLastResumePull = 0;
function crsRefreshOnResume() {
  if (document.visibilityState === 'hidden') return;
  const now = Date.now();
  if (now - crsLastResumePull < 15000) return;
  crsLastResumePull = now;
  crsPullOnce = false;
  crsCloudPull();
}
window.addEventListener('focus', crsRefreshOnResume);
document.addEventListener('visibilitychange', crsRefreshOnResume);
window.addEventListener('online', crsRefreshOnResume);
/* ================= /CRS_BLOCK_V3 (часть 4) ================= */

goTab('sched');
if (/[#?]diag\b/.test(location.href)) location.replace('sync-check.html');
else startup();
window.addEventListener('hashchange',()=>{if(/[#?]diag\b/.test(location.href))location.assign('sync-check.html');});
updateAppBadge();
// Web Push links can open a specific existing Tingli unit or part.
try {
  const pushParams = new URLSearchParams(location.search);
  const pushUnit = Number(pushParams.get('unit'));
  const pushPartRaw = pushParams.get('part');
  if (Number.isInteger(pushUnit) && pushUnit > 0) setTimeout(function () {
    if (pushPartRaw !== null && Number.isInteger(Number(pushPartRaw)) && typeof openPart === 'function') openPart(pushUnit, Number(pushPartRaw));
    else if (typeof openUnit === 'function') openUnit(pushUnit);
    const clean = new URL(location.href); clean.searchParams.delete('unit'); clean.searchParams.delete('part');
    history.replaceState(null, '', clean.href);
  }, 180);
} catch (e) {}
// Service Worker: офлайн-режим
try { localStorage.removeItem('arina-offline-v1'); } catch (e) {}
if ('serviceWorker' in navigator) {
  const SW_BUILD = 'offline-1.5.4';
  navigator.serviceWorker.register('sw.js?v=' + SW_BUILD, { updateViaCache: 'none' }).catch(() => {});
  navigator.serviceWorker.ready.then(() => offlineRefreshStatus()).catch(() => {});
}
