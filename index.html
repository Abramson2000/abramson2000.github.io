    } catch (e) { btn.disabled = false; toast('⚠️ Не сохранено: ' + (e && e.message ? e.message : e)); }
  });
}

async function renderMyDay() {
  const view = document.getElementById('view');
  state.mydayOffset = 0;               // v3.15.2: выбор дня убран — «Мой день» всегда на сегодня
  const off = 0;
  const base = new Date(); base.setHours(0, 0, 0, 0);
  // v3.16.4: фильтр по менеджерам в «Моём дне» — ТОЛЬКО для аккаунта Абрамова (строго по e-mail,
  // без фолбэка на роль из localStorage — иначе чужой вход на этом же устройстве видел фильтр)
  const isBoss = String(CURRENT_EMAIL || '').toLowerCase() === 'abramson@crm.ru';
  // v3.28.0: в «Мой день» попадают и справочные клиники, взятые в работу (есть ответственный)
  let clinics = (await listClinics()).filter(c => !c.markedDel && ((c.kind || 'hospital') === 'hospital' || (isRefClinicCard(c) && String(c.manager || '').trim() !== '')));
  const MGR_PICK = ['Абрамов', 'Осечкина', 'Скокова'];   // v3.15.2: в «Моём дне» — только эти менеджеры
  const mgrs = MGR_PICK.filter(m => clinics.some(c => (c.manager || '') === m));
  // v4.12.0: имена для блока идей + цели визитов (из служебных записей notes)
  const nameById = {}; clinics.forEach(c => { nameById[c.id] = c.name; });
  await loadVisitMeta();
  const ideasDue = (await loadVisitIdeas()).filter(i => !i.remind || i.remind <= todayISO());
  if (state.mydayMgr) clinics = clinics.filter(c => (c.manager || '') === state.mydayMgr);
  // v3.26.2: поиск работает и в «Моём дне» (раньше строка поиска здесь молчала)
  clinics = clinics.filter(c => matchFilters(state.filters, c));   // v3.33.0: метки-фильтры и здесь
  const sMD = state.search;
  if (sMD) clinics = clinics.filter(c =>
    (c.name || '').toLowerCase().includes(sMD) ||
    (c.city || '').toLowerCase().includes(sMD) ||
    (c.region || '').toLowerCase().includes(sMD) ||
    (c.manager || '').toLowerCase().includes(sMD));
  // v4.55.0: визит, который идёт сегодня, остаётся в «Сегодня»; уходит только когда закончился
  const todayIso = todayISO();
  const effDate = (c) => {
    if (c.actionType === 'visit') {
      const p = visitPlanOf(c.id);
      if (p) {
        const a = String(p.date || '').slice(0, 10), b = visitEnd(p);
        if (a && b && todayIso >= a && todayIso <= b) return todayIso;   // идёт прямо сейчас
      }
    }
    return String(c.nextContact || '').slice(0, 10);
  };
  const days = c => { const d = effDate(c); return d ? Math.round((new Date(d + 'T00:00:00') - base) / 86400000) : null; };
  const visitAlreadyDone = (c) => {
    if (c.actionType !== 'visit') return false;
    const p = visitPlanOf(c.id);
    const end = p ? visitEnd(p) : String(c.nextContact || '').slice(0, 10);
    return !!end && end < todayIso;   // закончился раньше сегодня — убираем из «Моего дня»
  };
  const withDate = clinics.filter(c => effDate(c) && !visitAlreadyDone(c));
  const over = withDate.filter(c => days(c) < 0).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const tod  = withDate.filter(c => days(c) === 0);
  const week = withDate.filter(c => days(c) > 0 && days(c) <= 7).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const later = withDate.filter(c => days(c) > 7).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const row = (c, badge) => {
    // v4.12.0: под городом — зачем контакт: цель визита или пометка к звонку
    const sub = [c.city, c.manager].filter(Boolean).join(' · ');
    const why = (c.actionType === 'visit') ? '' : (c.privateNote || '');
    const vPlan = (c.actionType === 'visit') ? (visitPlanOf(c.id) || {}) : null;
    const vk = vPlan ? visitTitleOf(vPlan) : '';
    return `<div class="card list-row${state.selId === c.id ? ' selected' : ''}" data-id="${c.id}" data-kind="clinic">
      <div class="list-row-top">
        <span class="rn-wrap">${vk ? `<span class="visit-title-sm">${esc(vk)}</span>` : ''}<span class="list-row-name">${esc(c.name)}</span></span></span>
        <span class="row-next">${badge}</span>
      </div>
      ${subMarks(c, esc(sub || '—'))}
      ${(c.actionType === 'visit' && vPlan) ? `<div class="row-why">${esc(visitRange(vPlan))}</div>` : ''}
      ${why ? `<div class="row-why">${esc(why)}</div>` : ''}
    </div>`;
  };
  // v4.12.0: секция делится на «Звонки» и «Визиты» — визит видно сразу
  const block = (title, list, badgeFn, useChip) => {
    if (!list.length) return '';
    const calls = list.filter(c => c.actionType !== 'visit');
    const visits = list.filter(c => c.actionType === 'visit');
    const sub = (t, arr) => arr.length ? `<div class="md-sub">${t} · ${arr.length}</div><div class="list">${arr.map(c => row(c, badgeFn(c))).join('')}</div>` : '';
    return `<div class="md-sec">${title} · <b>${list.length}</b>${useChip && mgrSel ? mgrSel : ''}</div>`
      + sub('Звонки', calls) + sub('Визиты', visits);
  };
  // ---------- v4.18.0: «Пора вернуться» ----------
  // Сравниваем ЛИБО год к году, ЛИБО квартал к кварталу — переключателем. Месяц к месяцу не сравниваем.
  const MON_ALL = await loadMonthlyAll();
  const EXC = await loadControlExclusions();
  const PLANS = await loadPlans();
  const CUR_Y = new Date().getFullYear();
  const LAST_M = 9;
  const CTRL_MODE = localStorage.getItem('ctrlMode') === 'q' ? 'q' : 'ytd';
  const sumRange = (cid, y, m1, m2) => {
    const rows = MON_ALL[Number(cid)] || [];
    let s = 0, has = false;
    rows.forEach(r => {
      const m = Number(r.month);
      if (Number(r.year) === y && m >= m1 && m <= m2) { s += Number(r.sale || 0); has = true; }
    });
    return has ? s : null;
  };
  const MIN_BASE = 100000, DROP = 0.8;
  const att = [];
  clinics.forEach(c => {
    if (EXC.includes(Number(c.id))) return;
    let cur, prev, label;
    if (CTRL_MODE === 'q') { cur = sumRange(c.id, CUR_Y, 7, 9); prev = sumRange(c.id, CUR_Y - 1, 7, 9); label = 'III кв'; }
    else { cur = sumRange(c.id, CUR_Y, 1, LAST_M); prev = sumRange(c.id, CUR_Y - 1, 1, LAST_M); label = 'янв–сен'; }
    if (prev == null || prev < MIN_BASE || cur == null || cur >= prev * DROP) return;
    att.push({ c, cur, prev, label, lost: prev - cur });
  });
  att.sort((a, b) => b.lost - a.lost);
  const pct = (cur, prev) => Math.round((cur - prev) / prev * 100);
  const ctrlBlock = `<div class="cns-head"><span>Пора вернуться${att.length ? ' <b>' + att.length + '</b>' : ''}</span>
      <div class="md-mgr" id="ctrlModeBox"><button class="md-mgr-btn" id="ctrlModeBtn" title="Что сравниваем">${CTRL_MODE === 'q' ? 'Квартал к кварталу' : 'Год к году'}<span class="md-caret">▾</span></button>
      <div class="md-mgr-pop hidden" id="ctrlModePop">
        <button class="md-mgr-opt${CTRL_MODE === 'ytd' ? ' active' : ''}" data-ctrl-mode="ytd">Год к году</button>
        <button class="md-mgr-opt${CTRL_MODE === 'q' ? ' active' : ''}" data-ctrl-mode="q">Квартал к кварталу</button>
      </div></div></div>`
    + (att.length
      ? `<div class="list">${att.slice(0, 50).map(x => {
        const pr = pct(x.cur, x.prev);
        const pl = planOf(PLANS, x.c.id, CUR_Y);
        // план приводим к тому же периоду, что и сравнение: год → 9/12, квартал → 3/12
        const pf = CTRL_MODE === 'q' ? 3 / 12 : LAST_M / 12;
        const planPeriod = pl ? Math.round(pl * pf) : 0;
        const periodName = CTRL_MODE === 'q' ? 'III кв' : 'янв–сен';
        const planLine = planPeriod ? `<div class="row-why">план ${fmtMoney(planPeriod)} ₽ на ${periodName} · факт ${fmtMoney(x.cur)} ₽ · ${Math.round(x.cur / planPeriod * 100)}%</div>` : '';
        return `<div class="card list-row" data-id="${x.c.id}" data-kind="clinic">
          <div class="list-row-top"><span class="rn-wrap"><span class="list-row-name">${esc(x.c.name)}</span>${ownBadge(x.c)}</span><span class="nd nd-over">${pr}%</span></div>
          <div class="list-row-sub">${esc([x.c.city, x.c.manager].filter(Boolean).join(' · ') || '—')}</div>
          <div class="row-why">${esc(x.label)}: ${fmtMoney(x.cur)} против ${fmtMoney(x.prev)} ₽</div>
          ${planLine}
          <button class="ctrl-x" data-ctrl-hide="${x.c.id}" title="Убрать из контроля" aria-label="Убрать из контроля">✕</button>
        </div>`;
      }).join('')}</div>
      <div class="list-row-sub" style="margin-top:8px"><a href="#" id="ctrlExcLink" style="color:var(--muted)">Исключённые из контроля · ${EXC.length}</a></div>
      <div class="list-row-sub" style="margin-top:6px;color:var(--muted)">${CTRL_MODE === 'q' ? 'Сравнение III квартала 2026 с III кварталом 2025.' : 'Сравнение января–сентября 2026 с тем же периодом 2025.'} Порог — падение от 20% при базе от 100 тыс. ₽. Месяц к месяцу не сравниваем.</div>`
      : `<div class="empty">Провалов ${CTRL_MODE === 'q' ? 'квартал к кварталу' : 'год к году'} нет.</div>`);
  const chip = () => state.mydayMgr || 'Все';
  const mgrSel = isBoss ? `<div class="md-mgr" id="mdMgrBox"><button class="md-mgr-btn" id="mdMgrBtn" title="Фильтр по менеджеру">${esc(chip())}<span class="md-caret">▾</span></button>
      <div class="md-mgr-pop hidden" id="mdMgrPop">${[''].concat(mgrs).map(m => `<button class="md-mgr-opt${(state.mydayMgr || '') === m ? ' active' : ''}" data-m="${esc(m)}">${esc(m || 'Все менеджеры')}</button>`).join('')}</div>
    </div>` : '';
  // v3.16.0: без верхней строки «Мой день · дата», без дублирующего «просрочено», без выбора дня
  // и без кнопок выполнения; заголовки — только над группами, пустые группы не выводятся
  // v3.17.2: на телефоне кнопка фильтра встроена в строку первого непустого заголовка;
  // v3.27.0: на компьютере — всегда своя строка сверху (как на телефоне, но не спрятана)
  // у визита в строке показываем диапазон дат, у звонка — дату
  const badgeOf = (c) => {
    if (c.actionType === 'visit') {
      const p = visitPlanOf(c.id);
      if (p && p.date) return visitRange(p);
    }
    return fmtDate(c.nextContact);
  };
  const bOver = block('Просрочено', over, badgeOf, true);
  const bToday = block('Сегодня', tod, badgeOf, !over.length);
  const bLater = block('Позже', [...week, ...later].slice(0, 20), badgeOf, !over.length && !tod.length);
  const ideasBlock = ideasDue.length ? `<div class="md-sec">Пора выбрать дату визита · <b>${ideasDue.length}</b></div>
    <div class="list">${ideasDue.map(i => {
      const nm = nameById[i.clinic_id] || ('клиника #' + i.clinic_id);
      const win = (i.from && i.to) ? (fmtDate(i.from) + ' — ' + fmtDate(i.to)) : (i.from ? 'с ' + fmtDate(i.from) : '');
      const parts = (i.participants || []).join(', ');

async function renderContacts() {
  const view = document.getElementById('view');
  const s = state.search;
  const f = state.filters;
  // v3.16.2: люди, клиники и связки — параллельно и из кэша
  const [people, clinics, links] = await Promise.all([listPeople(), listClinics(), listClinicLinks()]);
  const clinicMap = {};
  clinics.forEach(c => clinicMap[c.id] = c);
  const extra = {};
  links.forEach(l => { (extra[l.person_id] = extra[l.person_id] || []).push(l.clinic_id); });
  const orgIds = (p) => {
    const ids = [];
    if (p.clinicId) ids.push(p.clinicId);
    (extra[p.id] || []).forEach(id => { if (!ids.includes(id)) ids.push(id); });
    return ids;
  };
  const orgName = (p) => orgIds(p).map(id => clinicMap[id] && clinicMap[id].name).filter(Boolean).join(', ');
  const loc = (p) => {
    const c = clinicMap[p.clinicId];
    return { region: (c && c.region) || p.region || '', city: (c && c.city) || p.city || '' };
  };
  const kindOf = (p) => (isFirmContact(p) ? 'Компания' : (isRefDoc(p) ? 'Врач' : 'Клиника'));
  let rows = people.filter(p => !p.markedDel && (p.phone || p.email));
  rows = rows.filter(p => {
    const org = orgName(p);
    const l = loc(p);
    return (!s ||
      (p.fullName || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (p.position || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (p.phone || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (p.email || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      org.toLowerCase().replace(/ё/g,'е').includes(s) ||
      (l.city || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (l.region || '').toLowerCase().replace(/ё/g,'е').includes(s)) &&
      matchFilters(f, Object.assign({}, p, { region: l.region || p.region || '', city: l.city || p.city || '' }));
  });
  rows.sort((a, b) => (a.fullName || '').localeCompare(b.fullName || '', 'ru'));
  const head = `<div class="cns-head"><span>Контакты · <b>${rows.length}</b></span></div>`;
  if (!rows.length) {
    view.innerHTML = head + `<div class="empty">${s ? 'Ничего не найдено' : 'Контактов пока нет'}</div>`;
    return;
  }
  view.innerHTML = head + '<div class="list">' + rows.map(p => {
    // v3.30.5: «Контакты» (справочник) — вторая строка: СНАЧАЛА ГОРОД, затем учреждение, затем должность
    const sub = [loc(p).city, orgName(p), shortPos(p.position)].filter(Boolean).join(' · ');
    return `<div class="card list-row" data-id="${p.id}" data-kind="person">
      <div class="list-row-top"><span class="list-row-name">${esc(p.fullName)}</span></div>
      <div class="list-row-sub">${esc(sub || '—')}</div>
    </div>`;
  }).join('') + '</div>';
  restorePanelSelection();
}

// ---------- перенос клиники в личный лист (Настя/Галя) ----------
function transferTarget(email, c) {
  const m = (c.manager || '').trim();
  if (email === 'osechkina@crm.ru') return m === 'Осечкина' ? 'nastya' : null;
  if (email === 'skokova@crm.ru') return m === 'Скокова' ? 'galya' : null;
  if (email === 'abramson@crm.ru') {
    if (m === 'Осечкина') return 'nastya';
    if (m === 'Скокова') return 'galya';
    if (m === 'Абрамов') return 'sasha';
    return 'pick';
  }
  return null;
}
async function transferToWorklist(c) {
  const key = transferTarget(CURRENT_EMAIL, c);
  if (key === null) { toast('Можно переносить только свои клиники'); return; }
  if (key === 'pick') {
    openModal('Куда перенести?', `
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
        ${Object.keys(WORKLISTS).filter(k => WORKLISTS[k].emails.includes(CURRENT_EMAIL)).map(k =>
          `<button class="btn" id="pk-${k}" style="flex:1;min-width:90px">${WORKLISTS[k].label}</button>`).join('')}
      </div>`);
    Object.keys(WORKLISTS).filter(k => WORKLISTS[k].emails.includes(CURRENT_EMAIL)).forEach(k => {
      document.getElementById('pk-' + k).addEventListener('click', () => { closeModal(); doTransfer(k, c); });
    });
    return;
  }
  await doTransfer(key, c);
}
async function doTransfer(key, c) {
  // v3.14.0: перенос = только СВЯЗЬ со списком. Контакты и продажи больше не копируются,
  // данные читаются из общей карточки — расхождений между разделами больше не будет.
  const W = WORKLISTS[key];
  try {
    const { data: dup, error: derr } = await withTimeout(sb.from(W.cl).select('id').eq('linked_clinic_id', c.id).maybeSingle(), 10000, 'wl-dup');
    if (derr) throw derr;
    if (dup) { toast('Уже в списке ' + W.label); return; }
    const { error: ierr } = await withTimeout(sb.from(W.cl).insert({
      name: c.name, linked_clinic_id: c.id
    }), 10000, 'wl-transfer');
    if (ierr) throw ierr;
    toast('✓ Связь с «' + W.label + '» создана (карточка общая)');
  } catch (e) { toast('⚠️ ' + e.message); }
}

async function renderMoney() {
  const view = document.getElementById('view');
  let clinics = await listClinics();
  const myMgr = myManagerName();  // менеджер видит в «Деньгах» только свои клиники
  if (myMgr) clinics = clinics.filter(c => c.manager === myMgr);
  const s = state.search;
  const f = state.filters;
  const year = state.moneyYear || curYear();
  const trendOn = !!state.moneyYear;
  clinics = clinics.filter(c =>
    (c.kind || 'hospital') === 'hospital' &&
    (!s ||
      (c.name || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (c.city || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (c.region || '').toLowerCase().replace(/ё/g,'е').includes(s) ||
      (c.manager || '').toLowerCase().replace(/ё/g,'е').includes(s)) &&
    matchFilters(f, c)
  );
  // сортировка: по сумме (вверх/вниз) или по алфавиту; 0₽-бейджи — в середине (только при выбранном годе), пустые — вниз по алфавиту
  const mode = state.moneySort;  // 'desc' | 'asc' | 'name'
  const mf = state.moneyFilter || 'all';
  const showPills = trendOn || mf !== 'all';
  if (mf !== 'all') {
    const py = String(Number(year) - 1);
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, py);
      if (mf === 'up') return v != null && p != null && v > p;
      if (mf === 'down') return p != null && p !== 0 && (v == null || v < p);
      if (mf === 'new') return v != null && (p == null || p === 0);
      return true;
    });
    // пустые карточки (нет продаж ни в этом, ни в прошлом году) — скрываем при включённом фильтре
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, String(Number(year) - 1));
      return v != null || (p != null && p !== 0);
    });
  } else if (trendOn) {
    // выбран год: прячем карточки, где нет ни суммы, ни «0 ₽» — нет никакой информации
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, String(Number(year) - 1));
      return v != null || (p != null && p !== 0);
    });
  }
  clinics.sort((a, b) => {
    if (mode === 'name') return (a.name || '').localeCompare(b.name || '', 'ru');
    const av = moneyVal(a, year), bv = moneyVal(b, year);
    const ap = moneyVal(a, String(Number(year) - 1)), bp = moneyVal(b, String(Number(year) - 1));
    const az = trendOn && av == null && ap != null && ap !== 0;  // бейдж 0₽ только при выбранном годе
    const bz = trendOn && bv == null && bp != null && bp !== 0;
    const ta = av != null ? 0 : (az ? 1 : 2);
    const tb = bv != null ? 0 : (bz ? 1 : 2);
    if (ta !== tb) return ta - tb;
    if (ta === 0) return mode === 'asc' ? av - bv : bv - av;
    return (a.name || '').localeCompare(b.name || '', 'ru');
  });
  clinics.sort((a, b) => (b.markedDel ? 1 : 0) - (a.markedDel ? 1 : 0));  // помеченные на удаление — первыми
  const src = state.moneySource;
  const total = clinics.reduce((sum, c) => sum + (moneyVal(c, year) || 0), 0);
  const bTotal = clinics.reduce((sum, c) => sum + (curYearSales(c, year) || 0), 0);
  const hTotal = clinics.reduce((sum, c) => sum + (curYearHM(c, year) || 0), 0);
  const splitLabel = src === 'boston' ? `Boston ${fmtMoney(bTotal)}`
    : src === 'hugemed' ? `HugeMed ${fmtMoney(hTotal)}`
    : `Boston ${fmtMoney(bTotal)} · HugeMed ${fmtMoney(hTotal)}`;
  const sortLabel = mode === 'name' ? 'А-Я' : (mode === 'asc' ? '↑ по сумме' : '↓ по сумме');
  const sortTitle = mode === 'name' ? 'Сортировка по алфавиту (нажми для смены)' : `Сортировка по сумме: ${mode === 'asc' ? 'по возрастанию' : 'по убыванию'} (нажми для смены)`;
  view.innerHTML = `<div class="money-total-line">Итого ${year}: <b>${fmtMoney(total)} ₽</b>
      <span class="money-split">${splitLabel}</span>
      <label class="money-lbl">Производитель
      <select id="money-src" class="sort-toggle" title="Какие продажи считать">
        <option value="both"${src === 'both' ? ' selected' : ''}>Все</option>
        <option value="boston"${src === 'boston' ? ' selected' : ''}>Boston</option>
        <option value="hugemed"${src === 'hugemed' ? ' selected' : ''}>HugeMed</option>
      </select></label>
      <label class="money-lbl">Динамика
      <select id="money-filter" class="sort-toggle" title="Фильтр по динамике">
        <option value="all"${mf === 'all' ? ' selected' : ''}>Все</option>
        <option value="up"${mf === 'up' ? ' selected' : ''}>Рост</option>
        <option value="down"${mf === 'down' ? ' selected' : ''}>Падение</option>
        <option value="new"${mf === 'new' ? ' selected' : ''}>Новый</option>
      </select></label>
      <button class="sort-toggle" id="money-sort" title="${sortTitle}">${sortLabel}</button>
      <span class="money-cnt">${clinics.length}</span>
    </div>`
    + (clinics.length
      ? '<div class="list">' + clinics.map(c => {
      const loc = c.city || '';
      const money = fmtMoney(moneyVal(c, year));
      const hm = curYearHM(c, year);
      const split = (src === 'both' && hm != null && hm !== 0) ? ` · ХМ ${fmtMoney(hm)}` : '';
      let trend = '';
      const prevVal = moneyVal(c, String(Number(year) - 1));
      const curVal = moneyVal(c, year);
      // v3.32.1: цвет по динамике — всегда, когда есть с чем сравнить (год к году)
      if (curVal != null && prevVal != null) trend = (curVal > prevVal ? 'money-up' : (curVal < prevVal ? 'money-down' : 'money-flat'));
      else trend = 'money-flat';
      const zeroBadge = showPills && (curVal == null || curVal === 0) && prevVal != null && prevVal !== 0
        ? `<span class="list-row-money money-zero">0 ₽</span>` : '';
      return `<div class="card list-row${c.markedDel ? ' marked-del' : ''}" data-id="${c.id}" data-kind="clinic">
        <div class="list-row-top">
          <span class="rn-wrap"><span class="list-row-name">${esc(c.name)}</span></span>
          ${c.markedDel ? '<span class="mark-badge">на удалении</span>' : ''}
          ${money ? `<span class="list-row-money ${trend}" title="${year} к ${Number(year) - 1}">${money} ₽</span>` : zeroBadge}
        </div>
        ${subMarks(c, (loc ? esc(loc) : '—') + split)}
      </div>`;
      }).join('') + '</div>'
      : '<div class="empty">Ничего не найдено</div>');
  view.querySelectorAll('.list-row').forEach(row => {
    row.addEventListener('mouseenter', () => showHoverCard(row));
    row.addEventListener('mouseleave', hideHover);
  });
  document.getElementById('money-sort').addEventListener('click', () => {
    state.moneySort = mode === 'desc' ? 'asc' : (mode === 'asc' ? 'name' : 'desc');
    renderMoney();
  });
  document.getElementById('money-src').addEventListener('change', e => {
    state.moneySource = e.target.value;
    renderMoney();
  });
  document.getElementById('money-filter').addEventListener('change', e => {
    state.moneyFilter = e.target.value;
    renderMoney();
  });
}

function telHref(phone) {
  const first = String(phone || '').split(/[,;]/)[0];
  let d = first.replace(/[^\d+]/g, '');
  if (/^8\d{10}$/.test(d)) d = '+7' + d.slice(1);
  return d;
}
function maskPhoneValue(v) {
  return String(v || '').split(/[,;]\s*/).map(seg => {
    let d = seg.replace(/\D/g, '');
    let digits = d;
    if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) digits = digits.slice(1);
    if (digits.length === 10) return `8 (${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 8)}-${digits.slice(8, 10)}`;
    return seg.trim();
  }).join(', ');
}
function maskPhoneInput(el) {
  el.value = maskPhoneValue(el.value);
  el.addEventListener('input', () => { el.value = maskPhoneValue(el.value); });
}
function formatPhone(phone) {
  if (!phone) return '';
  return String(phone).split(/[,;]\s*/).map(seg => {
    let d = seg.replace(/\D/g, '');
    let digits = d;
    if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) digits = digits.slice(1);
    if (digits.length === 10) {
      return `8 (${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,8)}-${digits.slice(8,10)}`;
    }
    return seg.trim();
  }).join(', ');
}
function telLink(phone) {
  if (!phone) return '';
  return `<a class="tel" href="tel:${telHref(phone)}">${esc(formatPhone(phone))}</a>`;
}

function bindClinicPicker() {
  const inp = document.getElementById('f_clinicSearch');
  const sel = document.getElementById('f_clinic');
  if (!inp || !sel || inp.dataset.bound === '1') return;
  inp.dataset.bound = '1';
  const escT = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // снимок всех вариантов: прятать <option> бесполезно — нативный список этого не понимает,
  // поэтому при вводе пересобираем содержимое select заново
  const items = [...sel.querySelectorAll('option')].filter(o => o.value).map(o => ({
    id: String(o.value),
    text: o.textContent,
    q: String(o.dataset.q || o.textContent).toLowerCase(),
    group: o.closest('optgroup') ? o.closest('optgroup').label : ''
  }));
  const current = () => sel.value;
  sel.addEventListener('change', () => { inp.dataset.keep = sel.value || ''; });
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    const keep = inp.dataset.keep || '';
    const hit = q ? items.filter(i => i.q.includes(q)) : items;
    const groups = {};
    hit.forEach(i => { (groups[i.group] = groups[i.group] || []).push(i); });
    let html = '<option value="">— выберите —</option>';
    Object.keys(groups).forEach(g => {
      const opts = groups[g].map(i => `<option value="${i.id}"${i.id === keep ? ' selected' : ''}>${escT(i.text)}</option>`).join('');
      html += g ? `<optgroup label="${escT(g)}">${opts}</optgroup>` : opts;
    });
    sel.innerHTML = html;
    // если выбранное скрылось — оставляем выбор пустым; если совпало одно — сразу его и ставим
    if (keep && hit.some(i => i.id === keep)) sel.value = keep;
    else sel.value = hit.length === 1 ? hit[0].id : '';
  });
}

// v3.6.4: короткая должность («пара слов») для карточек и списков
function shortPos(p) {
  if (!p) return '';
  let s = String(p).replace(/\([^)]*\)/g, ' ').split(/[,;·\n]/)[0].replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const l = s.toLowerCase().replace(/ё/g, 'е');
  const has = re => re.test(l);
  // v4.45.0: «Зав УО», «Зав ХО», «Зав АиР» — по названию отделения
  const DEPT_ABBR = [
    [/урогинеколог/, 'УГО'], [/уролог/, 'УО'], [/хирург/, 'ХО'], [/анестези|реанимат/, 'АиР'],
    [/гинеколог/, 'ГО'], [/терапевт/, 'ТО'], [/кардиолог/, 'КО'], [/невролог/, 'НО'],
    [/онколог/, 'ОО'], [/эндоскоп/, 'ЭО'], [/офтальмолог/, 'ОфтО'], [/травматолог/, 'ТрО'],
    [/нефролог/, 'НфО'], [/пульмонолог/, 'ПулО'], [/гастроэнтеролог/, 'ГЭО'], [/инфекцион/, 'ИО'],
    [/педиатр/, 'ПедО'], [/родильн|роддом/, 'РД'], [/поликлиник/, 'Пол'], [/функцион/, 'ФД'],
    [/лучев|радиолог/, 'РДО'], [/патологоанатом/, 'ПАО']
  ];
  const deptAbbr = (str) => {
    const l2 = String(str).toLowerCase().replace(/ё/g, 'е');
    for (const [re, ab] of DEPT_ABBR) if (re.test(l2)) return ab;
    return '';
  };
  if (has(/помощник\s+зав/)) return 'Помощник заведующего';
  if (has(/зам.*главн.*врач|зам.*главврач/)) return 'Зам. главврача';
  if (has(/зам.*хирург/)) return 'Зам ПоХ';
  if (has(/зам.*эконом/)) return 'Зам. по экономике';
  if (has(/^зам(\s|$|\.)/) || has(/заместител/)) { const ab = deptAbbr(s); return ab ? 'Зам ' + ab : 'Заместитель'; }
  if (has(/главн.*врач|главврач/)) return 'Главврач';
  if (has(/(^|\s)гл\.?\s+уролог|главн.*уролог/)) return 'Главный уролог';
  if (has(/профессор/)) return 'Профессор';
  if (has(/доцент/)) return 'Доцент';
  if (has(/академик|член-корр/)) return 'Академик';
  if (has(/аспирант/)) return 'Аспирант';
  if (has(/ассистент/)) return 'Ассистент';
  if (has(/ординатор|стажер|стажёр/)) return has(/уролог/) ? 'Врач-уролог' : 'Ординатор';
  if (has(/научн.*сотрудник/)) return 'Научный сотрудник';
  if (has(/зав|завед/)) {
    if (has(/аптек/)) return 'Зав. аптекой';
    if (has(/кафедр|каф\.?\s/)) return 'Зав. кафедрой';
    if (has(/оперблок/)) return 'Зав. оперблоком';
    if (has(/лаборатор/)) return 'Зав. лабораторией';
    const ab = deptAbbr(s);
    return ab ? 'Зав ' + ab : 'Зав. отделением';
  }
  if (has(/ген.*директор/)) return 'Ген. директор';
  if (has(/директор/)) return 'Директор';
  if (has(/(^|\s)юрист/)) return 'Юрист';
  if (has(/менеджер|мнеджер/)) return has(/закуп/) ? 'Менеджер по закупкам' : 'Менеджер';
  if (has(/закуп|снабжен/)) return has(/начальник/) ? 'Нач. отдела закупок' : (has(/руковод/) ? 'Руководитель закупок' : 'Закупки');
  if (has(/начальник/)) return has(/уролог|отделен/) ? 'Начальник отделения' : 'Нач. отдела';
  if (has(/руководител/)) {
    if (has(/направлен/)) return 'Руководитель направления';
    if (has(/отдел|отделен/)) return 'Руководитель отделения';
    return 'Руководитель';
  }
  if (has(/уролог-?андролог/)) return 'Уролог-андролог';
  if (has(/урогинеколог/)) return 'Урогинеколог';
  if (has(/онкоуролог/)) return has(/^(врач|доктор)/) ? 'Врач-уролог' : 'Онкоуролог';
  if (has(/дистрибьютор|поставщик/)) return 'Дистрибьютор';
  if (has(/анестезиолог|анастезиолог/)) return 'Анестезиолог';
  if (has(/уролог/)) return has(/^(врач|доктор)/) ? 'Врач-уролог' : 'Уролог';
  if (has(/онколог/)) return has(/^(врач|доктор)/) ? 'Врач-онколог' : 'Онколог';
  if (has(/гинеколог/)) return has(/^(врач|доктор)/) ? 'Врач-гинеколог' : 'Гинеколог';
  if (has(/нефролог/)) return 'Нефролог';
  if (has(/м\/с|медсестр|мед\.\s*сестр|сестра/)) return has(/главн/) ? 'Главная медсестра' : 'Медсестра';
  if (has(/начмед/)) return 'Начмед';
  if (has(/специалист/)) return 'Специалист';
  if (has(/представител/)) return 'Представитель';
  if (has(/студент/)) return 'Студент';
  if (has(/инженер/)) return 'Инженер';
  if (has(/^(врач|доктор)/)) return 'Врач';
  const w = s.split(' ');
  return w.length > 2 ? w.slice(0, 2).join(' ') : s;
}
function parseTags(s) {
  return (s || '').split(',').map(t => t.trim()).filter(Boolean);
}

function readMoney(id) {
  const el = document.getElementById(id);
  if (!el) return null;   // v3.6.1: поле может отсутствовать (форма справочной карточки/компании) — не падаем
  const raw = (el.value || '').trim().replace(/\s/g, '');
  if (raw === '') return null;
  const n = Number(raw);
  return isFinite(n) ? n : NaN;
}

function salesFormFields(c, isRef) {
  // 4.67.0: текущий год — на виду, история — в свёрнутом блоке (по умолчанию закрыт)
  const curY = String(new Date().getFullYear());
  const cell = (y, prefix) =>
    `<div class="money-cell"><label>${y}</label><input id="f_${prefix}${y}" type="text" inputmode="numeric" value="${c[prefix === 'hm' ? 'hugemed' + y : 'sales' + y] != null ? c[prefix === 'hm' ? 'hugemed' + y : 'sales' + y] : ''}" placeholder="—" /></div>`;
  const block = (years, prefix, label) => {
    const now = years.filter(y => y === curY);
    const hist = years.filter(y => y !== curY);
    const nowHtml = now.length ? `<div class="money-grid">${now.map(y => cell(y, prefix)).join('')}</div>` : '';
    const histHtml = hist.length ? `<details class="fhist"><summary>Исторические продажи · ${hist.length} ${hist.length === 1 ? 'год' : 'года'}</summary><div class="money-grid">${hist.map(y => cell(y, prefix)).join('')}</div></details>` : '';
    return `<div class="field"><label>${label}</label>${nowHtml}${histHtml}</div>`;
  };
  if (isRef) return block(['2023', '2024'], 'sales', 'Продажа Уро (₽)');
  return block(MONEY_YEARS, 'sales', 'Boston (₽)')
    + (HUGEMED_YEARS.length ? block(HUGEMED_YEARS, 'hm', 'HugeMed (₽)') : '');
}

// v3.37.0 («Авиценну объедини»): у связанных записей одной клиники классификация должна быть одна.
// После сохранения переносим продукты/источники/неклассифицированные метки на парную запись,
// её собственные служебные и технические метки сохраняем.
async function syncPairTags(id, tags) {
  try {
    if (!id || !canEditMain()) return;
    const self = await getClinic(id);
    if (!self) return;
    const pair = await linkedPairInfo(self);
    const others = pair.others || [];
    if (!others.length) return;
    const keep = t => isSvcTag(t) || TECH_TAGS.includes(String(t).toLowerCase());
    const cls = (tags || []).filter(t => !keep(t));
    for (const o of others) {
      const kept = (o.tags || []).filter(keep);
      const next = [...new Set(cls.concat(kept))];
      const cur = [...new Set(o.tags || [])];
      if (next.length === cur.length && next.every(t => cur.includes(t))) continue;
      try { await sb.from('clinics').update({ tags: next }).eq('id', o.id); } catch (_) {}
    }
  } catch (_) {}
}
async function saveClinic(id) {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { toast('Название обязательно'); return; }
  let kind = document.getElementById('f_kind').value;
  const typeSelEl = document.querySelector('#f_typeseg .seg-b.on');
  const type = typeSelEl ? typeSelEl.dataset.t : '';
  const kindIsClinic = ['hospital', 'ref_gos', 'ref_priv'].includes(kind);
  if (kindIsClinic && !type) { toast('Укажите тип: ЛПУ или ЧК'); return; }
  // тип определяет справочник: ЛПУ → «Государственные», ЧК → «Частные» (карточка та же)
  if (isRefKind(kind)) kind = type === 'ЧК' ? 'ref_priv' : (type === 'ЛПУ' ? 'ref_gos' : kind);
  const region = document.getElementById('fm_region').value.trim();
  if (!region) { toast('Регион обязателен'); return; }
  const city = document.getElementById('fm_city').value.trim();
  const manager = document.getElementById('fm_manager').value.trim();
  const sitRaw = document.getElementById('f_situation').value.trim();
  const siteEl = document.getElementById('f_site');
  const situation = withSite(sitRaw, siteEl ? siteEl.value : '');
  // v3.35.0: метки карточки = продукты + источники + служебные + прочие метки (из отдельных полей)
  const tags = orgTagsFromForm();
  const linkedClinicId = document.getElementById('f_link').value ? Number(document.getElementById('f_link').value) : null;
  const isRefK = isRefKind(kind);
  let sales, hms;
  if (isRefK) {
    sales = MONEY_YEARS.map(y => (y === '2023' || y === '2024') ? readMoney('f_sales' + y) : null);
    hms = HUGEMED_YEARS.map(() => null);
  } else {
    sales = MONEY_YEARS.map(y => readMoney('f_sales' + y));
    hms = HUGEMED_YEARS.map(y => readMoney('f_hm' + y));
  }
  if (sales.some(v => Number.isNaN(v)) || hms.some(v => Number.isNaN(v))) { toast('Некорректное число в продажах'); return; }

  await addDictValues('region', [region]);
  await addDictValues('city', [city]);
  await addDictValues('manager', [manager]);

  const row = { name, region, city, manager, situation, tags, linkedClinicId, kind, type: kindIsClinic ? type : null };
  const moneyFields = {};
  MONEY_YEARS.forEach((y, i) => { moneyFields['sales_' + y] = sales[i]; });
  HUGEMED_YEARS.forEach((y, i) => { moneyFields['hugemed_' + y] = hms[i]; });
  // v3.17.0: при сбое сохранения форма не закрывается и введённое НЕ теряется
  try {
    if (id) await updateClinic(id, row);
    else id = (await addClinic(row)).id;
  } catch (e) {
    toast('⚠️ Не сохранилось: ' + (e && e.message ? e.message : e) + ' — данные остались в форме');
    return;
  }

  // деньги — только в закрытую часть, и только если на неё есть право
  const isBossNow = CURRENT_ROLE === 'admin';
  // v4.22.0: деньги правит только админ — менеджеры (Осечкина, Скокова) не могут
  const canMoney = isBossNow;
  if (canMoney) { try { await saveClinicPrivate(id, manager, moneyFields); } catch (e) { toast('Клиника сохранена, деньги — нет: ' + (e.message || e)); } }

  await syncPairTags(id, tags);   // v3.37.0: классификация парной записи той же клиники

  closeModal(); toast('Сохранено'); render(); updateFiltersUI(); refreshCounts();
}

// v3.7.0: сайт учреждения хранится строкой «Сайт: URL» в примечаниях; в карточке — отдельной кнопкой
const SITE_LINE_RE = /^\s*Сайт:\s*(https?:\/\/\S+)\s*$/i;
function splitSite(sit) {
  const lines = String(sit || '').split('\n');
  let site = ''; const rest = [];
  for (const ln of lines) {
    const m = ln.match(SITE_LINE_RE);
    if (m) { if (!site) site = m[1]; continue; }
    rest.push(ln);
  }
  return { site, rest: rest.join('\n').replace(/^\s+|\s+$/g, '') };
}
// v3.17.0: САЙТ — отдельной плашкой (после людей) и с правкой на месте

  let dom = site;

  return `<a class="site-ico" href="${esc(site)}" target="_blank" rel="noopener" title="${esc(dom)}" aria-label="Открыть сайт ${esc(dom)}">`

    + `</svg></a>`;
}

const MNY_ROWS = {};

const SRC_RU = { both: 'Все', boston: 'Boston', hugemed: 'HugeMed' };
function mnySum(c, y, src) {

  if (src === 'boston') return s != null ? Number(s) : null;

function mnyYearsWith(c, src) {

function mnyCompare(c, src) {

async function takeClinicIntoWork(cid, mgr) {

  } catch (_) { /* закрытую часть настроит руководитель */ }

// ---------- дата связи: свой календарь (◀ • ▶, • — сегодня, выбор дня подтверждает сразу) ----------
function ruDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return d + '.' + m + '.' + y.slice(2);
}
let calOvl = null, calPop = null;
function closeDateCal() {
  if (calOvl) { calOvl.remove(); calOvl = null; }
  if (calPop) { calPop.remove(); calPop = null; }
}
function openDateCal(curIso, onPick) {
  closeDateCal();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cur = curIso ? new Date(String(curIso).slice(0, 10) + 'T00:00:00') : null;
  let view = new Date(cur && !isNaN(cur) ? cur : today);
  view = new Date(view.getFullYear(), view.getMonth(), 1);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  calOvl = document.createElement('div'); calOvl.className = 'cal-ovl'; calOvl.addEventListener('click', closeDateCal);
  document.body.appendChild(calOvl);
  calPop = document.createElement('div'); calPop.className = 'cal-pop';
  document.body.appendChild(calPop);
  const draw = () => {
    const y = view.getFullYear(), m = view.getMonth();
    const first = new Date(y, m, 1);
    const start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));   // неделя с понедельника
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const cls = ['cal-d'];
      if (d.getMonth() !== m) cls.push('other');
      if (d.getTime() === today.getTime()) cls.push('today');
      if (cur && d.getTime() === cur.getTime()) cls.push('sel');
      cells += `<div class="${cls.join(' ')}" data-d="${iso(d)}">${d.getDate()}</div>`;
    }
    calPop.innerHTML = `<div class="cal-head">
        <button type="button" class="cal-nav" data-nav="-1">‹</button>
        <button type="button" class="cal-dot" data-today="1" title="Сегодня"></button>
        <div class="cal-title">${MONTH_RU[m + 1]} ${y}</div>
        <button type="button" class="cal-nav" data-nav="1">›</button></div>
      <div class="cal-grid">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<div class="cal-w">${w}</div>`).join('')}${cells}</div>
      <div class="cal-foot"><button type="button" class="btn ghost" data-clr="1">Очистить</button><button type="button" class="btn ghost" data-close="1">Отмена</button></div>`;
  };
  draw();
  calPop.addEventListener('click', (ev) => {
    const nav = ev.target.closest('[data-nav]');
    if (nav) { view = new Date(view.getFullYear(), view.getMonth() + Number(nav.dataset.nav), 1); draw(); return; }
    if (ev.target.closest('[data-today]')) { const t = new Date(); view = new Date(t.getFullYear(), t.getMonth(), 1); draw(); closeDateCal(); onPick(iso(t)); return; }
    if (ev.target.closest('[data-clr]')) { closeDateCal(); onPick(null); return; }
    if (ev.target.closest('[data-close]')) { closeDateCal(); return; }
    const d = ev.target.closest('[data-d]');
    if (d) { const v = d.dataset.d; closeDateCal(); onPick(v); return; }
  });
}

function relBlockHtml(c, linked, related) {
  // v3.16.0: ПАРТНЁРЫ — только реальные компании; свою справочную запись не показываем
  const isCompanyKind = k => k === 'distributor' || k === 'ref_firm';
  const ownRef = c.linkedClinicId || 0;

    if (!r || !r.id || !r.name) return;

    if (!isCompanyKind(r.kind)) return;
    if (rel.some(x => x.id === r.id)) return;

  pushRel(linked);

  return rel.length
    ? `<div class="detail-block"><div class="k">Связанные партнёры</div>${rel.map(r => `<div class="v"><span class="org-link" data-clinic="${r.id}">${esc(r.name)}</span></div>`).join('')}</div>`

    instantPerson = p; instantCanEditPerson = canEditP;

    const c = await getClinic(id);
    if (!c || seq !== hoverSeq) return;
    const canEditC = canEditMain() || (isRefEdit() && isRefKind(c.kind));
    // v3.27.2: карточка рисуется СРАЗУ после ответа по клинике — без медленных блоков
    // (люди / партнёры / помесячные продажи). Они досыпаются ниже, введённое не перерисовывается.
    // v4.2.1: карточка уже нарисована из кэша — не перерисовываем целиком (не даём ей «прыгнуть»),
    // только тихо поправляем шапку, если на сервере изменились название/строка/сайт/право правки.
    const cardHead = clinicHeadHtml(c, canEditC);
    if (!instant) {
      panel.innerHTML = cardHead + clinicDetailBody(c, null, [], undefined, [], null);
      if (window.innerWidth < 900) panel.insertBefore(makeBackBtn(), panel.firstChild);
      hydrateCard(Number(c.id) || 0);
    } else {
      const h3 = panel.querySelector('.card-head h3');
      if (h3 && h3.textContent.trim() !== String(c.name || '').trim()) h3.textContent = c.name;
      const sub = panel.querySelector('.card-head .card-top');
      const wantSub = clinicSubLine(c);
      if (sub && wantSub && sub.textContent !== wantSub) sub.textContent = wantSub;
      const acts = panel.querySelector('.card-head-acts');
      if (acts) acts.innerHTML = `${canEditC ? `<button class="pane-btn primary" id="paneEditClinic" data-id="${c.id}">Изменить</button>` : ''}${siteChipHtml(c.situation)}`;
    }
    // медленная часть — одним заходом (параллельно)
    // v3.36.0: данные по всей связанной паре (люди + продажи + блок «Связанная запись»)
    const pair = await linkedPairInfo(c);
    const [contacts, monthly] = await Promise.all([
      peopleByClinic(id, pair.ids.filter(x => Number(x) !== Number(id))),
      listMonthly(pair.moneyCard.id)
    ]);
    if (seq !== hoverSeq) return;
    const linked = pair.linked;
    const related = (pair.others || []).map(r => ({ id: r.id, name: r.name, kind: r.kind }));
    MNY_ROWS[pair.moneyCard.id] = (monthly || []).slice();
    const pw = document.getElementById('pplWrap');
    if (pw) setHtmlIfChanged(pw, peopleBlockHtml(c, contacts, canEditCardNow()));
    const rw = document.getElementById('relWrap');
    if (rw) setHtmlIfChanged(rw, relBlockHtml(c, linked, related));
    const pairWrap = document.getElementById('pairWrap');
    if (pairWrap) setHtmlIfChanged(pairWrap, pairBlockHtml(pair));
    // v3.36.0: быстрый рендер рисовал продажи по своей записи — на медленном перерисовываем по записи с закрытой частью
    const slw = document.getElementById('salesWrap');
    if (slw) setHtmlIfChanged(slw, canSeePrivate(pair.moneyCard) ? salesLineHtml(pair.moneyCard) : '');
    // «Связаться» — всегда на записи с закрытой частью, чтобы дата пары жила в одном месте
    const prvw = document.getElementById('privWrap');
    if (prvw) setHtmlIfChanged(prvw, privBlock(pair.moneyCard, canEditCardNow()));
    if (document.body.classList.contains('sales-open')) rerenderSalesPage();
    return;
  }
  if (!instant) panel.innerHTML = inner;
  else if (instantPerson) {
    // v4.2.1: человек уже нарисован из кэша — поправляем только шапку и кнопки
    const pp = instantPerson;
    const h3 = panel.querySelector('h3');
    if (h3 && h3.textContent.trim() !== String(pp.fullName || '').trim()) h3.textContent = pp.fullName;
    const acts = panel.querySelector('.pane-actions');
    if (acts) acts.innerHTML = `${instantCanEditPerson ? `<button class="pane-btn primary" id="panePersonEdit" data-id="${pp.id}">Изменить</button>` : ''}${siteChipHtml(pp.situation)}`;
  }
  hydrateCard(document.querySelector('#notesList[data-cid]') ? Number(document.querySelector('#notesList[data-cid]').dataset.cid) : 0);
  if (window.innerWidth < 900) panel.insertBefore(makeBackBtn(), panel.firstChild);
}

// v3.27.0: вторая строка карточки клиники — «город · ЛПУ/ЧК · менеджер»
function clinicSubLine(c) {
  const own = ownershipOf(c);
  const ownShort = own === 'state' ? 'ЛПУ' : (own === 'private' ? 'ЧК' : '');
  return [c.city, ownShort, (c.manager && !isFirmKind(c.kind)) ? c.manager : ''].filter(Boolean).join(' · ');
}
// v4.2.2: закрытая часть (деньги/след. контакт) из локального кэша — карточка сразу с цифрами
function withPrivateFromCache(c) {
  try {
    if (!c || !rcHas('cp')) return c;
    const p = (RC.data['cp'] || []).find(x => Number(x.clinic_id) === Number(c.id));
    MONEY_COLS.forEach(k => { c[k] = p ? p[k] : null; });
    [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026].forEach(y => { c['sales' + y] = c['sales_' + y]; });
    [2025, 2026].forEach(y => { c['hugemed' + y] = c['hugemed_' + y]; });
    c.nextContact = p ? p.next_contact : null;
    c.actionType = p ? (p.action_type || null) : null;
    c.privateNote = p ? p.note : null;
    c.hasPrivate = !!p;
  } catch (_) {}
  return c;
}
// v4.2.2: id связанной пары (сама запись + обе стороны связки) — только из кэша, без сети
function pairIdsFromCache(c) {
  try {
    const arr = Array.isArray(RC.data['t:clinics']) ? RC.data['t:clinics'] : [];
    const selfId = Number(c.id);
    const ids = [selfId];
    if (c.linkedClinicId) ids.push(Number(c.linkedClinicId));
    arr.forEach(r => { if (Number(r.linked_clinic_id) === selfId) ids.push(Number(r.id)); });
    return ids.filter((v, i, a) => a.indexOf(v) === i);
  } catch (_) { return [Number(c.id)]; }
}
// v4.2.2: пара (связанные карточки) из кэша — блок «Связанная запись» тоже появляется сразу.
// Логика выбора записи с закрытой частью — та же, что в linkedPairInfo(), только без сети.
function pairFromCache(c) {
  try {
    const raw = Array.isArray(RC.data['t:clinics']) ? RC.data['t:clinics'] : null;
    if (!raw || !c) return null;
    const selfId = Number(c.id);
    const cards = [withPrivateFromCache(c)];
    let linked = null;
    if (c.linkedClinicId && Number(c.linkedClinicId) !== selfId) {
      const lr = raw.find(r => Number(r.id) === Number(c.linkedClinicId));
      if (lr) { linked = withPrivateFromCache(fromClinic(lr)); cards.push(linked); }
    }
    raw.forEach(r => {
      if (Number(r.linked_clinic_id) === selfId && !cards.some(x => Number(x.id) === Number(r.id))) {
        cards.push(withPrivateFromCache(fromClinic(r)));
      }
    });
    const ids = cards.map(x => Number(x.id));
    const moneyCard = cards.find(x => x && x.hasPrivate) || cards[0];
    const others = cards.filter(x => x && Number(x.id) !== selfId && !x.markedDel);
    return { ids, cards, others, moneyCard, linked: linked || others[0] || null, selfId };
  } catch (_) { return null; }
}
// v4.2.2: люди клиники из кэша (без сети) — блок «Контакты» появляется вместе с карточкой.
// null означает «кэша нет» — тогда ждём сеть, как раньше.
function peopleByClinicCached(clinicId, alsoIds) {
  try {
    if (!rcHas('t:people') || !rcHas('cpl')) return null;
    const all = RC.data['t:people'].map(fromPerson);
    const links = RC.data['cpl'] || [];
    const ids = [Number(clinicId)].concat((alsoIds || []).map(Number));
    const extraIds = new Set(links.filter(l => ids.includes(Number(l.clinic_id))).map(l => l.person_id));
    return all.filter(p => ids.includes(Number(p.clinicId)) || extraIds.has(p.id))
      .sort((a, b) => String(a.fullName || '').localeCompare(String(b.fullName || ''), 'ru'));
  } catch (_) { return null; }
}
// v4.2.2: меняем HTML блока только если он реально отличается — иначе ничего не «дёргается»
function setHtmlIfChanged(el, html) {
  if (el && typeof html === 'string' && el.innerHTML !== html) el.innerHTML = html;
}
// v4.2.1: карточка человека из локального кэша — открывается без заглушки и без ожидания сети
function personFromCache(id) {
  try {
    const v = (rcHas('t:people') && Array.isArray(RC.data['t:people'])) ? RC.data['t:people'] : null;
    if (!v) return null;
    const r = v.find(x => Number(x.id) === Number(id));
    return r ? fromPerson(r) : null;
  } catch (_) { return null; }
}
// v4.2.1: учреждения человека из кэша связок (без сети)
function personClinicsFromCache(p) {
  try {
    const links = (rcHas('cpl') && Array.isArray(RC.data['cpl'])) ? RC.data['cpl'] : [];
    const clinics = (rcHas('t:clinics') && Array.isArray(RC.data['t:clinics'])) ? RC.data['t:clinics'] : [];
    const map = {}; clinics.forEach(r => { map[Number(r.id)] = { id: Number(r.id), name: r.name }; });
    const ids = [];
    if (p.clinicId) ids.push(Number(p.clinicId));
    links.filter(l => Number(l.person_id) === Number(p.id)).forEach(l => { if (!ids.includes(Number(l.clinic_id))) ids.push(Number(l.clinic_id)); });
    return ids.map(i => map[i]).filter(Boolean);
  } catch (_) { return []; }
}
// v4.2.1: шапка карточки клиники — одной функцией, чтобы не дублировать разметку
function clinicHeadHtml(c, canEditC) {
  return `<div class="card-head"><div class="card-head-txt"><h3>${esc(c.name)}</h3>${clinicSubLine(c) ? `<div class="card-top">${esc(clinicSubLine(c))}</div>` : ''}</div>`

// v3.27.0: быстрый доступ к карточке из кэша — чтобы панель открывалась без ожидания сети

// v3.27.0: сайт — компактной ссылкой в шапке (отдельной плашки «Сайт» больше нет)

}

// ---------- delete ----------
async function deleteClinic(id) {
  const c = await getClinic(id);
  if (!c) { toast('Клиника не найдена'); return; }
  if (CURRENT_ROLE !== 'admin') {
    const target = !c.markedDel;
    if (!confirm(target ? 'Пометить клинику на удаление?' : 'Снять пометку на удаление?')) return;
    await setClinicMarked(id, target);
    closeModal(); toast(target ? 'Помечена на удаление' : 'Пометка снята'); render(); updateFiltersUI(); refreshCounts();
    return;
  }
  // если у клиники есть продажи — предупреждаем с суммой, чтобы не потерять историю
  const sales = clinicSalesTotal(c);
  const msg = sales
    ? '⚠️ У этой клиники есть продажи на ' + fmtMoney(sales) + ' ₽.\nОни будут удалены безвозвратно вместе с карточкой.\n\nТочно удалить клинику?'
    : 'Удалить клинику?';
  if (!confirm(msg)) return;
  await removeClinic(id);
  await clearPeopleClinic(id);
  closeModal(); toast('Удалено'); render(); updateFiltersUI(); refreshCounts();
}

async function deletePerson(id) {
  if (CURRENT_ROLE !== 'admin') {
    const p = await getPerson(id);
    const target = !p.markedDel;
    if (!confirm(target ? 'Пометить человека на удаление?' : 'Снять пометку на удаление?')) return;
    await setPersonMarked(id, target);
    closeModal(); toast(target ? 'Помечен на удаление' : 'Пометка снята'); render(); refreshCounts();
    return;
  }
  if (!confirm('Удалить человека?')) return;
  await removePerson(id);
  closeModal(); toast('Удалено'); render(); refreshCounts();
}

document.addEventListener('click', async (ev) => {
  const cr = ev.target.closest('#hoverCard .contact-row[data-person]');
  if (!cr) return;
  if (ev.target.closest('a.tel')) return;
  const pid = Number(cr.dataset.person);
  if (!pid) return;
  ev.preventDefault(); ev.stopPropagation();
  await showPerson(pid);
});

// делегирование кликов по view
document.getElementById('view').addEventListener('click', async e => {
  if (e.target.closest('a.tel')) return;
  // v3.6.0: в «Компаниях» тап по человеку — открываем его карточку (списка этих людей нет)
  const fpEl = e.target.closest('.firm-person[data-person]');
  if (fpEl) {
    e.preventDefault(); e.stopPropagation();
    hideHover();
    await showPerson(Number(fpEl.dataset.person));
    return;
  }
  // v3.5.4: тап по метке в списке — сразу включаем фильтр по этой метке (v3.32.0: тоггл)
  const tagOld = e.target.closest ? e.target.closest('.tag-click[data-tag]') : null;
  if (tagOld) {
    e.preventDefault(); e.stopPropagation();
    await toggleTagFilter('tags', tagOld.dataset.tag);
    return;
  }
  // v3.15.0: действия «Выполнено»/«Перенести» из «Моего дня»
  const mdDone = e.target.closest('[data-md-done]');
  if (mdDone) {
    e.preventDefault(); e.stopPropagation();
    await mdComplete(Number(mdDone.dataset.mdDone), mdDone.dataset.mdDate);
    return;
  }
  const mdMove = e.target.closest('[data-md-move]');
  if (mdMove) {
    e.preventDefault(); e.stopPropagation();
    await mdReschedule(Number(mdMove.dataset.mdMove), mdMove.dataset.mdDate);
    return;
  }
  const card = e.target.closest('.card');
  if (card) {
    // 4.67.0: строки визитов и идей открывают свою карточку — сюда не пускаем
    if (card.hasAttribute('data-visit') || card.hasAttribute('data-more')) return;
    const { id, kind } = card.dataset;
    if (kind === 'nastya') return;
    const idNum = Number(id);
    if (!id || !Number.isFinite(idNum) || idNum <= 0) return;
    // v3.11.2: выделяем выбранную строку спокойным цветом
    document.querySelectorAll('.list-row.selected').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    if (document.body.classList.contains('detail-mode')) {
      // Клиники/Партнёры: карточка справа просто меняется, окно не открываем
      state.selId = idNum;
      markListScroll();                           // v3.17.0: запоминаем позицию списка
      document.body.classList.add('card-open');   // v3.11.4: на телефоне — отдельный экран карточки
      showHoverCard(card, true);
      return;
    }
    if (kind === 'refclinic') { showClinic(Number(id)); return; }
    if (kind === 'refdoc') { showPerson(Number(id)); return; }    if (kind === 'clinic') showClinic(Number(id));
    else showPerson(Number(id));
    return;
  }
  const addBtn = e.target.closest('[data-add-btn]');
  if (addBtn) {
    const type = addBtn.dataset.addBtn;
    const input = document.querySelector(`input[data-add="${type}"]`);
    const value = (input.value || '').trim();
    if (!value) { toast('Введите значение'); return; }
    await addDictValue(type, value);
    toast('Добавлено'); render();
    return;
  }
  const x = e.target.closest('.chip .x');
  if (x) {
    const { dict, val } = x.dataset;
    await deleteDictValue(dict, val);
    toast('Удалено'); render();
  }
});

// ---------- офлайн: очередь правок и синхронизация ----------
const OFF = { n: 0, busy: false };
function swAsk(msg) {
  return new Promise((res) => {
    if (!('serviceWorker' in navigator)) return res(null);
    navigator.serviceWorker.ready.then((reg) => {
      const sw = reg.active || navigator.serviceWorker.controller;
      if (!sw) return res(null);
      const ch = new MessageChannel();
      ch.port1.onmessage = (e) => res(e.data);
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { return res(null); }
      setTimeout(() => res(null), 25000);
    }).catch(() => res(null));
  });
}
function offWord(n) { const m = n % 100, d = n % 10; if (m > 10 && m < 20) return 'правок'; if (d === 1) return 'правка'; if (d > 1 && d < 5) return 'правки'; return 'правок'; }
function offRender() {
  const chip = document.getElementById('offChip');
  if (!chip) return;
  const txt = document.getElementById('offText');
  const btn = document.getElementById('offSync');
  const offline = !navigator.onLine;
  if (!OFF.n && !offline) { chip.classList.add('hidden'); return; }
  chip.classList.remove('hidden');
  chip.classList.toggle('offline', offline);
  if (offline) {
    txt.textContent = OFF.n ? ('Нет сети · не отправлено: ' + OFF.n + ' ' + offWord(OFF.n)) : 'Нет сети · работаем по сохранённым данным';
    btn.textContent = 'Ждём сеть';
    btn.disabled = true;
  } else {
    txt.textContent = 'Не отправлено: ' + OFF.n + ' ' + offWord(OFF.n);
    btn.textContent = OFF.busy ? 'Отправляю…' : 'Отправить';
    btn.disabled = !!OFF.busy;
  }
}
async function offInfo() {
  const r = await swAsk({ type: 'queue-info' });
  if (r) { OFF.n = r.n || 0; offRender(); }
}
async function offReloadData() { try { await render(); await refreshCounts(); } catch (e) {} }
async function offFlush() {
  if (!navigator.onLine || OFF.busy || OFF.blocked) return;   // 4.8.1: не крутимся на 401/403
  OFF.busy = true; offRender();
  let authorization = null;
  try {
    const session = await withTimeout(sb.auth.getSession(), 1500, 'flush-session');
    const token = session && session.data && session.data.session && session.data.session.access_token;
    if (token) authorization = 'Bearer ' + token;
  } catch (_) {}
  const r = await swAsk({ type: 'flush', authorization: authorization });
  OFF.busy = false;
  if (r) {
    if (r.left != null) OFF.n = r.left;
    offRender();
    if (r.blocked) {
      // 4.8.1: после отказа по доступу ждём ручного «Отправить» или нового входа
      if (r.blocked === 401 || r.blocked === 403) OFF.blocked = true;
      toast((r.blocked === 401 || r.blocked === 403) ? 'Правки сохранены на устройстве. Нужна проверка входа и прав доступа.' : 'Правки сохранены на устройстве. Сервер отклонил отправку: ' + r.blocked);
    }
    else if (r.ok) toast('Отправлено правок: ' + r.ok);
  }
  if (!OFF.n) await offReloadData();
}
window.addEventListener('online', () => { offRender(); offFlush(); });
window.addEventListener('offline', () => { offRender(); toast('Нет сети — правки сохранятся на устройстве и уйдут, когда появится связь'); });
if ('serviceWorker' in navigator) {
  const SW_BUILD = 'offline-safe-24';
  navigator.serviceWorker.register('sw.js?v=' + SW_BUILD, { updateViaCache: 'none' }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'queue-changed') { OFF.n = d.n || 0; offRender(); if (d.flushed) offReloadData(); }
  });
}
const offSyncBtn = document.getElementById('offSync');
if (offSyncBtn) offSyncBtn.addEventListener('click', () => { OFF.blocked = false; offFlush(); });
setTimeout(offInfo, 1500);
window.addEventListener('load', () => setTimeout(offInfo, 800));

// v3.15.1: поиск — на десктопе сверху (над списком), на телефоне — внизу, слева от ＋
function placeSearch() {
  const inp = document.getElementById('globalSearch');
  const top = document.getElementById('searchTop');
  const slot = document.getElementById('searchSlot');
  const row = document.querySelector('.bottom-bar .search-row');
  if (!inp || !top || !row) return;
  const desktop = window.innerWidth >= 900;
  if (desktop) {
    const host = slot || top;
    if (inp.parentElement !== host) host.appendChild(inp);
    top.classList.remove('hidden');
  } else {
    if (inp.parentElement !== row) row.insertBefore(inp, row.firstChild);
    top.classList.add('hidden');
  }
  searchUITick();
}
window.addEventListener('resize', placeSearch);

// ---------- init ----------
placeSearch();
init();
