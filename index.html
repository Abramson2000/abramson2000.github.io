async function renderMyDay() {
  const view = document.getElementById('view');
  state.mydayOffset = 0;               // v3.15.2: выбор дня убран — «Мой день» всегда на сегодня
  const off = 0;
  const base = new Date(); base.setHours(0, 0, 0, 0);
  // v3.16.4: фильтр по менеджерам в «Моём дне» — ТОЛЬКО для аккаунта Абрамова (строго по e-mail,
  // без фолбэка на роль из localStorage — иначе чужой вход на этом же устройстве видел фильтр)
  const isBoss = String(CURRENT_EMAIL || '').toLowerCase() === 'abramson@crm.ru';
  let clinics = (await listClinics()).filter(c => !c.markedDel && (c.kind || 'hospital') === 'hospital');
  const MGR_PICK = ['Абрамов', 'Осечкина', 'Скокова'];   // v3.15.2: в «Моём дне» — только эти менеджеры
  const mgrs = MGR_PICK.filter(m => clinics.some(c => (c.manager || '') === m));
  if (state.mydayMgr) clinics = clinics.filter(c => (c.manager || '') === state.mydayMgr);
  const days = c => Math.round((new Date(String(c.nextContact).slice(0, 10) + 'T00:00:00') - base) / 86400000);
  const withDate = clinics.filter(c => c.nextContact);
  const over = withDate.filter(c => days(c) < 0).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const tod  = withDate.filter(c => days(c) === 0);
  const week = withDate.filter(c => days(c) > 0 && days(c) <= 7).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const later = withDate.filter(c => days(c) > 7).sort((a, b) => (a.nextContact < b.nextContact ? -1 : 1));
  const row = (c, badge) => {
    // v3.16.3: в строке только город и менеджер — суть задачи видна в карточке, дублировать не нужно
    const sub = [c.city, c.manager].filter(Boolean).join(' · ');
    return `<div class="card list-row${state.selId === c.id ? ' selected' : ''}" data-id="${c.id}" data-kind="clinic">
      <div class="list-row-top">
        <span class="list-row-name">${esc(c.name)}</span>
        <span class="row-next">${badge}</span>
      </div>
      <div class="list-row-sub">${esc(sub || '—')}</div>
    </div>`;
  };
  const block = (title, list, badgeFn, useChip) => list.length
    ? `<div class="cns-head"><span>${title}${list.length ? ' · <b>' + list.length + '</b>' : ''}</span>${useChip && mgrSel ? mgrSel : ''}</div><div class="list">${list.map(c => row(c, badgeFn(c))).join('')}</div>`
    : '';
  // v3.18.0: «Требуют внимания» — снижение ПО ВСЕМ продуктам: сравниваем годовые итоги 2025 и 2026
  // (Boston + HugeMed вместе; отсутствующее значение не считаем нулём)
  const sumY = (c, y) => {
    const v = [c['sales_' + y], c['hugemed_' + y]].filter(x => x != null && x !== '');
    return v.length ? v.reduce((a, b) => a + Number(b), 0) : null;
  };
  const att = clinics.map(c => ({ c, a: sumY(c, '2025'), b: sumY(c, '2026') }))
    .filter(x => x.a != null && x.b != null && x.a > 0 && x.b < x.a);
  // v3.20.3: порядок блока — «Сумма» (по убыванию суммы прошлого года, по умолчанию) или «Процент» (по убыванию падения)
  const attSort = localStorage.getItem('attSort') === 'pct' ? 'pct' : 'sum';
  const attRows = att.slice().sort(attSort === 'pct' ? ((p, q) => (p.b / p.a) - (q.b / q.a)) : ((p, q) => q.a - p.a));
  // v3.17.3: блок «Требуют внимания» показываем всегда; если снижений нет — пишем, сколько клиник
  // вообще имеет заполненный 2025 / 2026 (иначе блок «исчезал» и выглядел как нереализованный)
  const attD25 = clinics.filter(c => sumY(c, '2025') != null).length;
  const attD26 = clinics.filter(c => sumY(c, '2026') != null).length;
  const pct = (cur, prev) => Math.round((cur - prev) / prev * 100);
  const attBlock = `<div class="cns-head"><span>Требуют внимания${att.length ? ' <b>' + att.length + '</b>' : ''}</span>`
    + `<div class="md-mgr" id="attSrtBox"><button class="md-mgr-btn" id="attSrtBtn" title="Порядок">${attSort === 'pct' ? 'Процент' : 'Сумма'}<span class="md-caret">▾</span></button>
      <div class="md-mgr-pop hidden" id="attSrtPop"><button class="md-mgr-opt${attSort === 'sum' ? ' active' : ''}" data-s="sum">Сумма</button><button class="md-mgr-opt${attSort === 'pct' ? ' active' : ''}" data-s="pct">Процент</button></div></div></div>`
    + (att.length
      ? `<div class="list">${attRows.slice(0, 50).map(x => `<div class="card list-row" data-id="${x.c.id}" data-kind="clinic">
        <div class="list-row-top"><span class="list-row-name">${esc(x.c.name)}</span><span class="nd nd-over">${pct(x.b, x.a)}%</span></div>
        <div class="list-row-sub">${esc([x.c.city, x.c.manager].filter(Boolean).join(' · ') || '—')}</div>
      </div>`).join('')}</div>
      <div class="list-row-sub" style="margin-top:6px;color:var(--muted)">Сравнение годовых итогов 2025 и 2026 по всем продуктам (Boston + HugeMed). Помесячных данных в базе нет.</div>`
      : `<div class="empty">Снижения год к году нет. Для сравнения нужны оба года: итоги 2025 заполнены у <b>${attD25}</b> клиник, 2026 — у <b>${attD26}</b>. Заполни в карточке — клиника появится здесь.</div>`);
  const chip = () => state.mydayMgr || 'Все';
  const mgrSel = isBoss ? `<div class="md-mgr" id="mdMgrBox"><button class="md-mgr-btn" id="mdMgrBtn" title="Фильтр по менеджеру">${esc(chip())}<span class="md-caret">▾</span></button>
      <div class="md-mgr-pop hidden" id="mdMgrPop">${[''].concat(mgrs).map(m => `<button class="md-mgr-opt${(state.mydayMgr || '') === m ? ' active' : ''}" data-m="${esc(m)}">${esc(m || 'Все менеджеры')}</button>`).join('')}</div>
    </div>` : '';
  // v3.16.0: без верхней строки «Мой день · дата», без дублирующего «просрочено», без выбора дня
  // и без кнопок выполнения; заголовки — только над группами, пустые группы не выводятся
  // v3.17.2: кнопка фильтра встроена в строку первого непустого заголовка (раньше — отдельная полоса сверху)
  const bOver = block('Просрочено', over, c => fmtDate(c.nextContact), true);
  const bToday = block('Сегодня', tod, c => fmtDate(c.nextContact), !over.length);
  const bLater = block('Позже', [...week, ...later].slice(0, 20), c => fmtDate(c.nextContact), !over.length && !tod.length);
  const chipInHead = !!(bOver || bToday || bLater);
  view.innerHTML = (mgrSel && !chipInHead ? `<div class="md-tools">${mgrSel}</div>` : '')
    + bOver + bToday + bLater
    + (!withDate.length ? `<div class="empty">Запланированных контактов нет. Клиник в базе: ${clinics.length}.</div>` : '')
    + attBlock;
  const mb = document.getElementById('mdMgrBtn');
  const mp = document.getElementById('mdMgrPop');
  const mbox = document.getElementById('mdMgrBox');
  if (mb && mp) {
    mb.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = mp.classList.toggle('hidden');
      if (mbox) mbox.classList.toggle('pop-open', !open);
    });
    mp.querySelectorAll('.md-mgr-opt').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      state.mydayMgr = b.dataset.m || '';
      state.selId = null;
      await render();
    }));
    document.addEventListener('click', () => { mp.classList.add('hidden'); if (mbox) mbox.classList.remove('pop-open'); }, { once: true });
  }
  // v3.20.3: чип выбора порядка в блоке «Требуют внимания»
  const ab = document.getElementById('attSrtBtn');
  const ap = document.getElementById('attSrtPop');
  const abox = document.getElementById('attSrtBox');
  if (ab && ap) {
    ab.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = ap.classList.toggle('hidden');
      if (abox) abox.classList.toggle('pop-open', !isHidden);
    });
    ap.querySelectorAll('.md-mgr-opt').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      localStorage.setItem('attSort', b.dataset.s === 'pct' ? 'pct' : 'sum');
      state.selId = null;
      await render();
    }));
    document.addEventListener('click', () => { ap.classList.add('hidden'); if (abox) abox.classList.remove('pop-open'); }, { once: true });
  }
  restorePanelSelection();
}

async function renderContacts() {
  const view = document.getElementById('view');
  const s = state.search;
  const f = state.filters;
  // v3.16.2: люди, клиники и связки — параллельно и из кэша
  const [people, clinics, links] = await Promise.all([listPeople(), listClinics(), listClinicLinks()]);
  const clinicMap = {};
  clinics.forEach(c => clinicMap[c.id] = c);
  const extra = {};
  links.forEach(l => { (extra[l.person_id] = extra[l.person_id] || []).push(l.clinic_id); });
  const orgIds = (p) => {
    const ids = [];
    if (p.clinicId) ids.push(p.clinicId);
    (extra[p.id] || []).forEach(id => { if (!ids.includes(id)) ids.push(id); });
    return ids;
  };
  const orgName = (p) => orgIds(p).map(id => clinicMap[id] && clinicMap[id].name).filter(Boolean).join(', ');
  const loc = (p) => {
    const c = clinicMap[p.clinicId];
    return { region: (c && c.region) || p.region || '', city: (c && c.city) || p.city || '' };
  };
  const kindOf = (p) => (isFirmContact(p) ? 'Компания' : (isRefDoc(p) ? 'Врач' : 'Клиника'));
  let rows = people.filter(p => !p.markedDel && (p.phone || p.email));
  rows = rows.filter(p => {
    const org = orgName(p);
    const l = loc(p);
    return (!s ||
      (p.fullName || '').toLowerCase().includes(s) ||
      (p.position || '').toLowerCase().includes(s) ||
      (p.phone || '').toLowerCase().includes(s) ||
      (p.email || '').toLowerCase().includes(s) ||
      org.toLowerCase().includes(s) ||
      (l.city || '').toLowerCase().includes(s) ||
      (l.region || '').toLowerCase().includes(s)) &&
      (!f.region || l.region === f.region) &&
      (!f.city || l.city === f.city);
  });
  rows.sort((a, b) => (a.fullName || '').localeCompare(b.fullName || '', 'ru'));
  const head = `<div class="cns-head"><span>Контакты · <b>${rows.length}</b></span></div>`;
  if (!rows.length) {
    view.innerHTML = head + `<div class="empty">${s ? 'Ничего не найдено' : 'Контактов пока нет'}</div>`;
    return;
  }
  view.innerHTML = head + '<div class="list">' + rows.map(p => {
    const sub = [orgName(p), shortPos(p.position), p.phone, p.email].filter(Boolean).join(' / ');
    return `<div class="card list-row" data-id="${p.id}" data-kind="person">
      <div class="list-row-top"><span class="list-row-name">${esc(p.fullName)}</span><span class="row-actions"><span class="tag">${esc(kindOf(p))}</span></span></div>
      <div class="list-row-sub">${esc(sub || '—')}</div>
    </div>`;
  }).join('') + '</div>';
  restorePanelSelection();
}

async function renderOrgList(kind) {
  const view = document.getElementById('view');
  const emptyWord = kind === 'distributor' ? 'Партнеров' : 'Клиник';
  let clinics = await listClinics();
  clinics = clinics.filter(c => (c.kind || 'hospital') === kind);
  const s = state.search;
  const f = state.filters;
  const mineOnly = kind === 'hospital' && !!state.mineOnly;
  const mym = myManager();
  clinics = clinics.filter(c =>
    (!s ||
      (c.name || '').toLowerCase().includes(s) ||
      (c.city || '').toLowerCase().includes(s) ||
      (c.region || '').toLowerCase().includes(s) ||
      (c.manager || '').toLowerCase().includes(s) ||
      (c.situation || '').toLowerCase().includes(s) ||
      (c.tags || []).some(t => t.toLowerCase().includes(s))) &&
    (!f.region || c.region === f.region) &&
    (!f.city || c.city === f.city) &&
    (!f.type || kind !== 'hospital' || ownershipOf(c) === f.type) &&
    (kind !== 'hospital' || tagHit(f, c.tags)) &&
    (!f.manager || c.manager === f.manager) &&
    (!mineOnly || (c.manager || '').trim() === mym)
  );
  const active = s || f.type || f.region || f.city || f.manager || mineOnly;
  if (!clinics.length) {
    view.innerHTML = `<div class="empty">${active ? 'Ничего не найдено' : emptyWord + ' пока нет. Нажми ＋'}</div>`;
    if (document.body.classList.contains('detail-mode') && state.selId) clearDetailPanel();   // выбранная выпала из фильтра
    return;
  }
  clinics.sort((a, b) => (b.markedDel ? 1 : 0) - (a.markedDel ? 1 : 0) || (a.name || '').localeCompare(b.name || '', 'ru'));
  const myEmail = CURRENT_EMAIL;
  const canTransfer = CURRENT_ROLE !== 'viewer' && CURRENT_ROLE !== 'guest' &&
    (myEmail === 'abramson@crm.ru' || myEmail === 'osechkina@crm.ru' || myEmail === 'skokova@crm.ru');
  // какие клиники уже есть на листах пользователя — подсветка значка ⇄
  const myWlIds = new Set();
  if (canTransfer) {
    const listKeys = Object.keys(WORKLISTS).filter(k => WORKLISTS[k].emails.includes(myEmail));
    const qs = await Promise.all(listKeys.map(k =>
      withTimeout(sb.from(WORKLISTS[k].cl).select('linked_clinic_id'), 10000, 'wl-check').catch(() => ({ data: [] }))
    ));
    qs.forEach(res => { (res.data || []).forEach(r => { if (r.linked_clinic_id) myWlIds.add(Number(r.linked_clinic_id)); }); });
  }
  const subTabs = kind !== 'hospital' ? '' :
    '<div class="subtabs">' +
      '<button type="button" class="subtab' + (mineOnly ? '' : ' active') + '" data-sub="all">Все клиники</button>' +
      '<button type="button" class="subtab' + (mineOnly ? ' active' : '') + '" data-sub="mine">Мои клиники' + (mym ? ' · ' + esc(mym) : '') + '</button>' +
    '</div>';
  view.innerHTML = subTabs + '<div class="list">' + clinics.map(c => {
    const loc = c.city || '';
    const m = (c.manager || '').trim();
    const showTr = canTransfer && (myEmail === 'abramson@crm.ru' ||
      (myEmail === 'osechkina@crm.ru' && m === 'Осечкина') ||
      (myEmail === 'skokova@crm.ru' && m === 'Скокова'));
    const inWl = myWlIds.has(c.id);
    const tr = showTr ? `<span class="transfer-btn${inWl ? ' on' : ''}" data-transfer="${c.id}" title="${inWl ? 'Уже в вашем листе' : 'Перенести в мой лист'}">⇄</span>` : '';
    const cnsOn = (c.tags || []).includes('cns');
    const cnsBtn = `<span class="cns-btn${cnsOn ? ' on' : ''}" data-cns="${c.id}" title="${cnsOn ? 'В отборе ЦНС — убрать' : 'Отобрать для ЦНС'}"><img src="cns.png" class="cns-ico" alt="" /></span>`;
    const typ = `<span class="row-type">${esc(ownershipLabel(ownershipOf(c)))}</span>`;
    const nc = (mineOnly && c.nextContact) ? `<span class="row-next">След. контакт: ${esc(String(c.nextContact).slice(0, 10))}</span>` : '';
    return `<div class="card list-row${c.markedDel ? ' marked-del' : ''}${state.selId === c.id ? ' selected' : ''}" data-id="${c.id}" data-kind="clinic">
      <div class="list-row-top">
        <span class="list-row-name">${esc(c.name)}</span>
        ${c.markedDel ? '<span class="mark-badge">на удалении</span>' : ''}
        <span class="row-actions">${cnsBtn}${tr}</span>
      </div>
      <div class="list-row-sub">${loc ? esc(loc) : '—'}</div>
      <div class="list-row-tags">${typ}${nc}</div>
    </div>`;
  }).join('') + '</div>';
  view.querySelectorAll('.subtab').forEach(b => b.addEventListener('click', () => {
    state.mineOnly = (b.dataset.sub === 'mine');
    render();
  }));
  // наведение — только спокойная подсветка строки, карточку не трогаем
  view.querySelectorAll('.list-row').forEach(row => {
    row.addEventListener('mouseenter', () => row.classList.add('hovering'));
    row.addEventListener('mouseleave', () => row.classList.remove('hovering'));
  });
  // v3.11.2: карточка справа открывается только по клику; наведения нет
  if (document.body.classList.contains('detail-mode')) {
    const selRow = state.selId ? view.querySelector(`.list-row[data-id="${state.selId}"]`) : null;
    if (selRow) { state.selKind = 'clinic'; showHoverCard(selRow, true); }
    else if (state.selId) clearDetailPanel();   // выбранная клиника отфильтрована — убираем карточку
  }
  view.querySelectorAll('.transfer-btn').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    e.preventDefault();
    const c = clinics.find(x => x.id === Number(b.dataset.transfer));
    if (!c) return;
    await transferToWorklist(c);
  }));
  // v1.158: клик по лого — пометка клиники в отбор ЦНС
  view.querySelectorAll('.cns-btn').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    e.preventDefault();
    const id = Number(b.dataset.cns);
    const c = clinics.find(x => x.id === id);
    if (!c) return;
    const on = !(c.tags || []).includes('cns');
    b.classList.toggle('on', on);
    b.title = on ? 'В отборе ЦНС — убрать' : 'Отобрать для ЦНС';
    try {
      const tags = on ? [...(c.tags || []), 'cns'] : (c.tags || []).filter(t => t !== 'cns');
      const { error } = await withTimeout(sb.from('clinics').update({ tags }).eq('id', id), 10000, 'cns-toggle');
      if (error) throw error;
      c.tags = tags;
      refreshCounts();
      toast(on ? 'Добавлено в отбор ЦНС' : 'Убрано из отбора ЦНС');
    } catch (err) {
      b.classList.toggle('on', !on);
      toast('Ошибка: ' + (err && err.message ? err.message : err));
    }
  }));
}

// ---------- перенос клиники в личный лист (Настя/Галя) ----------
function transferTarget(email, c) {
  const m = (c.manager || '').trim();
  if (email === 'osechkina@crm.ru') return m === 'Осечкина' ? 'nastya' : null;
  if (email === 'skokova@crm.ru') return m === 'Скокова' ? 'galya' : null;
  if (email === 'abramson@crm.ru') {
    if (m === 'Осечкина') return 'nastya';
    if (m === 'Скокова') return 'galya';
    if (m === 'Абрамов') return 'sasha';
    return 'pick';
  }
  return null;
}
async function transferToWorklist(c) {
  const key = transferTarget(CURRENT_EMAIL, c);
  if (key === null) { toast('Можно переносить только свои клиники'); return; }
  if (key === 'pick') {
    openModal('Куда перенести?', `
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
        ${Object.keys(WORKLISTS).filter(k => WORKLISTS[k].emails.includes(CURRENT_EMAIL)).map(k =>
          `<button class="btn" id="pk-${k}" style="flex:1;min-width:90px">${WORKLISTS[k].label}</button>`).join('')}
      </div>`);
    Object.keys(WORKLISTS).filter(k => WORKLISTS[k].emails.includes(CURRENT_EMAIL)).forEach(k => {
      document.getElementById('pk-' + k).addEventListener('click', () => { closeModal(); doTransfer(k, c); });
    });
    return;
  }
  await doTransfer(key, c);
}
async function doTransfer(key, c) {
  // v3.14.0: перенос = только СВЯЗЬ со списком. Контакты и продажи больше не копируются,
  // данные читаются из общей карточки — расхождений между разделами больше не будет.
  const W = WORKLISTS[key];
  try {
    const { data: dup, error: derr } = await withTimeout(sb.from(W.cl).select('id').eq('linked_clinic_id', c.id).maybeSingle(), 10000, 'wl-dup');
    if (derr) throw derr;
    if (dup) { toast('Уже в списке ' + W.label); return; }
    const { error: ierr } = await withTimeout(sb.from(W.cl).insert({
      name: c.name, linked_clinic_id: c.id
    }), 10000, 'wl-transfer');
    if (ierr) throw ierr;
    toast('✓ Связь с «' + W.label + '» создана (карточка общая)');
  } catch (e) { toast('⚠️ ' + e.message); }
}

async function renderMoney() {
  const view = document.getElementById('view');
  let clinics = await listClinics();
  const myMgr = myManagerName();  // менеджер видит в «Деньгах» только свои клиники
  if (myMgr) clinics = clinics.filter(c => c.manager === myMgr);
  const s = state.search;
  const f = state.filters;
  const year = state.moneyYear || curYear();
  const trendOn = !!state.moneyYear;
  clinics = clinics.filter(c =>
    (c.kind || 'hospital') === 'hospital' &&
    (!s ||
      (c.name || '').toLowerCase().includes(s) ||
      (c.city || '').toLowerCase().includes(s) ||
      (c.region || '').toLowerCase().includes(s) ||
      (c.manager || '').toLowerCase().includes(s)) &&
    (!f.region || c.region === f.region) &&
    (!f.city || c.city === f.city) &&
    (tagHit(f, c.tags)) &&
    (!f.manager || c.manager === f.manager)
  );
  // сортировка: по сумме (вверх/вниз) или по алфавиту; 0₽-бейджи — в середине (только при выбранном годе), пустые — вниз по алфавиту
  const mode = state.moneySort;  // 'desc' | 'asc' | 'name'
  const mf = state.moneyFilter || 'all';
  const showPills = trendOn || mf !== 'all';
  if (mf !== 'all') {
    const py = String(Number(year) - 1);
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, py);
      if (mf === 'up') return v != null && p != null && v > p;
      if (mf === 'down') return p != null && p !== 0 && (v == null || v < p);
      if (mf === 'new') return v != null && (p == null || p === 0);
      return true;
    });
    // пустые карточки (нет продаж ни в этом, ни в прошлом году) — скрываем при включённом фильтре
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, String(Number(year) - 1));
      return v != null || (p != null && p !== 0);
    });
  } else if (trendOn) {
    // выбран год: прячем карточки, где нет ни суммы, ни «0 ₽» — нет никакой информации
    clinics = clinics.filter(c => {
      const v = moneyVal(c, year), p = moneyVal(c, String(Number(year) - 1));
      return v != null || (p != null && p !== 0);
    });
  }
  clinics.sort((a, b) => {
    if (mode === 'name') return (a.name || '').localeCompare(b.name || '', 'ru');
    const av = moneyVal(a, year), bv = moneyVal(b, year);
    const ap = moneyVal(a, String(Number(year) - 1)), bp = moneyVal(b, String(Number(year) - 1));
    const az = trendOn && av == null && ap != null && ap !== 0;  // бейдж 0₽ только при выбранном годе
    const bz = trendOn && bv == null && bp != null && bp !== 0;
    const ta = av != null ? 0 : (az ? 1 : 2);
    const tb = bv != null ? 0 : (bz ? 1 : 2);
    if (ta !== tb) return ta - tb;
    if (ta === 0) return mode === 'asc' ? av - bv : bv - av;
    return (a.name || '').localeCompare(b.name || '', 'ru');
  });
  clinics.sort((a, b) => (b.markedDel ? 1 : 0) - (a.markedDel ? 1 : 0));  // помеченные на удаление — первыми
  const src = state.moneySource;
  const total = clinics.reduce((sum, c) => sum + (moneyVal(c, year) || 0), 0);
  const bTotal = clinics.reduce((sum, c) => sum + (curYearSales(c, year) || 0), 0);
  const hTotal = clinics.reduce((sum, c) => sum + (curYearHM(c, year) || 0), 0);
  const splitLabel = src === 'boston' ? `Boston ${fmtMoney(bTotal)}`
    : src === 'hugemed' ? `HugeMed ${fmtMoney(hTotal)}`
    : `Boston ${fmtMoney(bTotal)} · HugeMed ${fmtMoney(hTotal)}`;
  const sortLabel = mode === 'name' ? 'А-Я' : (mode === 'asc' ? '↑ по сумме' : '↓ по сумме');
  const sortTitle = mode === 'name' ? 'Сортировка по алфавиту (нажми для смены)' : `Сортировка по сумме: ${mode === 'asc' ? 'по возрастанию' : 'по убыванию'} (нажми для смены)`;
  view.innerHTML = `<div class="money-total-line">Итого ${year}: <b>${fmtMoney(total)} ₽</b>
      <span class="money-split">${splitLabel}</span>
      <select id="money-src" class="sort-toggle" title="Какие продажи считать">
        <option value="both"${src === 'both' ? ' selected' : ''}>Все</option>
        <option value="boston"${src === 'boston' ? ' selected' : ''}>Boston</option>
        <option value="hugemed"${src === 'hugemed' ? ' selected' : ''}>HugeMed</option>
      </select>
      <select id="money-filter" class="sort-toggle" title="Фильтр по динамике">
        <option value="all"${mf === 'all' ? ' selected' : ''}>Все</option>
        <option value="up"${mf === 'up' ? ' selected' : ''}>Рост</option>
        <option value="down"${mf === 'down' ? ' selected' : ''}>Падение</option>
        <option value="new"${mf === 'new' ? ' selected' : ''}>Новый</option>
      </select>
      <button class="sort-toggle" id="money-sort" title="${sortTitle}">${sortLabel}</button>
      <span class="money-cnt">${clinics.length}</span>
    </div>`
    + (clinics.length
      ? '<div class="list">' + clinics.map(c => {
      const loc = c.city || '';
      const money = fmtMoney(moneyVal(c, year));
      const hm = curYearHM(c, year);
      const split = (src === 'both' && hm != null && hm !== 0) ? ` · ХМ ${fmtMoney(hm)}` : '';
      let trend = '';
      const prevVal = moneyVal(c, String(Number(year) - 1));
      if (showPills && money) {
        const prev = prevVal;
        const cur = moneyVal(c, year);
        trend = (prev != null && cur != null) ? (cur > prev ? 'money-up' : (cur < prev ? 'money-down' : 'money-flat')) : 'money-flat';
      }
      const curVal = moneyVal(c, year);
      const zeroBadge = showPills && (curVal == null || curVal === 0) && prevVal != null && prevVal !== 0
        ? `<span class="list-row-money money-zero">0 ₽</span>` : '';
      return `<div class="card list-row${c.markedDel ? ' marked-del' : ''}" data-id="${c.id}" data-kind="clinic">
        <div class="list-row-top">
          <span class="list-row-name">${esc(c.name)}</span>
          ${c.markedDel ? '<span class="mark-badge">на удалении</span>' : ''}
          ${money ? `<span class="list-row-money ${trend}">${money} ₽</span>` : zeroBadge}
        </div>
        <div class="list-row-sub">${loc ? esc(loc) : '—'}${split}</div>
      </div>`;
      }).join('') + '</div>'
      : '<div class="empty">Ничего не найдено</div>');
  view.querySelectorAll('.list-row').forEach(row => {
    row.addEventListener('mouseenter', () => showHoverCard(row));
    row.addEventListener('mouseleave', hideHover);
  });
  document.getElementById('money-sort').addEventListener('click', () => {
    state.moneySort = mode === 'desc' ? 'asc' : (mode === 'asc' ? 'name' : 'desc');
    renderMoney();
  });
  document.getElementById('money-src').addEventListener('change', e => {
    state.moneySource = e.target.value;
    renderMoney();
  });
  document.getElementById('money-filter').addEventListener('change', e => {
    state.moneyFilter = e.target.value;
    renderMoney();
  });
}

function telHref(phone) {
  const first = String(phone || '').split(/[,;]/)[0];
  let d = first.replace(/[^\d+]/g, '');
  if (/^8\d{10}$/.test(d)) d = '+7' + d.slice(1);
  return d;
}
function maskPhoneValue(v) {
  return String(v || '').split(/[,;]\s*/).map(seg => {
    let d = seg.replace(/\D/g, '');
    let digits = d;
    if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) digits = digits.slice(1);
    if (digits.length === 10) return `8 (${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 8)}-${digits.slice(8, 10)}`;
    return seg.trim();
  }).join(', ');
}
function maskPhoneInput(el) {
  el.value = maskPhoneValue(el.value);
  el.addEventListener('input', () => { el.value = maskPhoneValue(el.value); });
}
function formatPhone(phone) {
  if (!phone) return '';
  return String(phone).split(/[,;]\s*/).map(seg => {
    let d = seg.replace(/\D/g, '');
    let digits = d;
    if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) digits = digits.slice(1);
    if (digits.length === 10) {
      return `8 (${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,8)}-${digits.slice(8,10)}`;
    }
    return seg.trim();
  }).join(', ');
}
function telLink(phone) {
  if (!phone) return '';
  return `<a class="tel" href="tel:${telHref(phone)}">${esc(formatPhone(phone))}</a>`;
}

// v3.6.4: короткая должность («пара слов») для карточек и списков
function shortPos(p) {
  if (!p) return '';
  let s = String(p).replace(/\([^)]*\)/g, ' ').split(/[,;·\n]/)[0].replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const l = s.toLowerCase().replace(/ё/g, 'е');
  const has = re => re.test(l);
  if (has(/помощник\s+зав/)) return 'Помощник заведующего';
  if (has(/зам.*главн.*врач|зам.*главврач/)) return 'Зам. главврача';
  if (has(/зам.*хирург/)) return 'Зам. по хирургии';
  if (has(/зам.*эконом/)) return 'Зам. по экономике';
  if (has(/^зам(\s|$|\.)/) || has(/заместител/)) return 'Заместитель';
  if (has(/главн.*врач|главврач/)) return 'Главврач';
  if (has(/(^|\s)гл\.?\s+уролог|главн.*уролог/)) return 'Главный уролог';
  if (has(/профессор/)) return 'Профессор';
  if (has(/доцент/)) return 'Доцент';
  if (has(/академик|член-корр/)) return 'Академик';
  if (has(/аспирант/)) return 'Аспирант';
  if (has(/ассистент/)) return 'Ассистент';
  if (has(/ординатор|стажер|стажёр/)) return has(/уролог/) ? 'Врач-уролог' : 'Ординатор';
  if (has(/научн.*сотрудник/)) return 'Научный сотрудник';
  if (has(/зав|завед/)) {
    if (has(/аптек/)) return 'Зав. аптекой';
    if (has(/кафедр|каф\.?\s/)) return 'Зав. кафедрой';
    if (has(/оперблок/)) return 'Зав. оперблоком';
    if (has(/лаборатор/)) return 'Зав. лабораторией';
    return 'Зав. отделением';
  }
  if (has(/ген.*директор/)) return 'Ген. директор';
  if (has(/директор/)) return 'Директор';
  if (has(/(^|\s)юрист/)) return 'Юрист';
  if (has(/менеджер|мнеджер/)) return has(/закуп/) ? 'Менеджер по закупкам' : 'Менеджер';
  if (has(/закуп|снабжен/)) return has(/начальник/) ? 'Нач. отдела закупок' : (has(/руковод/) ? 'Руководитель закупок' : 'Закупки');
  if (has(/начальник/)) return has(/уролог|отделен/) ? 'Начальник отделения' : 'Нач. отдела';
  if (has(/руководител/)) {
    if (has(/направлен/)) return 'Руководитель направления';
    if (has(/отдел|отделен/)) return 'Руководитель отделения';
    return 'Руководитель';
  }
  if (has(/уролог-?андролог/)) return 'Уролог-андролог';
  if (has(/урогинеколог/)) return 'Урогинеколог';
  if (has(/онкоуролог/)) return has(/^(врач|доктор)/) ? 'Врач-уролог' : 'Онкоуролог';
  if (has(/дистрибьютор|поставщик/)) return 'Дистрибьютор';
  if (has(/анестезиолог|анастезиолог/)) return 'Анестезиолог';
  if (has(/уролог/)) return has(/^(врач|доктор)/) ? 'Врач-уролог' : 'Уролог';
  if (has(/онколог/)) return has(/^(врач|доктор)/) ? 'Врач-онколог' : 'Онколог';
  if (has(/гинеколог/)) return has(/^(врач|доктор)/) ? 'Врач-гинеколог' : 'Гинеколог';
  if (has(/нефролог/)) return 'Нефролог';
  if (has(/м\/с|медсестр|мед\.\s*сестр|сестра/)) return has(/главн/) ? 'Главная медсестра' : 'Медсестра';
  if (has(/начмед/)) return 'Начмед';
  if (has(/специалист/)) return 'Специалист';
  if (has(/представител/)) return 'Представитель';
  if (has(/студент/)) return 'Студент';
  if (has(/инженер/)) return 'Инженер';
  if (has(/^(врач|доктор)/)) return 'Врач';
  const w = s.split(' ');
  return w.length > 2 ? w.slice(0, 2).join(' ') : s;
}
function parseTags(s) {
  return (s || '').split(',').map(t => t.trim()).filter(Boolean);
}

function readMoney(id) {
  const el = document.getElementById(id);
  if (!el) return null;   // v3.6.1: поле может отсутствовать (форма справочной карточки/компании) — не падаем

  if (raw === '') return null;

}

async function saveClinic(id) {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { toast('Название обязательно'); return; }
  const kind = document.getElementById('f_kind').value;
  const region = document.getElementById('fm_region').value.trim();
  if (!region) { toast('Регион обязателен'); return; }
  const city = document.getElementById('fm_city').value.trim();
  const manager = document.getElementById('fm_manager').value.trim();
  const sitRaw = document.getElementById('f_situation').value.trim();
  const siteEl = document.getElementById('f_site');
  const situation = withSite(sitRaw, siteEl ? siteEl.value : '');
  const tags = parseTags(document.getElementById('f_tags').value);
  const linkedClinicId = document.getElementById('f_link').value ? Number(document.getElementById('f_link').value) : null;
  const isRefK = isRefKind(kind);
  let sales, hms;
  if (isRefK) {
    sales = MONEY_YEARS.map(y => (y === '2023' || y === '2024') ? readMoney('f_sales' + y) : null);
    hms = HUGEMED_YEARS.map(() => null);
  } else {
    sales = MONEY_YEARS.map(y => readMoney('f_sales' + y));
    hms = HUGEMED_YEARS.map(y => readMoney('f_hm' + y));
  }
  if (sales.some(v => Number.isNaN(v)) || hms.some(v => Number.isNaN(v))) { toast('Некорректное число в продажах'); return; }

  await addDictValues('region', [region]);
  await addDictValues('city', [city]);
  await addDictValues('manager', [manager]);

  const row = { name, region, city, manager, situation, tags, linkedClinicId, kind };
  const moneyFields = {};
  MONEY_YEARS.forEach((y, i) => { moneyFields['sales_' + y] = sales[i]; });
  HUGEMED_YEARS.forEach((y, i) => { moneyFields['hugemed_' + y] = hms[i]; });
  // v3.17.0: при сбое сохранения форма не закрывается и введённое НЕ теряется
  try {
    if (id) await updateClinic(id, row);
    else id = (await addClinic(row)).id;
  } catch (e) {
    toast('⚠️ Не сохранилось: ' + (e && e.message ? e.message : e) + ' — данные остались в форме');
    return;
  }

  // деньги — только в закрытую часть, и только если на неё есть право
  const isBossNow = CURRENT_ROLE === 'admin';
  const canMoney = isBossNow || (!!myManager() && myManager() === manager);
  if (canMoney) { try { await saveClinicPrivate(id, manager, moneyFields); } catch (e) { toast('Клиника сохранена, деньги — нет: ' + (e.message || e)); } }

  closeModal(); toast('Сохранено'); render(); updateFiltersUI(); refreshCounts();
}

// v3.7.0: сайт учреждения хранится строкой «Сайт: URL» в примечаниях; в карточке — отдельной кнопкой
const SITE_LINE_RE = /^\s*Сайт:\s*(https?:\/\/\S+)\s*$/i;
function splitSite(sit) {
  const lines = String(sit || '').split('\n');
  let site = ''; const rest = [];
  for (const ln of lines) {
    const m = ln.match(SITE_LINE_RE);
    if (m) { if (!site) site = m[1]; continue; }
    rest.push(ln);
  }
  return { site, rest: rest.join('\n').replace(/^\s+|\s+$/g, '') };
}
// v3.17.0: САЙТ — отдельной плашкой (после людей) и с правкой на месте
function siteLineHtml(site) {
  if (!site) return `<span class="site-empty">не указан</span>`;
  let dom = site; try { dom = new URL(site).hostname.replace(/^www\./, ''); } catch (e) {}
  return `<a class="site-link" href="${esc(site)}" target="_blank" rel="noopener">🌐 ${esc(dom)}</a>`;
}
function withSite(situation, site) {
  const { rest } = splitSite(situation);
  const s = String(site || '').trim();
  return s ? (rest ? rest + '\n' : '') + 'Сайт: ' + s : rest;
}
// v3.22.0: плашка «Сайт» только ПОКАЗЫВАЕТ адрес; правка — в форме организации/человека
function siteBlockFull(situation, table, id, canEdit) {
  const { site } = splitSite(situation);
  // v3.17.1: блок «Сайт» показываем ВСЕГДА (даже пустой и без прав) — он не должен пропадать
  return `<div class="detail-block site-block" data-table="${table}" data-id="${id}">
      <div class="k">Сайт</div>
      <div class="v site-row">
        <span class="site-link-wrap">${siteLineHtml(site)}</span>
      </div>
    </div>`;
}
async function currentSituation(table, id) {
  try {
    const { data } = await sb.from(table).select('situation').eq('id', id).maybeSingle();
    return (data && data.situation) || '';
  } catch (_) { return ''; }
}
function commentField(table, id, situation, canEditNow) {
  const editable = canEditNow === undefined
    ? (CURRENT_ROLE !== 'guest' && CURRENT_ROLE !== 'viewer')
    : (!!canEditNow && CURRENT_ROLE !== 'guest' && CURRENT_ROLE !== 'viewer');
  const { site, rest } = splitSite(situation);
  return `<div class="detail-block">
      <div class="k">Комментарии / ситуация</div>
      <div class="v comment-field" ${editable ? 'contenteditable="true" spellcheck="false"' : ''} data-table="${table}" data-id="${id}" data-site="${esc(site)}">${esc(rest)}</div>
    </div>`;
}

function readComment(field) {
  const t = (field.innerText != null) ? field.innerText : field.textContent;
  return String(t || '').replace(/\u00A0/g, ' ').replace(/\r\n?/g, '\n').trim();
}

// v3.24.0: гранулярность разворота продаж — месяцы или кварталы
// v3.24.1: строки держим по клинике (карточка и модалка могут показывать разные клиники)
let MNY_G = (localStorage.getItem('mnyGran') === 'q') ? 'q' : 'm';
const MNY_ROWS = {};
function mnyRows(y, rows) {
  const list = (rows || []).filter(r => String(r.year) === String(y));
  if (!list.length) return [];
  if (MNY_G === 'q') {
    const q = {};
    list.forEach(r => {
      const k = Math.ceil(Number(r.month) / 3);
      if (!q[k]) q[k] = { sale: null };
      if (r.sale != null) q[k].sale = Number(q[k].sale || 0) + Number(r.sale);
    });
    return Object.keys(q).sort((a, b) => a - b).map(k => ({ label: ['', 'I', 'II', 'III', 'IV'][k] + ' кв', sale: q[k].sale }));
  }
  return list.slice().sort((a, b) => Number(a.month) - Number(b.month)).map(r => ({ label: MONTH_RU[Number(r.month)] || r.month, sale: r.sale }));
}
function mnyTbodyHtml(y, rows) {
  return mnyRows(y, rows).map(r => `<tr class="mny-m"><td>${r.label}</td><td>${r.sale != null ? fmtMoney(r.sale) : '—'}</td><td>—</td><td>${r.sale != null ? fmtMoney(r.sale) : '—'}</td></tr>`).join('');
}
// v3.24.1: разворот денег работает и в правой карточке, и в модалке («Деньги», «Мой день», справочники)
function moneyClick(ev) {
  if (ev.__mnyDone) return true;          // защита от двойного вызова (делегат панели + document)
  const blk = ev.target.closest('.mny-block');
  if (!blk) return false;
  ev.__mnyDone = true;
  const rows = MNY_ROWS[blk.dataset.clinic] || [];
  const g = ev.target.closest('.mny-g');
  if (g) {
    ev.preventDefault(); ev.stopPropagation();
    const v = g.dataset.g === 'q' ? 'q' : 'm';
    if (v === MNY_G) return true;
    MNY_G = v;
    try { localStorage.setItem('mnyGran', v); } catch (_) {}
    blk.querySelectorAll('.mny-g').forEach(b => b.classList.toggle('on', b.dataset.g === v));
    blk.querySelectorAll('tbody[id^="mnyY"]').forEach(tb => {
      const y = tb.id.slice(4);
      const html = mnyTbodyHtml(y, rows);
      if (html) { tb.innerHTML = html; tb.classList.remove('hidden'); }
      else {
        tb.innerHTML = ''; tb.classList.add('hidden');
        const yr = blk.querySelector(`.mny-yr[data-y="${y}"]`);
        const car = yr && yr.querySelector('.mm-caret');
        if (car) car.style.transform = '';
      }
    });
    return true;
  }
  const more = ev.target.closest('#mnyMore');
  if (more) {
    ev.preventDefault(); ev.stopPropagation();
    const tb = blk.querySelectorAll('tbody[data-old="1"]');
    const show = tb.length ? tb[0].classList.contains('hidden') : false;
    tb.forEach(t => t.classList.toggle('hidden', !show));
    more.classList.toggle('open', show);
    return true;
  }
  const my = ev.target.closest('.mny-yr');
  if (my) {
    ev.preventDefault(); ev.stopPropagation();
    const tb = blk.querySelector(`tbody[id="mnyY${my.dataset.y}"]`);
    if (tb) {
      const hid = tb.classList.toggle('hidden');
      const car = my.querySelector('.mm-caret');
      if (car) car.style.transform = hid ? '' : 'rotate(180deg)';
    }
    return true;
  }
  return false;
}
document.addEventListener('click', moneyClick);

function clinicDetailBody(c, linked, contacts, canEditCard, related, monthly) {
  MNY_ROWS[c.id] = (monthly || []).slice();
  const mm = {};
  (monthly || []).forEach(r => { (mm[r.year] = mm[r.year] || []).push(r); });
  const canEditNow = canEditCard === undefined
    ? (CURRENT_ROLE !== 'guest' && CURRENT_ROLE !== 'viewer' && !isRefEdit())
    : !!canEditCard;
  const canPriv = canSeePrivate(c);
  // v3.22.0: ПРОДАЖИ — Год | Boston | HugeMed | Сумма (в году); видны текущий и два прошлых года, старые — под стрелкой
  const CUR_Y = Number(MONEY_YEARS[MONEY_YEARS.length - 1]);
  const mainYears = [CUR_Y, CUR_Y - 1, CUR_Y - 2].map(String).filter(y => MONEY_YEARS.includes(y));
  const oldYears = MONEY_YEARS.filter(y => !mainYears.includes(y));
  const hasYear = y => c['sales_' + y] != null || c['hugemed_' + y] != null;
  const moneyRow = y => {
    const s = c['sales_' + y], h = c['hugemed_' + y];
    const sum = (s != null || h != null) ? (Number(s || 0) + Number(h || 0)) : null;
    return `<tr><td>${y}</td><td>${s != null ? fmtMoney(s) : '—'}</td><td>${h != null ? fmtMoney(h) : '—'}</td><td>${sum != null ? fmtMoney(sum) : '—'}</td></tr>`;
  };
  void moneyRow;
  const mainRows = mainYears.filter(hasYear);
  const oldRows = oldYears.filter(hasYear);
  // v3.23.0: месяцa — вложенными строками под годом (только там, где они есть в базе)
  const monthTbody = y => {
    const inner = mnyTbodyHtml(y, MNY_ROWS[c.id]);
    if (!inner) return '';
    return `<tbody id="mnyY${y}" class="hidden">` + inner + `</tbody>`;
  };
  const yearTbody = (rows, hidden) => rows.map(y => {
    const has = (mm[y] || []).length > 0;
    return `<tbody${hidden ? ` class="hidden" data-old="1"` : ''}>`
      + `<tr${has ? ` class="mny-yr" data-y="${y}"` : ''}><td>${y}${has ? ' <span class="mm-caret">▾</span>' : ''}</td><td>${c['sales_' + y] != null ? fmtMoney(c['sales_' + y]) : '—'}</td><td>${c['hugemed_' + y] != null ? fmtMoney(c['hugemed_' + y]) : '—'}</td><td>${(() => { const s = c['sales_' + y], h = c['hugemed_' + y]; return (s != null || h != null) ? fmtMoney(Number(s || 0) + Number(h || 0)) : '—'; })()}</td></tr>`
      + `</tbody>` + monthTbody(y);
  }).join('');
  const hasMon = Object.keys(mm).length > 0;
  const granSwitch = `<div class="mny-gran">Показать: <button class="mny-g${MNY_G === 'm' ? ' on' : ''}" data-g="m" type="button">Месяцы</button><button class="mny-g${MNY_G === 'q' ? ' on' : ''}" data-g="q" type="button">Кварталы</button></div>`;
  const salesBlock = canPriv ? `<details class="detail-block mny-block" data-clinic="${c.id}" open>
      <summary>Продажи, ₽</summary>
      ${hasMon ? granSwitch : ''}
      ${(mainRows.length || oldRows.length) ? `<table class="money-tbl">
        <thead><tr><th>Год</th><th>Boston</th><th>HugeMed</th><th>Сумма</th></tr></thead>
        ${yearTbody(mainRows, false)}
        ${oldRows.length ? yearTbody(oldRows, true) : ''}
      </table>
      ${oldRows.length ? `<button class="money-more" id="mnyMore" type="button">${oldYears[0]}–${oldYears[oldYears.length - 1]} <span class="mm-caret">▾</span></button>` : ''}` : `<div class="v" style="color:var(--muted)">данных нет</div>`}
    </details>` : '';
  // v3.16.0: ЛЮДИ — компактный список (имя, должность, телефон), без счётчика и слова «нет»
  const sortedContacts = [...contacts].sort((a, b) => (b.markedDel ? 1 : 0) - (a.markedDel ? 1 : 0));
  const addPersonBtn = `<button class="pane-btn" id="paneAddPerson" data-id="${c.id}">＋ Добавить человека</button>`;
  const peopleBlock = sortedContacts.length
    ? `<div class="detail-block ppl-block">
        ${sortedContacts.map(p => `<div class="ppl-row contact-row${p.markedDel ? ' marked-del-row' : ''}" data-person="${p.id}">
            <div class="ppl-name">${esc(p.fullName)}${p.markedDel ? ' <span class="mark-badge">на удалении</span>' : ''}</div>
            ${p.position ? `<div class="ppl-sub">${esc(shortPos(p.position))}</div>` : ''}
            ${p.phone ? phoneLines(p.phone) : ''}
          </div>`).join('')}
        ${canEditNow ? `<div class="ppl-add">${addPersonBtn}</div>` : ''}
      </div>`
    : (canEditNow ? `<div class="detail-block ppl-block ppl-empty">${addPersonBtn}</div>` : '');
  // v3.16.0: ПАРТНЁРЫ — только реальные компании; свою справочную запись не показываем
  const isCompanyKind = k => k === 'distributor' || k === 'ref_firm';
  const ownRef = c.linkedClinicId || 0;
  const rel = [];
  const pushRel = (r) => {
    if (!r || !r.id || !r.name) return;
    if (r.id === c.id || r.id === ownRef) return;
    if (!isCompanyKind(r.kind)) return;
    if (rel.some(x => x.id === r.id)) return;
    rel.push({ id: r.id, name: r.name, kind: r.kind });
  };
  pushRel(linked);
  (related || []).forEach(pushRel);
  const relBlock = rel.length
    ? `<div class="detail-block"><div class="k">Связанные партнёры</div>${rel.map(r => `<div class="v"><span class="org-link" data-clinic="${r.id}">${esc(r.name)}</span></div>`).join('')}</div>`
    : '';
  // v3.22.1: блок «Подробнее» убран из карточки клиники (город/тип/ответственный дублируют шапку);
  // метки оставлены отдельной компактной плашкой — они нигде больше в карточке не показываются
  const tagsBlock = tagsHtml(c.tags);
  return `
    ${c.markedDel ? `<div class="detail-block mark-banner">⛔ Помечена на удаление</div>` : ''}
    ${salesBlock}
    ${privBlock(c, canEditNow)}
    ${notesBlock(c, canEditNow)}
    ${peopleBlock}
    ${siteBlockFull(c.situation, 'clinics', c.id, canEditNow)}
    ${relBlock}
    ${tagsBlock}
  `;
}

// ---- v3.12.2: «Работа и продажи · Вам и руководителю» + история записей ----

//   сервер отдаёт их только руководителю и ответственному менеджеру.
function canSeePrivate(c) {
  if (CURRENT_ROLE === 'admin') return true;
  if (CURRENT_ROLE === 'guest' || CURRENT_ROLE === 'viewer') return false;
  return !!c.hasPrivate || (!!window.CURRENT_MANAGER && c.manager === window.CURRENT_MANAGER);
}
function actionLabel(t) {
  return t === 'call' ? 'Звонок' : t === 'visit' ? 'Визит' : t === 'other' ? 'Другое' : 'Контакт';
}
function privBlock(c, canEditNow) {
  if (!canSeePrivate(c)) return '';
  const d = c.nextContact ? String(c.nextContact).slice(0, 10) : '';
  // v3.16.1: остался только компактный «Связаться» (дата необязательна).
  // Поле «Текущая ситуация» убрано — теперь одна лента записей ниже (п.3 дополнения),

  return `<div class="detail-block priv-block" data-cid="${c.id}" data-mgr="${esc(c.manager || '')}">
      <div class="priv-row compact"><span class="lbl">Связаться</span>

}
function notesBlock(c, canEditNow) {
  if (!canSeePrivate(c)) return '';
  // v3.16.1: одно поле ввода сверху, ниже — записи (новые сверху)
  return `<div class="detail-block notes-block" data-canedit="${canEditNow ? '1' : ''}">
      ${canEditNow ? `<div class="note-add"><textarea id="noteText" placeholder="Добавить запись…"></textarea><button class="btn-primary-sm" id="noteAdd" data-cid="${c.id}">Добавить</button></div>` : ''}
      <div class="v" id="notesList" data-cid="${c.id}"><span style="color:var(--muted)">загрузка…</span></div>
    </div>`;
}
function fillNotesBlock(cid) {
  return fillNotesBlock0(cid);
}
async function fillNotesBlock0(cid) {
  const box = document.querySelector('#notesList[data-cid="' + cid + '"]');
  if (!box) return;
  const blk = box.closest('.notes-block');
  const canEdit = !!(blk && blk.getAttribute('data-canedit') === '1');
  let list = [];
  try {
    const { data, error } = await sb.from('notes')
      .select('id,text,author_email,author_name,created_at')
      .eq('clinic_id', cid).order('created_at', { ascending: false });
    if (error) throw error;
    list = data || [];
  } catch (_) { list = []; box.classList.remove('hidden'); box.innerHTML = '<span style="color:var(--muted)">нет доступа к заметкам</span>'; return; }
  // v3.16.2: пустую историю и счётчик не показываем; у записи — дата и автор (если известны)
  box.classList.toggle('hidden', !list.length);
  if (!list.length && blk && !canEdit) blk.classList.add('hidden');
  box.innerHTML = list.length
    ? list.map(n => {
        const meta = [fmtDate(n.created_at), (n.author_name || n.author_email || '')].filter(Boolean).join(' · ');
        const pencil = canEdit ? `<button class="note-edit" data-note-edit="${n.id}" title="Изменить запись" aria-label="Изменить запись">✎</button>` : '';
        return `<div class="note-item" data-note="${n.id}">${pencil ? `<span class="note-tools">${pencil}</span>` : ''}${meta ? `<div class="note-meta">${esc(meta)}</div>` : ''}<div class="note-text">${esc(n.text)}</div></div>`;
      }).join('')
    : '';
}
// v3.16.2: правка ранее записанного (карандаш → текст → «Сохранить»/«Отмена»)
// v3.17.0: рядом с карандашом — удаление записи (с подтверждением в самой строке)
// скрываем «инструменты» (карандаш и корзину) у ВСЕХ записей, пока одна редактируется/удаляется
function hideNoteTools() {
  document.querySelectorAll('#notesList .note-tools').forEach(t => { t.style.display = 'none'; });
}
document.addEventListener('click', async (ev) => {
  const dl = ev.target.closest('[data-note-del]');
  if (dl) {
    ev.preventDefault(); ev.stopPropagation();
    const item = dl.closest('.note-item');
    if (!item || item.querySelector('.note-text') === null) return;
    hideNoteTools();   // v3.17.1: корзина не висит, пока идёт подтверждение
    const id = Number(dl.dataset.noteDel);
    const box = item.closest('#notesList');
    const cid = box ? Number(box.dataset.cid) : 0;
    const txt = (item.querySelector('.note-text') || {}).textContent || '';
    item.innerHTML = `<div class="note-meta">Удалить эту запись?</div><div class="note-confirm-text">${esc(txt.slice(0, 160))}</div>
      <div class="note-edit-row"><button class="btn-primary-sm danger" id="ndYes">Удалить</button><button class="pane-btn" id="ndNo">Отмена</button></div>`;
    item.querySelector('#ndNo').addEventListener('click', async (e2) => { e2.stopPropagation(); await fillNotesBlock(cid); });
    item.querySelector('#ndYes').addEventListener('click', async (e2) => {
      e2.stopPropagation();
      const b = e2.currentTarget; if (b.disabled) return; b.disabled = true;
      try {
        const { error } = await sb.from('notes').delete().eq('id', id);
        if (error) throw error;
        await fillNotesBlock(cid);
        toast('✓ Запись удалена');
      } catch (e3) {
        toast('⚠️ Не удалилось: ' + (e3 && e3.message ? e3.message : e3));
        b.disabled = false;
      }
    });
    return;
  }
  const ed = ev.target.closest('[data-note-edit]');
  if (!ed) return;
  ev.preventDefault(); ev.stopPropagation();
  const item = ed.closest('.note-item');
  if (!item || item.querySelector('.note-edit-ta')) return;
  const id = Number(ed.dataset.noteEdit);
  const box = item.closest('#notesList');
  const cid = box ? Number(box.dataset.cid) : 0;
  const textEl = item.querySelector('.note-text');
  const cur = textEl ? textEl.textContent : '';
  const metaEl = item.querySelector('.note-meta');
  const meta = metaEl ? metaEl.outerHTML : '';
  hideNoteTools();   // v3.17.1: на время правки корзина/карандаш не показываются
  item.innerHTML = `${meta}<textarea class="note-edit-ta" id="neTa">${esc(cur)}</textarea>
    <div class="note-edit-row"><button class="btn-primary-sm" id="neSave">Сохранить</button><button class="pane-btn" id="neCancel">Отмена</button><button class="note-del" id="neDel" title="Удалить запись" aria-label="Удалить запись">🗑</button></div>`;
  // v3.19.0: корзина живёт ТОЛЬКО в режиме правки записи
  item.querySelector('#neDel').addEventListener('click', async (e2) => {
    e2.stopPropagation();
    const b = e2.currentTarget; if (b.disabled) return; b.disabled = true;
    try {
      const { error } = await sb.from('notes').delete().eq('id', id);
      if (error) throw error;
      await fillNotesBlock(cid);
      toast('✓ Запись удалена');
    } catch (e3) {
      toast('⚠️ Не удалилось: ' + (e3 && e3.message ? e3.message : e3));
      b.disabled = false;
    }
  });
  const ta = item.querySelector('#neTa');
  if (ta) { ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (_) {} }
  item.querySelector('#neCancel').addEventListener('click', async (e2) => { e2.stopPropagation(); await fillNotesBlock(cid); });
  item.querySelector('#neSave').addEventListener('click', async (e2) => {
    e2.stopPropagation();
    const btn = e2.currentTarget; if (btn.disabled) return; btn.disabled = true;
    const txt = (ta.value || '').trim();
    if (!txt) { toast('Пустая запись не сохраняется'); btn.disabled = false; return; }
    try {
      const { error } = await sb.from('notes').update({ text: txt }).eq('id', id);
      if (error) throw error;
      await fillNotesBlock(cid);
      if (state.selId) { /* карточка уже открыта */ }
      toast('✓ Запись изменена');
    } catch (e3) {
      toast('⚠️ Не сохранилось: ' + (e3 && e3.message ? e3.message : e3));
      btn.disabled = false;
    }
  });
});
function hydrateCard(cid) { if (cid) fillNotesBlock(cid); }
document.addEventListener('click', async (ev) => {
  const save = ev.target.closest('#cpSave');
  if (save) {
    if (save.disabled) return;                     // защита от двойного нажатия
    save.disabled = true;
    const cid = Number(save.dataset.cid);
    const nd = document.getElementById('cpNext'), nt = document.getElementById('cpNote');
    // v3.16.1: в карточке больше нет полей «Ситуация» и «Тип действия» —

    } finally { save.disabled = false; }
    return;
  }
  const add = ev.target.closest('#noteAdd');

    const cid = Number(add.dataset.cid);

    const txt = ((ta && ta.value) || '').trim();
    if (!txt) { if (ta) ta.focus(); return; }
    add.disabled = true;
    try {
      const u = await currentUser();
      const { error } = await sb.from('notes').insert({ clinic_id: cid, text: txt, author_email: (u && u.email) || null, author_name: myManagerName() || (u && u.email) || null });
      if (error) throw error;
      if (ta) ta.value = '';
      await fillNotesBlock(cid);
      toast('✓ Запись добавлена');
    } catch (e) {
      toast('⚠️ Запись не добавлена: ' + (e && e.message ? e.message : e) + ' — текст оставлен в поле');
    } finally { add.disabled = false; }
    return;
  }
});

// v3.17.0: на телефоне карточка — отдельный экран (список скрыт), поэтому запоминаем
// позицию списка при входе в карточку и возвращаем её при выходе
function markListScroll() {
  if (document.body.classList.contains('card-open')) return;
  state.listScroll = Math.round(window.scrollY || document.documentElement.scrollTop || 0);
}
function closeCardToList() {
  const y = state.listScroll;
  state.selId = null; state.selKind = null;
  clearDetailPanel();
  showPanelHint();
  if (y != null) requestAnimationFrame(() => { try { window.scrollTo(0, y); } catch (_) {} });
  state.listScroll = null;
}

// v3.15.0: наведение НИЧЕГО не открывает и не закрывает — карточка меняется только по клику
function hideHover() { /* no-op */ }

function showPanelHint() {
  // v3.16.1: пустую плашку «Выберите клинику» убрали целиком (текст/фон/рамка/тень)
  const p = document.getElementById('hoverCard');

// после перерисовки списка возвращаем карточку выбранной строки (не сбрасываем выбор)
async function restorePanelSelection() {
  if (!document.body.classList.contains('detail-mode')) return;
  if (!state.selId) { showPanelHint(); return; }
  const kind = state.selKind || 'clinic';
  const row = document.querySelector(`.list-row[data-id="${state.selId}"][data-kind="${kind}"]`)
    || document.querySelector(`.list-row[data-id="${state.selId}"]`);

  else { state.selId = null; state.selKind = null; showPanelHint(); }

async function showHoverCard(row, immediate) {
  if (!immediate) return;   // v3.11.2: по наведению ничего не показываем
  const id = Number(row.dataset.id);
  const kind = row.dataset.kind || 'clinic';
  const seq = ++hoverSeq;
  clearTimeout(hoverTimer);
  const panel = document.getElementById('hoverCard');
  if (!panel) return;
  panel.classList.remove('hidden');
  panel.classList.remove('panel-empty');   // v3.16.1: карточка выбрана — пустое место занимать не нужно
  let inner;
  if (kind === 'person' || kind === 'refdoc') {
    state.selKind = kind;
    const p = await getPerson(id);
    if (!p || seq !== hoverSeq) return;
    const clinics = await personAllClinics(p);
    if (seq !== hoverSeq) return;
    const canEditP = canEditMain() || (isRefEdit() && (isRefDoc(p) || (clinics || []).some(c => c && isRefKind(c.kind))));
    inner = `<h3>${esc(p.fullName)}</h3>` + personDetailBody(p, clinics)
      + `<div class="pane-actions">${canEditP ? `<button class="pane-btn primary" id="panePersonEdit" data-id="${p.id}">Редактировать</button>` : ''}</div>`;
  } else {
    state.selKind = 'clinic';
    const c = await getClinic(id);
    if (!c || seq !== hoverSeq) return;
    // v3.15.3: связанная карточка, контакты и обратные ссылки — одним заходом, а не по очереди
    const [linked, contacts, relRes, monthly] = await Promise.all([
      c.linkedClinicId ? getClinic(c.linkedClinicId) : Promise.resolve(null),
      peopleByClinic(id),
      sb.from('clinics').select('id,name,kind,linked_clinic_id').eq('linked_clinic_id', id).then(r => r).catch(() => ({ data: [] })),
      listMonthly(id)
    ]);
    let related = (((relRes || {}).data) || []).map(r => ({ id: r.id, name: r.name, kind: r.kind }));
    if (seq !== hoverSeq) return;
    const canEditC = canEditMain() || (isRefEdit() && isRefKind(c.kind));
    // v3.16.2: вторая строка карточки — город · ЛПУ (госы) / ЧК (частники) · менеджер
    const own = ownershipOf(c);
    const ownShort = own === 'state' ? 'ЛПУ' : (own === 'private' ? 'ЧК' : '');
    const subLine = [c.city, ownShort, (c.manager && !isFirmKind(c.kind)) ? c.manager : ''].filter(Boolean).join(' · ');
    const head = `<h3>${esc(c.name)}</h3>${subLine ? `<div class="card-top">${esc(subLine)}</div>` : ''}`;
    const actions = `<div class="pane-actions">${canEditC ? `<button class="pane-pencil" id="paneClinicEdit" data-id="${c.id}" title="Редактировать" aria-label="Редактировать">✎</button>` : ''}</div>`;
    // v3.17.0: заголовок и карандаш — в одну компактную строку
    inner = `<div class="card-head"><div class="card-head-txt">${head}</div>${actions}</div>` + clinicDetailBody(c, linked, contacts, undefined, related, monthly);
  }
  panel.innerHTML = inner;
  hydrateCard(document.querySelector('#notesList[data-cid]') ? Number(document.querySelector('#notesList[data-cid]').dataset.cid) : 0);
  if (document.body.classList.contains('detail-mode')) {
    const back = document.createElement('button');
    back.className = 'btn ghost detail-back';
    back.textContent = '← Назад';
    back.addEventListener('click', (ev) => { ev.stopPropagation(); closeCardToList(); });
    panel.insertBefore(back, panel.firstChild);
  }
}

// v3.15.0: кнопки и ссылки внутри правой панели (одна общая карточка для всех разделов)
document.addEventListener('click', async (ev) => {
  const panel = document.getElementById('hoverCard');
  if (!panel || !panel.contains(ev.target)) return;
  const ss = ev.target.closest('#siteSave');
  if (ss) {
    ev.preventDefault(); ev.stopPropagation();
    if (ss.disabled) return;
    const box = ss.closest('.site-block');
    const inp = box ? box.querySelector('#siteInput') : null;
    const val = inp ? (inp.value || '').trim() : '';
    const table = ss.dataset.table || 'clinics';
    const id = Number(ss.dataset.id);
    ss.disabled = true;
    try {
      const cur = await currentSituation(table, id);
      const { rest } = splitSite(cur);
      const sit = val ? (rest ? rest.replace(/\s+$/, '') + '\n' : '') + 'Сайт: ' + val : rest;
      await setSituation(table, id, sit);
      const wrap = box ? box.querySelector('.site-link-wrap') : null;
      if (wrap) wrap.innerHTML = siteLineHtml(val);
      const cf = document.querySelector('.comment-field');
      if (cf) cf.setAttribute('data-site', val);
      toast('✓ Сайт сохранён');
    } catch (e2) {
      toast('⚠️ Сайт не сохранился');
    } finally { ss.disabled = false; }
    return;
  }
  const ed = ev.target.closest('#paneClinicEdit');
  if (ed) { ev.preventDefault(); ev.stopPropagation(); openClinicForm(Number(ed.dataset.id)); return; }
  if (moneyClick(ev)) return;   // v3.24.1: разворот денег (годы/месяцы/кварталы) — общий обработчик
  const ap = ev.target.closest('#paneAddPerson');
  if (ap) { ev.preventDefault(); ev.stopPropagation(); openPersonForm(null, Number(ap.dataset.id)); return; }
  const pe = ev.target.closest('#panePersonEdit');
  if (pe) { ev.preventDefault(); ev.stopPropagation(); openPersonForm(Number(pe.dataset.id)); return; }
  const ol = ev.target.closest('.org-link[data-clinic]');
  if (ol) {
    ev.preventDefault(); ev.stopPropagation();
    const cid = Number(ol.dataset.clinic);
    if (!cid) return;
    state.selId = cid; state.selKind = 'clinic';
    markListScroll();                             // v3.17.0: запоминаем позицию списка
    document.body.classList.add('card-open');
    document.querySelectorAll('.list-row.selected').forEach(el => el.classList.remove('selected'));
    const r = document.querySelector(`.list-row[data-kind="clinic"][data-id="${cid}"]`);
    if (r) r.classList.add('selected');
    await showHoverCard({ dataset: { id: String(cid), kind: 'clinic' } }, true);
    return;
  }
});

// инлайн-редактирование комментариев: контент-редактируемое поле, сохранение по blur
document.addEventListener('focusin', e => {
  const field = e.target.closest('.comment-field[contenteditable]');
  if (!field) return;
  field._orig = readComment(field);
});
document.addEventListener('focusout', async e => {
  const field = e.target.closest('.comment-field[contenteditable]');
  if (!field) return;
  const text = readComment(field);
  if (text === field._orig) return;
  const site = field.dataset.site || '';
  const full = site ? (text ? text.replace(/\s+$/, '') + '\nСайт: ' + site : 'Сайт: ' + site) : text;
  await setSituation(field.dataset.table, Number(field.dataset.id), full);
  toast('Сохранено');
});

async function showClinic(id) {
  const c = await getClinic(id);
  if (!c) return;
  const linked = c.linkedClinicId ? await getClinic(c.linkedClinicId) : null;
  const contacts = await peopleByClinic(id);
  const monthly = await listMonthly(id);
  const canEdit = canEditMain() || (isRefEdit() && isRefKind(c.kind));

  openModal(c.name, clinicDetailBody(c, linked, contacts, canEdit, null, monthly) + `
    <div class="btn-row">
      ${canEdit ? '<button class="btn" id="d_edit">Редактировать</button>' : ''}
      <button class="btn ghost" id="d_close">Закрыть</button>
    </div>
    ${canEdit ? '<button class="btn ghost" id="d_add_person" style="margin-top:10px">＋ Добавить человека</button>' : ''}
  `);
  if (canEdit) document.getElementById('d_edit').addEventListener('click', () => openClinicForm(id));
  hydrateCard(id);
  document.getElementById('d_close').addEventListener('click', closeModal);
  document.querySelectorAll('.contact-row').forEach(el => {
    el.addEventListener('click', (e) => { if (e.target.closest('a.tel')) return; closeModal(); showPerson(Number(el.dataset.person)); });
  });
  if (canEdit) document.getElementById('d_add_person').addEventListener('click', () => { closeModal(); openPersonForm(null, id); });
}

async function showPerson(id) {
  const p = await getPerson(id);
  if (!p) return;
  const clinics = await personAllClinics(p);
  const isRefP = isRefDoc(p) || (clinics || []).some(c => c && isRefKind(c.kind));
  const canEdit = canEditMain() || (isRefEdit() && isRefP);

  openModal(p.fullName, personDetailBody(p, clinics, canEdit) + `
    <div class="btn-row">
      ${canEdit ? '<button class="btn" id="d_edit">Редактировать</button>' : ''}
      <button class="btn ghost" id="d_close">Закрыть</button>
    </div>
  `);
  if (canEdit) document.getElementById('d_edit').addEventListener('click', () => openPersonForm(id));
  document.getElementById('d_close').addEventListener('click', closeModal);
  document.querySelectorAll('.org-link').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => { const cid = Number(el.dataset.clinic); if (cid) { closeModal(); showClinic(cid); } });
  });
}

// ---------- delete ----------
async function deleteClinic(id) {
  if (CURRENT_ROLE !== 'admin') {
    const c = await getClinic(id);
    const target = !c.markedDel;
    if (!confirm(target ? 'Пометить клинику на удаление?' : 'Снять пометку на удаление?')) return;
    await setClinicMarked(id, target);
    closeModal(); toast(target ? 'Помечена на удаление' : 'Пометка снята'); render(); updateFiltersUI(); refreshCounts();
    return;
  }
  if (!confirm('Удалить клинику?')) return;
  await removeClinic(id);
  await clearPeopleClinic(id);
  closeModal(); toast('Удалено'); render(); updateFiltersUI(); refreshCounts();
}

async function deletePerson(id) {
  if (CURRENT_ROLE !== 'admin') {
    const p = await getPerson(id);
    const target = !p.markedDel;
    if (!confirm(target ? 'Пометить человека на удаление?' : 'Снять пометку на удаление?')) return;
    await setPersonMarked(id, target);
    closeModal(); toast(target ? 'Помечен на удаление' : 'Пометка снята'); render(); refreshCounts();
    return;
  }
  if (!confirm('Удалить человека?')) return;
  await removePerson(id);
  closeModal(); toast('Удалено'); render(); refreshCounts();
}

// v3.16.0: тап по человеку в карточке (панель справа / экран на телефоне) — открываем его карточку
// (раньше строка была кликабельной по виду, но клик ничего не делал)
document.addEventListener('click', async (ev) => {

// делегирование кликов по view
document.getElementById('view').addEventListener('click', async e => {
  if (e.target.closest('a.tel')) return;
  // v3.6.0: в «Компаниях» тап по человеку — открываем его карточку (списка этих людей нет)
  const fpEl = e.target.closest('.firm-person[data-person]');
  if (fpEl) {
    e.preventDefault(); e.stopPropagation();
    hideHover();
    await showPerson(Number(fpEl.dataset.person));
    return;
  }
  // v3.5.4: тап по метке в списке — сразу включаем фильтр по этой метке
  const tagEl = e.target.closest('.tag-click[data-tag]');
  if (tagEl) {
    e.preventDefault(); e.stopPropagation();
    state.filters.tags = [tagEl.dataset.tag];
    try { syncTagMenu(); } catch (_) {}
    await render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  // v3.15.0: действия «Выполнено»/«Перенести» из «Моего дня»
  const mdDone = e.target.closest('[data-md-done]');
  if (mdDone) {
    e.preventDefault(); e.stopPropagation();
    await mdComplete(Number(mdDone.dataset.mdDone), mdDone.dataset.mdDate);
    return;
  }
  const mdMove = e.target.closest('[data-md-move]');
  if (mdMove) {
    e.preventDefault(); e.stopPropagation();
    await mdReschedule(Number(mdMove.dataset.mdMove), mdMove.dataset.mdDate);
    return;
  }
  const card = e.target.closest('.card');
  if (card) {
    hideHover();
    const { id, kind } = card.dataset;
    if (kind === 'nastya') return;
    // v3.11.2: выделяем выбранную строку спокойным цветом
    document.querySelectorAll('.list-row.selected').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    if (document.body.classList.contains('detail-mode')) {
      // Клиники/Партнёры: карточка справа просто меняется, окно не открываем
      state.selId = Number(id) || null;
      markListScroll();                           // v3.17.0: запоминаем позицию списка
      document.body.classList.add('card-open');   // v3.11.4: на телефоне — отдельный экран карточки
      showHoverCard(card, true);
      return;
    }
    if (kind === 'refclinic') { showClinic(Number(id)); return; }
    if (kind === 'refdoc') { showPerson(Number(id)); return; }    if (kind === 'clinic') showClinic(Number(id));
    else showPerson(Number(id));
    return;
  }
  const addBtn = e.target.closest('[data-add-btn]');
  if (addBtn) {
    const type = addBtn.dataset.addBtn;
    const input = document.querySelector(`input[data-add="${type}"]`);
    const value = (input.value || '').trim();
    if (!value) { toast('Введите значение'); return; }
    await addDictValue(type, value);
    toast('Добавлено'); render();
    return;
  }
  const x = e.target.closest('.chip .x');
  if (x) {
    const { dict, val } = x.dataset;
    await deleteDictValue(dict, val);
    toast('Удалено'); render();
  }
});

// ---------- офлайн: очередь правок и синхронизация ----------
const OFF = { n: 0, busy: false };
function swAsk(msg) {
  return new Promise((res) => {
    if (!('serviceWorker' in navigator)) return res(null);
    navigator.serviceWorker.ready.then((reg) => {
      const sw = reg.active || navigator.serviceWorker.controller;
      if (!sw) return res(null);
      const ch = new MessageChannel();
      ch.port1.onmessage = (e) => res(e.data);
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { return res(null); }
      setTimeout(() => res(null), 25000);
    }).catch(() => res(null));
  });
}
function offWord(n) { const m = n % 100, d = n % 10; if (m > 10 && m < 20) return 'правок'; if (d === 1) return 'правка'; if (d > 1 && d < 5) return 'правки'; return 'правок'; }
function offRender() {
  const chip = document.getElementById('offChip');
  if (!chip) return;
  const txt = document.getElementById('offText');
  const btn = document.getElementById('offSync');
  const offline = !navigator.onLine;
  if (!OFF.n && !offline) { chip.classList.add('hidden'); return; }
  chip.classList.remove('hidden');
  chip.classList.toggle('offline', offline);
  if (offline) {
    txt.textContent = OFF.n ? ('Нет сети · не отправлено: ' + OFF.n + ' ' + offWord(OFF.n)) : 'Нет сети · работаем по сохранённым данным';
    btn.textContent = 'Ждём сеть';
    btn.disabled = true;
  } else {
    txt.textContent = 'Не отправлено: ' + OFF.n + ' ' + offWord(OFF.n);
    btn.textContent = OFF.busy ? 'Отправляю…' : 'Отправить';
    btn.disabled = !!OFF.busy;
  }
}
async function offInfo() {
  const r = await swAsk({ type: 'queue-info' });
  if (r) { OFF.n = r.n || 0; offRender(); }
}
async function offReloadData() { try { await render(); await refreshCounts(); } catch (e) {} }
async function offFlush() {
  if (!navigator.onLine || OFF.busy) return;
  OFF.busy = true; offRender();
  const r = await swAsk({ type: 'flush' });
  OFF.busy = false;
  if (r) {
    if (r.left != null) OFF.n = r.left;
    offRender();
    if (r.ok) toast('Отправлено правок: ' + r.ok + (r.failed ? ' · отклонено базой: ' + r.failed : ''));
  }
  if (!OFF.n) await offReloadData();
}
window.addEventListener('online', () => { offRender(); offFlush(); });
window.addEventListener('offline', () => { offRender(); toast('Нет сети — правки сохранятся на устройстве и уйдут, когда появится связь'); });
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=' + APP_VER).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'queue-changed') { OFF.n = d.n || 0; offRender(); if (d.flushed) offReloadData(); }
  });
}
const offSyncBtn = document.getElementById('offSync');
if (offSyncBtn) offSyncBtn.addEventListener('click', () => offFlush());
setTimeout(offInfo, 1500);
window.addEventListener('load', () => setTimeout(offInfo, 800));

// v3.15.1: поиск — на десктопе сверху (над списком), на телефоне — внизу, слева от ＋
function placeSearch() {
  const inp = document.getElementById('globalSearch');
  const top = document.getElementById('searchTop');
  const row = document.querySelector('.bottom-bar .search-row');
  if (!inp || !top || !row) return;
  const desktop = window.innerWidth >= 900;
  if (desktop) {
    if (inp.parentElement !== top) top.appendChild(inp);
    top.classList.remove('hidden');
  } else {
    if (inp.parentElement !== row) row.insertBefore(inp, row.firstChild);
    top.classList.add('hidden');
  }
}
window.addEventListener('resize', placeSearch);

placeSearch();
