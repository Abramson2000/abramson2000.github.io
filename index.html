  let contacts = [], monthly = [];
  try {
    const [ct, mn] = await Promise.all([
      peopleByClinic(id, (pair.ids || [Number(id)]).filter(x => Number(x) !== Number(id))),
      listMonthly(moneyCard.id)
    ]);
    contacts = ct || []; monthly = mn || [];
  } catch (_) {}
  MNY_ROWS[moneyCard.id] = (monthly || []).slice();
  const related = (pair.others || []).map(r => ({ id: r.id, name: r.name, kind: r.kind }));
  openModal(c.name || 'Клиника',
    clinicHeadHtml(c, canEditC) + clinicDetailBody(c, pair.linked, contacts, undefined, related, monthly, pair));
  hydrateCard(Number(c.id) || 0);
}

// v4.31.0: клик по цифре в «Плане» — всплывающее окно с продажами клиники по месяцам
// v4.38.0: карточка продаж открывается мгновенно (из кэша) и обновляется после ответа сети
const SALES_CACHE = {};
async function savePlanYear(clinicId, amount) {
  const body = '[[P]]' + JSON.stringify({ year: 2026, plan: Number(amount) || 0 });
  const { data } = await sb.from('notes').select('id').eq('clinic_id', Number(clinicId)).like('text', '[[P]]%').limit(1);
  if (data && data[0]) {
    const { error } = await sb.from('notes').update({ text: body }).eq('id', data[0].id);
    if (error) throw error;
  } else {
    const { error } = await sb.from('notes').insert({
      clinic_id: cid, text: body,
      author_email: CURRENT_EMAIL || null, author_name: myManagerName() || window.CURRENT_MANAGER || null, source: 'plan'
    });
    if (error) throw error;
  }
  planCache = null;
  try { await loadPlans(); } catch (_) {}
}

function openPlanEditor(clinicId, curPlan, onSaved) {
  openModal('План 2026', `
    <div class="field"><label>План на год, ₽</label>
      <input type="number" id="planInput" value="${curPlan || ''}" placeholder="например 10000000" min="0" step="1000" />
    </div>
    <div class="btn-row"><button class="btn" id="planSave">Сохранить</button><button class="btn ghost" id="planCancel">Отмена</button></div>
  `);
  document.getElementById('planCancel').addEventListener('click', closeModal);
  document.getElementById('planSave').addEventListener('click', async () => {
    const btn = document.getElementById('planSave');
    btn.disabled = true;
    try {
      const val = Number(document.getElementById('planInput').value || 0);
      await savePlanYear(clinicId, val);
      closeModal();
      toast('✓ План сохранён');
      if (onSaved) await onSaved();
    } catch (e) { btn.disabled = false; toast('⚠️ Не сохранилось: ' + (e && e.message ? e.message : e)); }
  });
}

function salesModalHtml(c, rows, pl) {
  const CUR = 2026, PREV = 2025, LAST_M = 9;
  const sumM = (y, m) => { let s = 0, has = false; (rows || []).forEach(r => { if (Number(r.year) === y && Number(r.month) === m) { s += Number(r.sale || 0); has = true; } }); return has ? s : null; };
  const sumR = (y, a, b) => { let s = 0, has = false; (rows || []).forEach(r => { const m = Number(r.month); if (Number(r.year) === y && m >= a && m <= b) { s += Number(r.sale || 0); has = true; } }); return has ? s : null; };
  const fact = sumR(CUR, 1, LAST_M) || 0;
  const prev = sumR(PREV, 1, LAST_M) || 0;
  const pct = (a, b) => (b ? Math.round((a - b) / b * 100) : null);
  const MN = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  let body = '';
  for (let m = 1; m <= LAST_M; m++) {
    const a = sumM(CUR, m), b = sumM(PREV, m);
    const d = (a != null && b != null) ? pct(a, b) : null;
    body += `<tr><td>${MN[m - 1]}</td><td>${a != null ? fmtMoney(a) : '—'}</td><td>${b != null ? fmtMoney(b) : '—'}</td>`
      + `<td>${d == null ? '—' : `<span class="${d >= 0 ? 'pl-ok' : 'pl-bad'}">${d > 0 ? '+' : ''}${d}%</span>`}</td></tr>`;
  }
  const q = [1, 2, 3, 4].map(n => sumR(CUR, (n - 1) * 3 + 1, n * 3));
  const head = `<tr><td><b>Итого янв–сен</b></td><td><b>${fmtMoney(fact)}</b></td><td><b>${fmtMoney(prev)}</b></td>`
    + `<td>${prev ? `<span class="${fact >= prev ? 'pl-ok' : 'pl-bad'}">${pct(fact, prev) > 0 ? '+' : ''}${pct(fact, prev)}%</span>` : '—'}</td></tr>`;
  const qRow = `<tr class="pl-total"><td>Кварталы</td><td colspan="3">I ${q[0] ? fmtMoney(q[0]) : '—'} · II ${q[1] ? fmtMoney(q[1]) : '—'} · III ${q[2] ? fmtMoney(q[2]) : '—'} · IV ${q[3] ? fmtMoney(q[3]) : '—'}</td></tr>`;
  const planLine = pl
    ? `<div class="detail-block"><div class="k">План 2026</div><div class="v">${fmtMoney(pl)} ₽ · факт ${fmtMoney(fact)} ₽ · ${Math.round(fact / pl * 100)}%
         ${CURRENT_ROLE === 'admin' ? '· <a href="#" id="planEditLink">изменить</a>' : ''}</div></div>`
    : (CURRENT_ROLE === 'admin' ? `<div class="detail-block"><div class="k">План 2026</div><div class="v">не задан · <a href="#" id="planEditLink">задать</a></div></div>` : '');
  return `
    <div class="detail-block"><div class="k">Клиника</div><div class="v">${esc(c.name || '')}${c.city ? ' · ' + esc(c.city) : ''}</div></div>
    ${planLine}
    <table class="money-tbl plan-tbl" style="width:100%">
      <thead><tr><th>Месяц</th><th>2026</th><th>2025</th><th>Δ</th></tr></thead>
      <tbody>${body || '<tr><td colspan="4">данных нет</td></tr>'}${head}${qRow}</tbody>
    </table>
    <div class="row-why" style="margin-top:8px">Продажи Boston по месяцам, январь–сентябрь. Октябрь в базе пока не залит.</div>
  `;
}

async function openSalesPopup(id) {
  const cid = Number(id);
  let c = null;
  try { c = (typeof clinicFromCache === 'function') ? clinicFromCache(cid) : null; } catch (_) {}
  if (!c) { try { c = await getClinic(cid); } catch (_) {} }
  if (!c) { toast('Клиника не найдена'); return; }

  let rows = SALES_CACHE[cid] || MNY_ROWS[cid] || null;
  let pl = planCache ? planOf(planCache, cid, 2026) : 0;

  const paint = () => {
    openModal('Продажи · ' + (c.name || ''), salesModalHtml(c, rows || [], pl));
    const link = document.getElementById('planEditLink');
    if (link) link.addEventListener('click', (e) => {
      e.preventDefault();
      openPlanEditor(cid, pl, async () => {
        pl = planCache ? planOf(planCache, cid, 2026) : 0;
        paint();
        await render();
      });
    });
  };
  paint();   // мгновенно, без ожидания сети

  if (!rows || !pl) {
    try {
      const [r2, _] = await Promise.all([listMonthly(cid), loadPlans()]);
      rows = r2 || [];
      SALES_CACHE[cid] = rows;
      MNY_ROWS[cid] = rows.slice();
      pl = planCache ? planOf(planCache, cid, 2026) : 0;
      if (!document.getElementById('modal').classList.contains('hidden')) paint();
    } catch (_) {}
  }
}

async function renderPlan() {
  const view = document.getElementById('view');
  let all = [], mon = {}, plans = {}, vplans = [];
  const isMgrPlan = CURRENT_ROLE === 'manager';
  try {
    // v4.29.0: менеджер видит весь наш отдел (Абрамов, Осечкина, Скокова) — есть к чему стремиться,
    // но чужих менеджеров (Веприков, Янус и пр.) не видит
    const mePlan = String(window.CURRENT_MANAGER || myManagerName() || '').trim();
    all = (await listAllClinics()).filter(c => !isMgrPlan || String(c.manager || '').trim() === mePlan);
    mon = await loadMonthlyAll();
    plans = await loadPlans();
    vplans = await loadVisitPlans();
  } catch (e) {
    view.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки: ' + esc(e && e.message ? e.message : e) + '<br><br><button class="btn" onclick="render()">Повторить</button></div>';
    return;
  }
  const CUR_Y = new Date().getFullYear(), PREV_Y = CUR_Y - 1, LAST_M = 9;
  const sumR = (cid, y, m1, m2) => {
    const rows = mon[Number(cid)] || [];
    let s = 0, has = false;
    rows.forEach(r => { const m = Number(r.month); if (Number(r.year) === y && m >= m1 && m <= m2) { s += Number(r.sale || 0); has = true; } });
    return has ? s : null;
  };
  const today = todayISO();
  const nextVisit = {};
  (vplans || []).forEach(pl => {
    if (!pl.date || String(pl.date) < today) return;
    const id = Number(pl.clinic_id);
    if (!nextVisit[id] || String(pl.date) < String(nextVisit[id].date)) nextVisit[id] = pl;
  });

  const rows = [];
  (all || []).forEach(c => {
    if (c.markedDel) return;
    const plan = planOf(plans, c.id, CUR_Y);
    const fact = sumR(c.id, CUR_Y, 1, LAST_M) || 0;
    const prev = sumR(c.id, PREV_Y, 1, LAST_M) || 0;
    if (!plan && !fact && !prev) return;
    const q = [1, 2, 3, 4].map(n => sumR(c.id, CUR_Y, (n - 1) * 3 + 1, n * 3) || 0);
    const v = nextVisit[Number(c.id)];
    rows.push({
      id: Number(c.id), name: c.name, city: c.city || '', mgr: c.manager || '—',
      plan, fact, prev, q,
      pct: plan ? Math.round(fact / plan * 100) : null,
      left: plan ? Math.max(0, plan - fact) : null,
      perMonth: plan ? Math.max(0, plan - fact) / Math.max(1, (12 - LAST_M)) : null,
      yoy: prev ? Math.round((fact - prev) / prev * 100) : null,
      visit: v ? (v.kind || 'Визит') + ' · ' + fmtDate(v.date) : ''
    });
  });

  let list = rows;
  if (PLAN_ST.q) { const q = PLAN_ST.q.toLowerCase().replace(/ё/g, 'е'); list = list.filter(r => (r.name + ' ' + r.city).toLowerCase().replace(/ё/g,'е').includes(q)); }
  if (PLAN_ST.mgrs.length) list = list.filter(r => PLAN_ST.mgrs.includes(r.mgr));
  if (PLAN_ST.onlyPlan) list = list.filter(r => r.plan > 0);
  if (PLAN_ST.onlyFail) list = list.filter(r => r.yoy != null && r.yoy < 0);

  const cmp = (a, b) => {
    const k = PLAN_ST.sort, d = PLAN_ST.dir;
    const av = a[k], bv = b[k];
    if (typeof av === 'string' || typeof bv === 'string') return String(av || '').localeCompare(String(bv || ''), 'ru') * d;
    return ((Number(av || 0) - Number(bv || 0))) * d;
  };
  list.sort(cmp);

  const allMgrs = [...new Set(rows.map(r => r.mgr))].sort((a, b) => a.localeCompare(b, 'ru'));
  const groups = {};
  list.forEach(r => { (groups[r.mgr] = groups[r.mgr] || []).push(r); });
  const mgrOrder = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ru'));

  const fmtM = v => v == null ? '—' : fmtMoney(v);
  // v4.32.0: красный <60%, жёлтый 60–99%, зелёный 100–129%, синий ≥130% (перевыполнение = плохое планирование)
  // v4.32.0: красный <70%, жёлтый 70–99%, зелёный 100–129%, синий ≥130%
  const cellPct = v => v == null ? '—' : `<span class="${v >= 130 ? 'pl-over' : (v >= 100 ? 'pl-ok' : (v >= 70 ? 'pl-mid' : 'pl-bad'))}">${v}%</span>`;
  const th = (k, t, extra, title) => `<th data-plan-sort="${k}"${title ? ` title="${esc(title)}"` : ''} class="pl-th${PLAN_ST.sort === k ? ' on' : ''}${extra ? ' ' + extra : ''}">${t}${PLAN_ST.sort === k ? (PLAN_ST.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;

  const head = `<tr>
      ${th('name', 'Клиника')}
      ${th('plan', 'План')}${th('fact', 'Факт')}${th('pct', '%')}
      ${th('left', 'Осталось', 'pl-opt')}${th('perMonth', 'В месяц', 'pl-opt')}
      ${th('q1', 'I', 'pl-q', 'I квартал 2026')}${th('q2', 'II', 'pl-q', 'II квартал 2026')}${th('q3', 'III', 'pl-q', 'III квартал 2026')}${th('q4', 'IV', 'pl-q', 'IV квартал 2026')}
      ${th('yoy', 'Г/Г', '', 'Год к году: факт января–сентября 2026 против того же периода 2025')}<th class="pl-th">Визит</th>
    </tr>`;

  // v4.35.0: красим саму строку — красноватая при невыполненном плане, зеленоватая при выполненном
  const rowHtml = (r) => `<tr class="pl-row${r.pct == null ? '' : (r.pct >= 100 ? ' pl-done' : ' pl-fail')}" data-plan-clinic="${r.id}">
      <td class="pl-name"><b>${esc(r.name)}</b><span class="pl-city">${esc(r.city)}</span></td>
      <td data-sale-cell="${r.id}">${fmtM(r.plan)}</td>
      <td data-sale-cell="${r.id}">${fmtM(r.fact)}</td>
      <td data-sale-cell="${r.id}">${cellPct(r.pct)}</td>
      <td class="pl-opt">${fmtM(r.left)}</td>
      <td class="pl-opt">${r.perMonth ? fmtM(Math.round(r.perMonth)) : '—'}</td>
      <td class="pl-q" data-sale-cell="${r.id}">${r.q[0] ? fmtM(r.q[0]) : '—'}</td>
      <td class="pl-q" data-sale-cell="${r.id}">${r.q[1] ? fmtM(r.q[1]) : '—'}</td>
      <td class="pl-q" data-sale-cell="${r.id}">${r.q[2] ? fmtM(r.q[2]) : '—'}</td>
      <td class="pl-q" data-sale-cell="${r.id}">${r.q[3] ? fmtM(r.q[3]) : '—'}</td>
      <td data-sale-cell="${r.id}">${r.yoy == null ? '—' : `<span class="${r.yoy >= 0 ? 'pl-ok' : 'pl-bad'}">${r.yoy > 0 ? '+' : ''}${r.yoy}%</span>`}</td>
      <td class="pl-visit">${esc(r.visit || '')}</td>
    </tr>`;

  let body = '';
  const flatName = (PLAN_ST.sort === 'name');
  if (flatName) {
    body = list.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru') * (PLAN_ST.dir > 0 ? 1 : -1)).map(rowHtml).join('');
  }
  if (!flatName) mgrOrder.forEach(m => {
    const g = groups[m];
    const gp = g.reduce((s, r) => s + Number(r.plan || 0), 0);
    const gf = g.reduce((s, r) => s + Number(r.fact || 0), 0);
    body += `<tr class="pl-mgr" data-plan-mgr="${esc(m)}"><td colspan="12">
        <b>${esc(m)}</b> · клиник ${g.length} · план ${fmtM(gp)} · факт ${fmtM(gf)} · ${gp ? Math.round(gf / gp * 100) : 0}%
      </td></tr>` + g.map(rowHtml).join('');
  });

  const totP = rows.reduce((s, r) => s + Number(r.plan || 0), 0);
  const totF = rows.reduce((s, r) => s + Number(r.fact || 0), 0);
  const totLeft = Math.max(0, totP - totF);
  body += `<tr class="pl-total">`
    + `<td>Итого</td>`
    + `<td>${fmtM(Math.round(totP))}</td>`
    + `<td>${fmtM(Math.round(totF))}</td>`
    + `<td>${totP ? Math.round(totF / totP * 100) + '%' : '—'}</td>`
    + `<td class="pl-opt">${fmtM(Math.round(totLeft))}</td>`
    + `<td class="pl-opt">${fmtM(Math.round(totLeft / 3))}</td>`
    + `<td class="pl-q"></td><td class="pl-q"></td><td class="pl-q"></td><td class="pl-q"></td><td></td><td></td></tr>`;

  // 4.67.0: подпись описывает ровно то, что считает код: месяцы 1..LAST_M и те продукты,
  // которые реально есть в sales_monthly. Максимальный месяц не выдаём за «загружено полностью».
  const MN_RU = ['', 'январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const lastFactMonth = (() => {
    let m = 0;
    Object.keys(mon || {}).forEach(cid => (mon[cid] || []).forEach(r => { if (Number(r.year) === CUR_Y && Number(r.sale)) m = Math.max(m, Number(r.month) || 0); }));
    return m;
  })();
  const prodTxt = monProducts.size
    ? [...monProducts].map(x => x.charAt(0).toUpperCase() + x.slice(1)).join(' + ')
    : 'состав не указан';
  const calcTxt = 'январь–' + MN_RU[LAST_M] + ' ' + CUR_Y;
  const lastTxt = lastFactMonth ? (MN_RU[lastFactMonth] + ' ' + CUR_Y) : 'нет данных';
  const planNote = `<div class="plan-note">План ${CUR_Y} · факт в расчёте: ${esc(calcTxt)} · в данных только ${esc(prodTxt)} · последние продажи — ${esc(lastTxt)}</div>`;
  // v4.38.1: на телефоне — карточками; все нужные значения считаем ЗДЕСЬ, до объявлений ниже
  const isNarrow = window.innerWidth < 900;
  if (isNarrow) {
    const filtersOpenM = localStorage.getItem('planFilters') === '1';
    const chipsM = isMgrPlan ? '' : `<div class="plan-chips">`
      + `<button type="button" class="pl-chip${PLAN_ST.mgrs.length === 0 ? ' on' : ''}" data-pm="__all">Все</button>`
      + `<button type="button" class="pl-chip${PLAN_DEPT.every(m => PLAN_ST.mgrs.includes(m)) && PLAN_ST.mgrs.length === PLAN_DEPT.length ? ' on' : ''}" data-pm="__dept">Мой отдел</button>`
      + allMgrs.map(m => `<button type="button" class="pl-chip${PLAN_ST.mgrs.includes(m) ? ' on' : ''}" data-pm="${esc(m)}">${esc(m)}</button>`).join('')
      + `</div>`;
    const cardHtml = (r) => {
      const tint = r.pct == null ? '' : (r.pct >= 100 ? ' pl-card-done' : ' pl-card-fail');
      const pctTxt = r.pct == null ? '—' : r.pct + '%';
      const pctCls = r.pct == null ? '' : (r.pct >= 130 ? 'pl-over' : (r.pct >= 100 ? 'pl-ok' : (r.pct >= 70 ? 'pl-mid' : 'pl-bad')));
      const yoy = r.yoy == null ? '' : `<span class="${r.yoy >= 0 ? 'pl-ok' : 'pl-bad'}">${r.yoy > 0 ? '+' : ''}${r.yoy}%</span>`;
      return `<div class="pl-card${tint}">
        <div class="pl-card-top" data-plan-clinic="${r.id}">
          <span class="pl-card-name">${esc(r.name)}${r.city ? ' <span class="pl-card-city">' + esc(r.city) + '</span>' : ''}</span>
          <span class="pl-card-pct ${pctCls}">${pctTxt}</span>
        </div>
        <div class="pl-card-mid" data-sale-cell="${r.id}">
          <span>план <b>${fmtM(r.plan)}</b></span>
          <span>факт <b>${fmtM(r.fact)}</b></span>
          ${yoy ? `<span>Г/Г ${yoy}</span>` : ''}
        </div>
      </div>`;
    };
    const totP = rows.reduce((a, r) => a + Number(r.plan || 0), 0);
    const totF = rows.reduce((a, r) => a + Number(r.fact || 0), 0);
    view.innerHTML = planNote + `<div class="plan-bar">
        <input type="text" id="planSearch" placeholder="Поиск клиники" value="${esc(PLAN_ST.q)}" />
        <button type="button" class="btn ghost mini" id="planFiltersBtn">Фильтры${PLAN_ST.mgrs.length || PLAN_ST.onlyPlan || PLAN_ST.onlyFail ? ' ·' : ''}</button>
      </div>
      <div class="plan-filters${filtersOpenM ? '' : ' hidden'}" id="planFilters">
        <label class="pl-chk"><input type="checkbox" id="planOnlyPlan"${PLAN_ST.onlyPlan ? ' checked' : ''}/> только с планом</label>
        <label class="pl-chk"><input type="checkbox" id="planOnlyFail"${PLAN_ST.onlyFail ? ' checked' : ''}/> только с провалом</label>
        ${chipsM}
      </div>`
      + `<div class="pl-cards">${list.map(cardHtml).join('')}</div>`
      + `<div class="pl-cards-total">Итого: план ${fmtM(totP)} · факт ${fmtM(totF)} · ${totP ? Math.round(totF / totP * 100) : 0}%</div>`;
    const fb2 = document.getElementById('planFiltersBtn');
    if (fb2) fb2.addEventListener('click', () => {
      const box = document.getElementById('planFilters');
      if (!box) return;
      const open = box.classList.toggle('hidden') === false;
      localStorage.setItem('planFilters', open ? '1' : '0');
    });
    const ps2 = document.getElementById('planSearch');
    if (ps2) ps2.addEventListener('input', () => { PLAN_ST.q = ps2.value; renderPlan(); });
    const op2 = document.getElementById('planOnlyPlan');
    if (op2) op2.addEventListener('change', () => { PLAN_ST.onlyPlan = op2.checked; renderPlan(); });
    const of2 = document.getElementById('planOnlyFail');
    if (of2) of2.addEventListener('change', () => { PLAN_ST.onlyFail = of2.checked; renderPlan(); });
    view.querySelectorAll('#planFilters [data-pm]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.pm;
      if (v === '__all') PLAN_ST.mgrs = [];
      else if (v === '__dept') PLAN_ST.mgrs = PLAN_DEPT.slice();
      else { const k = PLAN_ST.mgrs.indexOf(v); if (k >= 0) PLAN_ST.mgrs.splice(k, 1); else PLAN_ST.mgrs.push(v); }
      renderPlan();
    }));
    view.querySelectorAll('.pl-card').forEach(el => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      const cell = el.querySelector('[data-sale-cell]') || el.querySelector('[data-plan-clinic]');
      const id = cell ? Number(cell.dataset.saleCell || cell.dataset.planClinic) : 0;
      if (id) await openSalesPopup(id);
    }));
    return;
  }

  const FILTERS_OPEN = localStorage.getItem('planFilters') === '1';
  const deptOn = PLAN_DEPT.every(m => PLAN_ST.mgrs.includes(m)) && PLAN_ST.mgrs.length === PLAN_DEPT.length;
  const chips = `<div class="plan-chips">
      <button type="button" class="pl-chip${PLAN_ST.mgrs.length === 0 ? ' on' : ''}" data-pm="__all">Все</button>
      <button type="button" class="pl-chip${deptOn ? ' on' : ''}" data-pm="__dept">Мой отдел</button>
      ${allMgrs.map(m => `<button type="button" class="pl-chip${PLAN_ST.mgrs.includes(m) ? ' on' : ''}" data-pm="${esc(m)}">${esc(m)}</button>`).join('')}
    </div>`;

  view.innerHTML = planNote + `<div class="plan-bar">
      <input type="text" id="planSearch" placeholder="Поиск клиники" value="${esc(PLAN_ST.q)}" />
      <button type="button" class="btn ghost mini" id="planFiltersBtn">Фильтры${PLAN_ST.mgrs.length || PLAN_ST.onlyPlan || PLAN_ST.onlyFail ? ' ·' : ''}</button>
    </div>
    <div class="plan-filters${FILTERS_OPEN ? '' : ' hidden'}" id="planFilters">
      <label class="pl-chk"><input type="checkbox" id="planOnlyPlan"${PLAN_ST.onlyPlan ? ' checked' : ''}/> только с планом</label>
      <label class="pl-chk"><input type="checkbox" id="planOnlyFail"${PLAN_ST.onlyFail ? ' checked' : ''}/> только с провалом</label>
      ${isMgrPlan ? '' : chips}
    </div>
    <div class="plan-wrap"><table class="money-tbl plan-tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;

  const fb = document.getElementById('planFiltersBtn');
  if (fb) fb.addEventListener('click', () => {
    const box = document.getElementById('planFilters');
    if (!box) return;
    const open = box.classList.toggle('hidden') === false;
    localStorage.setItem('planFilters', open ? '1' : '0');
  });
  const ps = document.getElementById('planSearch');
  if (ps) ps.addEventListener('input', () => { PLAN_ST.q = ps.value; renderPlan(); });
  view.querySelectorAll('[data-pm]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.pm;
    if (v === '__all') PLAN_ST.mgrs = [];
    else if (v === '__dept') PLAN_ST.mgrs = PLAN_DEPT.slice();
    else {
      const i = PLAN_ST.mgrs.indexOf(v);
      if (i >= 0) PLAN_ST.mgrs.splice(i, 1); else PLAN_ST.mgrs.push(v);
    }
    renderPlan();
  }));
  const op = document.getElementById('planOnlyPlan');
  if (op) op.addEventListener('change', () => { PLAN_ST.onlyPlan = op.checked; renderPlan(); });
  const of = document.getElementById('planOnlyFail');
  if (of) of.addEventListener('change', () => { PLAN_ST.onlyFail = of.checked; renderPlan(); });

  view.querySelectorAll('[data-plan-sort]').forEach(h => h.addEventListener('click', () => {
    const k = h.dataset.planSort;
    if (PLAN_ST.sort === k) PLAN_ST.dir = -PLAN_ST.dir; else { PLAN_ST.sort = k; PLAN_ST.dir = -1; }
    renderPlan();
  }));
  view.querySelectorAll('[data-plan-mgr]').forEach(td => td.addEventListener('click', () => {
    const m = td.dataset.planMgr;
    const i = PLAN_ST.mgrs.indexOf(m);
    if (i >= 0) PLAN_ST.mgrs.splice(i, 1); else PLAN_ST.mgrs.push(m);
    renderPlan();
  }));
  view.querySelectorAll('[data-sale-cell]').forEach(td => td.addEventListener('click', async (e) => {
    e.stopPropagation();
    await openSalesPopup(Number(td.dataset.saleCell));
  }));
  view.querySelectorAll('[data-plan-clinic]').forEach(tr => tr.addEventListener('click', async (e) => {
    if (e.target.closest('[data-sale-cell]')) return;   // по цифрам — продажи, по названию — карточка
    await openClinicCardModal(Number(tr.dataset.planClinic));
  }));
}

// v4.42.0: «Визиты» — диапазон дат, прошедшие, месячный обзор, фильтр по менеджерам, календарь
const VISITS_UI = {
  mode: (localStorage.getItem('visitsMode') === 'cal') ? 'cal' : 'list',
  month: null
};
function visitRange(p) {
  const a = String((p && p.date) || '').slice(0, 10);
  const b = String((p && (p.dateTo || p.date)) || '').slice(0, 10);
  if (!a) return '';
  if (!b || b === a) return fmtDate(a);
  return 'с ' + fmtDate(a) + ' по ' + fmtDate(b);
}
function visitMonthKey(iso) { return String(iso || '').slice(0, 7); }
function visitEnd(p) { return String((p && (p.dateTo || p.date)) || '').slice(0, 10); }
function monthLabel(key) {
  const MN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const p = String(key || '').split('-');
  return (MN[Number(p[1]) - 1] || '') + ' ' + (p[0] || '');
}
function monthShift(key, delta) {
  const p = String(key || '').split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function renderVisits() {
  const view = document.getElementById('view');
  state.defaultAction = 'visit';
  let all = [], ideas = [], plans = [];
  try {
    all = await listAllClinics();
    await loadVisitMeta();
    ideas = await loadVisitIdeas();
    plans = await loadVisitPlans();
  } catch (e) {
    view.innerHTML = '<div class="empty-state">\u26a0\ufe0f Ошибка загрузки: ' + esc(e && e.message ? e.message : e) + '<br><br><button class="btn" onclick="render()">Повторить</button></div>';
    return;
  }

  const byId = {}, cityById = {}, mgrById = {};
  (all || []).forEach(c => { byId[c.id] = c.name; cityById[c.id] = c.city || ''; mgrById[c.id] = c.manager || ''; });
  const me = window.CURRENT_MANAGER || myManagerName() || '';
  const isBossV = CURRENT_ROLE === 'admin' || String(CURRENT_EMAIL || '').toLowerCase() === 'abramson@crm.ru';
  // 4.69.0: правило Саши — ВСЕ менеджеры видят ВСЕ визиты и идеи.
  // Раньше не-руководителю показывались только визиты с его участием,
  // и у Скоковой список оставался пустым.
  const visible = () => true;

  // фильтр по менеджерам: Все / Мой отдел / Мазаева / Евсеев
  // v4.57.0: все видят все визиты; при входе фильтр стоит на своих, но можно выбрать «Все»
  const MGR_LIST = ['Абрамов', 'Осечкина', 'Скокова', 'Мазаева', 'Евсеев'];
  // v4.63.0: фильтр визитов живёт только в памяти. При входе — всегда «свои»,
  // сохранённый ранее чужой фильтр больше не «съедает» предстоящие визиты
  try { localStorage.removeItem('visitsMgr'); } catch (_) {}
  // 4.69.0: при входе фильтр всегда «Все». Раньше он молча вставал на свою фамилию
  // и прятал чужие визиты — это и выглядело как «нет предстоящих».
  const MGR_FILTER = (VISITS_UI.mgr === undefined) ? '' : VISITS_UI.mgr;
  const DEPT = ['Абрамов', 'Осечкина', 'Скокова'];
  const passMgr = (rec) => {
    if (!MGR_FILTER) return true;
    const cid = (rec && rec.clinic_id != null) ? rec.clinic_id : null;
    const parts = ((rec && rec.participants) || []).map(canonManager);
    if (parts.includes(MGR_FILTER)) return true;               // совместная поездка: визит виден участнику
    const m = String(mgrById[cid] || '').trim();
    if (MGR_FILTER === '__dept') return DEPT.includes(m) || parts.some(x => DEPT.includes(x));
    return m === MGR_FILTER;
  };

  const sV = state.search;
  const match = (txt) => !sV || String(txt || '').toLowerCase().replace(/ё/g,'е').includes(sV);
  const today = todayISO();

  const ideaRows = (ideas || []).filter(i => visible(i) && match(byId[i.clinic_id] || ''));
  const visitRows = (plans || [])
    .filter(p => p.date && passMgr(p) && match(byId[p.clinic_id] || p.city || ''))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));

  const past = visitRows.filter(p => visitEnd(p) < today);
  const future = visitRows.filter(p => visitEnd(p) >= today);

  // ---- месячные итоги (показываем внизу страницы) ----
  const curMonth = VISITS_UI.month || visitMonthKey(today);
  const monthStart = curMonth + '-01';
  const daysInMonthNum = new Date(Number(curMonth.slice(0, 4)), Number(curMonth.slice(5, 7)), 0).getDate();
  const monthEnd = curMonth + '-' + String(daysInMonthNum).padStart(2, '0');
  const inMonth = visitRows.filter(p => {
    const a = String(p.date).slice(0, 10), b = visitEnd(p);
    return !(b < monthStart || a > monthEnd);
  });
  const localISO = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const daySet = new Set();
  inMonth.forEach(p => {
    const a0 = String(p.date).slice(0, 10), b0 = visitEnd(p);
    const aa = a0 < monthStart ? monthStart : a0;
    const bb = b0 > monthEnd ? monthEnd : b0;
    const pa = aa.split('-').map(Number), pb = bb.split('-').map(Number);
    for (let d = new Date(pa[0], pa[1] - 1, pa[2]), e = new Date(pb[0], pb[1] - 1, pb[2]); d <= e; d.setDate(d.getDate() + 1)) {
      daySet.add(localISO(d));
    }
  });
  const days = daySet.size;
  const cities = new Set(inMonth.map(p => String(p.city || cityById[p.clinic_id] || '').trim()).filter(Boolean));
  const statsHtml = `<div class="md-gap">
      <div class="md-sec">Итоги · ${esc(monthLabel(curMonth))}</div>
      <div class="month-bar">
        <span class="month-stat">визитов <b>${inMonth.length}</b> · городов <b>${cities.size}</b> · дней <b>${days}</b>${cities.size ? ' · ' + esc([...cities].slice(0, 5).join(', ')) : ''}</span>
      </div>
    </div>`;

  // ---- календарь месяца: полосы на несколько дней, дни фиксированной высоты ----
  let calHtml = '';
  if (VISITS_UI.mode === 'cal') {
    const yy = Number(curMonth.slice(0, 4)), mm = Number(curMonth.slice(5, 7));
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const monthStart = curMonth + '-01';
    const monthEnd = curMonth + '-' + String(daysInMonth).padStart(2, '0');
    const shortTitle = (t) => { const v = String(t || '').trim(); return v.length > 18 ? v.slice(0, 18) + '…' : v; };
    const stripKind = (v) => String(v || '').replace(/^(встреча|апробация|мастер[- ]?класс|конференция)\s*[·:\-–]?\s*/i, '').trim();
    const labelOf = (p) => {
      const city = String(p.city || cityById[p.clinic_id] || '').trim();
      const raw = visitTitleOf(p) || p.goal || '';
      const name = shortTitle(stripKind(raw) || String(p.goal || '').trim() || raw);
      const isMoscow = /москва/i.test(city);
      if (city && !isMoscow) return city + ' · ' + name;
      return ((byId[p.clinic_id] || '') + (city ? (byId[p.clinic_id] ? ' · ' + city : city) : '') || 'Визит') + ' · ' + name;
    };
    const evs = [];
    visitRows.forEach(p => {
      const a0 = String(p.date).slice(0, 10), b0 = visitEnd(p);
      const a = a0 < monthStart ? monthStart : a0;
      const b = b0 > monthEnd ? monthEnd : b0;
      if (a > b) return;
      evs.push({ a, b, noteId: p.noteId, title: labelOf(p), cls: (b0 < today) ? 'past' : 'now' });
    });
    (ideas || []).forEach(i => {
      if (!i.from) return;
      const a0 = String(i.from).slice(0, 10), b0 = String(i.to || i.from).slice(0, 10);
      const a = a0 < monthStart ? monthStart : a0;
      const b = b0 > monthEnd ? monthEnd : b0;
      if (a > b) return;
      const city = String(cityById[i.clinic_id] || '').trim();
      const nm = shortTitle(i.goal || 'идея');
      evs.push({ a, b, noteId: i.noteId, idea: true, cls: 'idea', title: (city && !/москва/i.test(city) ? city + ' · ' : '') + nm });
    });

    // разбиваем месяц на недели по понедельникам
    const weeks = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = curMonth + '-' + String(d).padStart(2, '0');
      const dow = (new Date(yy, mm - 1, d).getDay() + 6) % 7; // Пн=0
      if (!weeks.length || dow === 0) weeks.push({ cells: [] });
      weeks[weeks.length - 1].cells.push({ iso, day: d, col: dow + 1 });
    }

    const weeksHtml = weeks.map(wk => {
      const wStart = wk.cells[0].iso, wEnd = wk.cells[wk.cells.length - 1].iso;
      const bars = [];
      evs.forEach(ev => {
        const a = ev.a > wStart ? ev.a : wStart;
        const b = ev.b < wEnd ? ev.b : wEnd;
        if (a > b) return;
        const dayA = Number(a.slice(8)), dayB = Number(b.slice(8));
        const colA = (new Date(yy, mm - 1, dayA).getDay() + 6) % 7 + 1;
        const colB = (new Date(yy, mm - 1, dayB).getDay() + 6) % 7 + 1;
        bars.push({ col: colA, span: Math.max(1, colB - colA + 1), title: ev.title, cls: ev.cls, noteId: ev.noteId, idea: ev.idea });
      });
      // раскладка полос по строкам, чтобы не перекрывались
      const rowsUsed = [];
      bars.sort((x, y) => x.col - y.col || y.span - x.span);
      bars.forEach(bar => {
        let r = 0;
        while (rowsUsed[r] && rowsUsed[r].some(x => !(bar.col + bar.span - 1 < x.col || x.col + x.span - 1 < bar.col))) r++;
        (rowsUsed[r] = rowsUsed[r] || []).push(bar);
        bar.row = r + 2;
      });
      return `<div class="cal-week">
        ${wk.cells.map(c => `<div class="cal-dnum" style="grid-column:${c.col};grid-row:1">${c.day}</div>`).join('')}
        ${bars.map(b => `<div class="cal-bar ${b.cls}" style="grid-column:${b.col}/${b.col + b.span};grid-row:${b.row}" ${b.idea ? `data-idea="${b.noteId}"` : `data-visit="${b.noteId}"`} title="${esc(b.title)}">${esc(b.title)}</div>`).join('')}
      </div>`;
    }).join('');

    calHtml = `<div class="cal-head">
        <button class="cal-nav" data-month="-1" aria-label="Предыдущий месяц">‹</button>
        <span class="cal-title">${esc(monthLabel(curMonth))}</span>
        <button class="cal-nav" data-month="1" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal-grid" id="calGrid">
        ${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${weeksHtml}
      </div>`;
  }

  // ---- список: прошедшие и предстоящие ----
  const rowHtml = (p) => `<div class="card list-row" data-visit="${p.noteId}">
      <div class="list-row-top"><span class="rn-wrap"><span class="visit-title-sm">${esc(visitTitleOf(p))}</span></span><span class="row-next">${esc(visitRange(p))}</span></div>
      <div class="row-why"><b>${esc(String(p.city || '').trim() || byId[p.clinic_id] || 'без клиники')}</b>${(!String(p.city || '').trim() && cityById[p.clinic_id]) ? ' · ' + esc(cityById[p.clinic_id]) : ''}</div>
      <div class="row-why">${(() => {
        const parts = (p.participants || []).map(canonManager).filter(Boolean);
        const mgr = String(mgrById[p.clinic_id] || '').trim();
        const who = parts.length ? parts : (mgr ? [mgr] : []);
        const uniq = [...new Set(who)];
        return (uniq.length ? 'Участники: ' + esc(uniq.join(', ')) : 'Участники: —') + ((p.people || []).length ? ' · врачей: ' + p.people.length : '');
      })()}</div>
      <div class="vm-actions">
        <button class="btn primary mini" data-edit-plan="${p.noteId}">Изменить</button>
        <button class="btn ghost mini vm-more" data-more="${p.noteId}" aria-haspopup="true" aria-expanded="false" aria-label="Другие действия с визитом">⋯</button>
      </div>
      <div class="vm-menu hidden" data-menu="${p.noteId}" role="menu">
        <button class="vm-menu-item" role="menuitem" data-drop-plan="${p.noteId}" data-cid="${p.clinic_id}">Отменить визит</button>
      </div>
    </div>`;
  // 4.67.0: самовосстановление — если фильтр по менеджеру спрятал все визиты,
  // показываем это прямо и даём одну кнопку, чтобы вернуть список
  const hiddenByFilter = (MGR_FILTER && !future.length && !past.length && (plans || []).length && !sV);
  const hiddenHtml = hiddenByFilter
    ? `<div class="empty" style="margin-bottom:12px">По фильтру «${esc(MGR_FILTER)}» визитов нет. <button class="btn ghost mini" id="visitsShowAll" style="width:auto;margin-left:6px">Показать все</button></div>`
    : '';
  const listHtml = (VISITS_UI.mode === 'cal') ? '' :
    hiddenHtml + `<div class="md-gap">
      <div class="md-sec">Предстоящие · <b>${future.length}</b></div>
      ${future.length ? `<div class="list">${future.map(rowHtml).join('')}</div>` : '<div class="empty">Предстоящих визитов нет.</div>'}
      ${past.length ? `<div class="visits-sep"><span>сегодня · ${fmtDate(today)}</span></div>
        <div class="md-sec" style="margin-top:6px">Прошедшие · <b>${past.length}</b></div>
        <div class="list">${past.slice().reverse().map(rowHtml).join('')}</div>` : ''}
    </div>`;

  // идеи
  const ideasHtml = ideaRows.length ? `<div class="md-sec">Идеи визитов · <b>${ideaRows.length}</b></div>
    <div class="list">${ideaRows.map(i => {
      const win = (i.from && i.to) ? (fmtDate(i.from) + ' — ' + fmtDate(i.to)) : (i.from ? 'с ' + fmtDate(i.from) : 'окно не задано');
      const parts = (i.participants || []).join(', ');
      return `<div class="card list-row" data-id="${i.clinic_id}" data-kind="clinic">
        <div class="list-row-top"><span class="rn-wrap"><span class="row-next" style="margin-left:0">${esc(win)}</span></span><span class="rn-wrap"><span class="list-row-name">${esc(byId[i.clinic_id] || ('клиника #' + i.clinic_id))}</span></span></div>
        <div class="row-why">${esc(i.goal || 'визит')}${parts ? ' · с ' + esc(parts) : ''}${i.remind ? ' · напомню ' + esc(fmtDate(i.remind)) : ''}</div>
        <div class="vm-actions">
          <button class="btn primary mini" data-plan-idea="${i.noteId}">Запланировать</button>
          <button class="btn ghost mini" data-edit-idea="${i.noteId}">Изменить</button>
          <button class="btn ghost mini vm-more" data-more="i${i.noteId}" aria-haspopup="true" aria-expanded="false" aria-label="Другие действия с идеей">⋯</button>
        </div>
        <div class="vm-menu hidden" data-menu="i${i.noteId}" role="menu">
          <button class="vm-menu-item" role="menuitem" data-drop-idea="${i.noteId}">Удалить идею</button>
        </div>
      </div>`;
    }).join('')}</div>` : '';

  const chip = (val, label) => `<button class="pl-chip${MGR_FILTER === val ? ' on' : ''}" data-visits-mgr="${val}">${label}</button>`;
  view.innerHTML = `
    <div class="plan-bar">
      <button class="btn ghost mini" id="visitsModeBtn">${VISITS_UI.mode === 'cal' ? 'Список' : 'Календарь'}</button>
      <button class="btn primary mini" id="newIdeaBtn">＋ Идея</button>
    </div>
    <div class="plan-filters" style="display:flex">
      ${chip('', 'Все')}${MGR_LIST.map(m => chip(m, m)).join('')}
    </div>
    ${calHtml}
    ${listHtml}
    ${VISITS_UI.mode === 'cal' ? '' : ideasHtml}
    ${VISITS_UI.mode === 'cal' ? statsHtml : ''}`;

  const nb = document.getElementById('newIdeaBtn');
  if (nb) nb.addEventListener('click', () => openIdeaModal());


  const shAll = document.getElementById('visitsShowAll');
  if (shAll) shAll.addEventListener('click', () => { VISITS_UI.mgr = ''; renderVisits(); });

  const mb = document.getElementById('visitsModeBtn');
  if (mb) mb.addEventListener('click', () => {
    VISITS_UI.mode = VISITS_UI.mode === 'cal' ? 'list' : 'cal';
    localStorage.setItem('visitsMode', VISITS_UI.mode);
    renderVisits();
  });

  view.querySelectorAll('[data-visits-mgr]').forEach(b => b.addEventListener('click', () => {
    VISITS_UI.mgr = b.dataset.visitsMgr;
    renderVisits();
  }));
  view.querySelectorAll('[data-month]').forEach(b => b.addEventListener('click', () => {
    VISITS_UI.month = monthShift(curMonth, Number(b.dataset.month));
    renderVisits();
  }));
  // свайп по сетке: влево — следующий месяц, вправо — предыдущий
  const calGrid = document.getElementById('calGrid');
  if (calGrid) {
    let sx = 0, sy = 0;
    calGrid.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    calGrid.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        VISITS_UI.month = monthShift(curMonth, dx < 0 ? 1 : -1);
        renderVisits();
      }
    }, { passive: true });
  }

  view.querySelectorAll('[data-plan-idea]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation(); e.preventDefault();
    const idea = ideas.find(x => Number(x.noteId) === Number(btn.dataset.planIdea));
    if (idea) await openVisitModal({ clinicId: idea.clinic_id, idea });
  }));
  view.querySelectorAll('[data-edit-idea]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation(); e.preventDefault();
    const idea = ideas.find(x => Number(x.noteId) === Number(btn.dataset.editIdea));
    if (idea) await openIdeaModal(idea.clinic_id, idea);
  }));
  view.querySelectorAll('[data-drop-idea]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation(); e.preventDefault();
    const nid = Number(btn.dataset.dropIdea);
    if (!confirm('Удалить идею визита?')) return;
    try {
      await sb.from('notes').delete().eq('id', nid);
      invalidateVisitCache();
      toast('✓ Идея удалена');
      await render();
    } catch (err) { toast('⚠️ Не удалось: ' + (err && err.message ? err.message : err)); }
  }));
  view.querySelectorAll('[data-edit-plan]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation(); e.preventDefault();
    const plan = plans.find(x => Number(x.noteId) === Number(btn.dataset.editPlan));
    if (plan) await openVisitModal({ clinicId: plan.clinic_id, plan });
  }));
  // 4.67.0: «⋯» раскрывает дополнительные действия; работает мышью, касанием и клавиатурой
  view.querySelectorAll('[data-more]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); e.preventDefault();
    const key = btn.dataset.more;
    const menu = view.querySelector('[data-menu="' + key + '"]');
    const open = menu && !menu.classList.contains('hidden');
    view.querySelectorAll('.vm-menu').forEach(m => m.classList.add('hidden'));
    view.querySelectorAll('[data-more]').forEach(b => b.setAttribute('aria-expanded', 'false'));
    if (menu && !open) { menu.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true'); const it = menu.querySelector('button'); if (it) it.focus(); }
  }));
  view.querySelectorAll('[data-menu]').forEach(menu => menu.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { menu.classList.add('hidden'); const b = view.querySelector('[data-more="' + menu.dataset.menu + '"]'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } }
  }));
  // (закрытие меню по клику вне — глобальный обработчик ниже, один раз при запуске)

  view.querySelectorAll('[data-drop-plan]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation(); e.preventDefault();
    const nid = Number(btn.dataset.dropPlan), cid = Number(btn.dataset.cid);
    if (!confirm('Отменить этот визит? Он исчезнет из «Предстоящих».')) return;
    try {
      await sb.from('notes').delete().eq('id', nid);
      await sb.from('clinic_private').update({ next_contact: null, action_type: null }).eq('clinic_id', cid);
      invalidateVisitCache();
      toast('✓ Визит отменён');
      await render();
    } catch (err) { toast('⚠️ Не удалось: ' + (err && err.message ? err.message : err)); }
  }));
  view.querySelectorAll('[data-visit]').forEach(el => el.addEventListener('click', async (e) => {
    if (e.target.closest('button')) return;
    const plan = plans.find(x => Number(x.noteId) === Number(el.dataset.visit));
    if (plan) await openVisitCard(plan);
  }));
}

// общий список запланированных действий из того же источника данных
async function renderActionList(type, title) {
  const view = document.getElementById('view');
  state.defaultAction = type;
  let rows = [];
  try {
    rows = (await listAllClinics()).filter(c => !c.markedDel && c.nextContact && c.kind !== 'distributor' && c.actionType === type);
    // v3.26.2: поиск работает и в «Звонках»/«Визитах»
    const sAL = state.search;
    if (sAL) rows = rows.filter(c =>
      (c.name || '').toLowerCase().includes(sAL) ||
      (c.city || '').toLowerCase().includes(sAL) ||
      (c.region || '').toLowerCase().includes(sAL) ||
      (c.manager || '').toLowerCase().includes(sAL));
  } catch (e) {
    view.innerHTML = '<div class="empty-state">\u26a0\ufe0f Ошибка загрузки: ' + esc(e && e.message ? e.message : e) + '<br><br><button class="btn" onclick="render()">Повторить</button></div>';
    return;
  }
  rows.sort((a, b) => {
    const da = String(a.nextContact).slice(0, 10), db = String(b.nextContact).slice(0, 10);
    if (da !== db) return da < db ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '', 'ru');
  });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cards = rows.map(c => {
    const nd = new Date(String(c.nextContact).slice(0, 10) + 'T00:00:00');
    const cls = nd < today ? 'nd-over' : (nd.getTime() === today.getTime() ? 'nd-today' : 'nd-future');
    return `<div class="card list-row${state.selId === c.id ? ' selected' : ''}" data-id="${c.id}" data-kind="clinic">
      <div class="list-row-top"><span class="rn-wrap"><span class="list-row-name">${esc(c.name)}</span></span><span class="nd ${cls}">${fmtDate(c.nextContact)}</span></div>
      ${subMarks(c, esc([c.city].filter(Boolean).join(', ') || '—') + (c.manager ? ' · ' + esc(c.manager) : ''))}
    </div>`;
  }).join('');
  view.innerHTML = `<div class="md-tools"><button class="btn primary mini" id="newActionBtn">＋ ${type === 'visit' ? 'Визит' : 'Звонок'}</button></div>` +
    `<div class="cns-head"><span>${esc(title)} \u00b7 <b>${rows.length}</b></span></div>` +
    (rows.length ? '<div class="list">' + cards + '</div>'
      : `<div class="empty">${type === 'visit' ? 'Запланированных визитов нет' : 'Запланированных звонков нет'} \u2014 нажми «＋» сверху</div>`);
  const nba = document.getElementById('newActionBtn');
  if (nba) nba.addEventListener('click', () => { if (type === 'visit') openVisitModal({}); else openCallModal(); });
}

// v4.56.0: новый звонок — клиника любая (Клиники или Справочник)
async function openCallModal() {
  const all = await clinicPool();
  const byName = {};
  all.forEach(c => { byName[String(c.name || '').toLowerCase()] = c; });
  openModal('Новый звонок', `

    <div class="btn-row"><button class="btn" id="clSave">Поставить</button><button class="btn ghost" id="clCancel">Отмена</button></div>
  `);

      const c = byName[nm.toLowerCase()];

  });
}

// ---------- Настя: изолированные карточки ----------
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return d + '.' + m + '.' + y;
}
async function renderNastya() { return renderWorklist('nastya'); }
async function renderGalya() { return renderWorklist('galya'); }
async function renderWorklist(key) {
  // v3.14.0 — список команды = СВЯЗИ с едиными карточками.
  // Из старой таблицы читается только состав списка (id + linked_clinic_id), все данные карточки
  // берутся из общей базы. Копий больше нет, поэтому правка карточки видна во всех разделах.
  const W = WORKLISTS[key];
  const view = document.getElementById('view');
  let members = [];
  try {
    const { data, error } = await withTimeout(sb.from(W.cl).select('id,linked_clinic_id,name').not('linked_clinic_id', 'is', null), 15000, 'wl-members');
    if (error) throw error;
    members = data || [];
  } catch (e) {
    view.innerHTML = '<div class="empty-state">\u26a0\ufe0f Ошибка загрузки вкладки ' + esc(W.label) + ': ' + esc(e && e.message ? e.message : e) +
      '<br><br><button class="btn" onclick="render()">Повторить</button></div>';
    return;
  }
  let all = [];
  try { all = (await listAllClinics()).filter(c => !c.markedDel); } catch (_) {}
  const byId = {}; all.forEach(c => { byId[c.id] = c; });
  // v3.33.0: в рабочих списках действуют те же метки-фильтры и поиск, что и в других разделах
  const wq = state.search || '';
  const linked = members.map(m => byId[m.linked_clinic_id]).filter(Boolean)
    .filter(c => (!wq || (c.name || '').toLowerCase().replace(/ё/g,'е').includes(wq) || (c.city || '').toLowerCase().replace(/ё/g,'е').includes(wq)) && matchFilters(state.filters, c));
  const unlinked = members.filter(m => !byId[m.linked_clinic_id]);
  // роль руководителя: только ему показываем конфликты назначений и записи без связи
  const isBoss = CURRENT_ROLE === 'admin' || CURRENT_EMAIL === 'abramson@crm.ru' || CURRENT_EMAIL === 'bot@crm.ru';
  const canManage = isBoss;
  // принадлежность списку НЕ назначает ответственного: расхождения показываем, но сами не правим
  const conflicts = linked.filter(c => (c.manager || '').trim() && (c.manager || '').trim() !== W.owner);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const sorted = [...linked].sort((a, b) => {
    const da = a.nextContact ? String(a.nextContact).slice(0, 10) : '9999-99-99';
    const db = b.nextContact ? String(b.nextContact).slice(0, 10) : '9999-99-99';
    if (da !== db) return da < db ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '', 'ru');
  });
  const cards = sorted.map(c => {
    const loc = c.city || '';
    let ndBadge = '';
    if (c.nextContact) {
      const nd = new Date(String(c.nextContact).slice(0, 10) + 'T00:00:00');
      const cls = nd < today ? 'nd-over' : (nd.getTime() === today.getTime() ? 'nd-today' : 'nd-future');
      ndBadge = `<span class="nd ${cls}">${fmtDate(c.nextContact)}</span>`;
    }
    const mgr = c.manager ? ' \u00b7 ' + esc(c.manager) : '';
    return `<div class="card list-row${state.selId === c.id ? ' selected' : ''}" data-id="${c.id}" data-kind="clinic">
        <div class="list-row-top">
          <span class="rn-wrap"><span class="list-row-name">${esc(c.name)}</span></span>
          ${ndBadge}
        </div>
        ${subMarks(c, (loc ? esc(loc) : '\u2014') + mgr)}
      </div>`;
  }).join('');
  let confBlock = '';
  if (isBoss && conflicts.length) {
    confBlock = `<div class="cns-head" style="margin-top:12px"><span>Расхождения по ответственному \u00b7 <b>${conflicts.length}</b></span></div>
      <div class="list">${conflicts.map(c => `<div class="card list-row" data-id="${c.id}" data-kind="clinic">
        <div class="list-row-sub">${esc(c.name)} \u2014 в карточке ответственный <b>${esc((c.manager || '').trim() || '\u2014')}</b>, список ${esc(W.label)} (${esc(W.owner)})</div></div>`).join('')}</div>`;
  }
  let unBlock = '';
  if (isBoss && unlinked.length) {
    unBlock = `<div class="cns-head" style="margin-top:12px"><span>Записи без связи с карточкой \u00b7 <b>${unlinked.length}</b></span></div>
      <div class="list">${unlinked.map(m => `<div class="card list-row"><div class="list-row-name">${esc(m.name || '\u2014')}</div>
        <div class="list-row-sub">нет связанной карточки \u2014 нужно решение руководителя</div></div>`).join('')}</div>`;
  }
  view.innerHTML = `<div class="money-total-line">${esc(W.label)}: <b>${linked.length}</b> клиник \u00b7 связи с общей базой
      ${canManage ? '<button class="sort-toggle" id="wl-add" title="Добавить клинику">+</button>' : ''}
    </div>
    ${linked.length ? '<div class="list">' + cards + '</div>' : '<div class="empty">Пусто \u2014 добавь клинику</div>'}
    ${confBlock}${unBlock}`;
  view.querySelectorAll('.list-row[data-id]').forEach(row => {
    row.addEventListener('click', () => { state.selId = Number(row.dataset.id) || null; });
  });
  const addBtn = document.getElementById('wl-add');
  if (addBtn) addBtn.addEventListener('click', async () => {
    const name = prompt('Название клиники (должна быть в разделе «Клиники»):');
    if (!name || !name.trim()) return;
    const q = name.trim().toLowerCase();
    const hit = all.filter(c => (c.name || '').trim().toLowerCase() === q);
    if (hit.length !== 1) { toast(hit.length ? '\u26a0\ufe0f Найдено несколько \u2014 переноси из раздела «Клиники»' : '\u26a0\ufe0f Клиника не найдена \u2014 сначала добавь её в «Клиники»'); return; }
    try {
      const { error } = await withTimeout(sb.from(W.cl).insert({ name: hit[0].name, linked_clinic_id: hit[0].id }), 10000, 'wl-link');
      if (error) throw error;
      toast('\u2713 Связь добавлена');
      await renderWorklist(key);
    } catch (e) { toast('\u26a0\ufe0f ' + e.message); }
  });
}

// каждый телефон контакта — отдельной строкой, в формате 8 (999) 978-67-78
function phoneLines(phone) {
  return String(phone || '').split(/[,;]|\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const d = s.replace(/\D/g, '');
    let digits = d;
    if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) digits = digits.slice(1);
    const formatted = digits.length === 10
      ? `8 (${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 8)}-${digits.slice(8, 10)}`
      : s;
    return `<a href="tel:${esc(telHref(s))}" class="tel" style="display:block;margin-top:2px">${esc(formatted)}</a>`;
  }).join('');
}

    if (v) rows.push(`<div style="padding:2px 0"><b>${y}</b>: ${fmtMoney(v)} ₽</div>`);
  });
  if (mc.hugemed_2025) rows.push(`<div style="padding:2px 0"><b>HugeMed 2025</b>: ${fmtMoney(mc.hugemed_2025)} ₽</div>`);
  if (mc.hugemed_2026) rows.push(`<div style="padding:2px 0"><b>HugeMed 2026</b>: ${fmtMoney(mc.hugemed_2026)} ₽</div>`);
  if (!rows.length) return '';
  return `<div class="nastya-money"><div style="font-size:12px;color:#999;margin:12px 0 4px">Продажи</div>${rows.join('')}</div>`;
}

        } catch (err) { toast('⚠️ Не удалилось: ' + err.message); }

          if (c.linked_clinic_id) {

      if (!body.full_name) { toast('Введите ФИО'); return; }

      } else body.phone = '';
      // синхронизация с общим листом «Клиенты» (если клиника связана с основной базой)
      let mainSyncFail = false;
      try {
        if (c.linked_clinic_id) {
          const { data: existing, error: exErr } = await withTimeout(sb.from('people').select('id').eq('clinic_id', c.linked_clinic_id).eq('full_name', body.full_name).maybeSingle(), 10000, 'wl-main-find');
          if (exErr) throw exErr;
          const patch = { phone: body.phone, email: body.email, situation: body.situation, position: body.position };
          if (existing) {

            if (uErr) throw uErr;

            const { error: iErr } = await withTimeout(sb.from('people').insert({ clinic_id: c.linked_clinic_id, full_name: body.full_name, ...patch }), 10000, 'wl-main-ins');
            if (iErr) throw iErr;
          }

        else await withTimeout(sb.from(W.pp).update(body).eq('id', id), 10000, 'wl-person-upd');
        toast('✓ Сохранено' + (mainSyncFail ? ' (в Клиенты не попало — нет прав)' : '')); renderWorklist(key);
      } catch (err) { toast('⚠️ Не сохранилось: ' + err.message); }

  const addBtn = document.getElementById('wl-add-person');
  if (addBtn) addBtn.addEventListener('click', () => {

    if (f) { try { f.focus(); } catch (_) {} }
  });
  const nd = document.getElementById('wl-next-date');
  if (nd) nd.addEventListener('change', async () => {
    if (readOnly) return;
    try { await saveWorklistClinic(W, c.id, { next_contact: nd.value || null }); toast('✓ Дата сохранена'); }
    catch (e) { toast('⚠️ Не сохранилось: ' + e.message); }

  const ta = view.querySelector('.nastya-notes');
  if (ta) {

    ta.addEventListener('input', () => {
      if (readOnly) return;

      t = setTimeout(async () => {
        try { await saveWorklistClinic(W, ta.dataset.id, { situation: ta.value }); toast('✓ Сохранено'); }

  }

// ---------- v4.13.0: визиты, идеи визитов, участники и врачи ----------
// Служебные записи в notes (в ленту истории не попадают):
//   [[V]]{date,goal,who,addr,participants[],people[]} — визит (date — конкретный день)
//   [[I]]{goal,from,to,remind,participants[],status} — замысел: дата ещё не выбрана
const VISIT_MARK = '[[V]]', IDEA_MARK = '[[I]]';
// Кто есть кто: в базе менеджер записан фамилией, «Настя» и «Галя» — обиходные имена.
const VISIT_MANAGERS = [
  { id: 'Абрамов', label: 'Абрамов' },
  { id: 'Осечкина', label: 'Осечкина' },
  { id: 'Скокова', label: 'Скокова' },
  { id: 'Мазаева', label: 'Мазаева' },
  { id: 'Евсеев', label: 'Евсеев' }
];
const VISIT_MANAGER_ALIAS = { 'Саша': 'Абрамов', 'Настя': 'Осечкина', 'Галя': 'Скокова' };
const VISIT_KINDS = ['Встреча', 'Апробация', 'Мастер-класс', 'Конференция'];
function canonManager(name) { const v = String(name || '').trim(); return VISIT_MANAGER_ALIAS[v] || v; }
let visitPlansMap = null, visitPlansList = null, visitIdeasCache = null;

function parseVisitText(t, mark) {
  const s = String(t || '');
  if (s.indexOf(mark) !== 0) return null;
  try { return JSON.parse(s.slice(mark.length)); } catch (_) { return null; }
}
function invalidateVisitCache() { visitPlansMap = null; visitPlansList = null; visitIdeasCache = null; }
function todayISO() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function addDaysISO(iso, days) {
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
async function loadVisitNotes() {
  if (visitPlansMap && visitPlansList && visitIdeasCache) return;
  const plans = {}, list = [], ideas = [];
  try {
    const { data } = await sb.from('notes').select('id,clinic_id,text,created_at').order('created_at', { ascending: false }).limit(2000);
    (data || []).forEach(n => {
      const v = parseVisitText(n.text, VISIT_MARK);
      if (v) {
        const rec = Object.assign({ noteId: n.id, clinic_id: (n.clinic_id == null ? null : Number(n.clinic_id)) }, v);
        list.push(rec);
        if (!plans[rec.clinic_id]) plans[rec.clinic_id] = v;
        return;
      }
      const i = parseVisitText(n.text, IDEA_MARK);
      if (i && (i.status || 'idea') === 'idea') ideas.push(Object.assign({ noteId: n.id, clinic_id: Number(n.clinic_id) }, i));
    });
  } catch (_) {}
  visitPlansMap = plans; visitPlansList = list; visitIdeasCache = ideas;
}
async function loadVisitMeta() { await loadVisitNotes(); return visitPlansMap; }
async function loadVisitIdeas() { await loadVisitNotes(); return visitIdeasCache; }
async function loadVisitPlans() { await loadVisitNotes(); return visitPlansList; }
function visitPlanOf(id) { return (visitPlansMap && visitPlansMap[Number(id)]) || null; }
function visitGoalOf(id) { const p = visitPlanOf(id); return p && p.goal ? p.goal : ''; }

// 4.67.0: id проверяем ДО запроса. Ни NaN, ни пустая строка на сервер не уходят.
function validId(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return (Number.isFinite(n) && n > 0) ? n : null;
}
function saveError(e) {
  const m = String((e && e.message) || e || '');
  if (/bigint|invalid input syntax/i.test(m)) return 'В записи потерялась связь с визитом или клиникой — открой визит заново из списка. Введённое не потеряно.';
  if (/row-level security|permission|policy/i.test(m)) return 'Нет прав на изменение этой записи. Введённое не потеряно.';
  if (/fetch|network|Failed to fetch/i.test(m)) return 'Нет связи с базой. Введённое не потеряно — попробуй ещё раз.';
  return 'Не удалось сохранить. Введённое не потеряно.';
}

async function saveVisitPlanRow(clinicId, plan, noteId) {
  const body = VISIT_MARK + JSON.stringify(plan || {});
  const cid = (clinicId == null || clinicId === '') ? null : validId(clinicId);
  const nId = validId(noteId);
  if (noteId && !nId) throw new Error('Некорректный идентификатор визита');
  if (clinicId != null && clinicId !== '' && !cid) throw new Error('Некорректный идентификатор клиники');
  if (nId) {
    const { error } = await sb.from('notes').update({ text: body, clinic_id: cid }).eq('id', nId);
    if (error) throw error;
  } else {
    const { error } = await sb.from('notes').insert({
      clinic_id: cid, text: body,
      author_email: CURRENT_EMAIL || null, author_name: myManagerName() || window.CURRENT_MANAGER || null, source: 'visit_plan'
    });
    if (error) throw error;
  }
  invalidateVisitCache();
}
async function saveVisitIdeaRow(clinicId, idea, noteId) {
  const body = IDEA_MARK + JSON.stringify(idea || {});
  const cid = (clinicId == null || clinicId === '') ? null : validId(clinicId);
  const nId = validId(noteId);
  if (noteId && !nId) throw new Error('Некорректный идентификатор идеи');
  if (!nId && !cid) throw new Error('Некорректный идентификатор клиники');
  if (nId) {
    const { error } = await sb.from('notes').update({ text: body }).eq('id', nId);
    if (error) throw error;
  } else {
    const { error } = await sb.from('notes').insert({
      clinic_id: cid, text: body,
      author_email: CURRENT_EMAIL || null, author_name: myManagerName() || window.CURRENT_MANAGER || null, source: 'visit_idea'
    });
    if (error) throw error;
  }
  invalidateVisitCache();
}
// v4.44.0: должность врача в визите — кратко: «Зав УО», «Зам ПХ»
function shortPos(pos) {
  const src = String(pos || '').trim();
  if (!src) return '';
  const words = src.split(/[\s\-–]+/).filter(Boolean);
  if (words.length === 1) return src.length > 9 ? src.slice(0, 9) + '…' : src;
  const head = words[0].slice(0, 3);
  const tail = words.slice(1, 3).map(w => w[0].toUpperCase()).join('');
  return head.charAt(0).toUpperCase() + head.slice(1) + (tail ? ' ' + tail : '');
}

async function clinicDoctors(cid) {
  try {
    const { data: links } = await sb.from('clinic_people').select('person_id').eq('clinic_id', Number(cid));
    const ids = (links || []).map(l => Number(l.person_id));
    if (!ids.length) return [];
    const people = await allPeopleList();
    const map = {};
    (people || []).forEach(p => { map[Number(p.id)] = p; });
    return ids.map(id => map[id]).filter(Boolean);
  } catch (_) { return []; }
}
function participantsHtml(sel) {
  const on = sel || [];
  const onCanon = (on || []).map(canonManager);
  return VISIT_MANAGERS.map(m => `<label class="vm-chk"><input type="checkbox" class="vmPart" value="${esc(m.id)}"${onCanon.includes(m.id) ? ' checked' : ''}/> ${esc(m.label)}</label>`).join('');
}
function doctorsHtml(docs, sel) {
  const on = (sel || []).map(Number);
  if (!docs.length) return '<div class="row-why">У клиники пока нет привязанных врачей — можно добавить в карточке.</div>';
  return `<div class="vm-docs">${docs.map(p => `<label class="vm-chk"><input type="checkbox" class="vmDoc" value="${p.id}"${on.includes(Number(p.id)) ? ' checked' : ''}/> ${esc(p.full_name || ('#' + p.id))}${p.position ? ' · ' + esc(p.position) : ''}</label>`).join('')}</div>`;
}
async function doctorsBlockFor(cid, sel) {
  const box = document.getElementById('vmDocsBox');
  if (!box) return;
  box.innerHTML = '<div class="row-why">Загружаю врачей…</div>';
  const docs = cid ? await clinicDoctors(cid) : [];
  box.innerHTML = doctorsHtml(docs, sel);
}

// Модалка визита: поиск клиники, дата, цель, участники, врачи
async function allPeopleList() {
  if (window.__allPeople) return window.__allPeople;
  try {
    const people = await listPeople();
    // listPeople отдаёт camelCase (fullName), а ниже нужен full_name — приводим к одному виду
    const arr = (people || []).map(p => Object.assign({}, p, { full_name: p.full_name || p.fullName }))
      .sort((a, b) => String(a.full_name || '').localeCompare(String(b.full_name || ''), 'ru'));
    window.__allPeople = arr;
    return arr;
  } catch (_) { return []; }
}
function peopleLabel(p) { return (p.full_name || ('#' + p.id)) + (p.position ? ' · ' + p.position : ''); }

async function openVisitModal(cfg) {
  cfg = cfg || {};
  let all = [], people = [];
  try {
    all = await clinicPool();
    people = await allPeopleList();
  } catch (_) {}
  all.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
  const byName = {}, peopleById = {}, peopleByName = {};
  all.forEach(c => { byName[String(c.name || '').toLowerCase()] = c; });
  people.forEach(p => { peopleById[Number(p.id)] = p; peopleByName[String(p.full_name || '').toLowerCase()] = p; });

  const idea = cfg.idea || null;
  const plan = cfg.plan || null;
  const cur = cfg.clinicId ? all.find(c => Number(c.id) === Number(cfg.clinicId)) : null;
  // v4.51.0: НИКАКОГО шаблона — новый визит открывается пустым, без данных прошлых визитов
  const base = plan || {};
  const date = (plan && plan.date) || (idea && (idea.planned || idea.from)) || '';
  const partSel = ((plan && plan.participants) || (idea && idea.participants) || []).map(canonManager);
  const chosen = ((plan && plan.people) || []).map(Number);
  const title = plan ? 'Изменить визит' : 'Спланировать визит';

  openModal(title, `
    <div class="field"><label>Название визита</label>
      <input type="text" id="vmTitle" value="${esc((plan && plan.title) || (idea && idea.title) || '')}" placeholder="например: мастер-класс по Литокласт" />
    </div>
    <div class="field"><label>Тип визита</label>
      <select id="vmKind">${VISIT_KINDS.map(k => `<option value="${esc(k)}"${(((plan && plan.kind) || (idea && idea.kind) || base.kind || 'Встреча') === k) ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Город</label>
      <input type="text" id="vmCity" value="${esc((plan && plan.city) || (idea && idea.city) || '')}" placeholder="например: Красноярск" autocomplete="off" />
    </div>
    <div class="field"><label>Клиника (не обязательно для конференции)</label>
      <input type="text" id="vmClinicName" list="vmClinicList" value="${esc(cur ? cur.name : '')}" placeholder="можно оставить пустым, если это конференция" autocomplete="off" />
      <datalist id="vmClinicList">${all.map(c => `<option value="${esc(c.name)}">${esc(c.city || '')}${isRefKind(c.kind) ? ' · справочник' : ''}</option>`).join('')}</datalist>
    </div>
    <div class="row2">
      <div class="field"><label>С какого числа</label><input type="date" id="vmDate" value="${esc(date)}" /></div>
      <div class="field"><label>По какое число</label><input type="date" id="vmDateTo" value="${esc((plan && plan.dateTo) || (idea && idea.to) || date)}" /></div>
    </div>
    <div class="field"><label>Комментарий</label><input type="text" id="vmGoal" value="${esc((plan && plan.goal) || (idea && idea.goal) || '')}" placeholder="апробация Литокласт / мастер-класс" /></div>
    <div class="field"><label>Участники (визит виден каждому из них)</label><div class="vm-chks">${participantsHtml(partSel)}</div></div>
    <div class="field"><label>Врачи в визите — из любой клиники</label>
      <input type="text" id="vmDocSearch" list="vmDocList" placeholder="начни печатать фамилию врача" autocomplete="off" />
      <datalist id="vmDocList">${people.map(p => `<option value="${esc(p.full_name || '')}">${esc(p.position || '')}</option>`).join('')}</datalist>
      <div id="vmDocChips" class="vm-chks vm-doc-chips"></div>
      <div class="row-why" id="vmClinicDocsHint"></div>
    </div>
    <div class="btn-row"><button class="btn" id="vmSave">${plan ? 'Сохранить' : 'Запланировать'}</button><button class="btn ghost" id="vmCancel">Отмена</button></div>
  `);

  const chipsBox = document.getElementById('vmDocChips');
  const hintBox = document.getElementById('vmClinicDocsHint');
  function renderChips() {
    if (!chipsBox) return;
    chipsBox.innerHTML = chosen.length
      ? chosen.map(id => {
          const p = peopleById[id];
          return `<span class="vm-chip" data-del-doc="${id}" title="Убрать">${esc(p ? peopleLabel(p) : ('#' + id))} ✕</span>`;
        }).join('')
      : '<span class="row-why">Пока никого не добавили</span>';
    chipsBox.querySelectorAll('[data-del-doc]').forEach(ch => ch.addEventListener('click', () => {
      const id = Number(ch.dataset.delDoc);
      const i = chosen.indexOf(id);
      if (i >= 0) chosen.splice(i, 1);
      renderChips();

  async function renderClinicHint(cid) {
    if (!hintBox) return;
    if (!cid) { hintBox.textContent = ''; return; }

    if (!docs.length) { hintBox.textContent = 'У этой клиники врачи не привязаны — добавь их по фамилии выше.'; return; }
    hintBox.innerHTML = 'Быстро добавить врачей клиники: ' + docs.map(d => `<button type="button" class="btn ghost mini" data-add-doc="${d.id}">${esc(d.full_name || ('#' + d.id))}</button>`).join(' ');
    hintBox.querySelectorAll('[data-add-doc]').forEach(bt => bt.addEventListener('click', () => {

  const docSearch = document.getElementById('vmDocSearch');
  if (docSearch) docSearch.addEventListener('change', () => {

  });

  document.getElementById('vmCancel').addEventListener('click', closeModal);

      const cityNow = (document.getElementById('vmCity').value || '').trim();

      }

      let dTo = (document.getElementById('vmDateTo').value || '').slice(0, 10) || d;
      if (!d) { toast('Нужна дата визита'); btn.disabled = false; return; }
      if (dTo < d) dTo = d;
      const payload = {
        date: d,
        dateTo: dTo,
        city: (document.getElementById('vmCity').value || '').trim(),
        kind: (document.getElementById('vmKind').value || 'Встреча'),
        title: (document.getElementById('vmTitle').value || '').trim(),
        goal: (document.getElementById('vmGoal').value || '').trim(),
        participants: [...document.querySelectorAll('.vmPart:checked')].map(x => canonManager(x.value)),
        people: chosen.slice()
      };
      if (c) await saveClinicPrivate(c.id, c.manager || null, { next_contact: d, action_type: 'visit' });
      await saveVisitPlanRow(c ? c.id : null, payload, plan && plan.noteId);
      if (idea && idea.noteId) {
        const rest = Object.assign({}, idea); delete rest.noteId;
        await saveVisitIdeaRow(idea.clinic_id, Object.assign(rest, { status: 'planned', planned: d }), idea.noteId);
      }
      closeModal();
      // v4.19.0: на телефоне после сохранения оставался card-open — экран схлопывался в белый
      try {
        state.selId = null; state.selKind = null;
        if (document.body.classList.contains('card-open')) closeCardToList();
        document.body.classList.remove('card-open');
      } catch (_) {}
      toast('✓ Визит на ' + fmtDate(d));
      await render();
    } catch (e) {
      // 4.67.0: техническую ошибку — в журнал, человеку — понятный текст. Форма остаётся открытой.
      btn.disabled = false;
      try { console.error('[визит] не сохранено', { message: e && e.message, noteId: plan && plan.noteId, clinicId: c ? c.id : null }); } catch (_) {}
      toast('⚠️ ' + saveError(e));
    }
  });
}

// Модалка идеи: тот же поиск клиники + участники + срок напоминания

  all.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));

  all.forEach(c => { byName[String(c.name || '').toLowerCase()] = c; });
  const cur = (idea && idea.clinic_id) ? all.find(c => Number(c.id) === Number(idea.clinic_id))
    : (presetClinicId ? all.find(c => Number(c.id) === Number(presetClinicId)) : null);

      <input type="text" id="viTitle" value="${esc((idea && idea.title) || '')}" placeholder="например: мастер-класс по Литокласт" />
    </div>
    <div class="field"><label>Тип визита</label>
      <select id="viKind">${VISIT_KINDS.map(k => `<option value="${esc(k)}"${(((idea && idea.kind) || 'Встреча') === k) ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Город</label>
      <input type="text" id="viCity" value="${esc((idea && idea.city) || '')}" placeholder="например: Красноярск" />
    </div>
    <div class="field"><label>Клиника (если есть — начни печатать)</label>
      <input type="text" id="viClinicName" list="viClinicList" value="${esc(cur ? cur.name : '')}" placeholder="можно не заполнять" autocomplete="off" />
      <datalist id="viClinicList">${all.map(c => `<option value="${esc(c.name)}">${esc(c.city || '')}${isRefKind(c.kind) ? ' · справочник' : ''}</option>`).join('')}</datalist>
    </div>
    <div class="field"><label>Комментарий</label><input type="text" id="viGoal" value="${esc((idea && idea.goal) || '')}" placeholder="апробация Литокласт" /></div>
    <div class="field"><label>Ориентир: с какого числа</label><input type="date" id="viFrom" value="${esc((idea && idea.from) || '')}" /></div>
    <div class="field"><label>Ориентир: по какое</label><input type="date" id="viTo" value="${esc((idea && idea.to) || '')}" /></div>
    <div class="field"><label>Участники</label><div class="vm-chks">${participantsHtml((idea && idea.participants) || [])}</div></div>
    <div class="field"><label>Напомнить через (дней)</label><input type="number" id="viRemind" value="4" min="1" max="90" /></div>
    <div class="btn-row"><button class="btn" id="viSave">${idea ? 'Сохранить' : 'Записать идею'}</button><button class="btn ghost" id="viCancel">Отмена</button></div>
  `);
  const viClinicInp = document.getElementById('viClinicName');
  if (viClinicInp) viClinicInp.addEventListener('change', () => {
    const c = byName[String(viClinicInp.value || '').trim().toLowerCase()];
    const cityInp = document.getElementById('viCity');
    if (c && cityInp && !cityInp.value.trim() && c.city) cityInp.value = c.city;
  });
  document.getElementById('viCancel').addEventListener('click', closeModal);
  document.getElementById('viSave').addEventListener('click', async () => {
    const btn = document.getElementById('viSave');
    btn.disabled = true;
    try {
      const nm = String((document.getElementById('viClinicName').value || '')).trim();
      const c = byName[nm.toLowerCase()];
      if (!c) { toast('Клиника не найдена — выбери из подсказки'); btn.disabled = false; return; }
      const days = Math.max(1, Math.min(90, Number(document.getElementById('viRemind').value) || 4));
      const payload = {
        title: (document.getElementById('viTitle').value || '').trim(),
        kind: (document.getElementById('viKind').value || 'Встреча'),
        city: (document.getElementById('viCity').value || '').trim(),
        goal: (document.getElementById('viGoal').value || '').trim(),
        from: document.getElementById('viFrom').value || null,
        to: document.getElementById('viTo').value || null,
        participants: [...document.querySelectorAll('.vmPart:checked')].map(x => canonManager(x.value)),
        remind: (idea && idea.remind) ? idea.remind : addDaysISO(todayISO(), days),
        status: 'idea'
      };
      await saveVisitIdeaRow(c.id, payload, idea && idea.noteId);
      closeModal();
      toast('✓ Идея сохранена');
      await render();
    } catch (e) {
      btn.disabled = false;
      try { console.error('[идея] не сохранено', { message: e && e.message }); } catch (_) {}
      toast('⚠️ ' + saveError(e));
    }
  });
}

// ---------- «Мой день»: завершение и перенос ----------
// v3.15.0: «Выполнено» пишет запись в историю и закрывает контакт (отменяемо);
// «Перенести» меняет дату у той же записи (без дублей).
let mdUndo = null;
async function mdComplete(id, date) {
  const c = await getClinic(id);
  if (!c) return;
  const cid = Number(id);
  const d = String(date || c.nextContact || '').slice(0, 10);
  const text = '✔ Выполнено: ' + actionLabel(c.actionType) + (d ? ' (' + fmtDate(d) + ')' : '');
  let noteId = null;
  try {
    const { data, error } = await sb.from('notes').insert({
      clinic_id: cid, text,
      author_email: CURRENT_EMAIL || null,
      author_name: myManagerName() || window.CURRENT_MANAGER || null,
      source: 'myday'
    }).select('id');
    if (error) throw error;
    noteId = (data && data[0] && data[0].id) || null;
  } catch (e) { toast('⚠️ История не записана: ' + (e && e.message ? e.message : e)); return; }
  // закрываем контакт ТОЛЬКО если он тот же, что и у завершённой задачи (новый запланированный не трогаем)
  const cur = String(c.nextContact || '').slice(0, 10);
  let cleared = false;
  if (cur && d && cur === d) {
    try { await sb.from('clinic_private').update({ next_contact: null }).eq('clinic_id', cid); cleared = true; }
    catch (e) { toast('⚠️ Запись в историю есть, но дату снять не удалось'); }
  }
  mdUndo = { clinicId: cid, name: c.name, prevDate: cur, noteId, cleared };
  toast(cleared ? '✓ Выполнено, контакт закрыт' : '✓ Выполнено, записано в историю');
  await render();
}
async function mdUndoLast() {
  if (!mdUndo) return;
  const u = mdUndo; mdUndo = null;
  try {
    if (u.noteId) await sb.from('notes').delete().eq('id', u.noteId);
    if (u.cleared) await sb.from('clinic_private').update({ next_contact: u.prevDate || null }).eq('clinic_id', u.clinicId);
    toast('↩ Отметка отменена');
  } catch (e) { toast('⚠️ Отмена не удалась: ' + (e && e.message ? e.message : e)); }
  await render();
}
async function mdReschedule(id, date) {
  const c = await getClinic(id);
  if (!c) return;
  const cur = String(date || c.nextContact || '').slice(0, 10);
  openModal('Перенести контакт', `
    <div class="detail-block"><div class="k">Клиника</div><div class="v">${esc(c.name)}</div></div>
    <div class="field"><label>Новая дата следующего контакта</label><input type="date" id="mdNewDate" value="${esc(cur)}" /></div>
    <div class="field"><label>Результат общения (в историю, необязательно)</label><textarea id="mdNewNote" placeholder="Что обсудили, договорённости…"></textarea></div>
    <div class="btn-row"><button class="btn" id="mdMoveSave">Перенести</button><button class="btn ghost" id="mdMoveCancel">Отмена</button></div>
  `);
  document.getElementById('mdMoveCancel').addEventListener('click', closeModal);
  document.getElementById('mdMoveSave').addEventListener('click', async () => {
    const btn = document.getElementById('mdMoveSave');
    btn.disabled = true;
    try {

      const note = (document.getElementById('mdNewNote').value || '').trim();

        await sb.from('notes').insert({ clinic_id: c.id, text: note, author_email: CURRENT_EMAIL || null, author_name: myManagerName() || window.CURRENT_MANAGER || null, source: 'myday' });
      }
      closeModal();
      toast(nd ? '✓ Перенесено на ' + fmtDate(nd) : '✓ Дата снята');
