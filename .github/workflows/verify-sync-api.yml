name: Sync API verification
on:
  push:
    branches: [fix/homework-cidian-20261007]
    paths: [.github/workflows/verify-sync-api.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check current server protocol
        run: |
          python3 - <<'PY'
          import urllib.request,json
          for path in ['/api/sync?list=1','/api/backup?list=1']:
            try:
              with urllib.request.urlopen('https://api.crmuro.ru'+path,timeout=30) as r:
                d=json.load(r)
                print(path, 'HTTP',r.status,'protocol',d.get('protocol'),'ok',d.get('ok'),'response keys',list(d)[:6])
            except Exception as e:
              print(path,type(e).__name__,str(e))
          PY
