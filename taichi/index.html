<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFCF9" />
<meta name="app-version" content="2.1.0" />
<title>Тайчи · программа тренировок</title>
<link rel="icon" type="image/png" href="assets/brand/app-mark.png?v=2.1.0" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/app-mark.png?v=2.1.0" />
<link rel="manifest" href="manifest.webmanifest?v=2.1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Тайчи" />
<style>
:root{
  --bg:#FBFCF9;--surface:#fff;--ink:#172820;--primary:#285444;--sel:#E5EFE6;
  --line:#C2D8C5;--gold:#AE7A30;--div:#D4DDD5;--muted:#5b6a62;--danger:#9B4C46;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.48;background:url("assets/backgrounds/route-relief-desktop.png?v=2.1.0") center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:rgba(251,252,249,.35)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(251,252,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--div)}
.topbar .inner{max-width:1280px;margin:auto;padding:12px 28px;display:flex;align-items:center;gap:24px}
.brand img{height:34px;display:block}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{border:0;background:none;border-radius:11px;padding:9px 12px;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.nav button img{width:19px;height:19px;object-fit:contain;opacity:.78}
.nav button.on{background:var(--sel);color:var(--ink);font-weight:700}
.shell{max-width:1280px;margin:auto;padding:0 28px 96px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.4px;margin:26px 0 6px}
h2{font-size:21px;line-height:1.25;margin:0 0 12px}
h3{font-size:16px;margin:0 0 6px}
.sub,.small{color:var(--muted)}
.sub{margin:0 0 18px;font-size:15px}
.small{font-size:13px}
.card{background:rgba(255,255,255,.94);border-radius:17px;padding:18px;box-shadow:0 1px 3px rgba(23,40,32,.07)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.btn{border:0;border-radius:12px;background:var(--primary);color:#fff;padding:12px 18px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--div)}
.btn.soft{background:var(--sel);color:var(--ink)}
.btn.gold{background:#F4EBDD;color:#80571e}
.btn.danger{background:#f5e6e4;color:var(--danger)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--sel);color:var(--primary);font-size:12px;font-weight:700}
.pill.gold{background:#F5EDDE;color:#865e22}
.progress{height:9px;background:#E7ECE7;border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--primary);border-radius:999px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch}
.hero-main{padding:22px}
.hero-main .big{font-size:35px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero-main .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.hero-side{display:flex;flex-direction:column;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sel);border-radius:13px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.history{display:flex;flex-direction:column;gap:8px}
.hist{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--div)}
.hist:first-child{border-top:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{text-align:center;font-size:11px;color:var(--muted);padding-bottom:3px}
.cal-day{min-height:58px;border-radius:11px;background:#F7F9F7;padding:6px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.blank{background:transparent}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--line)}
.cal-day.trained{background:var(--sel);box-shadow:inset 0 0 0 1px var(--line)}
.cal-day b{font-size:14px;line-height:1}
.cal-day span{font-size:10px;color:var(--primary);font-weight:700;white-space:nowrap}
.month-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.month-title h2{margin:0}
.route-card{overflow:hidden;position:relative}
.route-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.route-wrap{position:relative;max-width:940px;height:460px;margin:auto;border-radius:16px;overflow:hidden;background:linear-gradient(rgba(251,252,249,.45),rgba(251,252,249,.72)),url("assets/backgrounds/route-relief-desktop.png?v=2.1.0") center/cover no-repeat}
.route-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route-svg polyline{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 1.8;stroke-linecap:round;stroke-linejoin:round}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 6px rgba(23,40,32,.08);z-index:2}
.node.done{background:var(--primary);border-color:var(--primary);color:#fff}
.node.current{background:#fff7e8;border-color:var(--gold);color:#80571e;box-shadow:0 0 0 5px rgba(174,122,48,.12)}
.node.future{color:#89958f}
.node-label{position:absolute;transform:translate(-50%,0);font-size:11px;color:var(--muted);width:115px;text-align:center;line-height:1.15;z-index:2;pointer-events:none}
.node-label b{display:block;color:var(--ink);font-size:11.5px}
.workout-list{display:flex;flex-direction:column;gap:10px}
.ex-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:13px;background:#fff;border:1px solid var(--div)}
.ex-row img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:var(--sel)}
.ex-row .name{font-weight:700}
.ex-row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex-row .eff{font-size:12.5px;color:var(--primary);margin-top:5px}
.detail-side{position:sticky;top:78px}
.work-head{position:sticky;top:0;z-index:40;background:rgba(251,252,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--div);margin:0 -28px 18px;padding:10px 28px}
.work-head .line{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px}
.work-head .timer{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.work-head .wake{font-size:12px;color:var(--muted)}
.exercise{max-width:760px;margin:auto}
.exercise-card{padding:18px}
.exercise-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.exercise-top h1{font-size:25px;margin:0 0 6px}
.gif{background:var(--sel);border-radius:15px;display:flex;align-items:center;justify-content:center;min-height:280px;max-height:440px;margin:16px 0;overflow:hidden}
.gif img{width:100%;height:100%;max-height:440px;object-fit:contain;display:block}
.prescription{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.prescription div{background:var(--sel);border-radius:12px;padding:10px 12px}
.prescription span{display:block;font-size:12px;color:var(--muted)}
.prescription b{font-size:17px}
.effort{background:#F5F0E7;border-left:4px solid var(--gold);border-radius:11px;padding:12px 13px;margin:12px 0}
.effort b{display:block;margin-bottom:3px}
.tech{padding-left:20px;margin:8px 0 0}
.tech li{margin:6px 0}
.setbox{background:#F7F9F7;border:1px solid var(--div);border-radius:14px;padding:14px;margin-top:14px}
.setbox .settitle{font-weight:800;font-size:18px}
.restbox{background:#F4EBDD;border-radius:14px;padding:14px;text-align:center;margin-top:14px}
.resttime{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.feedback{margin-top:14px}
.feedback .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.feedback button{border:1px solid var(--div);background:#fff;border-radius:11px;padding:10px 6px}
.feedback button.on{background:var(--sel);border-color:var(--primary);font-weight:800}
.service-timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0}
.settings{max-width:820px}
.set-card{background:#fff;border-radius:17px;padding:4px 20px 18px}
.set-group{padding:16px 0;border-top:1px solid var(--div)}
.set-group:first-child{border-top:0}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:center;padding:9px 0}
select,input{width:100%;min-height:44px;border:1px solid var(--div);border-radius:10px;padding:9px 11px;background:#fff}
.toggle{display:flex;align-items:center;gap:9px}
.toggle input{width:20px;height:20px;min-height:0}
.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}
.m-head,.tabs{display:none}
.version-label{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);font-weight:650}
@media(max-width:900px){
  .grid2,.hero{grid-template-columns:1fr}
  .hero-side{min-height:0}
  .detail-side{position:static}
}
@media(max-width:720px){
  .bg{background-image:url("assets/backgrounds/route-relief-mobile.png?v=2.1.0")}
  .topbar{display:none}
  .shell{padding:0 14px calc(78px + env(safe-area-inset-bottom))}
  .m-head{display:flex;padding:13px 0 7px}
  .m-head img{height:30px}
  h1{font-size:25px;margin-top:12px}
  .hero-main{padding:17px}
  .hero-main .big{font-size:30px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .calendar{gap:4px}
  .cal-day{min-height:49px;padding:4px 2px}
  .cal-day span{font-size:9px}
  .route-wrap{height:930px;background-image:linear-gradient(rgba(251,252,249,.38),rgba(251,252,249,.72)),url("assets/backgrounds/route-relief-mobile.png?v=2.1.0")}
  .node{width:48px;height:48px}
  .node-label{width:100px}
  .ex-row{grid-template-columns:58px minmax(0,1fr)}
  .ex-row img{width:58px;height:58px}
  .ex-row .right{grid-column:2}
  .work-head{top:0;margin:0 -14px 12px;padding:9px 14px}
  .work-head .line{gap:8px}
  .work-head .timer{font-size:18px}
  .work-head .wake{display:none}
  .exercise-card{padding:14px}
  .gif{min-height:250px}
  .prescription{grid-template-columns:repeat(3,1fr)}
  .feedback .choices{grid-template-columns:1fr 1fr 1fr}
  .set-row{grid-template-columns:1fr;gap:5px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--div);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;border:0;background:none;padding:8px 5px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
  .tab img{width:22px;height:22px;object-fit:contain;opacity:.75}
  .tab.on{font-weight:800;color:var(--ink)}
  .tab.on img{opacity:1}
  body.in-workout .tabs{display:none}
}
</style>
</head>
<body>
<div class="bg"></div>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="#" data-go="home"><img src="assets/brand/wordmark-horizontal.png?v=2.1.0" alt="Тайчи"></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<div class="shell">
  <div class="m-head"><img src="assets/brand/wordmark-horizontal.png?v=2.1.0" alt="Тайчи"><span class="version-label">v2.1.0</span></div>
  <main id="view"></main>
  <div class="footer">v2.1.0 · Тайчи</div>
</div>
<nav class="tabs" id="tabs">
  <button class="tab" data-tab="home"><img src="assets/icons/nav-home.png?v=2.1.0" alt=""><span>Главная</span></button>
  <button class="tab" data-tab="program"><img src="assets/icons/nav-program.png?v=2.1.0" alt=""><span>Программа</span></button>
  <button class="tab" data-tab="settings"><img src="assets/icons/nav-settings.png?v=2.1.0" alt=""><span>Настройки</span></button>
</nav>
<script src="../supabase.v139.min.js?v=139"></script>
<script>
const VERSION='2.1.0';
const STORE='taichi-v2.0.0'; // НЕ МЕНЯТЬ: локальная история v2.0.0
const TAICHI_SB_URL='https://mkehzkobjxnjobkqeiwt.supabase.co';
const TAICHI_SB_KEY='sb_publishable_4RVlpOkywKmEjsnKsHpRiA_q_Af-f0v';
const cloud=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(TAICHI_SB_URL,TAICHI_SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let cloudUser=null,cloudStatus='Локально',cloudBusy=null,cloudLast=0;
const AV='?v='+VERSION;
const REMOTE='https://cdn.jsdelivr.net/gh/JahelCuadrado/ExerciseGymGifsDB@v1.1.0/';
const EX={
  warmup:{name:'Разминка',group:'Подготовка',gif:'assets/exercises/warmup.gif'+AV,kind:'service',seconds:300,about:'Разогрей плечи, локти и верх спины без рывков.',how:['Круги плечами и руками в комфортной амплитуде','10–12 лёгких сведений лопаток','Несколько медленных жимовых и тяговых движений без усилия']},
  cooldown:{name:'Заминка и растяжка',group:'Восстановление',gif:'assets/exercises/cooldown.gif'+AV,kind:'service',seconds:180,about:'Спокойно снизь темп после тренировки.',how:['Дыши ровно, не пружинь в растяжке','Мягко растяни грудь, спину и руки','Никакой боли — только лёгкое натяжение']},
  floorpress:{name:'Жим гантелей лёжа на полу',group:'Грудь · трицепс',gif:'assets/exercises/floorpress.gif'+AV,kind:'main',reps:'10–15',rest:75,equip:'dumbbell',about:'Основное жимовое движение на грудь с гантелями 3 кг.',how:['Локти направлены примерно под 45° к корпусу','Опускай гантели спокойно до касания локтями пола','Выжимай вверх без рывка и без жёсткого удара локтями']},
  pushup:{name:'Отжимания от высокой опоры',group:'Грудь · трицепс',gif:REMOTE+'pectorals/incline-push-up.gif',kind:'main',reps:'8–12',rest:75,equip:'body',about:'Выбери высокую устойчивую опору — например, столешницу или крепкий стол. Высота должна позволять сделать 8–12 чистых повторений. От пола пока не отжимаемся.',how:['Ладони чуть шире плеч на устойчивой неподвижной опоре','Корпус держи одной линией от головы до пяток','Опускай грудь к опоре спокойно, локти не разводи строго в стороны','Если 8 повторений не получается — используй более высокую опору; если 12 легко — немного снизь высоту']},
  wallpush:{name:'Отжимания от стены',group:'Грудь · трицепс',gif:'assets/exercises/wallpush.gif'+AV,kind:'main',reps:'8–15',rest:75,equip:'body',about:'Нагрузка регулируется расстоянием до стены.',how:['Тело держи прямой линией','Опускай грудь к стене, а не голову','Если легко — отойди немного дальше от стены']},
  bentrow:{name:'Тяга двух гантелей в наклоне',group:'Спина · бицепс',gif:REMOTE+'upper-back/dumbbell-bent-over-row.gif',kind:'main',reps:'10–15',rest:75,equip:'dumbbell',about:'Тяга на верх спины без креплений и дополнительного оборудования.',how:['Стопы примерно на ширине плеч, колени слегка согнуты','Наклонись от таза, спину держи ровной','Тяни локти назад, сводя лопатки','Опускай гантели медленно, корпус не раскачивай']},
  onearmrow:{name:'Тяга гантели одной рукой с опорой',group:'Спина',gif:'assets/exercises/onearmrow.gif'+AV,kind:'main',reps:'10–15 каждой рукой',rest:75,equip:'dumbbell',unilateral:true,about:'Тяга с опорой позволяет спокойно контролировать спину. Один подход = обе руки по очереди; отдых начинается после второй руки.',how:['Подход 1: левая → правая; следующий подход начни с правой','Спина ровная, корпус не вращай','Тяни локоть к тазу, а не гантель к плечу','Опускай гантель медленно, сохраняя контроль']},
  rearfly:{name:'Разведение гантелей в наклоне',group:'Задняя дельта · верх спины',gif:REMOTE+'delts/dumbbell-reverse-fly.gif',kind:'accessory',reps:'10–15',rest:60,equip:'dumbbell',about:'Задняя дельта и верх спины без анкера для резинки.',how:['Колени чуть согнуты, корпус наклонён от таза','Руки опущены, локти слегка мягкие','Разводи руки в стороны без рывка','Не поднимай плечи к ушам; опускай медленно']},
  curl:{name:'Сгибание рук с гантелями',group:'Бицепс',gif:'assets/exercises/curl.gif'+AV,kind:'accessory',reps:'10–15',rest:60,equip:'dumbbell',about:'Бицепс без раскачки корпусом.',how:['Локти остаются рядом с корпусом','Поднимай гантели без рывка','Опускай за 2–3 секунды']},
  bandcurl:{name:'Сгибание рук с резинкой',group:'Бицепс',gif:REMOTE+'biceps/band-alternating-biceps-curl.gif',kind:'accessory',reps:'10–15',rest:60,equip:'band',about:'Удобный способ постепенно увеличивать сопротивление для бицепса.',how:['Надёжно прижми резинку стопами','Локти не уводи вперёд','Сохраняй натяжение и опускай руки медленно']},
  hammer:{name:'Сгибание рук «молот»',group:'Бицепс · предплечье',gif:'assets/exercises/hammer.gif'+AV,kind:'accessory',reps:'10–15',rest:60,equip:'dumbbell',about:'Нейтральный хват нагружает бицепс и плечевую мышцу.',how:['Ладони смотрят друг на друга','Локти не гуляют вперёд-назад','Не раскачивай корпус']},
  overheadext:{name:'Разгибание гантели над головой',group:'Трицепс',gif:REMOTE+'triceps/dumbbell-standing-triceps-extension.gif',kind:'accessory',reps:'10–15 каждой рукой',rest:60,equip:'dumbbell',unilateral:true,about:'Трицепс с одной гантелью, без скамьи и креплений. Один подход = обе руки по очереди; отдых начинается после второй руки.',how:['Подход 1: левая → правая; подход 2: правая → левая','Стой устойчиво и не прогибай поясницу','Плечо держи рядом с головой','Сгибается и разгибается только локоть','Опускай гантель медленно и без рывка']},

const defaultState={cycle:1,step:0,history:[],feedback:{},running:null,settings:{frequency:3,wake:true,vibrate:true}};
function state(){try{return Object.assign({},defaultState,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function save(p){const s=Object.assign({},state(),p);localStorage.setItem(STORE,JSON.stringify(s));return s}

const historyId=h=>'workout-'+String(h.at)+'-'+String(h.cycle)+'-'+String(h.n);
function validateWorkout(h){
  return !!(h&&Number.isFinite(Number(h.at))&&Number(h.at)>0&&Number.isInteger(Number(h.n))&&Number(h.n)>=1&&Number(h.n)<=15&&Number.isInteger(Number(h.cycle))&&Number(h.cycle)>=1);
}
function mergeWorkoutHistory(a,b,resetAt){
  const seen=new Set(),list=[];
  [...(a||[]),...(b||[])].forEach(h=>{
    if(!validateWorkout(h)||Number(h.at)<=resetAt)return;
    const key=historyId(h);
    if(seen.has(key))return;
    seen.add(key);list.push(h);
  });
  return list.sort((x,y)=>Number(x.at)-Number(y.at));
}
function routeProgress(history){
  let max=0;
  (history||[]).forEach(h=>{if(validateWorkout(h))max=Math.max(max,(Number(h.cycle)-1)*15+Number(h.n));});
  return {cycle:Math.floor(max/15)+1,step:max%15};
}
function nextFeedbackStamp(data,id){
  const times=(data.feedbackAt||{});
  return Number(times[id])||1;
}

function cloudTable(){return cloud.from('taichi_events')}
async function syncCloud(){
  if(!cloud||!cloudUser||!navigator.onLine)return false;
  if(cloudBusy)return cloudBusy;
  cloudBusy=(async()=>{
    showCloudStatus('Синхронизация…');
    try{
      const user=await signedIn();
      if(!user||user.id!==cloudUser.id){cloudUser=null;showCloudStatus('Нужен вход');return false}
      const local=state();
      const owner=localStorage.getItem('taichi-cloud-owner-v1');
      if(owner&&owner!==user.id){showCloudStatus('Данные относятся к другому аккаунту — экспортируй историю');return false}
      // Load remote events BEFORE attempting writes, then upload only local-only events.
      let rows=[],page=0;
      while(true){
        const {data,error}=await cloudTable().select('event_key,kind,client_ms,payload').eq('user_id',user.id).order('client_ms',{ascending:true}).range(page*500,page*500+499);
        if(error)throw error;
        rows.push(...(data||[]));
        if(!data||data.length<500)break;
        page++;if(page>40)throw Error('История превышает лимит синхронизации');
      }
      const remoteReset=Math.max(0,...rows.filter(x=>x.kind==='reset').map(x=>Number(x.client_ms)||0));
      const resetAt=Math.max(Number(local.resetAt)||0,remoteReset);
      const keys=new Set(rows.map(x=>x.event_key));
      const outgoing=[];
      if(Number(local.resetAt)>remoteReset){
        const key='reset-'+local.resetAt;
        if(!keys.has(key))outgoing.push({user_id:user.id,event_key:key,kind:'reset',client_ms:local.resetAt,payload:{}});
      }
      (local.history||[]).forEach(h=>{
        if(!validateWorkout(h)||Number(h.at)<=resetAt)return;
        const key=historyId(h);
        if(!keys.has(key))outgoing.push({user_id:user.id,event_key:key,kind:'workout',client_ms:Number(h.at),payload:{n:h.n,title:h.title||'',cycle:h.cycle,at:h.at,min:h.min||0}});
      });
      Object.entries(local.feedback||{}).forEach(([id,value])=>{
        if(!EX[id]||!['easy','ok','hard'].includes(value))return;
        const at=nextFeedbackStamp(local,id);
        if(at<=resetAt)return;
        const key='feedback-'+id+'-'+at;
        if(!keys.has(key))outgoing.push({user_id:user.id,event_key:key,kind:'feedback',client_ms:at,payload:{id,value}});
      });
      for(let i=0;i<outgoing.length;i+=100){
        const batch=outgoing.slice(i,i+100);
        const {error}=await cloudTable().upsert(batch,{onConflict:'user_id,event_key',ignoreDuplicates:true});
        if(error)throw error;
        rows.push(...batch);
      }
      // Merge, never replace local data with an older remote snapshot.
      const remoteHistory=rows.filter(x=>x.kind==='workout').map(x=>x.payload);
      const history=mergeWorkoutHistory(local.history,remoteHistory,resetAt);
      const progress=routeProgress(history);
      const feedback={},feedbackAt={};
      rows.filter(x=>x.kind==='feedback'&&Number(x.client_ms)>resetAt)
        .sort((a,b)=>Number(a.client_ms)-Number(b.client_ms)).forEach(row=>{
          const id=row.payload&&row.payload.id, value=row.payload&&row.payload.value;
          if(EX[id]&&['easy','ok','hard'].includes(value)){feedback[id]=value;feedbackAt[id]=Number(row.client_ms)}
        });
      const prior=state(),merged=mergeWorkoutHistory(prior.history,history,resetAt);
      const latest=routeProgress(merged);
      // The browser keeps its own active workout; never cancel it during sync.
      save({history:merged,cycle:latest.cycle,step:latest.step,
        resetAt:resetAt,feedback:feedback,feedbackAt:feedbackAt});
      localStorage.setItem('taichi-cloud-owner-v1',user.id);
      cloudLast=Date.now();
      showCloudStatus('Облако ✓ · '+new Date(cloudLast).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
      if(VIEW!=='workout')render();
      return true;
    }catch(e){showCloudStatus('Нет синхронизации: '+String(e.message||e).slice(0,110));return false}
  })();
  try{return await cloudBusy}finally{cloudBusy=null}
}
async function cloudLogin(){

  if(!el||!pw)return;
  const raw=el.value.trim();
  const email=(raw.includes('@')?raw:raw+'@crm.ru').toLowerCase();

  if(!raw||!password){showCloudStatus('Укажи логин и пароль от Базы');return}
  showCloudStatus('Вход…');

  pw.value='';

  cloudUser=data.user;
  await syncCloud();
  if(VIEW==='settings')render();
}

  if(c===2)t+=' Во втором круге основные упражнения уже идут по 3 подхода.';
  if(c>=3)t+=' В этом круге делай обратную фазу медленнее — примерно 3 секунды.';
  if(id==='pushup'){
    if(c===1)t+=' Для отжиманий выбери высокую опору, где получается 8–12 чистых повторений. От пола пока не нужно.';
    else if(c===2)t+=' Если 12 повторений от текущей опоры уже уверенные, используй немного более низкую устойчивую опору.';
    else t+=' Переход к отжиманиям от пола только когда от низкой опоры стабильно получается 12–15 чистых повторений.';
  }
  if(last==='easy'){
    if(e.equip==='band')t+=' В прошлый раз было легко: увеличь натяжение резинки совсем немного.';
    else if(e.equip==='dumbbell')t+=' В прошлый раз было легко: не ускоряйся — опускай вес 3 секунды и добавь короткую паузу.';

  }
  if(last==='hard')t+=' В прошлый раз было тяжело: сопротивление не увеличивай и работай ближе к нижней границе повторов.';
  return t;

function monthCalendarHtml(){
  const hist=state().history||[], now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const offset=(first.getDay()+6)%7;
  const byDay={};
  hist.forEach(function(h){
    const d=new Date(h.at);
    if(d.getFullYear()===y&&d.getMonth()===m){
      const k=d.getDate();
      if(!byDay[k])byDay[k]={min:0,count:0};
      byDay[k].min+=(Number(h.min)||0);byDay[k].count++;
    }
  });
  const wd=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let cells=wd.map(function(x){return '<div class="cal-head">'+x+'</div>'}).join('');
  for(let i=0;i<offset;i++)cells+='<div class="cal-day blank"></div>';
  for(let d=1;d<=days;d++){
    const x=byDay[d],isToday=d===now.getDate();
    cells+='<div class="cal-day '+(x?'trained ':'')+(isToday?'today':'')+'"><b>'+d+'</b>'+(x?'<span>'+x.min+' мин</span>':'')+'</div>';
  }
  const month=now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  return '<div class="month-title"><h2>Календарь тренировок</h2><span class="small">'+month+'</span></div><div class="calendar">'+cells+'</div>';
}

  const s=state();
  v.innerHTML=head('Программа','15 тренировок → повтор маршрута с прогрессией')+
  '<section class="card route-card"><div class="route-head"><div><span class="pill gold">Круг '+s.cycle+'</span><p class="small" style="margin:8px 0 0">'+esc(cycleNote())+'</p></div><div class="small"><b>'+s.step+'/15</b> пройдено</div></div>'+renderRoute()+'</section>';
}
function renderDetail(v,n){
  const w=workout(n);if(!w){VIEW='program';render();return}
  const s=state(),locked=w.n>s.step+1,done=w.n<=s.step;
  v.innerHTML=head('Занятие '+w.n,w.title+' · '+w.focus)+
  '<div class="grid2"><section class="card"><h2>Состав тренировки</h2><div class="workout-list">'+w.ids.map(function(id,i){const e=EX[id],p=prescription(e);return '<div class="ex-row"><img src="'+e.gif+'" alt=""><div><div class="name">'+(i+1)+'. '+esc(e.name)+'</div><div class="meta">'+p.sets+' × '+esc(p.reps)+(p.rest?' · отдых '+p.rest+' сек':'')+'</div>'+(e.kind!=='service'?'<div class="eff">'+esc(effortText(id))+'</div>':'')+'</div><div class="right"><span class="pill">'+esc(e.group)+'</span></div></div>'}).join('')+'</div></section>'+
  '<aside class="card detail-side"><span class="pill gold">Круг '+s.cycle+'</span><h2 style="margin-top:10px">'+esc(w.title)+'</h2><p class="small">'+esc(cycleNote())+'</p>'+(locked?'<div class="effort"><b>Следующий шаг закрыт</b>Сначала пройди занятие '+(s.step+1)+'.</div>':'')+(done?'<p class="small">Это занятие уже пройдено в текущем круге. Его можно повторить, но маршрут от этого не сдвинется.</p>':'')+'<div class="controls">'+(!locked?'<button class="btn" data-start="'+w.n+'">'+(done?'Пройти ещё раз':'Начать тренировку')+'</button>':'')+'<button class="btn ghost" data-go="program">К маршруту</button></div></aside></div>';
}
function running(){return state().running}
function setRunning(p){const r=Object.assign({},running()||{},p);save({running:r});return r}
async function requestWake(){
  if(!settings().wake||!running())return;
  if(!('wakeLock' in navigator))return;
  try{if(!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}
}
async function releaseWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&running())requestWake()});
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function elapsed(){const r=running();if(!r)return 0;return Math.max(0,Math.floor((Date.now()-r.startedAt)/1000))}
function updateLive(){
  if(VIEW!=='workout'||!running())return;
  const wt=document.getElementById('workElapsed');if(wt)wt.textContent=fmt(elapsed());
  const r=running();
  if(r.restUntil){
    const left=Math.ceil((r.restUntil-Date.now())/1000),el=document.getElementById('restTime');
    if(el)el.textContent=fmt(left);
    if(left<=0&&!restBuzzed){
      restBuzzed=true;setRunning({restUntil:null});
      if(settings().vibrate&&navigator.vibrate)navigator.vibrate(120);
      render();
    }
  }
  if(r.phaseUntil){
    const left=Math.ceil((r.phaseUntil-Date.now())/1000),el=document.getElementById('phaseTime');
    if(el)el.textContent=fmt(left);
    if(left<=0){setRunning({phaseUntil:null,phaseDone:true});if(settings().vibrate&&navigator.vibrate)navigator.vibrate(120);render()}
  }
}
function startWorkout(n){
  const w=workout(n);if(!w)return;
  save({running:{n:w.n,idx:0,setIndex:1,startedAt:Date.now(),restUntil:null,phaseUntil:null,phaseDone:false}});
  restBuzzed=false;VIEW='workout';requestWake();render();
}
function currentExercise(){
  const r=running(),w=r?workout(r.n):null;if(!r||!w)return null;
  const id=w.ids[Math.min(r.idx,w.ids.length-1)];return {w:w,id:id,e:EX[id],idx:r.idx};
}
function renderWorkout(v){
  const cur=currentExercise();if(!cur){VIEW='home';render();return}
  const r=running(),e=cur.e,p=prescription(e),last=cur.idx===cur.w.ids.length-1;
  let body='<div class="work-head"><div class="line"><button class="btn ghost" data-exit="1">←</button><div><b>№'+cur.w.n+' · '+esc(cur.w.title)+'</b><div class="small">'+(cur.idx+1)+' из '+cur.w.ids.length+'</div></div><div class="timer" id="workElapsed">'+fmt(elapsed())+'</div><div class="wake">'+(settings().wake?'экран не гаснет':'таймер сохраняется')+'</div></div></div>';
  body+='<div class="exercise"><section class="card exercise-card"><div class="exercise-top"><div><h1>'+esc(e.name)+'</h1><span class="pill">'+esc(e.group)+'</span></div><span class="pill gold">Круг '+state().cycle+'</span></div><div class="gif"><img src="'+e.gif+'" alt="Техника: '+esc(e.name)+'"></div><p>'+esc(e.about)+'</p>';
  if(e.kind==='service'){
    const left=r.phaseUntil?Math.ceil((r.phaseUntil-Date.now())/1000):e.seconds;
    body+='<div class="service-timer" id="phaseTime">'+fmt(left)+'</div><ol class="tech">'+e.how.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol><div class="controls">'+(!r.phaseUntil&&!r.phaseDone?'<button class="btn" id="startPhase">Запустить '+fmt(e.seconds)+'</button>':'')+(r.phaseDone?'<button class="btn" id="nextExercise">'+(last?'Завершить':'Далее')+'</button>':'')+'</div>';
  }else{
    body+='<div class="prescription"><div><span>Подходы</span><b>'+p.sets+'</b></div><div><span>Повторы</span><b>'+esc(p.reps)+'</b></div><div><span>Отдых</span><b>'+p.rest+' сек</b></div></div><div class="effort"><b>Как должно ощущаться</b>'+esc(effortText(cur.id))+(feedbackHint(cur.id)?'<div class="small" style="margin-top:6px">'+esc(feedbackHint(cur.id))+'</div>':'')+'</div><h3>Техника</h3><ol class="tech">'+e.how.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>';
    if(r.restUntil){
      body+='<div class="restbox"><div class="small">Отдых перед подходом '+r.setIndex+' из '+p.sets+'</div><div class="resttime" id="restTime">'+fmt(Math.ceil((r.restUntil-Date.now())/1000))+'</div></div>';
    }else if(r.setIndex<=p.sets){
      body+='<div class="setbox"><div class="settitle">Подход '+r.setIndex+' из '+p.sets+'</div><div class="small">'+(e.unilateral?'Сделай '+esc(p.reps)+' — сначала одной рукой, затем другой. После обеих рук нажми «Подход выполнен».':esc(p.reps)+' · делай спокойно, без рывков')+'</div><div class="controls"><button class="btn" id="setDone">Подход выполнен</button></div></div>';
    }else{
      const f=(state().feedback||{})[cur.id]||'';
      body+='<div class="feedback"><b>Как было?</b><div class="small">Это помогает следующему кругу выбрать нагрузку.</div><div class="choices"><button data-fb="easy" class="'+(f==='easy'?'on':'')+'">Легко</button><button data-fb="ok" class="'+(f==='ok'?'on':'')+'">Как надо</button><button data-fb="hard" class="'+(f==='hard'?'on':'')+'">Тяжело</button></div></div><div class="controls"><button class="btn" id="nextExercise">'+(last?'Завершить тренировку':'Следующее упражнение')+'</button></div>';
    }
  }
  body+='</section></div>';v.innerHTML=body;wireWorkout(cur,p,last);
}
function wireWorkout(cur,p,last){
  const sp=document.getElementById('startPhase');if(sp)sp.onclick=function(){setRunning({phaseUntil:Date.now()+cur.e.seconds*1000,phaseDone:false});render()};
  const sd=document.getElementById('setDone');if(sd)sd.onclick=function(){const r=running();if(r.setIndex<p.sets){restBuzzed=false;setRunning({setIndex:r.setIndex+1,restUntil:Date.now()+p.rest*1000});render()}else{setRunning({setIndex:p.sets+1});render()}};
  document.querySelectorAll('[data-fb]').forEach(function(b){b.onclick=function(){const s=state(),fb=Object.assign({},s.feedback||{});fb[cur.id]=b.dataset.fb;const at=Object.assign({},s.feedbackAt||{});at[cur.id]=Date.now();save({feedback:fb,feedbackAt:at});render();syncCloud()}});
  const ne=document.getElementById('nextExercise');if(ne)ne.onclick=function(){if(last)finishWorkout(cur.w);else{setRunning({idx:cur.idx+1,setIndex:1,restUntil:null,phaseUntil:null,phaseDone:false});restBuzzed=false;render()}};
}
function finishWorkout(w){
  const s=state(),wasCurrent=w.n===s.step+1;
  let cycle=s.cycle,step=s.step,completedCycle=false;
  if(wasCurrent){step++;if(step>=15){completedCycle=true;cycle++;step=0}}
  const hist=s.history.concat([{n:w.n,title:w.title,cycle:s.cycle,at:Date.now(),min:Math.max(1,Math.round(elapsed()/60))}]);
  save({cycle:cycle,step:step,history:hist,running:null});
  releaseWake();DONE={w:w,completedCycle:completedCycle,newCycle:cycle};VIEW='done';render();
  syncCloud();
}
let DONE=null;
function renderDone(v){
  const d=DONE||{},s=state();
  v.innerHTML=head('Тренировка завершена',d.w?('№'+d.w.n+' · '+d.w.title):'')+'<section class="card" style="max-width:720px;text-align:center"><div class="stats"><div class="stat"><b>'+s.history.length+'</b><span>занятий всего</span></div><div class="stat"><b>'+s.step+'/15</b><span>текущий маршрут</span></div><div class="stat"><b>'+s.cycle+'</b><span>текущий круг</span></div></div>'+(d.completedCycle?'<div class="effort" style="text-align:left;margin-top:16px"><b>Круг завершён</b>Начинается круг '+d.newCycle+'. Нагрузка увеличится автоматически: больше подходов и, если предыдущая работа была лёгкой, чуть больше сопротивления.</div>':'')+'<div class="controls" style="justify-content:center"><button class="btn" data-go="home">На главную</button><button class="btn ghost" data-go="program">К маршруту</button></div></section>';
}
function renderSettings(v){
  const st=settings();
  v.innerHTML=head('Настройки','Версия '+VERSION+' · облачная синхронизация тренировок')+'<div class="settings"><div class="set-card">'+
  '<div class="set-group"><h2>Синхронизация между устройствами</h2><div class="small" id="cloudStatus">'+esc(cloudStatus)+'</div>'+
  (cloudUser?'<p class="small">Вход: '+esc(cloudUser.email||'')+'. История сохраняется в личном облаке Supabase.</p><div class="controls"><button class="btn soft" id="syncNow">Синхронизировать</button><button class="btn ghost" id="cloudLogout">Выйти из облака</button></div>':
  '<p class="small">Войди с логином и паролем от Базы (CRM). На телефоне и компьютере должен быть один аккаунт. История на устройстве останется и после входа объединится с облачной.</p><input id="cloudEmail" placeholder="Логин Базы" autocomplete="username"><input id="cloudPassword" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-top:8px"><div class="controls"><button class="btn" id="cloudLogin">Подключить облако</button></div>')+'</div>'+
  '<div class="set-group"><h2>Режим</h2><div class="set-row"><div><b>Тренировок в неделю</b><div class="small">Оптимально 3; четвёртая — только если восстановился и нет боли.</div></div><select id="freq"><option value="3" '+(st.frequency===3?'selected':'')+'>3 раза</option><option value="4" '+(st.frequency===4?'selected':'')+'>4 раза</option></select></div></div><div class="set-group"><h2>Во время тренировки</h2><div class="set-row"><div><b>Не гасить экран</b><div class="small">Если браузер поддерживает Wake Lock, экран останется включён. Если нет — таймер всё равно восстановится по реальному времени.</div></div><label class="toggle"><input type="checkbox" id="wake" '+(st.wake?'checked':'')+'> Включено</label></div><div class="set-row"><div><b>Вибрация после отдыха</b></div><label class="toggle"><input type="checkbox" id="vib" '+(st.vibrate?'checked':'')+'> Включено</label></div></div><div class="set-group"><h2>Прогресс</h2><p class="small">Сброс удалит историю, оценки нагрузки и вернёт программу на круг 1, занятие 1.</p><button class="btn danger" id="reset">Сбросить программу</button></div><div class="set-group"><h2>Резервная копия истории</h2><p class="small">Резервная копия на случай потери доступа к устройству. Импорт объединяет занятия и не удаляет имеющиеся записи.</p><div class="controls"><button class="btn soft" id="exportHistory">Сохранить историю в файл</button><label class="btn ghost" style="cursor:pointer">Загрузить историю из файла<input id="importHistory" type="file" accept=".json,application/json" style="display:none"></label></div></div><div class="controls"><button class="btn" id="saveSettings">Сохранить</button></div></div></div>';
}
document.addEventListener('click',function(ev){
  const t=ev.target.closest('[data-go],[data-tab],[data-open],[data-start],[data-exit]');
  if(!t)return;
  if(t.dataset.exit){releaseWake();VIEW='home';render();return}
  if(t.dataset.open){DETAIL=Number(t.dataset.open);VIEW='detail';render();return}
  if(t.dataset.start){startWorkout(Number(t.dataset.start));return}
  const go=t.dataset.go||t.dataset.tab;if(go){VIEW=go;DETAIL=null;render()}
});
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='saveSettings'){
    const st={frequency:Number(document.getElementById('freq').value)||3,wake:document.getElementById('wake').checked,vibrate:document.getElementById('vib').checked};
    save({settings:st});ev.target.textContent='Сохранено';setTimeout(function(){render()},600);
  }
  if(ev.target&&ev.target.id==='reset'){
    if(confirm('Сбросить весь прогресс Тайчи на всех подключённых устройствах? Предварительно сохрани резервную копию.')){
      const resetAt=Date.now(),old=state();
      save({cycle:1,step:0,history:[],feedback:{},feedbackAt:{},running:null,resetAt});
      VIEW='home';render();syncCloud();
    }
  }
});
function exportHistory(){
  const data={app:'taichi',format:1,createdAt:new Date().toISOString(),data:state()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='taichi-history-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000);
}
async function importHistory(file){
  if(!file)return;
  try{
    if(file.size>2000000)throw new Error('Файл слишком большой');
    const raw=JSON.parse(await file.text());
    if(!raw||raw.app!=='taichi'||!raw.data||!Array.isArray(raw.data.history))throw new Error('Это не резервная копия Тайчи');
    const source=raw.data, old=state();
    const clean=function(h){return h&&Number.isFinite(Number(h.at))&&Number.isInteger(Number(h.n))&&Number(h.n)>=1&&Number(h.n)<=15&&Number.isFinite(Number(h.cycle))&&Number(h.cycle)>=1};
    const seen=new Set(),history=[];
    [...(old.history||[]),...source.history].forEach(function(h){
      if(!clean(h))return;
      const id=String(h.at)+'|'+String(h.cycle)+'|'+String(h.n);
      if(!seen.has(id)){seen.add(id);history.push(h)}
    });
    history.sort(function(a,b){return a.at-b.at});
    const score=function(x){const cycle=Math.max(1,Math.floor(Number(x.cycle)||1));const step=Math.max(0,Math.min(14,Math.floor(Number(x.step)||0)));return (cycle-1)*15+step};
    const newer=score(source)>score(old)?source:old;
    save({history:history,cycle:newer.cycle||1,step:newer.step||0,feedback:Object.assign({},source.feedback||{},old.feedback||{}),feedbackAt:Object.assign({},source.feedbackAt||{},old.feedbackAt||{}),running:old.running});
    syncCloud();
    alert('Импорт завершён. В истории '+history.length+' тренировок. Данные с обоих устройств объединены.');
    render();
  }catch(e){alert('Не удалось загрузить историю: '+(e&&e.message||e))}
}
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='exportHistory')exportHistory();
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='importHistory'){
    const file=ev.target.files&&ev.target.files[0];
    ev.target.value='';
    importHistory(file);
  }
});
document.addEventListener('click',function(ev){
  if(!ev.target)return;
  if(ev.target.id==='cloudLogin')cloudLogin();
  if(ev.target.id==='cloudLogout')cloudLogout();
  if(ev.target.id==='syncNow')syncCloud();
});
window.addEventListener('online',function(){syncCloud()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&cloudUser)syncCloud()});
setInterval(function(){if(cloudUser)syncCloud()},45000);
cloudInit();
window.addEventListener('resize',function(){if(VIEW==='program')render()});
tickId=setInterval(updateLive,250);
if(running()){VIEW='workout';requestWake()}
render();
</script>
</body>
</html>
