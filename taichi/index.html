<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFCF9" />
<title>Тайчи · программа тренировок с гантелями</title>
<link rel="icon" href="assets/brand/app-mark.png" />
<style>
:root{
  --bg:#FBFCF9; --surface:#FFFFFF; --ink:#172820; --primary:#285444;
  --sel:#E5EFE6; --line:#C2D8C5; --next:#AE7A30; --div:#D4DDD5;
  --muted:#5b6a62; --radius:12px; --panel:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
a{color:var(--primary)}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:url('assets/backgrounds/route-relief-desktop.png') center/cover no-repeat;opacity:.55}
@media (max-width:720px){.bg{background-image:url('assets/backgrounds/route-relief-mobile.png');opacity:.5}}
.app{min-height:100vh;display:flex;flex-direction:column}
.shell{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:0 32px 96px}
/* ---------- шапка (компьютер) ---------- */
.topbar{display:flex;align-items:center;gap:28px;padding:18px 0 10px;border-bottom:1px solid var(--div);position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{height:34px;width:auto;display:block}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav button{
  border:none;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:15px
}
.nav button.on{background:var(--sel);color:var(--ink);font-weight:600}
.nav button:focus-visible,.btn:focus-visible,.marker:focus-visible,.tab:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* ---------- типографика ---------- */
h1{font-size:30px;line-height:1.2;margin:22px 0 6px;letter-spacing:-.4px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.small{font-size:14px;color:var(--muted)}
/* ---------- кнопки ---------- */
.btn{
  border:none;border-radius:var(--radius);background:var(--primary);color:#fff;
  padding:12px 20px;font-weight:600;cursor:pointer;min-height:44px
}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--div)}
.btn.soft{background:var(--sel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
/* ---------- дорожка ---------- */
.route{position:relative;margin:8px 0 6px;padding:6px 0}
.route-line{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);border-radius:2px}
.route-v .route-line{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto}
.markers{position:relative;display:flex;justify-content:space-between;gap:12px}
.route-v .markers{flex-direction:column;gap:22px}
.marker{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:none;cursor:pointer;padding:6px 4px;min-width:44px;min-height:44px}
.route-v .marker{flex-direction:row;align-items:center;gap:12px}
.marker .dot{width:28px;height:28px;flex:none;display:block}
.marker .dot img{width:28px;height:28px;object-fit:contain;display:block}

.marker .cap{font-size:13px;color:var(--muted);max-width:132px;text-align:center;line-height:1.25}
.route-v .marker .cap{text-align:left;max-width:none}
.route-scroll{max-height:46vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
@media (min-width:721px){.route-scroll{max-height:none;overflow:visible}}
.marker.sel .cap{color:var(--ink);font-weight:600}
/* ---------- карточки ---------- */
.card{background:var(--surface);border-radius:var(--panel);padding:18px;box-shadow:0 1px 2px rgba(23,40,32,.05)}
.grid{display:grid;gap:18px}
.cols-main{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1080px){.cols-main{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);cursor:pointer;border:1px solid transparent}
.row:hover{border-color:var(--div)}
.row.on{background:var(--sel);border-color:var(--line)}
.row .name{font-weight:600}
.row .meta{font-size:14px;color:var(--muted)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sel);color:var(--primary);font-weight:600}
.pill.next{background:#F6EEDF;color:#8a5f1f}
/* ---------- формы ---------- */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=time],select{
  width:100%;padding:11px 12px;border:1px solid var(--div);border-radius:10px;background:var(--surface);color:var(--ink)
}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day{border:1px solid var(--div);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;min-width:44px}
.day.on{background:var(--sel);border-color:var(--line);font-weight:600}
/* ---------- тренировка ---------- */
.workout{display:grid;gap:18px;grid-template-columns:300px minmax(0,1fr)}
@media (max-width:900px){.workout{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:15px;color:var(--muted)}
.step.done{background:var(--sel);color:var(--primary)}
.step.cur{background:var(--sel);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.step .num{font-variant-numeric:tabular-nums;font-weight:600;min-width:22px}
.frag-title{font-size:22px;font-weight:700;margin:0 0 4px}
.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;letter-spacing:-1px;margin:14px 0}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.fields div{background:var(--sel);border-radius:12px;padding:10px 12px}
.fields b{display:block;font-size:20px}
.fields span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
/* ---------- телефон ---------- */
.tabs{display:none}
@media (max-width:720px){
  .shell{padding:0 16px 108px}
  .topbar{display:none}
  .m-head{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
  .m-head img{height:28px}
  h1{font-size:25px;margin-top:14px}
  .tabs{
    display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--div);padding-bottom:env(safe-area-inset-bottom);z-index:30
  }
  .tab{flex:1;border:none;background:transparent;padding:10px 6px 12px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
  .tab img{width:22px;height:22px;object-fit:contain;opacity:.75}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on img{opacity:1}
  .desk-only{display:none!important}
}
@media (min-width:721px){ .mob-only{display:none!important} }
.m-head{display:none}
.empty{padding:22px;border:1px dashed var(--div);border-radius:var(--radius);color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <div class="shell">
    <!-- компьютер: верхняя навигация -->
    <div class="topbar desk-only">
      <div class="brand"><img src="assets/brand/wordmark-horizontal.png" alt="Тайчи" /></div>
      <nav class="nav" id="nav"></nav>
    </div>
    <!-- телефон: шапка -->
    <div class="m-head mob-only"><img src="assets/brand/wordmark-horizontal.png" alt="Тайчи" /></div>

    <main id="view"></main>
  </div>

  <!-- телефон: нижние вкладки -->
  <nav class="tabs mob-only" id="tabs">
    <button class="tab" data-tab="home"><img src="assets/icons/nav-home.png" alt=""><span>Главная</span></button>
    <button class="tab" data-tab="program"><img src="assets/icons/nav-program.png" alt=""><span>Программа</span></button>
    <button class="tab" data-tab="sections"><img src="assets/icons/nav-sections.png" alt=""><span>Разделы</span></button>
  </nav>
</div>

<script>
/* =======================================================================
   Тайчи — программа тренировок с гантелями.
   Данные программы, упражнений и теории — ниже. Правятся в одном месте.
   ======================================================================= */

const PROGRAM = {
  title: 'Сила и тонус с гантелями',
  goal: '3 тренировки в неделю · 25–35 минут · гантели 3 кг',
  startNote: 'Нужно: две гантели по 3 кг, устойчивый стул, коврик.',
  workouts: [
    { n:1, block:'Тренировка А', title:'Руки и грудь', minutes:30, focus:'бицепс · трицепс · грудь', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'curl', sets:1, reps:'10–15', rest:75 },
      { ex:'hammer', sets:1, reps:'10–15', rest:75 },
      { ex:'floorpress', sets:1, reps:'10–15', rest:75 },
      { ex:'wallpush', sets:1, reps:'8–12', rest:60 },
      { ex:'kickback', sets:1, reps:'10–12', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]},
    { n:2, block:'Тренировка Б', title:'Ягодицы и ноги', minutes:30, focus:'ягодицы · бёдра · икры', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'chairstand', sets:1, reps:'10–15', rest:75 },
      { ex:'bridge', sets:1, reps:'12–15', rest:75 },
      { ex:'rdl', sets:1, reps:'10–12', rest:75 },
      { ex:'backkick', sets:1, reps:'12–15 на ногу', rest:60 },
      { ex:'calfraise', sets:1, reps:'15–20', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]},
    { n:3, block:'Тренировка В', title:'Спина, плечи и руки', minutes:30, focus:'спина · плечи · руки', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'onearmrow', sets:1, reps:'10–12 на руку', rest:75 },
      { ex:'lateral', sets:1, reps:'10–12 без веса', rest:60 },
      { ex:'scapula', sets:1, reps:'12–15', rest:60 },
      { ex:'curl', sets:1, reps:'10–15', rest:60 },
      { ex:'kickback', sets:1, reps:'10–12', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]}
  ]
};

const EXERCISES = [
  { id:'curl', name:'Сгибание рук с гантелями', group:'Бицепс', about:'Базовое упражнение на бицепс. Локти держим у корпуса, работаем без раскачки.', how:['Встать прямо, гантели в опущенных руках','Локти прижаты к корпусу','Сгибаем руки до полного сокращения бицепса','Опускаем медленно, на 2 счёта'] },
  { id:'hammer', name:'Сгибание рук «молот»', group:'Бицепс, плечевая мышца', about:'Хват нейтральный, ладони смотрят друг на друга — включает плечевую мышцу и предплечье.', how:['Гантели держим вертикально','Локти не выводим вперёд','Поднимаем до уровня плеча и выше не нужно','Вниз — подконтрольно'] },
  { id:'floorpress', name:'Жим гантелей лёжа на полу', group:'Грудь, трицепс', about:'Безопасная замена жима на скамье: пол ограничивает амплитуду и защищает плечо.', how:['Лечь на спину, колени согнуты, стопы на полу','Гантели над грудью, локти под 45°','Опускаем до касания пола локтями','Выжимаем вверх, не блокируя локти жёстко'] },
  { id:'wallpush', name:'Отжимания от стены', group:'Грудь, трицепс', about:'Щадящий вариант отжиманий: нагрузка регулируется расстоянием до стены.', how:['Ладони на стене на уровне плеч','Тело — прямая линия, корпус не прогибается','Сгибаем руки, приближаясь к стене','Отталкиваемся и возвращаемся'] },
  { id:'kickback', name:'Разгибание руки назад', group:'Трицепс', about:'Изолирует трицепс. Работаем с гантелью или без веса, корпус держим неподвижно.', how:['Наклон вперёд, спина прямая','Локоть прижат к корпусу','Разгибаем руку назад до прямого угла','Возвращаем медленно'] },
  { id:'chairstand', name:'Приседания со стула', group:'Ягодицы, бёдра', about:'Вставание со стула — контролируемая глубина приседа и безопасная техника.', how:['Сесть на край стула, стопы на ширине плеч','Наклоняемся чуть вперёд и встаём через ягодицы','Садимся медленно, без падения','Колени идут по направлению носков'] },
  { id:'bridge', name:'Ягодичный мостик', group:'Ягодицы', about:'Подъём таза лёжа. Основная работа — ягодицы, поясница не переразгибается.', how:['Лечь на спину, стопы на полу, колени согнуты','Поднимаем таз до прямой линии корпус–бёдра','Сжимаем ягодицы в верхней точке','Опускаемся медленно'] },
  { id:'rdl', name:'Наклоны с гантелями (румынская тяга)', group:'Ягодицы, задняя поверхность бедра', about:'Тяга на бицепс бедра. Спина всё время прямая, движение идёт от таза.', how:['Гантели перед бёдрами, колени чуть согнуты','Отводим таз назад, гантели скользят по ногам','Останавливаемся, когда тянет под коленом','Вверх — за счёт ягодиц'] },
  { id:'backkick', name:'Отведение ноги назад стоя', group:'Ягодицы', about:'Изолирующее движение на ягодицы. Корпус не раскачивается.', how:['Стоим с опорой на стул','Отводим прямую ногу назад','Держим 1 секунду в верхней точке','Возвращаем медленно, не ставим ногу на пол'] },
  { id:'calfraise', name:'Подъёмы на носки', group:'Икры', about:'Икры любят много повторений и полную амплитуду.', how:['Стоим прямо, можно придерживаться за стул','Поднимаемся на носки максимально высоко','Задержка на секунду','Опускаемся медленно, до полной растяжки'] },
  { id:'onearmrow', name:'Тяга гантели одной рукой с опорой', group:'Спина', about:'Тяга с опорой на стул разгружает поясницу. Пока есть боль в левой руке — выполняем осторожно.', how:['Опора на стул одной рукой','Спина прямая, наклон около 45°','Тянем гантель к поясу, локоть вдоль тела','Опускаем медленно; сначала без веса, чтобы проверить ощущения'] },
  { id:'lateral', name:'Разведение рук в стороны', group:'Плечи', about:'Средний пучок плеча. Пока сохраняется боль — только без веса и в безболезненном диапазоне.', how:['Руки чуть согнуты в локтях','Поднимаем до уровня плеч, не выше','Не раскачиваем корпусом','При боли — уменьшить амплитуду или отложить'] },
  { id:'scapula', name:'Сведение лопаток стоя', group:'Верх спины', about:'Работает на осанку и середину спины, безопасно для плеча.', how:['Стоим прямо, руки вдоль тела','Сводим лопатки к позвоночнику','Держим 2 секунды','Расслабляем медленно'] },
  { id:'warmup', name:'Разминка', group:'Служебное', about:'5 минут спокойной разминки: ходьба на месте, движения ногами и плечами — без боли.', how:['Ходьба на месте 2 минуты','Круговые движения плечами','Наклоны и повороты корпуса','Приседания без веса в комфортной амплитуде'] },
  { id:'cooldown', name:'Заминка и растяжка', group:'Служебное', about:'3 минуты: спокойная растяжка ног, спины, груди и плеч.', how:['Наклон к ногам — 30 с','Растяжка квадрицепса — по 20 с','Растяжка груди у стены — 30 с','Дыхание восстанавливаем'] }
];

const THEORY = [
  { id:'how', title:'Как выполнять программу', text:'Три тренировки в неделю: понедельник, среда, суббота. Продолжительность 25–35 минут.\n\nПервые две недели — по одному подходу каждого упражнения. Затем, если всё переносится нормально, можно перейти к двум подходам.\n\nПеред каждой тренировкой — 5 минут спокойной разминки: ходьба на месте, движения ногами и плечами без боли.' },
  { id:'rest', title:'Отдых и интенсивность', text:'Между подходами отдыхай 60–90 секунд.\n\nНе нужно работать до полного мышечного отказа: заканчивай подход, когда чувствуешь, что смог бы выполнить ещё 2–3 повторения с правильной техникой.' },
  { id:'progress', title:'Как расти дальше', text:'Главное для роста мышц — постепенное увеличение нагрузки.\n\nКогда 15 повторений становятся лёгкими, сначала добавляй повторения или подход, а затем увеличивай сопротивление. Бесконечно увеличивать число повторений с гантелями по 3 кг неэффективно.\n\nДля ягодиц 3-килограммовые гантели довольно быстро станут лёгкими — тогда можно увеличить сопротивление, например с помощью эластичной ленты.' },
  { id:'shoulder', title:'Левое плечо: важное ограничение', text:'Если жим или отжимания усиливают боль в левом плече либо вызывают отдачу в кисть, прекращай именно это упражнение.\n\nПока сохраняется боль с иррадиацией в кисть, упражнения для плечевого пояса выполняй только в безболезненном диапазоне. Если даже без веса симптомы усиливаются, эту часть тренировки следует отложить.' },
  { id:'muscles', title:'Особенности групп мышц', text:'Руки: тренируй и бицепс, и трицепс — трицепс составляет значительную часть мышечной массы плеча.\n\nГрудь: жим и отжимания укрепляют грудные мышцы, но не позволяют избирательно убрать жир или изменить свойства кожи.\n\nСпина: тяги полезны, однако их пока нужно выполнять осторожно из-за симптомов в левой руке.\n\nЯгодицы: приседания, мостик и румынская тяга дают хорошую основу.' },
  { id:'when', title:'Когда ждать результатов', text:'2–3 недели — улучшение техники и переносимости нагрузки.\n\n4–6 недель — увеличение количества повторений, улучшение силы.\n\n8–12 недель — возможные заметные изменения мышц при достаточной нагрузке и восстановлении.' }
];

function setsNow(){ return cycleWeek() <= 2 ? 1 : 2; }

const STORE_KEY = 'taichi_v1';
function state(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ return {}; }
}
function save(patch){
  const s = Object.assign(state(), patch);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
  return s;
}
function historyList(){ return state().history || []; }
function settings(){
  return Object.assign({ days:[1,3,5], time:'19:00', bodyweight:'', weight:'10' }, state().settings || {});
}
function weekStart(){
  const d = new Date(); const day = (d.getDay() + 6) % 7;
  const s = new Date(d); s.setHours(0,0,0,0); s.setDate(d.getDate() - day);
  return s.getTime();
}
function doneSet(){ return new Set(historyList().filter(h => h.at >= weekStart()).map(h => h.n)); }
function currentWorkout(){
  const done = doneSet();
  return PROGRAM.workouts.find(w => !done.has(w.n)) || null;
}
function programPercent(){ return Math.min(100, Math.round(historyList().length / 12 * 100)); }
function cycleWeek(){                                    // какая неделя программы идёт
  const h = historyList();
  if (!h.length) return 1;
  return Math.floor((Date.now() - h[0].at) / (7*86400000)) + 1;
}
function ex(id){ return EXERCISES.find(e => e.id === id) || { id, name:id, group:'', about:'', how:[] }; }

/* ---------- маршрут ---------- */
function routeHtml(selected, opts){
  const o = opts || {};
  const done = doneSet();
  const cur = currentWorkout();
  const items = PROGRAM.workouts.map(w => {
    const isDone = done.has(w.n);
    const isCur = cur && cur.n === w.n;
    const cls = isDone ? 'done' : (isCur ? 'current' : 'next');
    const sel = selected === w.n ? ' sel' : '';
    const icon = isDone ? 'route-complete.png' : (isCur ? 'route-current.png' : 'route-next.png');
    return `<button class="marker ${cls}${sel}" data-open="${w.n}" aria-label="${w.title}">
      <span class="dot"><img src="assets/icons/${icon}" alt=""></span><span class="cap">${w.title}</span></button>`;
  }).join('');
  const vertical = (o.vertical === undefined) ? (window.innerWidth < 721) : !!o.vertical;
  const curId = (cur && selected === cur.n) || !selected ? ' id="routeCur"' : '';
  return `<div class="route-scroll"><div class="route ${vertical ? 'route-v' : ''}"><div class="route-line"></div><div class="markers">${items.replace('class="marker current', 'id="routeCur" class="marker current')}</div></div></div>`;
}

/* ---------- экраны ---------- */
let VIEW = 'home';

function render(){
  const v = document.getElementById('view');
  const s = state();
  if (s.running && VIEW === 'workout') { renderWorkout(); paintNav(); return; }
  const map = {
    home: renderHome, program: renderProgram, exercises: renderExercises,
    workout: renderWorkout, theory: renderTheory, progress: renderProgress,
    settings: renderSettings, sections: renderSections, exercise: renderExerciseCard
  };
  (map[VIEW] || renderHome)(v);
  paintNav();
  window.scrollTo(0, 0);
  const rc = document.getElementById('routeCur');
  if (rc && window.innerWidth < 721) {
    const box = rc.closest('.route-scroll');
    if (box) box.scrollTop = Math.max(0, rc.offsetTop - box.clientHeight / 2);
  }
}

function paintNav(){
  const tabOf = { home:'home', program:'program', workout:'program', exercises:'sections',
    sections:'sections', theory:'sections', progress:'sections', settings:'sections', exercise:'sections' };
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === VIEW));
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === (tabOf[VIEW] || 'home')));
}

function calcStreak(hist){
  if (!hist.length) return 0;
  const weeks = new Set(hist.map(h => { const d = new Date(h.at); const onejan = new Date(d.getFullYear(),0,1);
    return d.getFullYear() + '-' + Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7); }));
  return weeks.size;
}

/* ---------- тренировка ---------- */
let timerId = null;
function fmt(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function renderWorkout(){
  const v = document.getElementById('view');
  const s = state();
  const cur = s.running || null;
  if (!cur) {
    const w = currentWorkout();
    if (!w) { v.innerHTML = header('Тренировка','Программа пройдена') + '<div class="empty">Все занятия завершены.</div>'; return; }
    startWorkout(w.n);
    return;
  }
  const w = PROGRAM.workouts.find(x => x.n === cur.n);
  const idx = Math.min(cur.idx || 0, w.plan.length - 1);
  const frag = w.plan[idx];
  const e = ex(frag.ex);
  const paused = !!cur.paused;
  const steps = w.plan.map((f, i) => {
    const fe = ex(f.ex);
    const cls = i < idx ? 'done' : (i === idx ? 'cur' : '');
    return `<li class="step ${cls}"><span class="num">${i+1}</span><span>${fe.name}<br><span class="small">${f.sets} × ${f.reps}</span></span></li>`;
  }).join('');
  const left = cur.left != null ? cur.left : (frag.rest || 0);
  v.innerHTML = `
    <div class="topbar desk-only" style="position:static;border:none;padding-bottom:0">
      <button class="btn ghost" data-exit="1">← Назад</button>
      <div style="margin-left:auto" class="small">Занятие ${w.n} · ${w.title}</div>
    </div>
    ${header('Тренировка', `${w.title} · неделя ${cycleWeek()} · подходов ${setsNow()} · фрагмент ${idx+1} из ${w.plan.length}`)}
    <div class="workout">
      <section class="card"><h2>Порядок</h2><ul class="steps">${steps}</ul></section>
      <section class="card">
        <div class="frag-title">${e.name}</div>
        <div class="pill">${e.group}</div>
        <p style="margin:10px 0 0">${e.about}</p>
        <div class="fields">
          <div><b>${frag.ex === 'warmup' || frag.ex === 'cooldown' ? frag.sets : setsNow()}</b><span>подход</span></div>
          <div><b>${frag.reps}</b><span>повторения</span></div>
          <div><b>${frag.rest || 0} с</b><span>отдых</span></div>
        </div>
        ${frag.rest ? `<div class="timer" id="timer">${fmt(left)}</div>
          <div class="controls">
            <button class="btn" id="timerBtn">${paused ? 'Продолжить' : (cur.runningTimer ? 'Пауза' : 'Запустить')}</button>
            <button class="btn ghost" id="pauseBtn">${paused ? 'Выйти из паузы' : 'Пауза'}</button>
          </div>` : `<div class="controls"><button class="btn ghost" id="pauseBtn">${paused ? 'Выйти из паузы' : 'Пауза'}</button></div>`}
        <div class="controls" style="margin-top:16px">
          <button class="btn" id="nextBtn">${idx === w.plan.length - 1 ? 'Завершить занятие' : 'Далее'}</button>
        </div>
        ${paused ? '<p class="small" style="margin-top:12px">Пауза: позиция в занятии сохранена. Можно выйти и вернуться позже.</p>' : ''}
      </section>
    </div>`;
  wireWorkout(w, idx);
}

function wireWorkout(w, idx){
  const s = state();
  const get = () => state().running;
  const set = (patch) => save({ running: Object.assign({}, get(), patch) });

  const btn = document.getElementById('timerBtn');
  if (btn) btn.onclick = () => {
    const r = get();
    if (r.runningTimer) { stopTimer(); set({ runningTimer:false, paused:true }); writeTimer(get().left); }
    else { startTimer(); set({ runningTimer:true, paused:false }); }
    renderWorkout();
  };
  const pb = document.getElementById('pauseBtn');
  if (pb) pb.onclick = () => {
    const r = get();
    if (r.paused) set({ paused:false }); else { stopTimer(); set({ paused:true, runningTimer:false }); }
    renderWorkout();
  };
  document.getElementById('nextBtn').onclick = () => {
    stopTimer();
    const r = get();
    if (idx === w.plan.length - 1) { finishWorkout(w); return; }
    set({ idx: idx + 1, left: w.plan[idx+1].rest || 0, runningTimer:false, paused:false });
    renderWorkout();
  };
  const back = document.querySelector('[data-exit]');
  if (back) back.onclick = () => { stopTimer(); set({ paused:true, runningTimer:false }); VIEW = 'home'; render(); };
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on'));
}

function writeTimer(v){
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(Math.max(0, v || 0));
}
function startTimer(){
  stopTimer();
  timerId = setInterval(() => {
    const r = state().running; if (!r) { stopTimer(); return; }
    const left = Math.max(0, (r.left || 0) - 1);
    save({ running: Object.assign({}, r, { left }) });
    writeTimer(left);
    if (left === 0) { stopTimer(); const rr = state().running; if (rr) save({ running: Object.assign({}, rr, { runningTimer:false }) }); }
  }, 1000);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

function startWorkout(n){
  const w = PROGRAM.workouts.find(x => x.n === n);
  if (!w) return;
  save({ running: { n, idx:0, startedAt: Date.now(), left: w.plan[0].rest || 0, runningTimer:false, paused:false } });
  VIEW = 'workout';
  render();
}

function finishWorkout(w){
  stopTimer();
  const r = state().running || {};
  const min = Math.max(1, Math.round((Date.now() - (r.startedAt || Date.now())) / 60000));
  const hist = historyList().filter(h => h.n !== w.n);
  hist.push({ n: w.n, title: w.title, at: Date.now(), min });
  save({ history: hist, running: null });
  const v = document.getElementById('view');
  v.innerHTML = `
    ${header('Занятие завершено', `Занятие ${w.n} · ${w.title}`)}
    <div class="card">
      <div class="fields">
        <div><b>${min}</b><span>минут</span></div>
        <div><b>${historyList().length}</b><span>всего занятий</span></div>
        <div><b>${programPercent()}%</b><span>программы</span></div>
      </div>
      <div class="controls">
        <button class="btn" data-go="progress">Перейти в прогресс</button>
        <button class="btn ghost" data-go="home">На главную</button>
      </div>
    </div>`;
  paintNav();
}

/* ---------- мелочи ---------- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short' }) + ', ' +
         d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- навигация ---------- */
const NAV = [
  ['home','Главная'], ['program','Программа'], ['exercises','Упражнения'],
  ['workout','Тренировка'], ['theory','Теория'], ['progress','Прогресс'], ['settings','Настройки']
];
document.getElementById('nav').innerHTML = NAV.map(([go,t]) => `<button data-go="${go}">${t}</button>`).join('');
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if (t === 'sections') { VIEW = 'sections'; render(); return; }
  VIEW = t; render();
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-open],[data-start],[data-ex],[data-theory],[data-reset],[data-day]');
  if (!t) return;
  if (t.dataset.open) { VIEW = 'workout'; return showWorkoutInfo(Number(t.dataset.open)); }
  if (t.dataset.start) { VIEW = 'workout'; return startWorkout(Number(t.dataset.start)); }
  if (t.dataset.ex) { VIEW = 'exercises'; save({}); return renderExercises(document.getElementById('view'), t.dataset.ex); }
  if (t.dataset.theory) { save({ theoryOpen: t.dataset.theory }); VIEW = 'theory'; return render(); }
  if (t.dataset.reset) { if (confirm('Начать программу заново? История останется.')) { save({ running:null }); return; } }
  if (t.dataset.day) {
    const st = settings();
    const d = Number(t.dataset.day);
    const days = st.days.includes(d) ? st.days.filter(x => x !== d) : st.days.concat([d]).sort();
    save({ settings: Object.assign({}, st, { days }) });
    renderSettings(document.getElementById('view'));
    return;
  }
  const go = t.dataset.go;
  if (go) { VIEW = go; render(); }
});

/* карточка занятия без старта */
function showWorkoutInfo(n){
  const w = PROGRAM.workouts.find(x => x.n === n);
  if (!w) return;
  const done = doneSet();
  const v = document.getElementById('view');
  v.innerHTML = `
    ${header(`Занятие ${w.n}`, `${w.title} · ${w.focus}`)}
    <div class="grid cols-main">
      <section class="card">
        <h2>Состав</h2>
        <div class="list">${w.plan.map((f,i) => {
          const e = ex(f.ex);
          return `<div class="row"><span class="pill">${i+1}</span><div style="flex:1">
            <div class="name">${e.name}</div><div class="meta">${f.sets} × ${f.reps}${f.rest ? ' · отдых ' + f.rest + ' с' : ''}</div>
          </div></div>`;
        }).join('')}</div>
      </section>
      <aside class="card">
        <div class="pill">${w.block}</div>
        <h3 style="margin-top:10px">${w.minutes} минут</h3>
        <p class="small">${done.has(w.n) ? 'Это занятие уже пройдено. Можно пройти снова — в истории останется последняя запись.' : 'Занятие ещё не пройдено.'}</p>
        <div class="controls">
          <button class="btn" data-start="${w.n}">${done.has(w.n) ? 'Пройти снова' : 'Начать тренировку'}</button>
          <button class="btn ghost" data-go="program">К программе</button>
        </div>
      </aside>
    </div>`;
  paintNav();
}

/* поиск упражнений */
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'exSearch') {
    save({ exSearch: e.target.value });
    const sel = document.querySelector('.row.on[data-ex]');
    renderExercises(document.getElementById('view'), sel ? sel.dataset.ex : null);
    const inp = document.getElementById('exSearch');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
});

/* сохранение настроек */
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'setSave') {
    const st = settings();
    st.time = document.getElementById('setTime').value || st.time;
    st.bodyweight = document.getElementById('setBW').value;
    st.weight = document.getElementById('setW').value;
    save({ settings: st });
    e.target.textContent = 'Сохранено';
    setTimeout(() => { e.target.textContent = 'Сохранить'; }, 1400);
  }
});

/* старт */
render();
</script>
</body>
</html>
