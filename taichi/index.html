<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFCF9" />
<meta name="app-version" content="1.2.0" />
<title>Тайчи · программа тренировок с гантелями</title>
<link rel="icon" href="assets/brand/app-mark.png" />
<style>
:root{
  --bg:#FBFCF9; --surface:#FFFFFF; --ink:#172820; --primary:#285444;
  --sel:#E5EFE6; --line:#C2D8C5; --next:#AE7A30; --div:#D4DDD5;
  --muted:#5b6a62; --r-btn:12px; --r-panel:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
a{color:var(--primary)}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:url('assets/backgrounds/route-relief-desktop.png?v=1.2.0') center/cover no-repeat}

/* ---------- шапка компьютера ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--div)}
.topbar .inner{max-width:1440px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:26px}
.brand img{height:34px;width:auto;display:block}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 12px;
  border-radius:10px;cursor:pointer;color:var(--muted);font-size:15px;min-height:44px}
.nav button img{width:18px;height:18px;object-fit:contain;opacity:.8}
.nav button.on{background:var(--sel);color:var(--ink);font-weight:600}

/* ---------- оболочка ---------- */
.shell{max-width:1440px;margin:0 auto;padding:0 32px 96px}
h1{font-size:30px;line-height:1.2;letter-spacing:-.4px;margin:26px 0 6px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.small{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r-panel);padding:18px;box-shadow:0 1px 2px rgba(23,40,32,.05)}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}

/* ---------- кнопки ---------- */
.btn{border:0;border-radius:var(--r-btn);background:var(--primary);color:#fff;padding:12px 20px;
  font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--div)}
.btn.soft{background:var(--sel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
:where(button,.btn,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- карта маршрута ---------- */
.map-card{padding:18px 18px 22px}
.map-cap{font-size:13px;color:var(--muted);letter-spacing:.02em;margin:0 0 10px}
.map{position:relative;width:100%;max-width:720px;margin:0 auto;aspect-ratio:660/400;
  background:url('assets/routes/program-route-desktop.png?v=1.2.0') 0 0/100% 100% no-repeat}
.mk{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:none;
  aspect-ratio:1;cursor:pointer;border-radius:50%}
.mk img{width:100%;height:100%;display:block;object-fit:contain}
.mk.sel img{filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.cap{position:absolute;transform:translateY(-50%);right:2.5%;padding-left:6px;font-size:13px;line-height:1.25;
  color:var(--muted);pointer-events:none}
.cap b{display:block;font-weight:600;color:var(--ink);font-size:13.5px}
.cap i{font-style:normal;font-size:12px;color:var(--muted)}
.mk.sel ~ .cap{} /* оставляем как есть: подпись относится к своей точке */
.map-start{display:none}

/* ---------- список занятий ---------- */
.panel-list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  background:var(--surface);border:1px solid transparent;cursor:pointer;min-height:56px;text-align:left;width:100%}
.item:hover{border-color:var(--div)}
.item.on{background:var(--sel);border-color:var(--line)}
.item .name{font-weight:600}
.item .meta{font-size:13.5px;color:var(--muted)}
.thumb{width:72px;height:72px;flex:none;border-radius:10px;object-fit:cover;background:var(--sel)}
.ex-fig{background:var(--sel);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-height:280px;margin:0 0 14px}
.ex-fig img{width:100%;height:100%;object-fit:contain;display:block}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sel);color:var(--primary);
  font-weight:600;display:inline-block;white-space:nowrap}
.pill.next{background:#F6EEDF;color:#8a5f1f}
.ill{display:block;width:100%;max-width:260px;height:auto;max-height:180px;object-fit:cover;
  border-radius:12px;background:var(--sel)}

/* ---------- теория ---------- */
.theory{display:grid;gap:18px;grid-template-columns:30% minmax(0,1fr);align-items:start}
.theory .read p{max-width:68ch}

/* ---------- прогресс ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.stats div{background:var(--sel);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.empty{padding:22px;border:1px dashed var(--div);border-radius:12px;color:var(--muted);text-align:center}

/* ---------- настройки ---------- */
.set-card{background:var(--surface);border-radius:var(--r-panel);padding:4px 22px 18px;box-shadow:0 1px 2px rgba(23,40,32,.05)}
.set-group{padding:18px 0;border-top:1px solid var(--div)}
.set-group:first-child{border-top:0}
.set-group h2{margin:0 0 6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:center;padding:10px 0;min-height:56px}
.set-row > span{color:var(--ink)}
.set-row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
input[type=text],input[type=number],input[type=time],select{
  width:100%;padding:11px 12px;border:1px solid var(--div);border-radius:10px;
  background:var(--surface);color:var(--ink);min-height:44px;font:inherit}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day{border:1px solid var(--div);background:var(--surface);border-radius:10px;padding:9px 12px;
  cursor:pointer;min-width:44px;min-height:44px}
.day.on{background:var(--sel);border-color:var(--line);font-weight:600}

/* ---------- тренировка ---------- */
.workout{display:grid;gap:26px;grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
.frag{max-width:640px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:'';position:absolute;left:13px;top:24px;bottom:24px;width:2px;
  background:var(--line);border-radius:2px}
.step{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px 8px 8px 0;border-radius:12px}
.step .dot{width:28px;height:28px;flex:none;position:relative;z-index:1}
.step .dot img{width:100%;height:100%;display:block}
.step .t{font-size:14.5px;line-height:1.3;padding-top:4px}
.step .t em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.step.cur{background:var(--sel)}
.step.cur .t{font-weight:600}
.step.next .t{font-weight:400}
.frag h2{font-size:22px;line-height:1.25;margin:0 0 8px}
.fields{display:flex;flex-direction:column;margin:14px 0;background:var(--sel);border-radius:12px;padding:2px 14px}
.fields .f{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid rgba(23,40,32,.08)}
.fields .f:first-child{border-top:0}
.fields .f span{font-size:14px;color:var(--muted)}
.fields .f b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:0}
.timer{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.pause{background:var(--sel);border-radius:12px;padding:12px 14px;margin:12px 0}
.pause b{font-size:17px}
.pause p{margin:4px 0 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tech{margin:12px 0 0;padding-left:20px}
.tech li{margin-bottom:6px}

/* ---------- завершение ---------- */
.done-card{text-align:center}
.done-card .controls{justify-content:center}

/* ---------- телефон ---------- */
.m-head{display:none}
.tabs{display:none}
.workbar{display:none}
@media (max-width:1080px){
  .cols{grid-template-columns:1fr}
  .workout{grid-template-columns:1fr}
  .theory{grid-template-columns:1fr}
}
@media (max-width:720px){
  .bg{background-image:url('assets/backgrounds/route-relief-mobile.png?v=1.2.0');opacity:.45}
  .shell{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
  .topbar{display:none}
  .m-head{display:flex;align-items:center;padding:14px 0 8px}
  .m-head img{height:30px}
  h1{font-size:25px;margin:10px 0 4px}
  .sub{font-size:14px}
  .card{padding:16px;border-radius:16px}
  .map-card{padding:14px 12px 16px}
  .map{max-width:340px;aspect-ratio:300/405;
    background-image:url('assets/routes/program-route-mobile.png?v=1.2.0')}
  .mk{min-width:44px;min-height:44px}
  .cap b{font-size:13px}
  .map-start{display:flex;position:absolute;left:18.667%;top:55.802%;width:79.333%;height:10.864%;
    align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--primary);
    color:#fff;font-weight:600;font-size:14px;cursor:pointer;padding:0 6px;line-height:1.15}
  .thumb{width:64px;height:64px}
  .ex-fig{max-height:300px;padding:8px}
  .set-card{padding:2px 16px 16px}
  .set-row{grid-template-columns:1fr;gap:6px}
  .fields{grid-template-columns:1fr 1fr}
  .timer{font-size:36px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--div);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;border:0;background:none;padding:8px 6px 10px;font-size:12px;color:var(--muted);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
  .tab img{width:22px;height:22px;object-fit:contain;opacity:.75}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on img{opacity:1}
  body.in-workout .tabs{display:none}
  .workbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--div);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    gap:10px;align-items:center}
  body.in-workout .workbar{display:flex}
  .workbar .btn{flex:1}
  .save-bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:29;
    background:var(--bg);border-top:1px solid var(--div);padding:10px 16px}
  .save-bar .btn{width:100%}
  .frag #nextBtn{display:none}
}
@media (min-width:721px){ .mob-only{display:none!important} }
</style>
</head>
<body>
<div class="bg"></div>

<header class="topbar">
  <div class="inner">
    <a class="brand" href="#" data-go="home" aria-label="Тайчи — на главную"><img src="assets/brand/wordmark-horizontal.png?v=1.2.0" alt="Тайчи" /></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<div class="shell">
  <div class="m-head mob-only"><img src="assets/brand/wordmark-horizontal.png?v=1.2.0" alt="Тайчи" /></div>
  <main id="view"></main>
</div>

<nav class="tabs mob-only" id="tabs">
  <button class="tab" data-tab="home"><img src="assets/icons/nav-home.png?v=1.2.0" alt=""><span>Главная</span></button>
  <button class="tab" data-tab="program"><img src="assets/icons/nav-program.png?v=1.2.0" alt=""><span>Программа</span></button>
  <button class="tab" data-tab="sections"><img src="assets/icons/nav-sections.png?v=1.2.0" alt=""><span>Разделы</span></button>
</nav>

<div class="workbar" id="workbar"></div>

<script>
/* =======================================================================
   Тайчи — программа тренировок с гантелями.
   Данные программы, упражнений и теории — ниже. Правятся в одном месте.
   ======================================================================= */

const PROGRAM = {
  title: 'Сила и тонус с гантелями',
  goal: '3 тренировки в неделю · 25–35 минут · гантели 3 кг',
  startNote: 'Нужно: две гантели по 3 кг, устойчивый стул, коврик.',
  workouts: [
    { n:1, block:'Тренировка А', title:'Руки и грудь', minutes:30, focus:'бицепс · трицепс · грудь', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'curl', sets:1, reps:'10–15', rest:75 },
      { ex:'hammer', sets:1, reps:'10–15', rest:75 },
      { ex:'floorpress', sets:1, reps:'10–15', rest:75 },
      { ex:'wallpush', sets:1, reps:'8–12', rest:60 },
      { ex:'kickback', sets:1, reps:'10–12', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]},
    { n:2, block:'Тренировка Б', title:'Ягодицы и ноги', minutes:30, focus:'ягодицы · бёдра · икры', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'chairstand', sets:1, reps:'10–15', rest:75 },
      { ex:'bridge', sets:1, reps:'12–15', rest:75 },
      { ex:'rdl', sets:1, reps:'10–12', rest:75 },
      { ex:'backkick', sets:1, reps:'12–15 на ногу', rest:60 },
      { ex:'calfraise', sets:1, reps:'15–20', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]},
    { n:3, block:'Тренировка В', title:'Спина, плечи и руки', minutes:30, focus:'спина · плечи · руки', plan:[
      { ex:'warmup', sets:1, reps:'5 мин', rest:0 },
      { ex:'onearmrow', sets:1, reps:'10–12 на руку', rest:75 },
      { ex:'lateral', sets:1, reps:'10–12 без веса', rest:60 },
      { ex:'scapula', sets:1, reps:'12–15', rest:60 },
      { ex:'curl', sets:1, reps:'10–15', rest:60 },
      { ex:'kickback', sets:1, reps:'10–12', rest:60 },
      { ex:'cooldown', sets:1, reps:'3 мин', rest:0 }
    ]}
  ]
};

const EXERCISES = [
  { id:'curl', name:'Сгибание рук с гантелями', group:'Бицепс', about:'Базовое упражнение на бицепс. Локти держим у корпуса, работаем без раскачки.', how:['Встать прямо, гантели в опущенных руках','Локти прижаты к корпусу','Сгибаем руки до полного сокращения бицепса','Опускаем медленно, на 2 счёта'] },
  { id:'hammer', name:'Сгибание рук «молот»', group:'Бицепс, плечевая мышца', about:'Хват нейтральный, ладони смотрят друг на друга — включает плечевую мышцу и предплечье.', how:['Гантели держим вертикально','Локти не выводим вперёд','Поднимаем до уровня плеча и выше не нужно','Вниз — подконтрольно'] },
  { id:'floorpress', name:'Жим гантелей лёжа на полу', group:'Грудь, трицепс', about:'Безопасная замена жима на скамье: пол ограничивает амплитуду и защищает плечо.', how:['Лечь на спину, колени согнуты, стопы на полу','Гантели над грудью, локти под 45°','Опускаем до касания пола локтями','Выжимаем вверх, не блокируя локти жёстко'] },
  { id:'wallpush', name:'Отжимания от стены', group:'Грудь, трицепс', about:'Щадящий вариант отжиманий: нагрузка регулируется расстоянием до стены.', how:['Ладони на стене на уровне плеч','Тело — прямая линия, корпус не прогибается','Сгибаем руки, приближаясь к стене','Отталкиваемся и возвращаемся'] },
  { id:'kickback', name:'Разгибание руки назад', group:'Трицепс', about:'Изолирует трицепс. Работаем с гантелью или без веса, корпус держим неподвижно.', how:['Наклон вперёд, спина прямая','Локоть прижат к корпусу','Разгибаем руку назад до прямого угла','Возвращаем медленно'] },
  { id:'chairstand', name:'Приседания со стула', group:'Ягодицы, бёдра', about:'Вставание со стула — контролируемая глубина приседа и безопасная техника.', how:['Сесть на край стула, стопы на ширине плеч','Наклоняемся чуть вперёд и встаём через ягодицы','Садимся медленно, без падения','Колени идут по направлению носков'] },
  { id:'bridge', name:'Ягодичный мостик', group:'Ягодицы', about:'Подъём таза лёжа. Основная работа — ягодицы, поясница не переразгибается.', how:['Лечь на спину, стопы на полу, колени согнуты','Поднимаем таз до прямой линии корпус–бёдра','Сжимаем ягодицы в верхней точке','Опускаемся медленно'] },
  { id:'rdl', name:'Наклоны с гантелями (румынская тяга)', group:'Ягодицы, задняя поверхность бедра', about:'Тяга на бицепс бедра. Спина всё время прямая, движение идёт от таза.', how:['Гантели перед бёдрами, колени чуть согнуты','Отводим таз назад, гантели скользят по ногам','Останавливаемся, когда тянет под коленом','Вверх — за счёт ягодиц'] },
  { id:'backkick', name:'Отведение ноги назад стоя', group:'Ягодицы', about:'Изолирующее движение на ягодицы. Корпус не раскачивается.', how:['Стоим с опорой на стул','Отводим прямую ногу назад','Держим 1 секунду в верхней точке','Возвращаем медленно, не ставим ногу на пол'] },
  { id:'calfraise', name:'Подъёмы на носки', group:'Икры', about:'Икры любят много повторений и полную амплитуду.', how:['Стоим прямо, можно придерживаться за стул','Поднимаемся на носки максимально высоко','Задержка на секунду','Опускаемся медленно, до полной растяжки'] },
  { id:'onearmrow', name:'Тяга гантели одной рукой с опорой', group:'Спина', about:'Тяга с опорой на стул разгружает поясницу. Пока есть боль в левой руке — выполняем осторожно.', how:['Опора на стул одной рукой','Спина прямая, наклон около 45°','Тянем гантель к поясу, локоть вдоль тела','Опускаем медленно; сначала без веса, чтобы проверить ощущения'] },
  { id:'lateral', name:'Разведение рук в стороны', group:'Плечи', about:'Средний пучок плеча. Пока сохраняется боль — только без веса и в безболезненном диапазоне.', how:['Руки чуть согнуты в локтях','Поднимаем до уровня плеч, не выше','Не раскачиваем корпусом','При боли — уменьшить амплитуду или отложить'] },
  { id:'scapula', name:'Сведение лопаток стоя', group:'Верх спины', about:'Работает на осанку и середину спины, безопасно для плеча.', how:['Стоим прямо, руки вдоль тела','Сводим лопатки к позвоночнику','Держим 2 секунды','Расслабляем медленно'] },
  { id:'warmup', name:'Разминка', group:'Служебное', about:'5 минут спокойной разминки: ходьба на месте, движения ногами и плечами — без боли.', how:['Ходьба на месте 2 минуты','Круговые движения плечами','Наклоны и повороты корпуса','Приседания без веса в комфортной амплитуде'] },
  { id:'cooldown', name:'Заминка и растяжка', group:'Служебное', about:'3 минуты: спокойная растяжка ног, спины, груди и плеч.', how:['Наклон к ногам — 30 с','Растяжка квадрицепса — по 20 с','Растяжка груди у стены — 30 с','Дыхание восстанавливаем'] }
];

const THEORY = [

  { id:'rest', title:'Отдых и интенсивность', text:'Между подходами отдыхай 60–90 секунд.\n\nНе нужно работать до полного мышечного отказа: заканчивай подход, когда чувствуешь, что смог бы выполнить ещё 2–3 повторения с правильной техникой.' },
  { id:'progress', title:'Как расти дальше', text:'Главное для роста мышц — постепенное увеличение нагрузки.\n\nКогда 15 повторений становятся лёгкими, сначала добавляй повторения или подход, а затем увеличивай сопротивление. Бесконечно увеличивать число повторений с гантелями по 3 кг неэффективно.\n\nДля ягодиц 3-килограммовые гантели довольно быстро станут лёгкими — тогда можно увеличить сопротивление, например с помощью эластичной ленты.' },
  { id:'shoulder', title:'Левое плечо: важное ограничение', text:'Если жим или отжимания усиливают боль в левом плече либо вызывают отдачу в кисть, прекращай именно это упражнение.\n\nПока сохраняется боль с иррадиацией в кисть, упражнения для плечевого пояса выполняй только в безболезненном диапазоне. Если даже без веса симптомы усиливаются, эту часть тренировки следует отложить.' },
  { id:'muscles', title:'Особенности групп мышц', text:'Руки: тренируй и бицепс, и трицепс — трицепс составляет значительную часть мышечной массы плеча.\n\nГрудь: жим и отжимания укрепляют грудные мышцы, но не позволяют избирательно убрать жир или изменить свойства кожи.\n\nСпина: тяги полезны, однако их пока нужно выполнять осторожно из-за симптомов в левой руке.\n\nЯгодицы: приседания, мостик и румынская тяга дают хорошую основу.' },

];

/* ---------- состояние ---------- */
const APP_VER = '1.2.0';   // поднимать вместе с ?v= в CSS и в статических <img>
const AV = '?v=' + APP_VER;
const STORE_KEY = 'taichi_v1';
function state(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ return {}; }
}
function save(patch){
  const s = Object.assign(state(), patch);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
  return s;
}
function historyList(){ return state().history || []; }
function settings(){
  return Object.assign({ days:[1,3,5], time:'19:00', bodyweight:'', weight:'10' }, state().settings || {});
}
function weekStart(){
  const d = new Date(); const day = (d.getDay() + 6) % 7;
  const s = new Date(d); s.setHours(0,0,0,0); s.setDate(d.getDate() - day);
  return s.getTime();
}
function doneSet(){ return new Set(historyList().filter(h => h.at >= weekStart()).map(h => h.n)); }
function currentWorkout(){
  const done = doneSet();
  return PROGRAM.workouts.find(w => !done.has(w.n)) || null;
}
function programPercent(){ return Math.min(100, Math.round(historyList().length / 12 * 100)); }
function cycleWeek(){
  const h = historyList();
  if (!h.length) return 1;
  return Math.floor((Date.now() - h[0].at) / (7*86400000)) + 1;
}
function ex(id){ return EXERCISES.find(e => e.id === id) || { id, name:id, group:'', about:'', how:[] }; }
function exImg(e){ return 'assets/exercises/' + e.id + '.gif' + AV; }
function exThumb(e){ return 'assets/exercises/' + e.id + '-thumb.webp' + AV; }
function setsNow(){ return cycleWeek() <= 2 ? 1 : 2; }
function isMob(){ return window.innerWidth <= 720; }

/* ---------- маршрут: координаты из ASSET-MAP.md ---------- */
const MAP_DESK = {
  w:660, h:400, sizes:{ complete:80, current:116, next:84 },
  pts:[{x:35,y:41,lx:80},{x:290,y:205,lx:352},{x:437,y:359,lx:495}]
};
const MAP_MOB = {
  w:300, h:405, sizes:{ complete:56, current:84, next:56 },
  pts:[{x:70,y:32,lx:103},{x:78,y:178,lx:126},{x:71,y:363,lx:117}],
  btn:{ x:56, y:226, w:238, h:44 }
};

function pct(v, total){ return (v / total * 100).toFixed(3) + '%'; }

function routeState(w, done, cur){
  if (done.has(w.n)) return 'complete';
  if (cur && cur.n === w.n) return 'current';
  return 'next';
}

function routeHtml(selected){
  const g = isMob() ? MAP_MOB : MAP_DESK;
  const done = doneSet(), cur = currentWorkout();
  const s = state();
  const parts = PROGRAM.workouts.map((w, i) => {
    const p = g.pts[i] || g.pts[g.pts.length - 1];
    const st = routeState(w, done, cur);
    const size = g.sizes[st];
    const sel = selected === w.n ? ' sel' : '';
    const isCur = st === 'current' ? ' aria-current="step"' : '';
    const stName = st === 'complete' ? 'Пройдено' : (st === 'current' ? 'Текущее занятие' : 'Следующее занятие');
    return `<button class="mk${sel}" data-open="${w.n}"${isCur}
        aria-label="${esc(w.block)}: ${esc(w.title)}, ${w.minutes} минут, ${stName.toLowerCase()}"
        style="left:${pct(p.x, g.w)};top:${pct(p.y, g.h)};width:${pct(size, g.w)}">
        <img src="assets/icons/route-${st}.png${AV}" alt="" width="${size}" height="${size}"></button>
      <span class="cap" style="left:${pct(p.lx, g.w)};top:${pct(p.y, g.h)}">
        <b>${esc(w.title)}</b><i>${stName}</i></span>`;
  }).join('');
  const btn = (isMob() && cur)
    ? `<button class="map-start" data-start="${cur.n}">${s.running ? 'Продолжить тренировку' : 'Начать тренировку'}</button>`
    : '';
  return `<div class="map">${parts}${btn}</div>`;
}

function achievementsHtml(hist){
  const total = hist.length;
  const badges = [
    { at:1,  text:'Первое занятие' },
    { at:3,  text:'Три занятия' },
    { at:6,  text:'Половина программы' },
    { at:12, text:'Программа пройдена' }
  ];
  return `<div class="panel-list">${badges.map(b => `<div class="item" style="cursor:default">
    <span class="pill ${total >= b.at ? '' : 'next'}">${total >= b.at ? '✓' : '—'}</span>
    <span style="flex:1"><span class="name">${b.text}</span></span></div>`).join('')}</div>`;
}

function calcStreak(hist){
  if (!hist.length) return 0;
  const weeks = new Set(hist.map(h => {
    const d = new Date(h.at); const onejan = new Date(d.getFullYear(), 0, 1);
    return d.getFullYear() + '-' + Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  }));
  return weeks.size;
}

/* ---------- тренировка ---------- */
let timerId = null;
function fmt(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function paramLabel(reps){ return /мин|сек/.test(reps) ? 'Время' : 'Повторения'; }

function stepsHtml(w, idx){
  const items = w.plan.map((f, i) => {
    const e = ex(f.ex);
    const cls = i < idx ? 'done' : (i === idx ? 'cur' : 'next');
    const icon = i < idx ? 'route-complete.png' : (i === idx ? 'route-current.png' : 'route-next.png');
    return `<li class="step ${cls}"><span class="dot"><img src="assets/icons/${icon}${AV}" alt=""></span>
      <span class="t">${esc(e.name)}<em>${f.sets} × ${esc(f.reps)}</em></span></li>`;
  }).join('');
  return `<ol class="steps">${items}</ol>`;
}

function fragPanel(w, idx){
  const cur = state().running || {};
  const frag = w.plan[idx];
  const e = ex(frag.ex);
  const paused = !!cur.paused;
  const left = cur.left != null ? cur.left : (frag.rest || 0);
  const last = idx === w.plan.length - 1;
  return `<div class="frag">
    <h2>${esc(e.name)}</h2>
    <span class="pill">${esc(e.group)}</span>
    <p style="margin:12px 0 0">${esc(e.about)}</p>
    <div class="fields">
      <div class="f"><span>Подход</span><b>${frag.sets}</b></div>
      <div class="f"><span>${paramLabel(frag.reps)}</span><b>${esc(frag.reps)}</b></div>
      ${frag.rest ? `<div class="f"><span>Таймер</span><b class="timer" id="timer">${fmt(left)}</b></div>` : ''}
    </div>
    ${paused ? `<div class="pause"><b>Пауза</b><p class="small">Позиция в занятии сохранена — можно продолжить или выйти.</p></div>` : ''}
    <div class="controls">
      ${paused
        ? `<button class="btn" id="resumeBtn">Продолжить</button><button class="btn ghost" data-exit="1">Выйти</button>`
        : `${frag.rest ? `<button class="btn" id="timerBtn">${cur.runningTimer ? 'Пауза' : 'Запустить'}</button>` : ''}<button class="btn ghost" id="pauseBtn">Пауза</button>`}
      <button class="btn" id="nextBtn">${last ? 'Завершить занятие' : 'Далее'}</button>
    </div>
    <h3 style="margin-top:18px">Техника</h3>
    <ol class="tech">${(e.how || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>
  </div>`;
}

function renderWorkout(v){
  const s = state();
  const cur = s.running || null;
  if (!cur) {
    const w = currentWorkout();
    if (!w) { v.innerHTML = head('Тренировка','Программа пройдена') + '<div class="empty">Все занятия завершены.</div>'; return; }
    startWorkout(w.n);
    return;
  }
  const w = PROGRAM.workouts.find(x => x.n === cur.n);
  if (!w) { save({ running:null }); VIEW = 'home'; render(); return; }
  const idx = Math.min(cur.idx || 0, w.plan.length - 1);
  const last = idx === w.plan.length - 1;

  if (isMob()) {
    v.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin:10px 0 4px">
        <button class="btn ghost" data-exit="1">←</button>
        <div><div style="font-weight:600">Тренировка</div><div class="small">${esc(w.title)} · ${idx+1} из ${w.plan.length}</div></div>
      </div>
      <section class="card" style="margin-top:12px">
        ${stepsHtml(w, idx)}
        <div style="margin:16px 0 0 -8px">${fragPanel(w, idx)}</div>
      </section>`;
  } else {
    v.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;margin:26px 0 0">
        <button class="btn ghost" data-exit="1" style="padding:8px 12px">←</button>
        <h1 style="margin:0">Тренировка</h1>
      </div>
      <p class="sub" style="margin:6px 0 18px">${esc(w.title)} · неделя ${cycleWeek()} · подходов ${setsNow()} · занятие ${w.n}, фрагмент ${idx+1} из ${w.plan.length}</p>
      <div class="workout">
        <section class="card"><h2>Порядок</h2>${stepsHtml(w, idx)}</section>
        <section class="card">${fragPanel(w, idx)}</section>
      </div>`;
  }
  wireWorkout(w, idx);
  renderWorkbar(w, idx, last);
}

function renderWorkbar(w, idx, last){
  const bar = document.getElementById('workbar');
  if (!bar) return;
  if (document.body.classList.contains('in-workout')) {
    bar.innerHTML = `<button class="btn" id="wbNext">${last ? 'Завершить занятие' : 'Далее'}</button>`;
    const nb = document.getElementById('wbNext');
    if (nb) nb.onclick = () => nextFrag(w, idx, last);
  } else bar.innerHTML = '';
}

function nextFrag(w, idx, last){
  stopTimer();
  if (last) { finishWorkout(w); return; }
  save({ running: Object.assign({}, state().running, { idx: idx + 1, left: w.plan[idx+1].rest || 0, runningTimer:false, paused:false }) });
  renderWorkout(document.getElementById('view'));
  renderWorkbar(w, idx + 1, idx + 1 === w.plan.length - 1);
}

function wireWorkout(w, idx){
  const get = () => state().running;
  const set = (patch) => save({ running: Object.assign({}, get(), patch) });
  const btn = document.getElementById('timerBtn');
  if (btn) btn.onclick = () => {
    const r = get();
    if (r.runningTimer) { stopTimer(); set({ runningTimer:false, paused:true }); }
    else { startTimer(); set({ runningTimer:true, paused:false }); }
    renderWorkout(document.getElementById('view'));
  };
  const pb = document.getElementById('pauseBtn');
  if (pb) pb.onclick = () => {
    stopTimer();
    set({ paused:true, runningTimer:false });
    renderWorkout(document.getElementById('view'));
  };
  const rb = document.getElementById('resumeBtn');
  if (rb) rb.onclick = () => {
    set({ paused:false });
    if (w.plan[idx].rest) startTimer();
    renderWorkout(document.getElementById('view'));
  };
  const nb = document.getElementById('nextBtn');
  if (nb) nb.onclick = () => nextFrag(w, idx, idx === w.plan.length - 1);
}

function writeTimer(v){
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(Math.max(0, v || 0));
}
function startTimer(){
  stopTimer();
  timerId = setInterval(() => {
    const r = state().running; if (!r) { stopTimer(); return; }
    const left = Math.max(0, (r.left || 0) - 1);
    save({ running: Object.assign({}, r, { left }) });
    writeTimer(left);
    if (left === 0) {
      stopTimer();
      const rr = state().running;
      if (rr) save({ running: Object.assign({}, rr, { runningTimer:false }) });
    }
  }, 1000);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

function startWorkout(n){
  const w = PROGRAM.workouts.find(x => x.n === n);
  if (!w) return;
  save({ running: { n, idx:0, startedAt: Date.now(), left: w.plan[0].rest || 0, runningTimer:false, paused:false } });
  VIEW = 'workout';
  render();
}

function finishWorkout(w){
  stopTimer();
  const r = state().running || {};
  const min = Math.max(1, Math.round((Date.now() - (r.startedAt || Date.now())) / 60000));
  const hist = historyList().filter(h => h.n !== w.n);
  hist.push({ n: w.n, title: w.title, at: Date.now(), min });
  save({ history: hist, running: null });
  DONE = { n: w.n, title: w.title, min };
  VIEW = 'done';
  render();
}

let DONE = null;
function renderDone(v){
  const d = DONE || { n: '', title: '', min: 0 };
  v.innerHTML = `
    ${head('Занятие завершено', `${d.n ? 'Занятие ' + d.n + ' · ' : ''}${esc(d.title)}`)}
    <div class="card done-card">
      <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
        <div><b>${d.min}</b><span>минут</span></div>
        <div><b>${historyList().length}</b><span>всего занятий</span></div>
        <div><b>${programPercent()}%</b><span>программы</span></div>
      </div>
      <div class="controls">
        <button class="btn" data-go="progress">Перейти в прогресс</button>
        <button class="btn ghost" data-go="home">На главную</button>
      </div>
    </div>`;
}

/* ---------- мелочи ---------- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short' }) + ', ' +
         d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- навигация ---------- */
const NAV = [
  ['home','Главная','nav-home.png'], ['program','Программа','nav-program.png'],
  ['exercises','Упражнения','nav-exercises.png'], ['workout','Тренировка','nav-workout.png'],
  ['theory','Теория','nav-theory.png'], ['progress','Прогресс','nav-progress.png'],
  ['settings','Настройки','nav-settings.png']
];
document.getElementById('nav').innerHTML = NAV.map(([go,t,ic]) =>
  `<button data-go="${go}"><img src="assets/icons/${ic}${AV}" alt="">${t}</button>`).join('');
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => {
  VIEW = b.dataset.tab; render();
});

document.addEventListener('click', (e) => {
  const exit = e.target.closest('[data-exit]');
  if (exit) {
    stopTimer();
    const r = state().running;
    if (r) save({ running: Object.assign({}, r, { paused:true, runningTimer:false }) });
    VIEW = 'home'; render(); return;
  }
  const t = e.target.closest('[data-go],[data-open],[data-start],[data-ex],[data-theory],[data-day]');
  if (!t) return;
  if (t.dataset.open) { showWorkoutInfo(Number(t.dataset.open)); return; }
  if (t.dataset.start) { startWorkout(Number(t.dataset.start)); return; }
  if (t.dataset.ex) {
    if (isMob()) { VIEW = 'exercise'; EX_OPEN = t.dataset.ex; renderExerciseCard(document.getElementById('view'), t.dataset.ex); paintNav(); }
    else renderExercises(document.getElementById('view'), t.dataset.ex);
    return;
  }
  if (t.dataset.theory) { save({ theoryOpen: t.dataset.theory }); VIEW = 'theory'; render(); return; }
  if (t.dataset.day) {
    const st = settings();
    const d = Number(t.dataset.day);
    const days = st.days.includes(d) ? st.days.filter(x => x !== d) : st.days.concat([d]).sort();
    save({ settings: Object.assign({}, st, { days }) });
    renderSettings(document.getElementById('view'));
    return;
  }
  const go = t.dataset.go;
  if (go) { VIEW = go; render(); }
});
let EX_OPEN = null;

function showWorkoutInfo(n){
  const w = PROGRAM.workouts.find(x => x.n === n);
  if (!w) return;
  const done = doneSet();
  const v = document.getElementById('view');
  v.innerHTML = `
    ${head(`Занятие ${w.n}`, `${esc(w.title)} · ${esc(w.focus)}`)}
    <div class="cols">
      <section class="card">
        <h2>Состав</h2>
        <div class="panel-list">${w.plan.map((f,i) => {
          const e = ex(f.ex);
          return `<div class="item" style="cursor:default"><span class="pill">${i+1}</span>
            <span style="flex:1"><span class="name" style="display:block">${esc(e.name)}</span>
            <span class="meta">${f.sets} × ${esc(f.reps)}${f.rest ? ' · отдых ' + f.rest + ' с' : ''}</span></span></div>`;
        }).join('')}</div>
      </section>
      <aside class="card">
        <img class="ill" src="assets/illustrations/exercise-card-relief.png${AV}" alt="Рельеф занятия" width="260" height="180" />
        <h3 style="margin-top:12px">${w.minutes} минут</h3>
        <p class="small">${done.has(w.n) ? 'Это занятие уже пройдено. Можно пройти снова — в истории останется последняя запись.' : 'Занятие ещё не пройдено.'}</p>
        <div class="controls">
          <button class="btn" data-start="${w.n}">${done.has(w.n) ? 'Пройти снова' : 'Начать тренировку'}</button>
          <button class="btn ghost" data-go="program">К программе</button>
        </div>
      </aside>
    </div>`;
  paintNav();
}

/* поиск упражнений */
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'exSearch') {
    save({ exSearch: e.target.value });
    const sel = document.querySelector('.item.on[data-ex]');
    const pos = e.target.selectionStart;
    if (isMob()) renderExercises(document.getElementById('view'), null);
    else renderExercises(document.getElementById('view'), sel ? sel.dataset.ex : null);
    const inp = document.getElementById('exSearch');
    if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch(err){} }
  }
});

/* сохранение настроек */
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'setSave') {
    const st = settings();
    st.time = document.getElementById('setTime').value || st.time;
    st.bodyweight = document.getElementById('setBW').value;
    st.weight = document.getElementById('setW').value;
    save({ settings: st });
    e.target.textContent = 'Сохранено';
    setTimeout(() => { e.target.textContent = 'Сохранить'; }, 1400);
  }
});

/* перерисовка при смене ширины (маршрут: компьютер / телефон) */
let rt = null;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (!document.body.classList.contains('in-workout')) render(); }, 220);
});

render();
</script>
</body>
</html>
