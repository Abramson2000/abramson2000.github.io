<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My wave</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/pwa/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="assets/pwa/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/pwa/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/pwa/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--menu:#E4F5FE;--active:#D5EFFB;--ink:#123F66;--muted:#5B7E97;--btn:#087DA0;--line:#BFE3F5;--card:#FBFDFF}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  color:var(--ink);background:#EAF7FD url('assets/bg.jpg') center/cover fixed no-repeat;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:rgba(255,255,255,.22);z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:280px;flex:none;background:var(--menu);padding:18px 14px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--line);box-shadow:0 0 40px rgba(18,63,102,.06)}
.logo{display:block;width:100%;max-width:232px;height:auto;margin:2px auto 18px}
.mi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit}
.mi:hover{background:#eef9ff}
.mi.on{background:var(--active)}
.mi .ic{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.mi .ic img{width:28px;height:28px;object-fit:contain;display:block}
.mi b{display:block;font-size:16px;line-height:1.25;font-weight:700}
.mi small{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
main{flex:1;min-width:0;padding:32px 36px 56px;max-width:1320px;margin:0 auto}
h1{font-size:28px;margin-bottom:6px}
.sub{color:var(--muted);font-size:15px;margin-bottom:20px}
.week{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 18px rgba(18,63,102,.06)}
.c-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.c-time{font-weight:700;color:var(--btn);font-size:15px}
.card h3{font-size:17px;margin-bottom:8px;font-weight:700}
.c-meta{font-size:14px;opacity:.85}
.chip{display:inline-block;margin-top:12px;font-size:12.5px;background:var(--active);color:#0A5E7A;padding:4px 10px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 18px;height:76px;display:flex;justify-content:space-between;gap:16px;align-items:center;cursor:pointer;max-width:720px}
.player{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:10px 12px;background:#F2FAFF;border:1px solid var(--line);border-radius:12px}
.pbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:15px;cursor:pointer;flex:none}
.ptime{font-size:12.5px;color:var(--muted);min-width:86px;text-align:right}
#seek{flex:1;accent-color:#087DA0}
#prate{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink);font:inherit;font-size:12.5px}
.w{ display:grid; grid-template-columns:1fr 1fr 1.1fr auto; gap:8px; padding:12px 0;
  border-bottom:1px solid #EAF4FB; align-items:baseline; border-radius:12px; min-width:0; }
.w:last-child{ border-bottom:0; }
.w > *{ min-width:0; overflow-wrap:anywhere; }
.w .zh{ font-size:20.5px; }
.word-ex{ grid-column:1 / -1; color:#5B7E97; font-size:13px; }
.w-add{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:#fff;
  color:var(--btn); font-size:15px; font-weight:700; cursor:pointer; flex:none; line-height:1; }
.w-add.indict{ color:#15803D; border-color:#BFE3C9; background:#DDF3E6; }
.card{ overflow-x:hidden; }
width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--btn);font-size:18px;line-height:1;cursor:pointer;flex:none}
.addw.on{background:var(--active);border-color:var(--btn);color:#0A5E7A}
.row:hover{background:#f6fcff}
.w{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eaf4fb;font-size:16px}
.w:last-child{border-bottom:0}
.w .zh{font-size:19px;font-weight:600;min-width:96px}
.w .py{color:var(--btn);min-width:110px}
.w .ru{color:var(--ink);opacity:.85}
.back{background:none;border:0;color:var(--btn);font:inherit;cursor:pointer;margin-bottom:12px}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted)}
.mob{display:none}
@media (max-width:899px){
  .wrap{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;z-index:30;overflow-y:auto}
  .side.open{transform:none}
  .mob{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--menu);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mob button{background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer}
  main{padding:18px 16px 40px}
  .grid{grid-template-columns:1fr}
}

/* Плеер — как в Тингли */
:root{ --surf:#fff; --ink2:#123F66; }
.player{ position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); display:none; flex-direction:column; align-items:center; gap:8px; z-index:70; pointer-events:none; padding:0 12px; }
.player.show{ display:flex; }
.p-seek{ display:flex; align-items:center; gap:8px; pointer-events:auto; width:min(680px,94vw); background:rgba(18,63,102,.86); border-radius:999px; padding:6px 14px; box-shadow:0 6px 20px rgba(18,63,102,.28); }
.p-time{ font-size:11.5px; line-height:1; color:#fff; opacity:.85; min-width:34px; text-align:center; }
.p-seek input[type=range]{ -webkit-appearance:none; appearance:none; flex:1; height:34px; background:transparent; }
.p-seek input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:3px; background:rgba(255,255,255,.3); }
.p-seek input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; margin-top:-5.5px; }
.p-seek input[type=range]::-moz-range-track{ height:3px; border-radius:3px; background:rgba(255,255,255,.3); }
.p-seek input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:#fff; }
.p-bar{ display:flex; align-items:center; gap:12px; pointer-events:auto; }
.pp-btn{ width:66px; height:66px; border-radius:50%; background:#123F66; color:#fff; border:none; cursor:pointer; flex-shrink:0; box-shadow:0 4px 14px rgba(18,63,102,.28); display:flex; align-items:center; justify-content:center; transition:transform .12s ease; }
.pp-btn:active{ transform:scale(.93); }
.pp-btn svg{ width:28px; height:28px; display:block; }
.skip-btn{ width:50px; height:50px; border-radius:50%; background:#123F66; border:none; color:#fff; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(18,63,102,.24); transition:transform .12s ease; }
.skip-btn:active{ transform:scale(.92); }
.skip-btn svg{ width:24px; height:24px; display:block; }
.spd-wrap{ position:relative; width:50px; height:50px; flex-shrink:0; }
.spd-face{ position:absolute; inset:0; border-radius:50%; background:#123F66; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; box-shadow:0 3px 10px rgba(18,63,102,.24); }
.spd-wrap select{ position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; cursor:pointer; font-size:16px; }
.loop-btn{ width:50px; height:50px; border-radius:50%; background:#123F66; border:none; cursor:pointer; flex-shrink:0; color:rgba(255,255,255,.75); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(18,63,102,.24); transition:transform .12s ease, background .12s ease; }
.loop-btn.on{ color:#0A5E7A; background:#D5EFFB; }
.loop-btn svg{ width:22px; height:22px; display:block; }

/* 0.8.0 — как в Тингли: узкая колонка по центру, блоки выше */
@media (min-width: 1024px){
  /* как в Тингли: колонка центрируется по окну, а не по остатку после меню */
  main{ width:720px; max-width:720px; margin-left:max(0px, calc((100vw - 280px - 720px)/2)); margin-right:0; padding:20px 16px 120px; }
  .row{ height:84px; }
  .card{ padding:22px; }
  h1{ font-size:26px; }
  .grid{ max-width:720px; }
}
@media (min-width: 1500px){
  main{ max-width:720px; }
}

/* 0.8.2 — китайский текст печатным шрифтом (SimSun и близкие) */
.zh, .w .zh, .zh-phrase, .cn, .zh-text {
  font-family: "SimSun", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PingFang SC", serif !important;
}
.zh-phrase { font-size:17px; }

/* 0.13.0 — расписание и оплаты по образцу Тингли, в цветах Волны */
.crs-seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
.crs-seg button{border:0;background:none;font:inherit;font-size:13.5px;padding:8px 18px;border-radius:999px;color:var(--muted);cursor:pointer}
.crs-seg button.on{background:linear-gradient(135deg,#087DA0,#12A6C6);color:#fff;box-shadow:0 6px 16px rgba(8,125,160,.28)}
.crs-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:14px;box-shadow:0 6px 18px rgba(18,63,102,.06)}
.crs-nb{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--btn);font-size:17px;line-height:1;cursor:pointer;flex:none}
.crs-range{flex:1;min-width:0;text-align:center}
.crs-range b{display:block;font-size:14.5px;color:var(--ink)}
.crs-range span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.crs-today{border:1px solid var(--line);background:linear-gradient(135deg,#EAF8FE,#D5EFFB);color:#0A5E7A;font:inherit;font-size:12.5px;font-weight:650;padding:9px 12px;border-radius:12px;cursor:pointer;flex:none}
.crs-col{background:transparent;border:0;box-shadow:none;padding:0}
.crs-col-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 2px 6px}
.crs-day-h{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--btn);margin:14px 2px 8px;text-transform:uppercase}
.crs-day.today .crs-day-h{color:#0A5E7A}
.crs-card{background:linear-gradient(180deg,#FFFFFF 0%,#F3FBFF 100%);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 6px 16px rgba(18,63,102,.07)}
.crs-card-top{display:flex;align-items:flex-start;gap:12px}
.crs-c-time{font-weight:800;color:var(--btn);font-size:15.5px;min-width:50px}
.crs-c-tag{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink)}
.crs-c-tag span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.crs-mat{margin-top:8px;font-size:12.5px;color:var(--muted)}
.crs-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.crs-chip{font-size:11.5px;background:linear-gradient(135deg,#EAF8FE,#D5EFFB);color:#0A5E7A;padding:4px 10px;border-radius:999px}
.crs-add-big{width:100%;margin-top:8px;padding:13px;border-radius:14px;border:1px dashed #9FD6EA;background:rgba(255,255,255,.65);color:var(--btn);font:inherit;font-weight:700;cursor:pointer}
.crs-pay-course-list{display:grid;gap:6px;margin-bottom:10px}
.crs-pay-course{display:flex;align-items:stretch;background:linear-gradient(180deg,#FFFFFF,#F5FBFF);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 1px 2px rgba(18,63,102,.05)}
.crs-pay-course-main{flex:1;min-width:0;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:9px 10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.crs-pay-course-main>i{font-style:normal;font-size:20px;color:#8FB3C7;line-height:1;flex:0 0 auto}
.crs-pay-course-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.crs-pay-course-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.crs-pay-course-name{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crs-pay-course-sum{font-size:13px;font-weight:800;white-space:nowrap;color:#0A5E7A}
.crs-pay-course-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crs-pay-course-add{flex:0 0 38px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--btn);font:700 21px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;cursor:pointer}
.crs-pay-filter{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 10px 10px;margin:4px 0 14px;box-shadow:0 6px 18px rgba(18,63,102,.05)}
.crs-f-col{flex:1;min-width:0}
.crs-lbl{font-size:11px;font-weight:800;letter-spacing:.035em;color:var(--ink);margin:0 0 6px;text-transform:uppercase}
.crs-pay-filter select{width:100%;box-sizing:border-box;border:1px solid rgba(18,63,102,.14);border-radius:12px;padding:7px 9px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
.crs-pay-period{display:flex;align-items:center;gap:6px}
.crs-pay-period b{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crs-pay-period .crs-b.s{padding:5px 8px;font-size:12px}
.crs-pay-card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(18,63,102,.06)}
.crs-pay-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.crs-pay-head b{font-size:11px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
.crs-b{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#087DA0,#12A6C6);color:#fff;box-shadow:0 6px 16px rgba(8,125,160,.25)}
.crs-b.s{padding:7px 11px;font-size:12.5px;background:#fff;color:var(--btn);border:1px solid var(--line);box-shadow:none}
.crs-pay-total{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:0 0 8px;padding:0}
.crs-pay-total>div{display:block;padding:8px 7px;border-right:1px solid var(--line)}
.crs-pay-total>div:last-child{border-right:0}
.crs-pay-total span{display:block;font-size:10.5px;color:var(--muted)}
.crs-pay-total b{display:block;margin-top:3px;text-align:left;font-size:13px;color:var(--ink)}
.crs-pay-row.done{opacity:.62}
.crs-pay-row{border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:6px;background:linear-gradient(180deg,#FFFFFF,#F7FCFF)}
.crs-pay-row-top{display:flex;align-items:flex-start;gap:10px}
.crs-pay-row-info{flex:1;min-width:0}
.crs-pay-row-info b{display:block;font-size:13.5px}
.crs-pay-row-info span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.crs-pay-row-top strong{font-size:14px;color:#0A5E7A;white-space:nowrap}
.crs-used{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.crs-step{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
.crs-step button{width:28px;height:27px;border:0;background:none;color:var(--btn);font-size:15px;font-weight:700;cursor:pointer;line-height:1}
.crs-step input{width:40px;border:0;background:none;text-align:center;font:inherit;font-size:13px;color:var(--ink)}
.crs-left{margin-left:auto}
.crs-form{background:linear-gradient(180deg,#FFFFFF,#EFF9FF);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}
.crs-form label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.crs-form input,.crs-form select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);font:inherit;font-size:13.5px}
.crs-form .row2{display:flex;gap:8px}
.crs-form .row2>div{flex:1;min-width:0}

.crs-card{cursor:pointer}
.crs-card.off{opacity:.62}
.crs-card.off .crs-mat{background:#EEF2F5;color:#7C8FA0}
.crs-chip.off{background:#FDE8E8;color:#B03A2E}
.mwmodal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.mwmodal-card{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:16px;box-sizing:border-box}
@media (min-width:720px){.mwmodal{align-items:center}.mwmodal-card{border-radius:18px;max-height:88vh}}
@media (max-width:899px){.mwmodal-card{max-height:100dvh;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
 .mwbtn-row{position:sticky;bottom:0;z-index:3;background:#fff;padding-bottom:6px}}
.mwmodal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mwmodal-head h2{margin:0;font-size:18px;color:var(--ink);font-weight:800}
.crs-note{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.mwsub{font-size:13.5px;color:var(--muted);margin:-6px 0 14px}
.mwicon{border:none;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px;line-height:1}
.mwfield{margin-bottom:12px}
.mwfield label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.mwfield input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.mwfield input[type=date],.mwfield input[type=time]{max-width:190px}
.mwfield input:focus{outline:2px solid var(--btn);border-color:transparent}
.mwrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mwbtn{width:100%;padding:13px;border:none;border-radius:11px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#087DA0,#12A6C6);color:#fff;cursor:pointer;font-family:inherit}
.mwbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.mwbtn.danger-ghost{background:transparent;color:#B03A2E;border:1px solid currentColor;font-weight:600;font-size:14px;padding:10px}
.mwbtn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.crs-period{display:flex;gap:6px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.crs-period-b{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.crs-period-b.on{background:linear-gradient(135deg,#087DA0,#12A6C6);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(8,125,160,.22)}
.crs-period-nav{margin-left:auto;display:flex;gap:6px}
.crs-err{background:#FDE8E8;color:#B03A2E;border:1px solid #F3C9C9;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin:0 0 12px}

/* 0.22.0 — «+» в словах по правому краю; верхняя полоска на телефоне убрана */
.w .w-add{justify-self:end;margin-left:auto}
@media (min-width:1024px){
  .w{grid-template-columns:1fr 1fr 1.1fr 34px}
}
@media (max-width:899px){ .mob{display:none} }

/* 0.23.0 — шрифт как в Тингли, «+» справа, плеер без полосы, дата в оплате, расписание без общей плашки */

const LCONT={"1": {"texts": [{"t": "课文 1 · В офисе колледжа", "ru": "Бай Цзяюэ и Чэнь Тяньчжун оформляют поступление.", "lines": [["老师", "你们好，欢迎来到中国留学！请把护照、签证和入学通知书给我。", "Здравствуйте, добро пожаловать учиться в Китае! Дайте мне, пожалуйста, паспорта, визы и уведомления о зачислении."], ["白家月", "好的。这是我们的证件和材料。", "Хорошо. Вот наши документы и материалы."], ["老师", "办好了，这是你们的学生证，下周一开始上课。先试听两周，然后在网上选课。", "Готово, вот ваши студенческие билеты, занятия начинаются со следующего понедельника. Сначала две недели пробных занятий, потом выбираете курсы онлайн."], ["陈天中", "谢谢老师。", "Спасибо, учитель."], ["老师", "不客气，你们以后有任何问题都可以来找我。", "Не за что, если у вас будут любые вопросы — приходите."]]}, {"t": "课文 2 · В кампусе", "ru": "Бай Цзяюэ и Чэнь Тяньчжун гуляют по университету.", "lines": [["陈天中", "你看，咱们的校园真大！有图书馆、体育馆、超市，还有好几个食堂。", "Смотри, какой большой у нас кампус! Есть библиотека, спортзал, супермаркет и несколько столовых."], ["白家月", "是啊，我觉得学校就像一座小城市，什么都有，方便极了。", "Да, по-моему, университет как маленький город: всё есть, очень удобно."], ["陈天中", "刚才老师说，咱们可以申请奖学金，你了解过吗？", "Учитель только что сказал, что мы можем подать на стипендию. Ты узнавала?"], ["白家月", "我听说过一点儿，好像成绩好、表现好的学生都有机会获得奖学金。", "Немного слышала: вроде бы у студентов с хорошими оценками и успехами есть шанс получить стипендию."], ["陈天中", "那太好了，要是申请到奖学金，就能减轻不少经济压力。", "Это отлично: если получим стипендию, заметно снизится финансовая нагрузка."], ["白家月", "没错，我们一起加油吧！", "Точно, давай вместе стараться!"]]}, {"t": "课文 3 · Иностранные студенты в китайских вузах", "ru": "Текст для чтения.", "paras": [["随着中国的发展，越来越多的外国学生来到中国的大学学习。他们可以先上一年的中文课程，然后根据自己的兴趣和需要选择专业。", "С развитием Китая всё больше иностранных студентов приезжает учиться в китайские вузы. Сначала они могут год изучать китайский, а затем выбрать специальность по своим интересам и потребностям."], ["除了读本科课程，他们还可以申请读硕士研究生或者博士研究生。在大学里，外国学生可以和中国学生一起学习、做研究、参加校园活动。通过这些交流，外国学生能更快地适应中国的大学生活。", "Кроме бакалавриата, они могут подать на магистратуру или докторантуру. В университете иностранные студенты учатся вместе с китайскими, занимаются исследованиями, участвуют в кампусных мероприятиях. Благодаря такому общению они быстрее адаптируются к студенческой жизни в Китае."]]}, {"t": "课文 4 · Выбор специальности и карьера", "ru": "Текст для чтения.", "paras": [["很多外国学生来中国学习以前，就已经想好了自己的发展方向。有人对经济感兴趣，希望将来在国际公司工作；有人喜欢学医，打算回国后当一名医生；还有人对教育有热情，想要成为一名教师。", "Многие иностранные студенты ещё до приезда в Китай определили направление развития. Кто-то интересуется экономикой и хочет работать в международной компании; кто-то любит медицину и планирует стать врачом на родине; а кто-то увлечён образованием и хочет стать учителем."], ["陈天中想选择跟经济有关的专业，希望通过学习，了解更多国际贸易方面的知识。安妮以后想做一名中文老师，所以要选择国际中文教育专业。对他们来说，来到中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作和生活做准备。", "Чэнь Тяньчжун хочет выбрать специальность, связанную с экономикой, чтобы больше узнать о международной торговле. Аньни хочет стать преподавателем китайского, поэтому выбирает специальность «международное преподавание китайского языка». Для них учёба в Китае — с одной стороны, язык и знания, с другой — подготовка к будущей работе и жизни."]]}], "gram": [{"p": "任何", "ru": "«любой, всякий». Определяет существительное обычно без 的, в предложении часто с 都 или 也.", "ex": [["你们以后有任何问题都可以来找我。", "Если будут любые вопросы — приходите ко мне."], ["明天我们8点出发，任何人也不能迟到。", "Завтра выезжаем в 8, никто не может опаздывать."], ["学校有任何通知，我都会第一时间告诉你。", "О любом объявлении школы я сразу тебе сообщу."]], "py": "rèn hé"}, {"p": "要是……，就……", "ru": "Условное предложение: в первой части условие, во второй — результат.", "ex": [["要是申请到奖学金，就能减轻不少经济压力。", "Если получим стипендию, финансовая нагрузка заметно снизится."], ["你要是明天有时间，就跟我一起去爬山吧。", "Если завтра есть время, пойдём со мной в горы."], ["要是她不愿意参加比赛，我们就再问问别人。", "Если она не хочет участвовать в соревновании, спросим кого-то ещё."]], "py": "yào shì  jiù "}, {"p": "随着", "ru": "Предлог «по мере, вместе с»: после него — то, что меняется; одно служит условием другого.", "ex": [["随着中国的发展，越来越多的外国学生来到中国的大学学习。", "С развитием Китая всё больше иностранных студентов приезжает учиться в китайские вузы."], ["随着中文水平的提高，我现在能看懂中文报纸了。", "По мере роста уровня китайского я теперь могу читать газеты."], ["随着小区的环境越来越好，来这里买房子的人也变多了。", "По мере того как район становится лучше, покупателей квартир здесь всё больше."]], "py": "suí zhe"}, {"p": "一方面……，另一方面……", "ru": "С одной стороны…, с другой стороны… — о двух сторонах одного явления.", "ex": [["来到中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作和生活做准备。", "Учёба в Китае — с одной стороны язык и знания, с другой — подготовка к работе и жизни."], ["他经常在网上买东西，一方面因为便宜，另一方面因为方便。", "Он часто покупает в интернете: с одной стороны дешевле, с другой удобнее."], ["多做运动一方面能让身体更健康，另一方面也能减轻压力。", "Спорт с одной стороны укрепляет здоровье, с другой снимает стресс."]], "py": "yì fāng miàn  lìng yì fāng miàn "}], "ex": [["老师给白家月什么了？", "Что учитель дал Бай Цзяюэ?"], ["他们什么时候开始上课？", "Когда у них начинаются занятия?"], ["他们的校园里有什么？", "Что есть в их кампусе?"], ["什么样的学生有机会获得奖学金？", "Какие студенты имеют шанс получить стипендию?"], ["为什么很多外国学生来中国学习？", "Почему многие иностранные студенты едут учиться в Китай?"], ["除了学习，外国学生还可以和中国学生一起做什么？", "Кроме учёбы, что иностранные студенты делают вместе с китайскими?"]]}, "2": {"texts": [{"t": "课文 1 · Хозяйка показывает квартиру", "ru": "Бай Цзяюэ хочет снять квартиру, Ли Вэнь идёт с ней смотреть.", "lines": [["房东", "请进！我给你们介绍一下，这个房子有两个房间，那个大房间出租，房租每月5500元。现在已经收拾好了，想租的话，今天就可以搬进来。", "Заходите! Покажу: в квартире две комнаты, большая сдаётся, аренда 5500 юаней в месяц. Уже убрано, если решите снять — можете переехать сегодня."], ["白家月", "嗯，这个房间真不小，还挺亮。小区离我们学校也不远。", "Да, комната немаленькая и достаточно светлая. Район недалеко от нашей школы."], ["房东", "是的，我们小区离地铁站也很近，生活上很方便。如果决定租了，告诉我就是了。", "Верно, наш район близко и к метро, жить удобно. Если решите снять — просто скажите мне."], ["白家月", "好的，我们再去看看外边的环境。", "Хорошо, пойдём ещё посмотрим, что вокруг."]]}, {"t": "课文 2 · Во дворе", "ru": "Продолжают осматривать окрестности.", "lines": [["李文", "家月，你看，那边还有个小花园。", "Цзяюэ, смотри, там ещё маленький садик."], ["白家月", "嗯，这个小区到处是花，还种了不少树，周围也很安静。", "Да, здесь всюду цветы, посажено много деревьев, вокруг тихо."], ["李文", "是啊！这个小区的环境真不错，不过我听说，附近有十几家公司，很多刚毕业的学生都租住在这里。周末他们可能会玩到很晚，恐怕会影响你休息。", "Да! Обстановка хорошая, но я слышал, рядом больше десятка компаний и многие выпускники снимают жильё здесь. По выходным они могут гулять допоздна — боюсь, это помешает тебе отдыхать."], ["白家月", "没关系，我还想多认识一些朋友，和他们一起玩呢。", "Ничего страшного, я как раз хочу познакомиться с новыми друзьями и проводить время с ними."], ["李文", "是呢，大家可以一起热闹热闹。", "Верно, можно повеселиться вместе."], ["白家月", "这里房租合适，环境很好，而且房东也热情，所以我决定租这个房子了，明天就入住新家。", "Аренда подходящая, обстановка хорошая, да и хозяйка приветливая — решаю снять эту квартиру, завтра переезжаю."]]}, {"t": "课文 3 · Дневник, 25 августа, ясно", "ru": "Бай Цзяюэ пишет дневник после переезда.", "paras": [["昨天我顺利租到了合适的房子，今天李文帮我搬家。搬进去的时候，房东又向我介绍了一下房子里的东西，并告诉我这些东西怎么用。", "Вчера я удачно сняла подходящую квартиру, сегодня Ли Вэнь помогла мне с переездом. Когда мы заехали, хозяйка ещё раз показала, что есть в квартире, и рассказала, как этим пользоваться."], ["我看了一下，客厅里有椅子、沙发，还有一台大电视；厨房里有冰箱和一些做饭用的东西，不过，我平常主要在学校食堂吃，基本上不做饭。我租的房间里，除了一张床以外，还有一台空调、一张书桌和一把椅子。看完整个房子后，我准备再去买几条毛巾，其他东西还不需要。", "Я посмотрела: в гостиной есть стулья, диван и большой телевизор; на кухне — холодильник и кое-что для готовки, но обычно я ем в школьной столовой и почти не готовлю. В моей комнате кроме кровати есть кондиционер, письменный стол и стул. Осмотрев всю квартиру, я собираюсь купить ещё несколько полотенец, остальное пока не нужно."]]}, {"t": "课文 4 · Как снять подходящее жильё", "ru": "Текст для чтения.", "paras": [["在李文的帮助下，白家月租到了合适的房子。对白家月来说，这次租房并不容易。根据李文的建议，她先在租房网站和APP上查看有关信息，查找合适的房子，接着又去看了看房子，同时了解房子周围的环境。她看了好几个房子，才找到一个位置、环境和价格都合适的，最后顺利租到了理想的房子。", "С помощью Ли Вэнь Бай Цзяюэ сняла подходящую квартиру. Для неё это было непросто. По совету Ли Вэнь она сначала посмотрела информацию на сайтах и в приложениях аренды, искала подходящее жильё, затем поехала смотреть квартиры и заодно изучала окрестности. Она посмотрела несколько квартир, прежде чем нашла подходящую по расположению, обстановке и цене, и в итоге удачно сняла идеальную квартиру."], ["租房的时候，李文告诉白家月，在中国，由于很多刚工作的年轻人工资还不太高，所以他们一开始也不买房，都选择租房。工作几年后，不少人就会买房，因为大家一直觉得，有房才有家，有自己的房子会更有安全感。", "При аренде Ли Вэнь рассказала Бай Цзяюэ: в Китае многие молодые специалисты получают не очень высокую зарплату, поэтому сначала не покупают жильё, а снимают. Через несколько лет работы многие покупают квартиру — считается, что «есть жильё — есть дом», своё жильё даёт больше уверенности."]]}], "gram": [{"p": "……就是了", "ru": "Разговорная конструкция в конце предложения: «просто… и всё», уверенное утверждение.", "ex": [["如果决定租了，告诉我就是了。", "Если решишь снять — просто скажи мне."], ["我一定能办到，您放心就是了。", "Я обязательно смогу это сделать, просто не волнуйтесь."], ["这次考得不好没关系，下次努力就是了。", "Ничего страшного, что плохо сдал в этот раз, в следующий просто постарайся."]], "py": " jiù shì le"}, {"p": "……，不过……", "ru": "Союз 不过 в начале второго предложения — «однако, но».", "ex": [["这个小区的环境真不错，不过我听说，附近有十几家公司。", "Обстановка здесь хорошая, однако я слышал, что рядом больше десятка компаний."], ["我们在动物园看见了很多动物，不过没看见大熊猫。", "В зоопарке мы видели много животных, но не видели панду."], ["我刚来北京时还不太习惯这里的天气，不过很快就适应了。", "Когда я приехал в Пекин, погода была непривычной, но я быстро привык."]], "py": " bù guò "}, {"p": "并", "ru": "Союз «и к тому же» — соединяет однородные глаголы и фразы; как наречие перед отрицанием усиливает отрицание.", "ex": [["房东又向我介绍了一下房子里的东西，并告诉我这些东西怎么用。", "Хозяйка ещё раз показала вещи в квартире и рассказала, как ими пользоваться."], ["她考上了北京大学并申请到了奖学金。", "Она поступила в Пекинский университет и получила стипендию."], ["我并没有答应你就租这个房子，我还要再想想。", "Я вовсе не обещал тебе снять эту квартиру, мне надо ещё подумать."]], "py": "bìng"}, {"p": "由于", "ru": "Причина: союз в начале первой части (во второй обычно 所以/因此) или предлог «из-за».", "ex": [["由于很多刚工作的年轻人工资还不太高，所以他们一开始也不买房。", "Поскольку у многих молодых специалистов зарплата невысокая, сначала они не покупают жильё."], ["由于一直下大雨，所以我们决定不爬山了。", "Из-за сильного дождя мы решили не идти в горы."], ["由于大家的努力，这次运动会我们班获得了第一名。", "Благодаря стараниям всех наш класс занял первое место на спортивном празднике."]], "py": "yóu yú"}], "ex": [["房东要出租哪个房间？那个房间怎么样？", "Какую комнату сдаёт хозяйка и какая она?"], ["房东为什么说住在那个小区生活上很方便？", "Почему хозяйка говорит, что в этом районе удобно жить?"], ["李文为什么担心周末白家月休息不好？", "Почему Ли Вэнь волнуется, что по выходным Бай Цзяюэ не отдохнёт?"], ["白家月为什么决定租那个房子？", "Почему Бай Цзяюэ решила снять эту квартиру?"], ["白家月租的房间里都有什么？", "Что есть в комнате, которую сняла Бай Цзяюэ?"]]}, "3": {"texts": [{"t": "课文 1 · Как пройти к жилому комплексу", "ru": "Чэнь Тяньчжун заблудился и спрашивает дорогу.", "lines": [["陈天中", "请问，花园小区怎么走？", "Извините, как пройти к жилому комплексу «Хуаюань»?"], ["同学", "你往前走，到十字路口不要过马路，直接右转就到小区门口了。正好我也去那边，一起走吧。", "Идите прямо, на перекрёстке не переходите дорогу, сразу поверните направо — и вы у ворот комплекса. Мне как раз туда, пойдёмте вместе."], ["陈天中", "好的。我刚来中国，不熟悉路。北京真是太大了。", "Хорошо. Я только приехал в Китай и не знаю дороги. Пекин действительно огромный."], ["同学", "北京大是大，不过这边的路基本上都是正南正北、正东正西的，很好找。你也可以用手机地图，很容易就能找到目的地。", "Пекин-то большой, но здешние улицы в основном идут строго с севера на юг и с востока на запад, найти легко. Можно ещё пользоваться картой в телефоне — до места добраться просто."], ["陈天中", "嗯，不过很多中文地名我还不认识。", "Да, но многие китайские названия я пока не знаю."], ["同学", "没关系，你很快就会熟悉的。", "Ничего, скоро освоитесь."]]}, {"t": "课文 2 · В столовой", "ru": "Бай Цзяюэ и Чэнь Тяньчжун обедают и разговаривают.", "lines": [["白家月", "前两天和李文喝咖啡时，他帮我下载了微信和支付宝，教我认识里边的汉字，还教我用手机进行支付。", "Пару дней назад за кофе Ли Вэнь помог мне скачать WeChat и Alipay, объяснил иероглифы в них и научил платить с телефона."], ["陈天中", "他也教了我怎么用这两个软件。现在我不仅会扫码结账，还会用手机在网上购物了。昨天我就在网上订了一台电脑，今天下午一点送到。", "Меня он тоже научил пользоваться этими приложениями. Теперь я не только оплачиваю по QR-коду, но и покупаю в интернете. Вчера как раз заказал компьютер, сегодня в час дня привезут."], ["白家月", "学会了这些，我们在中国生活真是方便了不少。", "Освоив это, мы заметно упростили себе жизнь в Китае."], ["陈天中", "对。快递员要到了，我得马上回去！家月，明天见！", "Верно. Курьер скоро придёт, мне надо бежать! Цзяюэ, до завтра!"], ["白家月", "好的，天中，再见。", "Хорошо, Тяньчжун, до встречи."]]}, {"t": "课文 3 · Новый жизненный опыт", "ru": "Текст для чтения.", "paras": [["白家月和陈天中刚到北京时就发现，中国人在饭馆或超市结账时，几乎都用手机支付，只有他们用现金结账。", "Приехав в Пекин, Бай Цзяюэ и Чэнь Тяньчжун заметили: китайцы в ресторанах и супермаркетах почти всегда платят телефоном, и только они расплачиваются наличными."], ["在李文的帮助下，白家月和陈天中也学会了用手机支付、网购、寄快递等等。在中国网购，不仅选择多、价格不高，而且送货很快，很多留学生甚至改变了自己的购物习惯。不过，由于网购太方便了，动动手指就能买到想要的东西，他们也开始担心自己在网购时会乱花钱。怎么才能管住自己不乱花钱呢？", "С помощью Ли Вэнь они научились платить с телефона, покупать онлайн, отправлять посылки и многому другому. Покупки в Китае — это не только большой выбор и невысокие цены, но и быстрая доставка; многие иностранные студенты даже изменили свои привычки. Однако из-за того, что покупать стало слишком удобно — достаточно движения пальца, — они начали беспокоиться, что будут тратить лишнее. Как удержать себя от лишних трат?"]]}, {"t": "课文 4 · Как защитить личные данные в телефоне", "ru": "Текст для чтения.", "paras": [["网上购物或者订票时，经常需要提供个人信息，比如姓名、手机号、地址等。这些信息如果被坏人拿到，可能会带来麻烦。", "При покупках онлайн и бронировании билетов часто нужно указывать личные данные: имя, номер телефона, адрес. Если они попадут к недобросовестным людям, это может создать проблемы."], ["所以，下载软件要用正规的应用商店，不要随便点开不认识的链接；支付前先确认收款方；不用的账号要及时退出。保护好自己的信息，才能安心用手机。", "Поэтому приложения стоит скачивать в официальных магазинах, не открывать незнакомые ссылки, перед оплатой проверять получателя и вовремя выходить из ненужных аккаунтов. Только защищая свои данные, можно спокойно пользоваться телефоном."]]}], "gram": [{"p": "×是×，就是 / 不过……", "ru": "Уступительная конструкция: «×-то ×, но…» — сначала согласие, затем ограничение.", "ex": [["北京大是大，不过这边的路基本上都是正南正北的，很好找。", "Пекин-то большой, но улицы здесь идут строго по сторонам света, найти легко."], ["这个房子便宜是便宜，就是离我的公司太远了。", "Квартира дешёвая-то дешёвая, но слишком далеко от моей работы."], ["我们想是想了，就是没想出更好的办法。", "Мы-то думали, но лучшего способа не придумали."]], "py": " shì  jiù shì  bù guò "}, {"p": "不仅 / 不光……，还 / 而且……", "ru": "«Не только…, но и…»: вторая часть дополняет и усиливает первую.", "ex": [["现在我不仅会扫码结账，还会用手机在网上购物了。", "Теперь я не только плачу по QR-коду, но и покупаю в интернете."], ["王老师不光教我们说中文，而且带我们了解中国文化。", "Учитель Ван не только учит нас говорить по-китайски, но и знакомит с культурой."], ["现在很多书店不仅卖书，还卖咖啡和奶茶。", "Сейчас многие книжные не только продают книги, но и кофе с чаем."]], "py": "bù jǐn  bù guāng  hái  ér qiě "}, {"p": "甚至", "ru": "«даже» — подчёркивает крайний, неожиданный случай.", "ex": [["很多留学生甚至改变了自己的购物习惯。", "Многие иностранные студенты даже изменили свои привычки в покупках."], ["高铁速度真快，甚至还没看清楚，它就已经开过去了。", "Скоростной поезд так быстр, что не успеешь разглядеть — он уже проехал."], ["这个小区真不错，有小花园、球场，甚至还有一个超市。", "Район хороший: есть садик, спортплощадка и даже супермаркет."]], "py": "shèn zhì"}], "ex": [["陈天中为什么找不到花园小区了？", "Почему Чэнь Тяньчжун не смог найти комплекс «Хуаюань»?"], ["陈天中为什么没用手机地图？", "Почему он не воспользовался картой в телефоне?"], ["李文帮陈天中下载了什么软件？", "Какие приложения помог скачать Ли Вэнь?"], ["陈天中为什么着急回去？", "Почему Чэнь Тяньчжун спешил вернуться?"], ["白家月和陈天中学会用手机做什么了？", "Чему они научились делать с телефоном?"], ["留学生为什么也喜欢网购？", "Почему иностранные студенты любят покупать онлайн?"]]}};

let SUB='lessons';
const LESS_KEY='mywave-less-v1';
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['ВОСКРЕСЕНЬЕ','ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА','СУББОТА'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monOf(d){const x=new Date(d); x.setHours(0,0,0,0); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x;}
let WEEK=monOf(new Date());
let LESSF=false;
function extraLessons(){try{const o=JSON.parse(localStorage.getItem(LESS_KEY)||'[]'); return Array.isArray(o)?o:[]}catch(e){return []}}
const OVK='mywave-less-ov-v1';
function ovAll(){try{const o=JSON.parse(localStorage.getItem(OVK)||'{}'); return {ov:o.ov||{},del:Array.isArray(o.del)?o.del:[]}}catch(e){return {ov:{},del:[]}}}
function ovSet(o){try{localStorage.setItem(OVK,JSON.stringify(o))}catch(e){}}
function ovOf(id){return ovAll().ov[id]||{}}
function allLessons(){
  const st=ovAll();
  return LESSONS.concat(extraLessons().map((l,i)=>Object.assign({weekly:true,id:l.id||('x'+i)},l)))
    .filter(l=>!st.del.includes(l.id))
    .map(l=>Object.assign({},l,st.ov[l.id]||{}))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
/* ключ занятия в конкретной неделе: тот же день недели, не раньше начала серии */
function nominalKey(l, weekStart){
  const wd=(new Date(l.date+'T00:00:00').getDay()+6)%7;
  const d=new Date(weekStart); d.setDate(d.getDate()+wd); const k=iso(d);
  return k>=l.date ? k : null;
}
/* все занятия недели с учётом повторений и отмен */
function weekInstances(weekStart){
  const out=[];
  const ls=allLessons();
  for(let i=0;i<7;i++){
    const d=new Date(weekStart); d.setDate(d.getDate()+i); const key=iso(d);
    ls.forEach(l=>{
      const k=l.weekly===false ? (l.date===key?key:null) : nominalKey(l, weekStart);
      if(k!==key) return;
      const ov=ovOf(l.id);
      out.push(Object.assign({},l,{_key:key,
        cancelled:(ov.cancelled||[]).includes(key),
        done:(ov.done||[]).includes(key)}));
    });
  }
  return out;
}
function weekRange(mon){const a=new Date(mon), b=new Date(mon); b.setDate(b.getDate()+6);
  return a.getMonth()===b.getMonth()
    ? a.getDate()+' — '+b.getDate()+' '+MONTHS[a.getMonth()]
    : a.getDate()+' '+MONTHS[a.getMonth()]+' — '+b.getDate()+' '+MONTHS[b.getMonth()];}
function shiftWeek(n){const w=new Date(WEEK); w.setDate(w.getDate()+7*n); WEEK=w; go('sched')}
function goToday(){WEEK=monOf(new Date()); go('sched')}
function fmtDate(x){const d=new Date(x+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()]}
function money(n){return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+'\u00A0₽'}
const q=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

function paysHidden(){try{const o=JSON.parse(localStorage.getItem(PAYDEL)||'[]'); return Array.isArray(o)?o:[]}catch(e){return []}}

function payMonth(){if(!PAYMON){const n=new Date(); PAYMON=new Date(n.getFullYear(),n.getMonth(),1)} return PAYMON}
function payMonShift(k){const m=payMonth(); PAYMON=new Date(m.getFullYear(),m.getMonth()+k,1); ALLTIME=false; scopeSave(); go('sched')}

function paySum(c){return pays().filter(p=>p.course===c).reduce((s,p)=>s+(+p.amount||0),0)}
function payTotalCount(c){return pays().filter(p=>p.course===c).reduce((s,p)=>s+(+p.count||0),0)}
function payUsed(c){return pays().filter(p=>p.course===c).reduce((s,p)=>s+(+p.used||0),0)}

function payClose(){PAYF=null; go('sched')}
function paySetUsed(id,v){const a=pays(); const p=a.find(x=>x.id===id); if(!p) return; const st=paysStored(); const i=st.findIndex(x=>x.id===id); if(i>=0) st[i]=p; else st.push(p);
  const max=+p.count||0; p.used=Math.max(0,Math.min(max,Math.round(+v||0))); const j=st.findIndex(x=>x.id===id); if(j>=0) st[j]=p; paysSet(st); go('sched')}
function payAdjustUsed(id,d){const p=pays().find(x=>x.id===id); if(!p) return; paySetUsed(id,(+p.used||0)+d)}

  if(st.ov[LESSEDIT.id]) delete st.ov[LESSEDIT.id]; ovSet(st); closeLesson()}
function payDeduct(course,delta){
  const merged=pays().filter(p=>p.course===course).sort((a,b)=>a.date.localeCompare(b.date));
  let target=null;
  if(delta>0) target=merged.find(p=>(+p.count||0)-(+p.used||0)>0);
  else { const rev=merged.slice().reverse(); target=rev.find(p=>(+p.used||0)>0); }
  if(!target) return false;
  target.used=Math.max(0,Math.min(+target.count||0,(+target.used||0)+delta));
  const st=paysStored(); const i=st.findIndex(x=>x.id===target.id);
  if(i>=0) st[i]=target; else st.push(target);
  paysSet(st);
  return true;
}
function lessonDone(id,key){
  const l=allLessons().find(x=>x.id===id); if(!l) return;
  const st=ovAll(); const cur=st.ov[id]||{};
  const arr=Array.isArray(cur.done)?cur.done.slice():[];
  const at=arr.indexOf(key);
  if(at>=0){ arr.splice(at,1); payDeduct(l.course,-1); }
  else { arr.push(key); payDeduct(l.course,+1); }
  cur.done=arr; st.ov[id]=cur; ovSet(st); go('sched');
}

/* плеер (логика как в Тингли) */
function mwPlayerInit(){
  const pl=document.getElementById('player'), a=document.getElementById('pa');
  const pp=document.getElementById('ppBtn'), ico=document.getElementById('ppIco');
  const cur=document.getElementById('pCur'), dur=document.getElementById('pDur'), rng=document.getElementById('pRange');
  const spdSel=document.getElementById('spdSel'), spdFace=document.getElementById('spdFace'), loopBtn=document.getElementById('loopBtn');
  const ICON_PLAY='M8 5v14l11-7z', ICON_PAUSE='M7 5h4v14H7zM13 5h4v14h-4z';
  const fmt=t=>{ if(!isFinite(t)||t<0) t=0; t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
  window.mwPlayerShow=(src)=>{ if(src && a.getAttribute('src')!==src) a.src=src; pl.classList.add('show'); };
  window.mwPlayerHide=()=>{ pl.classList.remove('show'); a.pause(); };
  window.mwTogglePlay=()=>{ if(a.paused){ a.play(); ico.setAttribute('d',ICON_PAUSE);} else { a.pause(); ico.setAttribute('d',ICON_PLAY);} };
  window.mwSkip=sec=>{ if(a.duration) a.currentTime=Math.min(a.duration,Math.max(0,a.currentTime+sec)); };
  pp.addEventListener('click', window.mwTogglePlay);
  document.getElementById('skipBack').addEventListener('click',()=>window.mwSkip(-10));
  document.getElementById('skipFwd').addEventListener('click',()=>window.mwSkip(10));
  loopBtn.addEventListener('click',()=>{ a.loop=!a.loop; loopBtn.classList.toggle('on',a.loop); });
  spdSel.addEventListener('change',()=>{ a.playbackRate=parseFloat(spdSel.value); spdFace.textContent=spdSel.value+'×'; });
  rng.addEventListener('input',()=>{ if(a.duration) a.currentTime=rng.value/1000*a.duration; });
  a.addEventListener('timeupdate',()=>{ cur.textContent=fmt(a.currentTime); if(a.duration) rng.value=Math.round(a.currentTime/a.duration*1000); });
  a.addEventListener('loadedmetadata',()=>{ dur.textContent=fmt(a.duration); });
  a.addEventListener('ended',()=>{ ico.setAttribute('d',ICON_PLAY); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mwPlayerInit);
else mwPlayerInit();


/* Свайп колонки как в Тингли */
(function(){
  let t0=null;
  const sb=()=>document.querySelector('.side');
  const narrow=()=>window.innerWidth<900;
  const isOpen=()=>sb()&&sb().classList.contains('open');
  document.addEventListener('touchstart',e=>{
    if(!narrow()) return;
    const el=sb(); if(!el) return;
    const t=e.touches[0];
    const onSb=e.target.closest && e.target.closest('.side');
    if(isOpen()&&onSb) t0={x:t.clientX,y:t.clientY,mode:'close',armed:true};
    else if(!isOpen()&&t.clientX<24) t0={x:t.clientX,y:t.clientY,mode:'open',armed:false};
    else t0=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!t0) return;
    const el=sb(); const t=e.touches[0];
    const dx=t.clientX-t0.x, dy=Math.abs(t.clientY-t0.y), w=el.offsetWidth;
    if(!t0.armed){ if(Math.abs(dx)<10||Math.abs(dx)<dy) return; t0.armed=true; el.style.transition='none'; }
    if(Math.abs(dx)<dy) return;
    el.style.transform = t0.mode==='close'
      ? 'translateX('+Math.min(0,dx)+'px)'
      : 'translateX('+Math.max(-w, dx-w)+'px)';
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!t0) return;
    const el=sb(); const dx=e.changedTouches[0].clientX-t0.x;
    el.style.transition=''; el.style.transform='';
    if(t0.mode==='close' && dx<-60) el.classList.remove('open');
    if(t0.mode==='open' && dx>60) el.classList.add('open');
    t0=null;
  },{passive:true});
  const b=document.getElementById('mobMenu');
  if(b) b.addEventListener('click',()=>{ const el=sb(); if(el) el.classList.toggle('open'); });
})();
