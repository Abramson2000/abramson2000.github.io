<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой словарь</title><meta name="apple-mobile-web-app-title" content="Мой словарь"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="https://crmuro.ru/cidian-seal-180-20261010.png"><style>body{margin:32px auto;padding:0 24px;max-width:600px;background:#fbf7f0;color:#32261e;font:18px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}img{display:block;width:180px;height:180px;margin:24px 0}a{color:#754425}p{margin:16px 0}</style></head><body>
<h1>Проверка A</h1><img id="seal" src="https://crmuro.ru/cidian-seal-180-20261010.png" width="180" height="180" alt="Печать Словаря"><p id="image-status">Загружаем печать…</p>
<p>В Safari открой «Поделиться → На экран Домой». Посмотри значок в этом окне, затем закрой окно.</p><p><a href="/cidian-manifest-check-20261010.html">Открыть другую проверку</a></p><p><a href="/cidian/">Вернуться в Словарь</a></p>
<script>
(function(){
const img=document.getElementById('seal'),status=document.getElementById('image-status');
function loaded(){status.textContent='Печать загрузилась обычным запросом изображения ('+img.naturalWidth+'×'+img.naturalHeight+').';}
img.addEventListener('load',loaded);img.addEventListener('error',()=>{status.textContent='Обычный запрос изображения завершился ошибкой.';});
if(img.complete){if(img.naturalWidth)loaded();else status.textContent='Обычный запрос изображения завершился ошибкой.';}
window.addEventListener('load',()=>{if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)location.replace('/cidian/?v=2.21.0');});
})();
</script></body></html>
