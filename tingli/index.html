
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小山听力</title>
<link rel="icon" type="image/png" sizes="64x64" href="tingli-favicon-v3.png?v=5.36.0"><link rel="icon" type="image/png" sizes="32x32" href="tingli-favicon-32-v3.png?v=5.36.0">
<link rel="apple-touch-icon" href="tingli-icon-180-v3.png?v=5.36.0">
<link rel="manifest" href="manifest.json">
<style>
  @font-face { font-family: 'XSHand'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/xiaoshan-title.woff2?v=5.36.0') format('woff2'); }
  @font-face { font-family: 'SimSun'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/simsun-subset.woff2?v=5.36.0') format('woff2'); }
  /* общий иероглифический шрифт: подхватывает ТОЛЬКО китайские диапазоны, кириллица/латиница остаются системными */
  @font-face { font-family: 'TLCJK'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/simsun-subset.woff2?v=5.36.0') format('woff2'); unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF, U+2018-201D, U+2026, U+00B7; }
  :root {
    /* ===== палитра Tingli (5.0.0) ===== */
    --paper:       #F5F4F1;
    --surface:     #FFFFFF;
    --ink:         #1D1D21;
    --ink-2:       #77746F;
    --ink-3:       #AAA69F;
    --line:        #E5E1DA;
    --seal:        #C63717;
    --seal-dark:   #A62D13;
    --seal-soft:   #F8E8E2;
    --jade:        #3D795F;
    --jade-soft:   #E8F1EC;
    --ochre:       #B27C28;
    --ochre-soft:  #FAF0DC;
    --danger:      #A63B34;
    --danger-soft: #F7E7E4;

    /* ===== совместимость со старыми именами ===== */
    --bg: var(--paper);
    --card: var(--surface);
    --text: var(--ink);
    --black: var(--ink);
    --muted: var(--ink-2);
    --faint: var(--ink-3);
    --red: var(--seal);
    --red-deep: var(--seal-dark);
    --red-soft: var(--seal-soft);
    --brand: var(--seal);
    --ok: var(--jade);
    --ok-soft: var(--jade-soft);
    --done: var(--jade);
    --done-soft: var(--jade-soft);
    --bad: var(--danger);
    --bad-soft: var(--danger-soft);
    --yellow: var(--ochre);
    --yellow-soft: var(--ochre-soft);

    --shadow-card: 0 1px 2px rgba(29,29,33,.04), 0 8px 24px rgba(29,29,33,.055);
    --shadow-pop:  0 2px 6px rgba(29,29,33,.07), 0 14px 34px rgba(29,29,33,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-gutter: stable; }
  body { font-family: "TLCJK", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; letter-spacing: 0; }
  .zh, .zh-opt, .fill, .script, .word .zh { font-family: "TLCJK", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif; }
  .app { max-width: 720px; margin: 0 auto; padding: 16px 16px 130px; }
  body.has-player .app { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  /* Шапка */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 6px 0 18px; }
  /* логотип и красная надпись центрируются как элементы одной строки; мелкая подпись — справа от надписи */
  .logo { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .title-img { height: 56px; width: auto; display: block; flex-shrink: 0; }
  /* заголовок страницы — рукописный шрифт, как на сплэше (без растягивания) */
  .top-title { font-family: "XSHand", "TLCJK", "Zhi Mang Xing", serif; color: var(--red); font-size: 36px; font-weight: 400; letter-spacing: 6px; line-height: 1.1; flex-shrink: 0; padding-left: 2px; }
  .team-title { font-size: 30px; font-weight: 900; color: var(--red-deep); letter-spacing: 3px; font-family: "TLCJK", "SimSun","Songti SC","STSong",serif; line-height: 1.05; flex-shrink: 0; }
  .topbar .sub { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .2px; line-height: 1.3; }
  .topbar .dict-clear { margin-left: auto; }
  .ver-line { padding: 20px 18px 30px; font-size: 12.5px; color: var(--ink-2); letter-spacing: .4px; text-align: center; font-weight: 500; }

  .topbar .sub { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
  .back { background: var(--surface); border: none; width: 42px; height: 42px; border-radius: 14px; font-size: 21px; cursor: pointer; color: var(--text); flex-shrink: 0; font-weight: 500; box-shadow: var(--shadow-card); }
  .back:active { transform: scale(.94); }

  .section-title { font-size: 20px; font-weight: 800; letter-spacing: -.4px; margin: 8px 0 14px; display: flex; align-items: center; gap: 9px; }
  .section-title::before { content: ''; width: 4px; height: 19px; border-radius: 3px; background: var(--red); flex-shrink: 0; }

  /* Карточка урока */
  .unit-card { background: var(--card); border-radius: 20px; padding: 15px 14px 15px 16px; margin-bottom: 11px; cursor: pointer; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-card); transition: transform .12s ease, box-shadow .12s ease; }
  .unit-card:active { transform: scale(.98); box-shadow: 0 1px 3px rgba(29,29,33,.06); }
  .unit-emoji { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 25px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(29,29,33,.04); }
  .unit-zh { font-family: "TLCJK", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .unit-zh-sub { font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-weight: 400; font-size: 13px; color: var(--ink-2); margin-top: 2px; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unit-arrow { color: var(--line); font-size: 22px; font-weight: 600; flex-shrink: 0; line-height: 1; width: 12px; text-align: right; font-family: "TLCJK", -apple-system, sans-serif; }
  .unit-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-width: 0; flex-wrap: nowrap; }
  .pbar { flex: 0 1 92px; min-width: 34px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--red-deep), var(--red)); transition: width .4s ease; }
  .unit-progress { font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  .done-badge { font-size: 11px; font-weight: 700; color: var(--done); background: var(--done-soft); border-radius: 99px; padding: 3px 10px; white-space: nowrap; flex-shrink: 0; }
  .unit-dl-ph { width: 32px; height: 32px; flex-shrink: 0; }
  .unit-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .unit-arrow { color: var(--line); font-size: 22px; font-weight: 600; flex-shrink: 0; line-height: 1; width: 12px; text-align: right; font-family: "TLCJK", -apple-system, sans-serif; }
  .unit-dl { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--text); color: var(--surface); cursor: pointer; margin-right: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(29,29,33,.22); transition: transform .12s ease, background .12s ease; -webkit-appearance: none; appearance: none; }
  .unit-dl svg { width: 15px; height: 15px; display: block; }
  .unit-dl:active { transform: scale(.92); }
  .unit-dl.done { background: linear-gradient(135deg, var(--red-deep), var(--red)); box-shadow: 0 3px 10px rgba(198,55,23,.32); }
  .unit-dl.part { background: var(--red-soft); color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
  .unit-dl:disabled { opacity: .55; }

  .u-title { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 2px; }
  .u-sub { font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-weight: 400; font-size: 13.5px; color: var(--muted); margin-bottom: 14px; letter-spacing: .3px; }

  /* Список частей */
  .part { background: var(--card); border-radius: 16px; margin-bottom: 11px; overflow: hidden; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .12s ease; }
  .part:active { transform: scale(.985); }
  .part-head { display: flex; align-items: center; gap: 13px; padding: 14px 15px; }
  .part-num { width: 31px; height: 31px; border-radius: 12px; font-weight: 700; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-size: 16.5px; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--surface); background: var(--red); box-shadow: 0 2px 6px rgba(198,55,23,.28); }
  .part-title { font-weight: 650; font-size: 15.5px; flex: 1; min-width: 0; letter-spacing: -.2px; line-height: 1.28; }
  .part-zh { font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; letter-spacing: .2px; }
  .part-arrow { color: var(--line); font-size: 22px; font-weight: 600; }
  .lesson-img { width: 100%; border-radius: 16px; box-shadow: 0 6px 20px rgba(29,29,33,.14); margin: 2px 0 14px; display: block; }
  .lesson-text { background: var(--card); border-radius: 20px; padding: 24px 22px; box-shadow: var(--shadow-card); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif; }
  .lesson-text p { margin: 0 0 1.1em; font-size: 20px; line-height: 1.82; letter-spacing: 0; font-family: "TLCJK", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif; }
  .lesson-text p:last-child { margin-bottom: 0; }
  .speak { background: var(--card); border-radius: 20px; padding: 18px 16px; box-shadow: var(--shadow-card); margin-top: 14px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif; }
  .speak-h { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .speak-msg { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
  .speak-msg.bad { color: var(--danger); }
  .speak-btns { display: flex; gap: 10px; margin-top: 12px; }
  .speak-btn { flex: 1; height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-size: 15px; color: var(--ink); cursor: pointer; }
  .speak-btn.main { background: var(--seal); border-color: var(--seal); color: var(--surface); font-weight: 600; }
  .speak-btn:disabled { opacity: .45; }
  .speak-pb { font-size: 13px; color: var(--danger); margin-top: 8px; min-height: 16px; }
  .speak-out { margin-top: 10px; display: none; }
  .speak-out.show { display: block; }
  .speak-heard { font-size: 14px; line-height: 1.7; background: var(--paper); border-radius: 14px; padding: 12px; }
  .speak-heard .hzh { font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-size: 19px; display: block; margin-top: 4px; }
  .speak-verdict { font-size: 14px; line-height: 1.7; margin-top: 10px; }
  .dlg-tools { display:flex; gap:9px; margin:0 0 12px; }
  .dlg-tools .btn { padding:12px 14px; }
  .dlg-list { display:flex; flex-direction:column; gap:10px; }
  .dlg-line { background:var(--surface); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow-card); }
  .dlg-line.a { box-shadow:inset 3px 0 0 var(--seal), var(--shadow-card); }
  .dlg-line.b { box-shadow:inset 3px 0 0 var(--line), var(--shadow-card); }
  .dlg-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .dlg-role { width:25px; height:25px; border-radius:9px; background:var(--seal-soft); color:var(--seal); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .dlg-say { margin-left:auto; border:0; background:var(--paper); color:var(--ink); border-radius:999px; padding:6px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .dlg-zh { font-family:"TLCJK","SimSun","Songti SC","STSong",serif; font-size:19px; line-height:1.6; color:var(--ink); }
  .dlg-py { font-size:13px; line-height:1.5; color:var(--seal); margin-top:4px; }
  .dlg-ru { font-size:13px; line-height:1.5; color:var(--ink-2); margin-top:4px; }
  .vhw-intro { background:var(--surface); border-radius:16px; padding:13px 14px; margin:12px 0; box-shadow:var(--shadow-card); color:var(--ink-2); font-size:14px; line-height:1.55; }
  .vhw-item { background:var(--surface); border-radius:18px; padding:14px; margin:10px 0; box-shadow:var(--shadow-card); }
  .vhw-num { font-size:12px; font-weight:800; color:var(--seal); margin-bottom:6px; }
  .vhw-zh { font-family:"TLCJK","SimSun","Songti SC","STSong",serif; font-size:19px; line-height:1.6; color:var(--ink); }
  .vhw-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .vhw-b { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 12px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .vhw-b.rec { background:var(--seal); border-color:var(--seal); color:#fff; }
  .vhw-b.share { color:var(--seal); }
  .vhw-b.del { color:var(--danger); }
  .vhw-state { font-size:12.5px; color:var(--ink-2); margin-top:8px; }
  .vhw-state.ok { color:var(--jade); font-weight:700; }
  .vhw-audio { width:100%; margin-top:9px; display:none; }
  .vhw-footer { background:var(--surface); border-radius:18px; padding:14px; margin:14px 0 28px; box-shadow:var(--shadow-card); }
  .vhw-footer .note { font-size:12.5px; color:var(--ink-2); line-height:1.5; margin-top:8px; }
  .tts-bar { display:flex; gap:9px; margin-top:12px; padding:12px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow-card); align-items:center; }
  .tts-btn { border:0; border-radius:999px; padding:10px 15px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .tts-btn.main { background:var(--seal); color:#fff; }
  .tts-btn.stop { background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .tts-state { margin-left:auto; font-size:12px; color:var(--ink-2); min-width:70px; text-align:right; }

  .rec-hw-intro { background:var(--surface); border-radius:18px; padding:15px 16px; box-shadow:var(--shadow-card); font-size:14px; line-height:1.55; color:var(--ink-2); margin-bottom:12px; }
  .rec-hw-item { background:var(--surface); border-radius:18px; padding:15px 16px; box-shadow:var(--shadow-card); margin-bottom:11px; }
  .rec-hw-top { display:flex; gap:11px; align-items:flex-start; }
  .rec-hw-num { width:30px; height:30px; border-radius:10px; background:var(--seal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; }
  .rec-hw-phrase { font-family:"TLCJK","SimSun","Songti SC","STSong",serif; font-size:19px; line-height:1.65; color:var(--ink); flex:1; }
  .rec-hw-state { font-size:12.5px; color:var(--ink-2); margin:8px 0 0 41px; }
  .rec-hw-state.saved { color:var(--jade); font-weight:700; }
  .rec-hw-state.live { color:var(--danger); font-weight:700; }
  .rec-hw-actions { display:flex; gap:8px; margin:10px 0 0 41px; flex-wrap:wrap; }
  .rec-hw-b { border:0; border-radius:999px; padding:9px 14px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .rec-hw-b.rec { background:var(--seal); color:#fff; box-shadow:none; }
  .rec-hw-b.del { color:var(--danger); }
  .rec-hw-audio { width:calc(100% - 41px); margin:10px 0 0 41px; display:none; }
  .rec-hw-share { background:var(--surface); border-radius:18px; padding:15px 16px; box-shadow:var(--shadow-card); margin-top:14px; }
  .rec-hw-progress { font-size:13px; color:var(--ink-2); margin-bottom:10px; }
  .rec-hw-share .btn { background:var(--seal); }
  .rec-hw-fallback { margin-top:10px; font-size:13px; line-height:1.6; color:var(--ink-2); }
  .rec-hw-fallback a { color:var(--seal); font-weight:700; display:block; margin-top:5px; }

  .part-done { font-size: 11px; font-weight: 700; color: var(--done); background: var(--done-soft); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }

  /* Экран задания */
  .task-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .fav-btn { background: var(--surface); border: none; width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer; flex-shrink: 0; line-height: 1; box-shadow: var(--shadow-card); }
  .fav-btn:active { transform: scale(.92); }
  .fav-btn.on { background: var(--ochre-soft); box-shadow: 0 0 0 1px var(--ochre-soft) inset; }
  .fav-card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-card); }
  .fav-card:active { background: var(--paper); }
  .fav-top { display: flex; align-items: center; gap: 12px; }
  .fav-emoji { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(29,29,33,.04); }
  .fav-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .fav-q { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .fav-del { background: var(--paper); border: none; width: 28px; height: 28px; border-radius: 12px; color: var(--muted); font-size: 13px; cursor: pointer; flex-shrink: 0; }
  .fav-del:active { background: var(--line); }
  .fav-meta { font-size: 12px; color: var(--muted); margin-top: 9px; }
  .empty { text-align: center; color: var(--muted); font-size: 14.5px; padding: 48px 20px; line-height: 1.7; }
  .task-count { font-size: 13px; color: var(--muted); font-weight: 600; }
  .task-dots { display: flex; gap: 5px; }
  .tdot { width: 7px; height: 7px; border-radius: 99px; background: var(--line); }
  .tdot.on { background: var(--ochre); }
  .tdot.good { background: var(--ok); }
  .tdot.bad { background: var(--red); }
  .task-card { background: var(--card); border-radius: 20px; padding: 22px 18px; box-shadow: var(--shadow-card); }
  .task-q-ru { font-size: 18.5px; font-weight: 650; margin-bottom: 5px; line-height: 1.45; letter-spacing: -.2px; }
  .task-q-zh { font-size: 15.5px; color: var(--ink-2); margin-bottom: 15px; line-height: 1.55; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; }
  .task-q { font-size: 17.5px; margin-bottom: 13px; line-height: 1.55; font-weight: 600; letter-spacing: -.1px; }
  .task-q .hl { background: var(--ochre-soft); color: var(--ochre); font-weight: 700; border-radius: 5px; padding: 0 4px; }
  .task-qru { font-size: 13px; color: var(--muted); margin: -6px 0 13px; line-height: 1.55; font-weight: 400; }
  .app-ver { text-align: center; font-size: 11px; color: var(--line); padding: 18px 0 6px; letter-spacing: .3px; }
  .opts { display: flex; flex-direction: column; gap: 9px; margin-bottom: 15px; }
  .opt { display: flex; align-items: center; gap: 11px; padding: 14px 15px; border: 1.5px solid var(--paper); border-radius: 16px; cursor: pointer; font-size: 16px; background: var(--surface); transition: border-color .12s ease, background .12s ease; }
  .opt .letter { width: 27px; height: 27px; border-radius: 10px; background: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; color: var(--ink-2); transition: all .12s ease; }
  .opt.selected { border-color: var(--text); background: var(--surface); }
  .opt.selected .letter { background: var(--text); color: var(--surface); }
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.ok .letter { background: var(--ok); color: var(--surface); }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
  .opt.bad .letter { background: var(--bad); color: var(--surface); }
  .fill { width: 100%; padding: 14px 15px; border: 1.5px solid var(--paper); border-radius: 16px; font-size: 17.5px; margin-bottom: 15px; background: var(--surface); }
  .fill:focus { outline: none; border-color: var(--text); }
  .fill.ok { border-color: var(--ok); background: var(--ok-soft); }
  .fill.bad { border-color: var(--bad); background: var(--bad-soft); }
  .tf-btns { display: flex; gap: 10px; margin-bottom: 15px; }
  .tf-btn { flex: 1; padding: 14px; border: 1.5px solid var(--paper); border-radius: 16px; background: var(--surface); font-size: 16px; cursor: pointer; font-weight: 700; }
  .tf-btn.selected { border-color: var(--text); background: var(--surface); }
  .tf-btn.ok { border-color: var(--ok); background: var(--ok-soft); }
  .tf-btn.bad { border-color: var(--bad); background: var(--bad-soft); }
  .task-result { font-size: 15px; margin: 12px 0 0; font-weight: 700; text-align: center; padding: 11px; border-radius: 14px; display: none; }
  .task-result.ok { color: var(--ok); background: var(--ok-soft); display: block; }
  .task-result.bad { color: var(--bad); background: var(--bad-soft); display: block; }
  .btn { background: var(--text); color: var(--surface); border: none; border-radius: 999px; padding: 15px 20px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; letter-spacing: -.2px; transition: transform .1s ease, opacity .1s ease; }
  .btn:active { transform: scale(.98); opacity: .92; }
  .btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn-row { display: flex; gap: 10px; margin-top: 13px; }
  .btn-row .btn { flex: 1; }
  .link { color: var(--text); font-size: 13px; cursor: pointer; text-decoration: underline; margin-top: 12px; display: inline-block; font-weight: 600; }
  .script { background: var(--paper); border-radius: 16px; padding: 13px; font-size: 14.5px; line-height: 1.75; white-space: pre-line; margin-top: 12px; display: none; }
  .script.show { display: block; }
  .hw-item { margin: 12px 16px; }
  .hw-q { font-size: 16.5px; font-weight: 650; color: var(--ink); line-height: 1.5; margin-bottom: 7px; }
  .hw-ans { width: 100%; box-sizing: border-box; min-height: 56px; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; font-size: 15.5px; line-height: 1.5; font-family: inherit; resize: vertical; background: var(--surface); color: var(--ink); outline: none; }
  .hw-ans:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(198,55,23,.12); }
  .hw-tools { display: flex; align-items: flex-start; gap: 10px; margin-top: 9px; }
  .hw-chk { flex-shrink: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text); }
  .hw-chk:disabled { opacity: .5; }
  .hw-vd { font-size: 13px; line-height: 1.5; padding: 5px 0 2px; color: var(--ink-2); }
  .hw-vd.good { color: var(--jade); }
  .hw-vd.bad { color: var(--danger); }
  .hw-hint { font-size: 12px; color: var(--ink-3); margin: 3px 2px 0; }
  .hw-build { margin: 18px 16px 30px; }
  .hw-count { font-size: 13px; color: var(--ink-2); margin: 0 2px 10px; }
  .hw-out { white-space: pre-wrap; background: var(--paper); border-radius: 16px; padding: 15px; font-size: 14px; line-height: 1.6; color: var(--ink); margin-top: 13px; display: none; max-height: 340px; overflow: auto; }
  .hw-out.show { display: block; }
  .hw-out .hw-q-in { font-weight: 700; color: var(--ink); }
  .hw-ex { font-size: 15.5px; font-weight: 500; color: var(--ink-2); line-height: 1.6; margin: -3px 0 9px; padding-left: 10px; border-left: 2px solid var(--line); }
  .hw-ex-wrap { margin: -3px 0 9px; }
  .hw-ex-btn { border: 0; background: none; padding: 0 0 4px; font-size: 14px; color: var(--ink-2); text-decoration: underline dotted; cursor: pointer; }
  .hw-ex-wrap .hw-ex { margin: 0; }
  .hw-out .hw-out-label { font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .hw-out .hw-out-ta { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.65; background: var(--surface); color: var(--ink); font-family: inherit; resize: vertical; }
  .hw-out .hw-out-ta:focus { outline: none; border-color: var(--ink-3); }
  /* срок выполнения ДЗ */
  .hw-due { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 16px 0; padding: 10px 14px; background: var(--paper); border-radius: 14px; font-size: 13.5px; color: var(--ink-2); }
  .hw-due b { font-weight: 700; color: var(--ink); }
  .hw-due input[type=date] { border: 1.5px solid var(--line); border-radius: 12px; padding: 5px 8px; font-size: 13.5px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .hw-due-state { font-weight: 700; color: var(--ink-2); }
  .hw-due-x { margin-left: auto; border: none; background: none; color: var(--ink-3); font-size: 15px; cursor: pointer; padding: 2px 4px; }
  .due-badge { display: inline-block; margin-left: 8px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--ink-2); vertical-align: middle; white-space: nowrap; }
  .due-badge.soon { background: var(--ochre-soft); color: var(--ochre); }
  .due-badge.over { background: var(--danger-soft); color: var(--danger); }
  .due-badge.done { background: var(--jade-soft); color: var(--jade); }
  .nav-row { display: flex; gap: 10px; margin-top: 15px; }
  .nav-btn { flex: 1; padding: 15px; border: 1.5px solid var(--paper); border-radius: 16px; background: var(--surface); font-size: 15px; font-weight: 700; cursor: pointer; }
  .nav-btn:disabled { opacity: .35; }
  .nav-btn:not(:disabled):active { transform: scale(.98); }

  /* Слова */
  .word { display: grid; grid-template-columns: 1fr 1fr 1.1fr auto; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--paper); align-items: baseline; cursor: default; border-radius: 12px; }
  .word:last-child { border-bottom: none; }
  .word .zh { font-size: 19.5px; font-weight: 500; }
  .word .py { color: var(--muted); font-size: 14px; }
  .word .ru { color: var(--text); font-size: 14px; text-align: left; }
  .word .w-add { color: var(--line); font-size: 19px; text-align: right; padding: 3px 2px 3px 8px; line-height: 1; border: 0; background: transparent; font-family: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .word .word-ex { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; line-height: 1.45; margin-top: -2px; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif; }
  .word.indict .w-add { color: var(--done); }
  .word.sel { background: var(--seal-soft); box-shadow: inset 0 0 0 1.5px var(--red); padding-left: 10px; padding-right: 10px; border-radius: 14px; }
  .dict-send-bar { position: sticky; bottom: 0; padding: 12px 16px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  .dict-item { display: flex; align-items: center; gap: 13px; background: var(--card); border-radius: 16px; padding: 12px 15px; margin: 9px 16px; box-shadow: var(--shadow-card); }
  .dict-zh { font-size: 19.5px; font-weight: 600; min-width: 92px; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", serif; }
  .dict-body { flex: 1; min-width: 0; }
  .dict-py { color: var(--muted); font-size: 13px; }
  .dict-ru { font-size: 14px; color: var(--text); text-align: left; }
  .dict-src { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .dict-del { border: none; background: var(--paper); color: var(--ink-3); width: 29px; height: 29px; border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0; }
  .dict-edit { border: none; background: var(--paper); color: var(--ink-2); width: 29px; height: 29px; border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0; }
  .dict-actions { display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
  .word .w-add { cursor:pointer; }
  .dict-send { border:none; background:var(--paper); color:var(--ink-2); width:29px; height:29px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0; }
  .tl-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); max-width:min(600px,92vw); background:var(--ink); color:var(--surface); border-radius:14px; padding:12px 15px; display:flex; flex-direction:column; gap:7px; font-size:14px; line-height:1.35; box-shadow:0 10px 30px rgba(29,29,33,.28); z-index:60; animation:tlToastIn .18s ease-out; }
  .tl-toast a { color:var(--ochre-soft); font-weight:600; }
  .tl-toast .tl-x { align-self:flex-end; color:var(--ink-3); font-size:12px; }
  @keyframes tlToastIn { from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
  .dict-export { display:flex; gap:9px; margin:0 16px 12px; }
  .dict-export .btn { padding:12px 14px; font-size:13.5px; }
  .dict-editbox { flex:1; min-width:0; display:grid; gap:7px; }
  .dict-editbox input { width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius: 12px; padding:9px 10px; font:inherit; font-size:14px; background:var(--surface); color:var(--text); outline:none; }
  .dict-editbox input:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(198,55,23,.10); }
  .dict-editbtns { display:flex; gap:7px; margin-top:2px; }
  .dict-editbtns button { flex:1; border:none; border-radius:999px; padding:8px 10px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .dict-save { background:var(--text); color:var(--surface); }
  .dict-cancel { background:var(--paper); color:var(--text); }
  .dict-clear { border: 1.5px solid var(--line); background: var(--surface); color: var(--red); border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* Плеер */
  .player { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: none; justify-content: center; z-index: 70; padding: 0; pointer-events: none; }
  .player.show { display: flex; }
  .p-bar { display: flex; align-items: center; gap: 12px; pointer-events: auto; background: transparent; }
  .pp-btn { width: 66px; height: 66px; border-radius: 50%; background: var(--ink); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: var(--surface); border: none; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 14px rgba(29,29,33,.28); display: flex; align-items: center; justify-content: center; transition: transform .12s ease; }
  .pp-btn:active { transform: scale(.93); }
  .pp-btn svg { width: 28px; height: 28px; display: block; }
  .skip-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--ink); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: none; color: var(--surface); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(29,29,33,.24); transition: transform .12s ease; }
  .skip-btn:active { transform: scale(.92); }
  .skip-btn svg { width: 24px; height: 24px; display: block; }
  .spd-wrap { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
  .spd-face { position: absolute; inset: 0; border-radius: 50%; background: var(--ink); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 3px 10px rgba(29,29,33,.24); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--surface); pointer-events: none; letter-spacing: .2px; }
  .spd-wrap select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: none; cursor: pointer; font-size: 16px; }
  .loop-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--ink); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: none; cursor: pointer; flex-shrink: 0; color: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(29,29,33,.24); transition: transform .12s ease, background .12s ease; }
  .loop-btn:active { transform: scale(.92); }
  .loop-btn svg { width: 22px; height: 22px; display: block; }
  .loop-btn.loop-on { background: var(--ink-2); color: var(--surface); box-shadow: 0 4px 14px rgba(29,29,33,.32); }

  /* Сайдбар слева (вместо нижнего таб-бара) */
  :root { --sbw: 300px; }
  @media (min-width: 900px) { :root { --sbw: 420px; } }
  .tabbar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sbw); max-width: 82vw; box-shadow: 0 0 44px rgba(29,29,33,.22); background: rgba(255,255,255,.93); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-right: 1px solid rgba(29,29,33,.07); display: none; flex-direction: column; align-items: stretch; gap: 2px; padding: calc(12px + env(safe-area-inset-top)) 10px 14px; z-index: 60; overflow-y: auto; }
  .sb-brand { display: flex; align-items: center; gap: 16px; padding: 4px 8px 22px; }
  .sb-brand img { width: 61px; height: 61px; object-fit: contain; flex-shrink: 0; }
  .sb-name { font-size: 22px; font-weight: 800; line-height: 1.15; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif; }
  .sb-sub { font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: .2px; }
  .tab { display: flex; flex-direction: row; align-items: center; gap: 16px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 14px 12px; border-radius: 19px; width: 100%; text-align: left; transition: background .15s ease; }
  .tab:hover { background: rgba(29,29,33,.04); }
  .tab .ic { display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; flex-shrink: 0; border-radius: 14px; }
  .tab .ic-img { width: 54px; height: 54px; object-fit: contain; display: block; }
  .tab .ic-img-on { display: none; }
  .tab.active .ic-img-on { display: block; }
  .tab.active .ic-img-off { display: none; }
  .tab-label { display: flex; flex-direction: column; align-items: flex-start; font-size: 22px; font-weight: 700; color: var(--ink-2); white-space: nowrap; letter-spacing: .3px; font-family: "TLCJK", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif; line-height: 1.12; }
  .tab-ru { font-family: "TLCJK", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; font-weight: 300; font-size: 13.5px; letter-spacing: .2px; color: var(--ink-3); margin-top: 3px; }
  .tab.active .tab-ru { color: var(--red-deep); opacity: .72; }
  .tab.active { background: var(--red-soft); }
  .tab.active .tab-label { color: var(--red-deep); }
  .sb-ver { margin-top: auto; padding: 18px 12px calc(6px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-3); letter-spacing: .3px; text-align: left; font-weight: 500; }
  .sb-offline { padding: 0 12px 6px; }
  .sb-offline-btn { width: 100%; padding: 10px 12px; border: 1px solid rgba(29,29,33,.12); border-radius: 12px; background: var(--surface); color: var(--red-deep); font-size: 13px; font-weight: 700; cursor: pointer; transition: .15s ease; }
  .sb-offline-btn:hover { border-color: var(--red); background: var(--red-soft); }
  .sb-offline-btn:disabled { opacity: .7; cursor: default; }
  .sb-offline-btn.ready { color: var(--ink-2); border-color: rgba(29,29,33,.1); background: var(--paper); cursor: default; }
  .sb-offline-st { margin-top: 6px; font-size: 11px; color: var(--ink-3); text-align: center; line-height: 1.35; }
  .ic-tuan { background: var(--red); color: var(--surface); font-size: 27px; font-weight: 800; font-family: "TLCJK", "SimSun","Songti SC","STSong",serif; display: flex; align-items: center; justify-content: center; }
  /* меню — оверлей поверх контента; контент справа полупрозрачный, пока меню открыто */
  .app, .player { transition: opacity .3s ease; }
  body.sb-open .app, body.sb-open .player { opacity: .45; }
  .tabbar { transition: transform .28s cubic-bezier(.25,.8,.3,1); }
  .tabbar.sb-drag { transition: none; }
  body.sb-off .tabbar { transform: translateX(-104%); }
  @media (min-width: 900px) {
    .tab .ic, .tab .ic-img { width: 64px; height: 64px; }
    .tab-label { font-size: 24px; }
    .tab-ru { font-size: 15px; }
    .sb-brand img { width: 70px; height: 70px; }
  }
  /* Кнопка ☰ — только для узких окон с мышью (на телефоне её нет, там свайп) */
  .menu-btn { display: none; position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; z-index: 65; width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(29,29,33,.08); background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 6px 18px rgba(29,29,33,.14); font-size: 20px; line-height: 1; color: var(--ink-2); cursor: pointer; align-items: center; justify-content: center; }
  .menu-btn:active { transform: scale(.95); }
  @media (hover: hover) and (pointer: fine) and (max-width: 899.98px) {
    body:not(.in-unit) .menu-btn { display: flex; }
  }
  /* Десктоп: колонка меню всегда на виду, контент сдвинут вправо */
  @media (min-width: 900px) {
    #tabbar { display: flex !important; transform: none !important; box-shadow: none; }
    body { padding-left: var(--sbw); }
    .player { left: var(--sbw); }
    body.sb-open .app, body.sb-open .player { opacity: 1; }
  }

  .big-score { background: linear-gradient(135deg, var(--ink), var(--ink)); color: var(--surface); border-radius: 26px; padding: 24px 22px; margin-bottom: 18px; box-shadow: var(--shadow-pop); }
  .big-score .label { font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .big-score .num { font-size: 46px; font-weight: 900; letter-spacing: -2px; margin: 4px 0 2px; }
  .big-score .num small { font-size: 22px; color: var(--ink-3); font-weight: 700; }
  .big-score .sub { font-size: 12.5px; color: var(--ink-3); }
  .stat-row { display: flex; align-items: center; gap: 13px; padding: 13px 2px; border-bottom: 1px solid var(--paper); }
  .stat-row:last-child { border-bottom: none; }
  .stat-emoji { font-size: 22px; width: 40px; text-align: center; }
  .stat-name { flex: 1; font-size: 14px; font-weight: 700; }
  .stat-pct { font-size: 14px; font-weight: 900; }

  @keyframes slideNext { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slidePrev { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  .task-card.anim-next { animation: slideNext .3s cubic-bezier(.2,.7,.3,1); }
  .task-card.anim-prev { animation: slidePrev .3s cubic-bezier(.2,.7,.3,1); }
  .app { will-change: transform; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('bg.jpg') no-repeat center 25% / cover; opacity: .45; transform: translateZ(0); -webkit-transform: translateZ(0); will-change: transform; }
  .app { position: relative; z-index: 1; }

  /* Стартовый экран */
  #splash { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.4)), var(--line) url('bg.jpg') no-repeat center 25% / cover;
    transition: opacity .45s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-in { display: flex; flex-direction: column; align-items: center; gap: 30px; transform: translateY(-30px); }
  .splash-logo { width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
  .splash-logo img { width: 100%; height: 100%; object-fit: contain; }
  .splash-title { width: 264px; height: auto; }
  .splash-title-text { font-family: "XSHand", "TLCJK", "SimSun", "Songti SC", "STSong", serif; font-size: 58px; font-weight: 400; color: var(--red); letter-spacing: 8px; padding-left: 8px; line-height: 1.25; transform: scaleY(1.4); transform-origin: center center; }
  .splash-sub { font-size: 13px; color: var(--ink-2); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; }


/* ===== Matching (соедини пары) ===== */
.match-hint { padding: 10px 16px 2px; color: var(--ink-3); font-size: 13px; line-height: 1.45; }
.match-done { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 4px; }
.mpair { display: flex; align-items: center; gap: 10px; background: var(--ok-soft); border: 1px solid rgba(61,121,95,.28); border-radius: 14px; padding: 10px 14px; font-size: 17px; animation: mpairIn .35s ease; }
.mpair .zh { font-size: 19px; font-weight: 600; }
.mpair .eq { color: var(--ok); font-weight: 700; }
.mpair .ru { margin-left: auto; color: var(--jade); font-size: 15px; text-align: right; }
@keyframes mpairIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 16px; align-items: start; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-col .col-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--faint); text-transform: uppercase; margin: 2px 0 2px 2px; }
.match-tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 17px; line-height: 1.35; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .12s ease, border-color .12s ease, background .12s ease, opacity .25s ease; user-select: none; }
.match-tile.l { font-size: 19px; font-weight: 600; }
.match-tile:active { transform: scale(.98); }
.match-tile.sel { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 0 0 3px rgba(61,121,95,.15); }

    "text": "РАЗБОР ДИАЛОГА 1 (как я учу испанский)\n你戴着耳机听什么呢？ — Что ты слушаешь в наушниках? (戴着 — «надетые»; 呢 — «а именно?»)\n西班牙语。 — Испанский.\n听说你放暑假要去西班牙旅游，是吗？ — Говорят, на летних каникулах ты едешь в Испанию, правда? (听说 — «говорят»; 放暑假 — летние каникулы)\n你什么时候学的西班牙语呀？ — Когда ты учила испанский? (学的 — «учила когда-то», о прошлом опыте)\n天天学吗？不，只有周末去上课。 — Каждый день? Нет, только по выходным на занятия. (只有 — «только»)\n时间太少了吧？ — Времени маловато, да? (吧 — мягкое предположение)\n虽然上课不多，不过每次下了课我都听录音，所以听力提高很快。 — Хотя занятий немного, но после каждого занятия я слушаю записи, поэтому аудирование быстро растёт. (虽然……不过……; 下了课 — «после занятия»)\n\nРАЗБОР ДИАЛОГА 2 (можно послушать?)\n这本汉语书我看了，内容挺有意思的。 — Эту книгу по китайскому я прочитал, содержание довольно интересное.\n对我来说看汉语书太难了。 — Лично для меня читать книги по-китайски слишком трудно. (对我来说 — «для меня»; 太……了)\n这书有磁带吗？没有磁带，有CD，一共两张。 — Кассеты есть? Нет, есть CD, всего две.\n我听听好吗？ — Можно я послушаю? (удвоение 听听 — «чуть-чуть, попробовать»; 好吗 — вежливая просьба)\n这不会是高级的吧？ — Это ведь не продвинутый уровень? (不会……吧 — сомнение)\n别担心，不是高级的，是中级的。 — Не волнуйся, не продвинутый, а средний. (不是……是……)\n那我就听听吧。 — Тогда послушаю. (那……吧 — «тогда уж»)\n\nРАЗБОР ТЕКСТА 1 (я как раз слушаю запись)\n老师放了一段录音，我听了两遍也没听懂。 — Учитель включил запись, я прослушал дважды и всё равно не понял. (一遍/两遍 — разы от начала до конца; 也没听懂 — «и не понял»)\n我打算回家以后再听听。 — Собираюсь дома послушать ещё раз. (再 — «ещё раз»; 打算 — «планировать»)\n当我正在听CD的时候，弟弟突然从外边进来了。 — Когда я слушал CD, брат вдруг вошёл с улицы. (当……的时候 + 正在……)\n我摘下了耳机。 — Я снял наушники. (摘 — снимать)\n爸爸从书店给他买来了一盘MP3。 — Папа принёс ему из книжного диск MP3. (买来 — «купить и принести»)\n里边有一首歌特别好听。 — Там есть песня, очень красивая. (好听 — о звуке, не 好看)\n我说我正在听录音呢。 — Я сказал, что слушаю запись. (正在……呢 — «как раз»)\n没说话，关上门走了。 — Ничего не сказал, закрыл дверь и вышел.\n有的句子我听不懂。 — Некоторые предложения я не понимаю на слух. (听不懂 — потенциальная форма: 听 + 不 + 懂)\n你听听吧，一听就能听懂。 — Послушай — с первого раза поймёшь. (一……就…… — «стоит… как…»)\n\nРАЗБОР ТЕКСТА 2 (тоже послушай)\n这个故事不太难，你也听听吧。 — История не очень сложная, послушай и ты. (也 — «тоже»; 吧 — побуждение)\n他打算今年放暑假的时候去中国旅游。 — Собирается летом поехать в Китай.\n从现在起，去一个汉语学校学习半年汉语。 — С этого момента полгода учить китайский в языковой школе. (从现在起 — «начиная с…»)\n半年很快过去了。 — Полгода пролетели.\n他天天晚上去那里学习两个小时。 — Каждый вечер учится там два часа. (天天 = 每天)\n他的朋友问他汉语会了没有。 — Друг спросил, выучил ли он китайский. (……了没有 — «…или нет»)\n很简单，学会了。 — Легко, выучил. (会 — «уметь»)\n罗宾按自己的计划去了中国。 — Робин поехал в Китай по своему плану. (按 — «по, согласно»)\n在中国一定没遇到麻烦吧？ — Наверняка не столкнулся там с проблемами? (遇到麻烦 — «нарваться на неприятность»)\n我真的没遇到麻烦，不过，中国人遇到了麻烦。 — У меня проблем не было — это у китайцев они были. (шутка-развязка)\n\nКУЛЬТУРА И РЕЧЬ\n· 磁带 (кассета) / CD / MP3 — учебные записи; 听力课 — занятие по аудированию; 初级/中级/高级 — начальный/средний/продвинутый уровень.\n· 好听 — о музыке, пении, голосе; 好看 — о внешности и виде; 好玩儿 — о забаве. Не взаимозаменяемы.\n· 对我来说 — «лично для меня»; так же: 对你来说, 对他来说.\n· 一遍/两遍 — разы от начала до конца; 一次 — просто «один раз» (поход).\n· Пары: 上课/下课, 放假/放暑假/放寒假, 考试/考完.\n· 遇到麻烦 — «нарваться на неприятность»; 没问题 — «без проблем».\n\nТИПИЧНЫЕ ОШИБКИ РУССКОЯЗЫЧНЫХ\n· «我不听懂这个录音» ✗ → 我听不懂这个录音 ✓ (отрицание внутри: 听 + 不 + 懂).\n· «我听了两遍没听懂了» ✗ → 我听了两遍也没听懂 ✓ (после отрицания 了 не нужна).\n· «在听CD的时候» ✗ → 当我正在听CD的时候 ✓ (парная конструкция).\n· «对我来说太难» ✗ → 对我来说太难了 ✓.\n· 再 «ещё раз» ≠ 又 «снова (о повторе)»: 再听听 — «послушай ещё», 又听了一遍 — «снова прослушал».\n· «这本书很好看» о содержании ✗ → 内容挺有意思的 ✓ / 书很好看 — только о виде.\n· 从明天起 / 从今天起 — «начиная с…»; «从明天开始起» ✗.\n· 我听听好吗 — не «я слушаю», а просьба «можно послушать?»; отвечают 可以 / 好的.\n\nМИКРОПРОВЕРКА (сначала ответь, потом сверься)\n1) Как вежливо попросить послушать? a) 我听 b) 我听听好吗\n2) 我听了两遍也没听懂 — понял? a) да b) нет\n3) Вставь: 虽然上课不多，（　）每次下了课我都听录音。\n4) Вставь: 对我来说看汉语书太（　）了。\n5) 好听 или 好看 о песне? a) 好听 b) 好看\nОТВЕТЫ: 1 — b; 2 — b; 3 — 不过; 4 — 难; 5 — a."

    "text": "РАЗБОР ДИАЛОГА 1 (идём есть)\n我饿了。 — Я проголодался.\n我们找个饭馆吃饭吧。 — Давай найдём ресторан и поедим. (个 — «какой-нибудь»; 吧 — предложение)\n前边有个饭馆，我们去吃自助餐怎么样？ — Впереди есть ресторан, как насчёт шведского стола? (怎么样 — «как насчёт…»)\n你喜欢吃中餐还是西餐？ — Ты любишь китайскую или западную кухню? (还是 — выбор в вопросе)\n什么都行，不过，我还是喜欢吃中餐。 — Мне всё равно, но я всё-таки люблю китайскую. (什么都行; 还是 — «всё-таки»)\n那里有包子、饺子、炒饭和各种炒菜，你想吃什么就吃什么。 — Там баоцзы, цзяоцзы, жареный рис и разные жареные блюда — ешь что хочешь. (……就……)\n\nРАЗБОР ДИАЛОГА 2 (карточка и время)\n你是去食堂吃晚饭吗？ — Ты идёшь в столовую ужинать?\n我的饭卡里没钱了，得先去充值。 — На карте кончились деньги, надо сначала пополнить. (得 děi — «надо»; 先 — «сначала»)\n充值的地方可能关门了，你先用我的饭卡吧。 — Касса, возможно, уже закрыта, возьми мою карту. (可能 — «возможно»; 关门 — закрыться)\n你知道食堂几点关门吗？ — Знаешь, во сколько закрывается столовая?\n不知道，我一般都是六点多吃晚饭。 — Не знаю, я обычно ужинаю в седьмом часу. (一般 — «обычно»)\n现在几点了？— 差十分七点。 — Сколько времени? — Без десяти семь. (差 — «не хватает»)\n\nРАЗБОР ТЕКСТА 1 (столовые в кампусе)\n我们大学有好几个学生食堂。 — В нашем университете несколько студенческих столовых. (好几 + счётное = «несколько, порядочно»)\n教学楼旁边有一个，宿舍楼旁边有一个。 — Одна рядом с учебным корпусом, одна у общежития.\n你想去哪个就去哪个，非常方便。 — Иди в любую, очень удобно. (哪个……就哪个)\n这些学生食堂大小不一样。 — Столовые разные по размеру.\n最大的有几百个座位，最小的只有几十个座位。 — В самой большой несколько сотен мест, в самой маленькой — всего десятки.\n为了方便学生吃饭，每个学生食堂开门的时间也不一样。 — Чтобы студентам было удобно, у каждой свой график. (为了 — «для того чтобы»)\n有的是白天12个小时都开着门。 — Некоторые открыты 12 часов днём.\n吃饭的时候，每个食堂的学生都很多，但你不用担心排队问题。 — Народу много, но очереди не пугают. (排队 — стоять в очереди)\n用饭卡买饭速度很快。 — По карте всё очень быстро. (速度 — скорость)\n从你走进食堂挑选饭菜到刷卡，大概只要十几分钟。 — От входа и выбора до оплаты — минут пятнадцать. (大概 — «примерно»)\n\nРАЗБОР ТЕКСТА 2 (вилка и палочки)\n苏珊和卡琳都是意大利人。 — Сьюзан и Карин обе итальянки.\n卡琳在中国的一个意大利公司工作。 — Карин работает в итальянской компании в Китае.\n苏珊要了一碗面条，卡琳要了一碗炒饭。 — Сьюзан заказала лапшу, Карин — жареный рис. (要 — заказывать)\n苏珊用叉子，卡琳用筷子。 — Сьюзан вилкой, Карин палочками. (用 — пользоваться)\n苏珊问卡琳是什么时候学会用筷子的。 — Сьюзан спросила, когда Карин научилась есть палочками. (学会 — «научиться»)\n她在意大利的时候就学会了。 — Научилась ещё в Италии.\n因为那时候她一到周末就去中国饭馆吃饭。 — Потому что по выходным ходила в китайский ресторан. (一……就……)\n苏珊说很丰富，每顿饭都有米饭、馒头、包子。 — Сьюзан говорит, что разнообразно: рис, пампушки, баоцзы.\n他们吃的是自助餐，想吃什么就拿什么。 — У них шведский стол: бери что хочешь. (拿 — брать руками)\n不用担心不会说汉语的问题。 — Не надо переживать, что не говоришь по-китайски.\n\nКУЛЬТУРА И РЕЧЬ\n· 食堂 — столовая (в школе, на работе), 饭馆/餐馆 — ресторан, 自助餐 — шведский стол.\n· 饭卡 — карта питания в кампусе; 充值 — пополнить; 刷卡 — оплатить картой; 排队 — стоять в очереди.\n· 筷子 — палочки, 叉子 — вилка, 勺子 — ложка; 用筷子 — есть палочками.\n· Еда: 中餐/西餐, 炒饭 (жареный рис), 炒菜 (жареное блюдо), 面条, 馒头, 包子, 饺子.\n· 好几 + счётное слово = «несколько, порядочно»: 好几个食堂, 好几个人.\n· 差十分七点 — «без десяти семь»; 差五分八点 = 07:55; 差一刻 = «без четверти».\n\nТИПИЧНЫЕ ОШИБКИ РУССКОЯЗЫЧНЫХ\n· «我想吃什么就吃» ✗ → 你想吃什么就吃什么 ✓ (в ……就…… обе части повторяются).\n· 还是 vs 或者: в вопросе «или» — 还是, в утверждении — 或者. «你喜欢中餐或者西餐？» ✗.\n· «我吃筷子» ✗ → 我用筷子 ✓ (用 — «пользоваться»).\n· 得 в 得先去充值 читается děi «надо», а не de — иначе смысл теряется.\n· «我的饭卡没钱了» ✓, но точнее 我的饭卡里没钱了 — 里 «на карте».\n· 差十分七点 — это 6:50, а не 7:10 (差 — «не хватает»).\n· 学会 «научиться» ≠ 学 «учить»: 学会用筷子 ✓, «学用筷子» — «учиться пользоваться», смысл другой.\n· 一般 «обычно» ставится перед глаголом: 我一般都是六点多吃晚饭.\n\nМИКРОПРОВЕРКА (сначала ответь, потом сверься)\n1) Как сказать «ешь что хочешь»? a) 你想吃什么就吃什么 b) 你想吃什么可以吃\n2) 差十分七点 — это a) 6:50 b) 7:10\n3) Вставь: 我的饭卡里没钱了，（　）先去充值。\n4) Вставь: 那里有包子、饺子，你想吃什么（　）吃什么。\n5) 还是 или 或者 в вопросе? a) 还是 b) 或者\nОТВЕТЫ: 1 — a; 2 — a; 3 — 得; 4 — 就; 5 — a."

    "text": "ГОВОРИМ САМИ — 说一说\n\nОтвечай вслух: сначала китайская фраза, потом по-русски своими словами.\n\n1. Подстановочная таблица (还是 в вопросе / 或者 в утверждении)\n你 + 想喝茶 / 想去爬山 / 现在走 + 还是 + 喝咖啡 / 去看电影 / 等一会儿？\n你可以 + 喝茶 / 坐地铁 / 发微信 + 或者 + 喝咖啡 / 打车 / 打电话。\n桌子上 + 放 / 摆 + 着 一杯咖啡；墙上 + 挂 / 贴 + 着 一幅画；床上 + 躺 + 着 一只猫。\nСчётные слова: 一 + 条 + 裤子 / 绳子 / 蛇；一 + 根 + 筷子 / 香蕉 / 手指；一 + 道 + 题 / 彩虹。\n\n2. Разговорные вопросы (из урока — отвечай развёрнуто)\n• 你想喝茶还是喝咖啡？ → 我喝茶吧，晚上喝咖啡睡不着。\n• 周末你常常做什么？ → 周末我常常爬山或者看电影。\n• 桌子上放着什么？ → 桌子上放着一杯咖啡和几本书。\n• 你有几条裤子？几根筷子？ → 我有三条裤子，家里有十根筷子。\n• 爬山要注意什么？ → 要小心台阶，别粗心，不然会摔倒。\n• 你记得我们学过哪些生词？ → 我记得「爬山、小心、台阶」，可是「谨慎」我不常用。\n\n3. Мини-диалог «в горах» (проговори оба голоса)\nА: 周末我们去爬山还是去看电影？\nБ: 爬山吧，秋天气候好。\nА: 当心台阶，上面有点儿滑！\nБ: 放心，我会小心的。\nА: 啊，这儿有条蛇——快走！\nБ: 别怕，它比我们还怕呢，我们慢慢下去。\n\n4. Задание «история в 6 фраз»\nОпиши свою комнату и планы на выходные. Обязательно используй: 放着 · 挂着 · 还是 · 或者 · 会.\nШаблон: 我的房间里放着一张桌子，墙上挂着一张中国地图。桌上放着一杯茶和一条围巾。周末我想去爬山，或者去看电影也行。我一定会带上水和雨伞，因为山里天气会变。"

    "text": "小学的时候，我考试得了第一名，老师给了我一本《世界地图》。我太喜欢那本地图了，一回到家就看了起来。那一天，轮到我给全家人烧洗澡水，我就一边烧水一边看地图。我最喜欢的国家是埃及，“长大以后我一定要去埃及……”我看着埃及地图想。\n突然，一个人围着浴巾从浴室里冲出来，对着我大叫：“你在干什么呢？火都灭了！”是爸爸，他最讨厌做事不认真的人。我说：“对不起！我在看地图呢。”爸爸生气地说：“看什么地图！快烧火！”“我在看埃及地图呢。”我小声说。爸爸更生气了，打了我一巴掌：“看什么埃及地图！你一辈子也去不了那么远的地方！快烧火！”我不敢再看下去了，只好放下地图，继续烧水。我一边烧水一边想：“我真的去不了埃及吗？”\n20年后，我第一次出国就去了埃及。在埃及，我给爸爸寄回一张明信片，上面写着：“亲爱的爸爸，我现在正在埃及，我的面前就是金字塔。您还记得吗？小时候，因为我看埃及地图，您打了我，还说我一辈子也去不了埃及。我要谢谢您的那句话！”\n爸爸看着明信片，不好意思地问我妈妈：“我什么时候说过那样的话？我说过吗？打了一下就那么灵？这小子真的到埃及去了？”"

    "text": "1. V/Adj + 起来 — начало и продолжение действия: 看起来 — начать смотреть; 唱起来 — запели; 热起来 — стало жарко; 高兴起来 — стал весёлым.\nЕсли у глагола есть объект, он ставится МЕЖДУ 起 и 来: 看起地图来 — начал смотреть карту; 唱起歌来 — запел песню; 查起词典来 — начал искать в словаре.\nПримеры: 一回到家就看了起来; 她大声唱起歌来; 最近热起来了; 听了我的话，她笑了起来.\n\n2. V + 什么 + (N) — недовольство, запрет, отрицание («какой там…!», «нечего…!»): 看什么地图！— Какая ещё карта!; 都快迟到了，还吃什么！— Уже опаздываем, а ты ещё ешь!; 唱什么！别人都在睡觉呢！; 预习什么课文！\nТолько в устной эмоциональной речи; не путать с обычным вопросом «что?».\n\n3. V + 得了 / 不了 (liǎo) — могу / не могу. 了 здесь читается liǎo, не le!\nЗначение 1 — действие вообще состоится: 去不了 — не смогу поехать; 今天来不了 — сегодня не сможет прийти; 车坏了，开不了 — машина сломалась, не поедем; 你翻译得了吗？\nЗначение 2 — не осилить объём (часто = 不完): 这么多，咱们肯定吃不了; 这么多啤酒，你一个人喝得了吗？\n\n4. V/Adj + 下去 — продолжение действия или состояния: 学下去 — продолжать учиться; 走下去 — идти до конца; 胖下去 — толстеть дальше; 看下去 — смотреть дальше.\nПримеры: 虽然外语很难，但是我还要学下去; 如果你不锻炼，你可能还会胖下去; 这个工作太累了，我不想干下去了.\n\nСравнение: 起来 — начало (唱起来 — запел); 下去 — продолжение (唱下去 — продолжать петь).\nШпаргалка: V+起来 — начало (看了起来); V+起+Obj+来 — начало с объектом (看起地图来); V+什么 — недовольство (看什么地图！); V+得了 — могу (修得了); V+不了 — не могу (去不了); V+下去 — продолжение (看下去); Adj+下去 — продолжение состояния (胖下去).",

    "text": "РАЗБОР ЛЕКСИКИ — как эти слова живут в речи\n\nСлова урока удобно держать четырьмя гнёздами: память и чувства · время и этапы жизни · люди и действия · описание и сравнение. Ниже — главное по каждому гнезду: с чем сочетается, что легко перепутать, где ошибка русскоязычного.\n\n1) ПАМЯТЬ И ЧУВСТВА\n• 旧梦 — «старый сон». Слово книжное, поэтичное: в разговоре чаще 过去的回忆. Устойчиво: 旧梦重温 — вновь пережить былое.\n• 往事 — прошлое, былое. Связки: 回忆往事 — вспоминать прошлое; 往事如烟 — былое как дым. Пример: 我们一边喝茶，一边聊起往事。 — Мы пили чай и вспоминали прошлое.\n• 梦 — сон и мечта. Гнездо: 做梦 — видеть сон; 梦见 — увидеть во сне кого-то; 梦想 — мечта-цель; 做白日梦 — витать в облаках. Пример: 我昨天梦见了我的初恋。 — Вчера мне приснилась моя первая любовь.\n• 难忘 — незабываемый. 难忘的回忆 — незабываемые воспоминания; 令人难忘 — запоминающийся. Пример: 那是我一生中最难忘的一天。 — Это был самый незабываемый день в моей жизни.\n• 忘记 — забыть, нейтральное слово. 别忘了 — не забудь. ⚠️ Не путать с 忘掉 — «забыть окончательно».\n• 初恋 — первая любовь. 初恋情人 — сама первая любовь (человек); 初恋的感觉 — чувство первой любви. В интернете есть сленг 初恋脸 — «лицо первой любви».\n• 爱情 — романтическая любовь. 相信爱情 — верить в любовь; 爱情故事 — история любви. ⚠️ Не путать с 爱 — «любить» (можно маму, город, чай). 爱情 — только про мужчину и женщину.\n• 你相信一见钟情还是日久生情？ — Ты веришь в любовь с первого взгляда или в чувство, выросшее со временем? (一见钟情 — с первого взгляда; 日久生情 — со временем).\n\n2) ВРЕМЯ И ЭТАПЫ ЖИЗНИ\n• 一生 — вся жизнь. 一生一世 — всю жизнь (клятва в любви); 一生中 — за всю жизнь. Пример: 我一生都不会忘记你。 — Я не забуду тебя всю свою жизнь. Разговорный синоним: 一辈子 (был в 7-м уроке).\n• 老年 — старость, пожилой возраст. 老年人 — пожилые люди; 进入老年 — вступить в старость. Антонимы: 青年 — молодость, 童年 — детство.\n• 年龄 — возраст. 年龄多大？ — сколько лет (вежливо); 适合的年龄 — подходящий возраст. Пример: 我们年龄差不多。 — Мы примерно одного возраста.\n• 年级 — класс, в котором учишься. 几年级？ — в каком классе?; 同年级 — в одном классе. Пример: 我小学三年级的时候认识了她。 — Я познакомился с ней в третьем классе начальной школы. ⚠️ 年龄 — сколько лет, 年级 — какой класс. Не путать!\n• 刚刚 — только что (наречие). 刚刚开始 — только что началось; 刚刚好 — как раз, в самый раз. ⚠️ 刚刚 — наречие (他刚刚走 — он только что ушёл); 刚才 — существительное «только что, недавно» (刚才他还在 — только что он ещё был здесь).\n• 有时 — иногда. 有时……有时…… — иногда…, иногда… Пример: 有时我会想起她。 — Иногда я вспоминаю о ней.\n• 进入 — войти, вступить. 进入房间 — войти в комнату; 进入（上）大学 — поступить в университет; 进入老年 — вступить в старость. Слово книжное: в разговоре скорее 进 или 上.\n\n3) ЛЮДИ И ДЕЙСТВИЯ\n• 同事 — коллега. 老同事 — старый коллега; 同事关系 — отношения с коллегами. Пример: 他是我以前的同事。 — Он мой бывший коллега.\n• 照顾 — заботиться, присматривать (тёплое слово, часто семейное). 照顾孩子 — заботиться о ребёнке; 照顾病人 — ухаживать за больным; 互相照顾 — заботиться друг о друге.\n• 领 — вести за собой; а ещё «возглавлять» и «получать». 领路 — вести дорогу; 领导 — руководитель; 领工资 — получать зарплату. В уроке: 领着她 — вести её за собой.\n• 拉手 — держаться за руки. 拉一把 — подтянуть, выручить («我这道数学题做不出来了，可以拉我一把吗？» — не могу решить задачу, выручишь?). Пример: 他们拉着手在马路上走。 — Они шли по улице, держась за руки.\n• 亲 — целовать. 亲一下 — поцеловать (один раз); 亲嘴 — целоваться в губы; 亲吻 — целовать (книжно). Второе значение: «родной» — 亲人, 亲戚 — родственники.\n• 告别 — прощаться. 告别过去 — попрощаться с прошлым; 向……告别 — попрощаться с кем-то. Пример: 我们告别的时候，她哭了。 — Когда мы прощались, она плакала.\n• 飞吻 — воздушный поцелуй. 送飞吻 — послать воздушный поцелуй (милое, разговорное).\n• 使劲儿 — изо всех сил. 使劲儿拉 — тянуть изо всех сил; 别使劲儿 — не напрягайся. Эмоционально-разговорное; в формальной речи — 用力.\n• 打听 — разузнавать, наводить справки. 打听消息 — разузнавать новости; 打听一个人 — наводить справки о человеке. Пример: 我到处打听她的消息。 — Я везде разузнавал о ней.\n• 消息 — новость, информация. 好消息 — хорошая новость; 坏消息 — плохая; 发消息 — отправить сообщение (сегодня чаще «написать в мессенджере»).\n• 出现 — появляться. 出现问题 — возникла проблема; 突然出现 — внезапно появиться (синоним 忽然). Пример: 她突然出现在我面前。 — Она внезапно появилась передо мной.\n\n4) ОПИСАНИЕ, СРАВНЕНИЕ, ОКРУЖЕНИЕ\n• 比 — «чем» в сравнении: A 比 B + прилагательное. Пример: 她比我矮。 — Она ниже меня. ⚠️ Не путать с 比较 — «сравнительно, довольно».\n• 矮 — низкий (о росте). 个子矮 — низкого роста; 比他矮 — ниже его. Антоним: 高.\n• 双 — счётное слово «пара»: 一双鞋 — пара обуви; 一双眼睛 — пара глаз; 双人床 — двуспальная кровать. Ещё «двойной»: 双赢 — взаимная выгода (win-win).\n• 闭 — закрывать. 闭上眼睛 — закрыть глаза; 闭嘴 — «закрой рот» (грубо). Пример: 请闭上眼睛，许个愿。 — Закрой глаза и загадай желание.\n• 马路 — дорога, улица. 过马路 — переходить дорогу; 在马路上 — на дороге. Дословно «лошадиная дорога» — раньше по улицам ездили лошади.\n• 中 — в, среди, посередине. 一生中 — за всю жизнь; 在……中 — в процессе; 心中 — в сердце. Пример: 他是我一生中最好的朋友。 — Он мой лучший друг за всю жизнь.\n• 并 — усиление отрицания: 并不 — вовсе не; 并没有 — совсем не (в прошлом). Пример: 我并不认识他。 — Я вовсе его не знаю. Очень «живое» слово уровня HSK 4 — речь сразу становится естественнее.\n• 活 — жить, быть живым. 活着 — быть живым; 活到老，学到老 — век живи, век учись. Пример: 她还活着吗？ — Она ещё жива?\n• 广东话 — кантонский диалект. 说广东话 — говорить на кантонском; 广东人 — житель Гуандуна. На кантонском говорят в Гонконге и Макао; после путунхуа это самый распространённый «китайский» в мире.\n"

    "text": "ГРАММАТИКА УРОКА — пять конструкций, которые стоит унести с собой\n\n1. СРАВНЕНИЕ: A 比 B + прилагательное\n她比我矮。 — Она ниже меня.\n我比他大两岁。 — Я на два года старше его.\n今天比昨天冷一点儿。 — Сегодня немного холоднее, чем вчера.\nОтрицание — не 不比 в значении «не такой, как»: 我不比她矮 (я не ниже её) · 我没有她高 (я не такой высокий, как она).\n⚠️ Ошибка русскоязычных: «я более чем он высокий» → 我比他高 ✓; нельзя 我比他很/更 + прилагательное — после 比 не ставят 很/非常.\n\n2. УСИЛЕНИЕ ОТРИЦАНИЯ: 并 / 并不 / 并没有\n我并不认识他。 — Я вовсе его не знаю.\n她并没有生气。 — Она вовсе не рассердилась (а ты думал, что да).\n并 ставится перед 不/没有 и звучит как возражение собеседнику: «да нет же, не так».\n\n3. 有时……有时…… — «иногда…, иногда…»\n有时我会想起她。 — Иногда я вспоминаю о ней.\n周末他有时去爬山，有时在家看书。 — По выходным он то идёт в горы, то читает дома.\n\n4. 刚刚 и 刚才 — «только что»\n刚刚 — наречие, стоит перед глаголом: 他刚刚走。 — Он только что ушёл.\n刚才 — существительное времени, может стоять в начале: 刚才他还在。 — Только что он ещё был здесь.\n⚠️ Нельзя «刚刚 he is here»: для «только что был» — 刚才他在。\n\n5. 双 — счётное слово для пар\n一双鞋 · 一双眼睛 · 一双筷子 · 双人床 · 双赢\n⚠️ По-русски «пара», по-китайски нельзя 两个鞋 — только 一双鞋.\n\n6. 中 — «в, среди, за (время)»\n一生中 — за всю жизнь; 心中 — в сердце; 在……中 — в процессе чего-то.\n他是我一生中最好的朋友。 — Он мой лучший друг за всю жизнь.\n\n7. ГЛАГОЛЫ БЫТА: 领 · 拉 · 亲 · 照顾\n她领着我走进了老院子。 — Она повела меня в старый двор.\n他们拉着手在马路上走。 — Они шли по улице, держась за руки.\n妈妈亲了一下孩子的额头。 — Мама поцеловала ребёнка в лоб.\n你要好好照顾自己。 — Тебе надо хорошо о себе заботиться.\n\n8. 活 / 活着 — жить\n她还活着吗？ — Она ещё жива?\n活到老，学到老。 — Век живи, век учись.\n"

    "text": "ГОВОРИМ САМИ — 说一说\n\nОтвечай вслух: сначала китайская фраза, потом по-русски своими словами.\n\n1. Подстановочная таблица (вводные слова и советы)\n其实 / 说实话 / 老实说 / 听说 / 在我看来 / 一般来说 + ，……\n我 + 建议你 + 早点儿睡 / 多喝点儿水 / 明天早点儿来 / 先休息一下。\n别忘了 / 千万 + 记住 / 别迟到 / 别熬夜 —— 还是入乡随俗吧。\n都12点了，该 + 睡觉 / 走了 + 了；我已经 + 吃过了 / 到了 / 看完了。\n\n2. Разговорные вопросы (из урока — отвечай развёрнуто)\n• 为什么中国学校早上8点上课？ → 因为中国人都习惯早睡早起。\n• 你习惯早睡早起吗？ → 说实话，我以前习惯熬夜，现在慢慢习惯了。\n• 如果不习惯当地的规矩，你怎么办？ → 我看还是入乡随俗吧，先试一个月再说。\n• 你怎么给别人提建议？ → 我一般说：我建议你先试一下，别着急。\n• 哪些词你觉得最有用？ → 我觉得“其实、说实话、在我看来”最有用，谈生意的时候能缓一缓语气。\n• 你怎么记住生词？ → 我把生词和自己的生活绑在一起，比如“早睡早起”就想我女儿。\n\n3. Мини-диалог «местные обычаи» (проговори оба голоса)\nА: 明天早上7点在操场集合，通知大家了。\nБ: 这么早啊？我早上特别不想起床。\nА: 中国人都习惯早睡早起。我建议你晚上早点儿睡。\nБ: 为什么不能晚一点儿开始呢？\nА: 我看你呀，还是入乡随俗吧。我刚来的时候也不习惯。\nБ: 好吧，其实早睡早起也不错。这个词我得记住——入乡随俗。\n\n4. Задание «история в 6 фраз»\nРасскажи, к какому местному обычаю ты привыкал(а). Обязательно используй: 入乡随俗 · 习惯 · 建议 · 记住 · 其实.\nШаблон: 刚来的时候我不习惯早上8点上班，其实我一直熬夜。同事都建议我早点儿睡，我也只好试试。半年以后我竟然习惯了，早睡早起精神好多了。现在我常跟新来的同事说：先入乡随俗，别的以后再说。这个道理我记住了。"

    "audio": "211-0e.mp3",
    "text": "💫 入乡随俗\n\n上个星期六，我的中国朋友小李请我去他家吃饭。对我来说，这可不是一件简单的事：我从来没去过中国人的家，心里既紧张又期待。\n\n出门之前，我给他发微信问：“需要我带点儿什么？”他马上回：“什么也别带，来就行。”可是同事却说：“空着手去人家家里，不太礼貌。入乡随俗，最好带一份小礼物。”我想了想，还是买了一盒茶叶和一些水果。\n\n小李一开门就笑了：“欢迎欢迎！快进来，别客气！”看见我手里的东西，他连说：“你太客气了，真是的！”他妻子从厨房走出来，一边擦手一边说：“来就来呗，还带这么多，我们反而过意不去。”\n\n桌子上摆了七八个菜，看起来既丰盛又热闹。她一直给我夹菜，说：“多吃点儿，别不好意思，当自己家。”我已经吃得很饱了，可是她还是不停地夹。我只好再三说：“真的吃不下了，您做得太好吃了。”小李低声告诉我：“在中国，主人热情，客人就得接受。你不想吃，也可以把菜推回去，但是千万别让她觉得你不喜欢。”\n\n说实话，当时我有点儿尴尬，甚至有点儿受不了这种热情。不过后来我才明白，他们不是要我吃很多，而是想让我感到被重视。吃完饭，我们一边喝茶，一边聊天。他妻子问我在中国过得怎么样。我说：“刚来的时候不太习惯，现在越来越喜欢了，蛮喜欢的，尤其是跟家人在一起的时候。”\n\n离开时他们非要再给我装一袋水果。我推了几次，最后还是收下了——盛情难却。小李站在门口说：“有空再来，把这儿当自己家。下次别再带礼物了，来吃饭就行。”\n\n回到家我才发现，这次做客不但让我吃到了好吃的菜，还让我对“客气”和“热情”有了新的理解。原来有些话不是表面的意思：别人说“别带东西”，你最好还是带；别人说“再吃一点儿”，你可以笑着拒绝，但一定要领情。"

    "text": "ГОВОРИМ САМИ — 说一说\n\nОтвечай вслух, целиком: сначала китайская фраза, потом по-русски своими словами. Не «переводи в голове» — говори шаблоном и подставляй своё.\n\n1. Подстановочная таблица (уступка 要不是…，就…)\n要不是 + 你提早打电话叫我起床 / 同事提醒我 / 我定了三个闹钟 + 我 + 就 + 迟到 / 赶不上面试 / 错过这次面谈\nПример: 要不是你提早打电话叫我起床，我就迟到了。 — Если бы ты заранее не позвонил и не разбудил меня, я бы опоздал.\nТеперь добавь оправдание — что случилось по дороге:\n一路都堵车 / 半路公交车爆胎 / 我走错了部门 → 足足花了两个小时才到 / 足足等了半个小时\nПример: 一路上都在堵车，半路公交车还爆胎，足足花了两个小时才到。\n\n2. Разговорные вопросы (из урока — отвечай развёрнуто)\n• 你昨天的面试怎么样？ → 挺顺利的，他们叫我下礼拜再去面谈。\n• 面试的时候你最怕什么？ → 我最怕迟到，所以我提早一个半小时出门。\n• 从你家到公司要多久？ → 不堵车的话四十分钟，堵车就说不准了。\n• 你上班迟到过吗？因为什么？ → 有一次半路爆胎，幸好赶上了，没被主管发现。\n• 你觉得面试最重要的是什么？ → 我觉得经验只是一方面，主要还是取决于你怎么谈。\n• 收入重要还是学习重要？你会为了收入放弃学习吗？ → 收入重要，但我不会放弃学习。\n• 你对这份工作有什么看法？ → 我的看法是：先做起来，再谈收入。\n\n3. Мини-диалог «собеседование» (проговори оба голоса, потом поменяйся)\nА: 请先自我介绍一下。\nБ: 我叫……，做了五年销售，主要是跟医院和经销商打交道。\nА: 你为什么想换工作？\nБ: 老实说，我想去收入更高一点的部门。\nА: 那你为什么放弃以前的工作？\nБ: 不是因为钱，是我想多学一点东西。\nА: 下礼拜我们面谈，别迟到。\nБ: 好，我一定提早到——我可不想半路爆胎。\n\n4. Задание «история в 6 фраз»\nРасскажи случай, когда ты чуть не опоздал (на урок, на поезд, на собеседование). Обязательно используй: 要不是 · 提早 · 堵车 · 幸好 · 赶上.\nШаблон: 那天要不是我提早出门，就赶不上了。半路堵车堵得厉害，足足等了一个小时。幸好我提前订好了票，最后还是赶上了。多亏了……，不然就迟到了。"

    "titleZh": "注释 · 得 · 得",
    "text": "得 (de) — структурная частица. Схема: 动词/形容词 + 得 + 补语 (дополнение результата или степени).\n你的汉语说得真好。 — Ты говоришь по-китайски действительно хорошо.\n他的生意做得很不错。 — Дела у него идут совсем неплохо.\n这个酒吧管理得太好了。 — Этим баром управляют отлично.\n他们玩儿得很高兴。 — Им было очень весело.\n安娜高兴得说个不停。 — Анна так обрадовалась, что говорила без умолку.\nОтрицание: 说得不好 / 说得不太好. Вопрос: 你说得怎么样？\nВажно: 得 стоит только после глагола или прилагательного — никогда после существительного (✗ 汉语说得好 → ✓ 汉语说得很好).\n\n得 (děi) — модальный глагол «должен, нужно, придётся» (разговорный: по своей воле или по обстоятельствам).\n我得好好谢谢你。 — Я должен тебя хорошенько поблагодарить.\n你得多练习。 — Тебе надо больше практиковаться.\n现在八点钟了，我得去上班了。 — Уже восемь, мне пора на работу.\n开车的时候，得系好安全带。 — За рулём надо пристёгиваться.\nОтрицание: 不用 / 不要 / 不必 (不用工作 «не надо работать»), но не ✗ 不得.\n\n不过 — «однако, только» в разговоре: 他人不错，不过有点儿忙。\n当然 — «конечно, разумеется»: 当然可以。\n\nМИКРОПРОВЕРКА (ответы под вопросами)\n1. 你的汉语说（　）很好。 → 得 (de)\n2. 现在很晚了，我（　）回家了。 → 得 (děi)\n3. 他跑（　）很快。 → 得 (de)\n4. 明天有考试，我（　）复习。 → 得 (děi)"

    "titleZh": "注释 · 又/再 · 要",
    "text": "1. 又 и 再 — оба «снова, опять», оба наречия, оба про повторение одного действия. Но:\n• 又 — только для УЖЕ совершённого действия: 他前天来了，昨天又来了。 — Он приходил позавчера, а вчера пришёл снова.\n• 再 — для ещё не совершённого, будущего или предполагаемого: 请你明天再来。 时候还早，再坐会儿吧！\n• «Больше нельзя» — тоже 再: 你已经喝了很多啤酒，可不能再喝了。\n• Последовательные действия в одном предложении — 又: 他喝了很多啤酒，又吃了很多蛋糕。\n• В двух примерах из книги 又 и 再 формально можно поменять, но меняется смысл — очерёдность и акцент:\n我给了他一本书，又给他一本词典，他就高兴了。 — дал книгу, и к тому же ещё словарь (как продолжение).\n我给了他一本书，再给他一本词典，他就高兴了。 — дал книгу, а словарь дам следующим шагом.\n\n2. 要 как глагол — «нужно, хотеть получить»: 人不能没有钱，谁不要钱？ 他要了一杯可口可乐。 一年要多少学费？\n\n3. 要 как модальный глагол (перед сказуемым) — желание или объективная необходимость: 你要好好学汉语。 我要去买蛋糕。 请不要大声说话！\n\n4. 要 / 要是 как союз — «если»; 要是 разговорнее: 他要不喜欢，你就别给他买。 你要是能来，那就太好了。 你要是不高兴听，我就不说了。\n\n5. 补充生词: 有事儿 — быть занятым; 为 — для, ради; 效劳 — служить кому-л.: 为您效劳 — «к вашим услугам»."

    "text": "РАЗБОР ДИАЛОГА\n• 王老师: 你们会买东西吗？ 珍妮: 会。一手交钱，一手交货。 — «деньги в одну руку, товар в другую»: заплатил — забрал. 杰克 сомневается: 这么简单？ — «Неужели так просто?»\n• 杰克: 喂，苹果多少钱一斤？ 珍妮: 不能在这儿买。 — «Здесь покупать нельзя». Причина: 这个卖苹果的，是我朋友的爸爸！ — продавец — отец её друга; торговаться у знакомого неудобно.\n• 杰克 не понял: 怎么？你不会砍价？ — «Что, ты не умеешь торговаться?» 珍妮 отвечает формулой урока: 不是不会砍价，是不能在这儿砍价！ — «Не то чтобы не умею, а нельзя здесь».\n• Дальше 珍妮 всё-таки торгуется, но у другого лотка: 十二块三斤 → 十块三斤，卖不卖？ → 小贩: 十块两斤半！ → 珍妮: 什么？还是四块钱一斤？小老板，你真会蒙人！ → 十块钱三斤不卖，我们走了！ → 小贩 сдаётся: 好，好，十块三斤！\n• 珍妮 довольна: 怎么样？我砍掉他两块钱！ («сбила два юаня»). 杰克 ставит точку: 你去称称，最多两斤半！ → 珍妮: 真的？那还是四块钱一斤呀！ — «Так это по-прежнему четыре юаня за цзинь!»\n• Вывод 王老师: 怎么样，买东西不简单吧？ — Считать надо не «сколько скинул», а цену ЗА ЦЗИНЬ и вес на весах.\n\nРАЗБОР ЦЕН (посчитай вслух)\n十二块三斤 = 4 юаня/цзинь; 十块三斤 = 3,33; 十块两斤半 = 4 юаня/цзинь. Скидка «на слово» при недовесе — не скидка.\n\n注意\n• 蒙人 — «обмануть, надуть»: 你真会蒙人！ — «Ну ты и мастер надувать!»\n• 一手交钱，一手交货 — идиома: расчёт и товар одновременно.\n• 砍价 — торговаться, буквально «рубить цену»."

    "text": "РАЗБОР ДИАЛОГА\n• 王老师: 同学们都来了吗？ 珍妮: 安娜和杰克没有来。 — «Анна и Джек не пришли». 老师 сразу уточняет: 他们怎么了？ — универсальный вопрос «что с ними? что случилось?»\n• 珍妮: 安娜病了，杰克陪她去医院了。 — 陪 = сопровождать: Джек пошёл с ней (не «повёл», а «был рядом»).\n• Дальше цепочка уточнений врача-преподавателя: 什么病？ → 可能是感冒了，她说很不舒服。 → 发烧吗？量体温没有？ → 量了。38.5°C。 → 啊，烧得不低。咳嗽吗？\n• 珍妮 добавляет важное: 不咳嗽，嗓子也不疼，可总叫口渴。 — «Кашля нет и горло не болит, НО всё время просит пить»: 可 здесь = «но» (перелом мысли).\n• 王老师: 应该多喝水。 珍妮 возражает: 那可不行！她拉肚子。 — «Тут-то нельзя: у неё понос». 老师: 拉肚子就更得多喝水了。 — 更 = «тем более». 珍妮 ловит логику: 那不更要拉肚子了吗？ 老师 успокаивает: 哦，不会的。\n• 山口 предлагает свою версию: 我想，她不一定是感冒了，很可能是吃坏了肚子。 — «Не обязательно простуда, скорее всего, расстроила живот едой»: 不一定 — «не обязательно», 很可能 — «весьма вероятно», 吃坏了肚子 — «съела что-то не то».\n• Финал: 现在上课吧，下课以后，我们去看看她。 — 下课以后 = «после занятий», 我们去看看她 = «пойдём её проведаем».\n\n注意\n• 病了 — заболеть; 感冒了 — простудиться; 吃坏了肚子 — расстроить желудок едой. Разные причины — разные фразы.\n• 量体温 — измерять температуру; ответ 量了 (уже измерили). 38.5°C принято читать 三十八度五 (sānshíbā dù wǔ).\n• 烧得不低 — «температура немаленькая» (烧 = жар)."

    "text": "钱富成：先生，你们是去旅行吗？\n杰克：是啊。你呢？\n钱富成：出差，做生意。\n杰克：做生意？怎么不坐飞机？\n钱富成：吃点儿苦，节省点儿经费。\n杰克：可火车太慢。生意人最讲究的就是时间。\n钱富成：是啊。时间就是金钱嘛！\n杰克：可是……\n钱富成：没关系，今天是休息日。\n杰克：对了，大家都不上班。\n钱富成：你的朋友怎么一路都在睡觉？\n杰克：她病了几天了，叫她别来，可她一定要来。\n钱富成：怎么光睡觉，不吃点儿药？\n杰克：忘了带了，想下了火车去买。\n钱富成：啊？你们等等，我去找大夫。\n\n钱富成：大夫来了。\n大夫：小姐怎么了？\n安娜：前几天拉肚子，现在不拉了，可头疼得厉害。\n大夫：哦，你正在发高烧呢，量一量体温吧。\n安娜：大夫，我得了什么病？\n大夫：把体温表给我。40℃，烧得厉害。让我看看嗓子。\n杰克：有什么问题吗？\n大夫：嗓子发炎了。\n杰克：要打针吗？她怕打针！\n大夫：先吃点儿退烧药吧。一次吃两片，四小时吃一次。\n安娜：大夫，我的病要紧吗？\n大夫：下了车，去医院好好检查检查吧。\n安娜：啊，上帝，可别住院！"

    "text": "РАЗБОР РЕПЛИК\n你们是去旅行吗？ — Вы едете путешествовать? (旅行 — путешествие, поездка)\n出差，做生意。 — В командировку, по делам. (出差 — ехать по служебным делам; 做生意 — заниматься бизнесом)\n怎么不坐飞机？ — Почему не летите самолётом? (怎么 здесь = «почему же», удивление)\n吃点儿苦，节省点儿经费。 — Немного потерплю, сэкономлю средства. (吃苦 — терпеть лишения; 经费 — средства, бюджет)\n生意人最讲究的就是时间。 — Для делового человека главное — время. (讲究 — придавать значение, быть разборчивым; 最……的就是 — «самое главное — это»)\n时间就是金钱嘛！ — Время — деньги, вот что! (嘛 — частица, подчёркивает очевидность)\n今天是休息日。 — Сегодня выходной.\n大家都不上班。 — Все не работают. (都 — все; 上班 — быть на работе)\n她病了几天了，叫她别来，可她一定要来。 — Она болеет уже несколько дней, я говорил ей не ехать, но она обязательно захотела.\n怎么光睡觉，不吃点儿药？ — Почему только спишь и не пьёшь лекарство? (光 + глагол = «только и делать, что…»)\n忘了带了，想下了火车去买。 — Забыл взять, хотел купить, как сойдём с поезда. (忘了带 — забыл взять; 下了车 — сойдя с поезда)\n我去找大夫。 — Я схожу за врачом.\n量一量体温吧。 — Давай измерим температуру. (量 — измерять; удвоение глагола = «немножко, разок»)\n40℃，烧得厉害。 — 40 градусов, жар сильный. (烧 — жар; 得 + 厉害 — сильно)\n把体温表给我。 — Дай мне термометр. (把-предложение: 把 + объект + 给 + 我)\n嗓子发炎了。 — Горло воспалилось. (发炎 — воспаляться)\n要打针吗？她怕打针！ — Нужен укол? Она боится уколов!\n先吃点儿退烧药吧。一次吃两片，四小时吃一次。 — Сначала примите жаропонижающее. По две таблетки за раз, каждые четыре часа. (退烧药 — жаропонижающее; 片 — таблетка)\n我的病要紧吗？ — Моя болезнь серьёзная? (要紧 — серьёзный, важный)\n下了车，去医院好好检查检查吧。 — Как сойдёте с поезда, идите в больницу и как следует обследуйтесь.\n可别住院！ — Только не в больницу (не ложиться в стационар)! (可别 — «только не…», предостережение; 住院 — лечь в стационар)\n\nКУЛЬТУРА И РЕЧЬ\n· 大夫 / 医生 — оба «врач»; 大夫 разговорнее, 医生 официальнее.\n· 有点儿 + прилагательное = «немножко» (слегка нехорошо): 有点儿累, 有点儿慢. 一点儿 (после) = «чуть-чуть, немного»: 慢一点儿, 吃点儿药.\n· Вежливая просьба: глагол + 一 + глагол (量一量, 检查检查) смягчает, звучит по-дружески.\n· 时间就是金钱 — калька «время — деньги»; в Китае любят короткие афоризмы: 时间就是生命 «время — это жизнь».\n\nТИПИЧНЫЕ ОШИБКИ РУССКОЯЗЫЧНЫХ\n· ✗ 我不吃药一点 → ✓ 我吃一点儿药 («приму немного лекарства»).\n· ✗ 我忘带药了 = ок, но ✗ 我忘了带药了 неверно по порядку слов в 把-предложении.\n· ✗ 你病怎么了 → ✓ 你怎么了？ / 她怎么了？ (怎么了 = «что случилось?»)\n· 发高烧 — «сильный жар», но ✗ 发高热 в разговоре редко.\n· ✗ 时间就是说金钱 → ✓ 时间就是金钱 (без 说)."

    "text": "«时间» и «时候» — оба существительные, «время». Разница:\n时候 — разговорное, «(тот) момент, когда…»; часто в схеме 当……的时候:\n你什么时候来？ — Когда ты придёшь?\n我小的时候很爱玩儿。 — В детстве я очень любил играть.\n当我想起爸爸妈妈的时候，我就想回家。 — Когда я вспоминаю папу с мамой, мне хочется домой.\n时间 — точное, конкретное время; в книжной речи — «время» как понятие:\n你今天用了多长时间做练习？ — Сколько времени ты сегодня делал упражнения?\n火车到北京的时间是十二点零五分。 — Поезд прибывает в Пекин в 12:05.\n时间在一分一秒地过去。 — Время идёт минута за минутой.\nВажно: можно 当……的时候, но нельзя ✗ 当……时间.\n\n«把»-предложения — конструкция 把.\n把 как предлог выносит объект вперёд, перед глаголом. Схема: 主语 + 把 + 宾语 + 动词 + 其他成分.\nПосле глагола обязательно есть 了 / 补语 / результат — голый глагол не ставится.\n1. 请你把这本书给他。 — Пожалуйста, отдай ему эту книгу.\n2. 我把药吃下去了。 — Я выпил лекарство.\n3. 你把“四”念成“十”了。 — Ты произнёс «四» как «十».\n4. 我把练习做完了。 — Я доделал упражнения.\n5. 我把肚子吃坏了。 — Я объелся и испортил себе желудок.\nНельзя сказать ✗ 把门关 — надо 把门关上 («закрой дверь»).\nОбъект при 把 должен быть определённым, уже известным собеседнику.\n\n补充生词 · дополнительно\n双休日 shuāngxiūrì — два выходных (суббота и воскресенье).\n\nМИКРОПРОВЕРКА (ответы под вопросами)\n1. 你什么（　）来？ → 时候\n2. 现在（　）几点？ → 时间\n3. （　）门关上！ → 把\n4. 他（　）作业做完了。 → 把"

/* Свайпы: колонка уезжает влево / возвращается от левого края */
(function () {
  let sbTouch = null;
  const sbEl = () => document.getElementById('tabbar');
  const isNarrow = () => window.innerWidth < 900;
  document.addEventListener('touchstart', function (e) {
    if (!isNarrow()) return;
    const sb = sbEl();
    if (!sb || getComputedStyle(sb).display === 'none') return;
    const t = e.touches[0];
    const off = document.body.classList.contains('sb-off');
    const onSb = e.target && e.target.closest && e.target.closest('#tabbar');
    /* тащим колонку только если палец лёг на неё саму (закрыть) или у самого левого края (открыть) */
    if (!off && onSb) sbTouch = { x: t.clientX, y: t.clientY, mode: 'close', armed: true };
    else if (off && t.clientX < 24) sbTouch = { x: t.clientX, y: t.clientY, mode: 'open', armed: false };
    if (sbTouch && sbTouch.armed) sb.classList.add('sb-drag');
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!sbTouch) return;
    const t = e.touches[0];
    const dx = t.clientX - sbTouch.x;
    const dy = Math.abs(t.clientY - sbTouch.y);
    const sb = sbEl();
    const w = sb.offsetWidth;
    if (!sbTouch.armed) {
      /* пока палец не пошёл явно вбок — колонку не трогаем (иначе она дрожит при прокрутке) */
      if (Math.abs(dx) < 10 || Math.abs(dx) < dy) return;
      sbTouch.armed = true;
      sb.classList.add('sb-drag');
    }
    if (Math.abs(dx) < dy) return;
    if (sbTouch.mode === 'close') sb.style.transform = 'translateX(' + Math.min(0, dx) + 'px)';
    else sb.style.transform = 'translateX(' + Math.max(-w, dx - w) + 'px)';
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!sbTouch) return;
    const sb = sbEl();
    const dx = e.changedTouches[0].clientX - sbTouch.x;
    const armed = sbTouch.armed;
    sb.classList.remove('sb-drag');
    sb.style.transform = '';
    if (armed) {
      if (sbTouch.mode === 'close' && dx < -55) sbClose();
      else if (sbTouch.mode === 'open' && dx > 55) sbOpen();
    }
    sbTouch = null;
  }, { passive: true });
})();

// ---- облачный бэкап прогресса (авто) ----
let backupTimer = null;
function saveLocal(k, v) {
  try { localStorage.setItem(k, v); } catch (e) {}
  scheduleBackup();
}
function scheduleBackup() {
  if (backupTimer) clearTimeout(backupTimer);
  backupTimer = setTimeout(sendBackup, 1200);
}
async function sendBackup() {
  try {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('tingli-') === 0) data[k] = localStorage.getItem(k);
    }
    if (!data[LS]) return; // ещё ничего не наработано
    await apiFetch('/api/backup', { method: 'POST', body: JSON.stringify(data) });
  } catch (e) { /* сеть недоступна — попробуем в следующий раз */ }
}
// ---- облачный синк прогресса (merge при старте) ----
function mergeProgress(a, b) {
  const out = {};
  const units = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const u of units) {
    const pa = (a && a[u]) || {}, pb = (b && b[u]) || {};
    const parts = new Set([...Object.keys(pa), ...Object.keys(pb)]);
    const po = {};
    for (const pt of parts) {
      const ia = pa[pt] || {}, ib = pb[pt] || {};
      const items = new Set([...Object.keys(ia), ...Object.keys(ib)]);
      const io = {};
      for (const it of items) io[it] = !!(ia[it] || ib[it]);
      po[pt] = io;
    }
    out[u] = po;
  }
  return out;
}
function mergeMan(a, b) {
  const out = {};
  for (const u of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const A = (a && a[u]) || {}, B = (b && b[u]) || {};
    const o = {};
    if (A.u || B.u) o.u = 1;
    const p = {}, ks = new Set([...Object.keys(A.p || {}), ...Object.keys(B.p || {})]);
    for (const k of ks) if ((A.p && A.p[k]) || (B.p && B.p[k])) p[k] = 1;
    if (Object.keys(p).length) o.p = p;
    if (o.u || Object.keys(p).length) out[u] = o;
  }
  return out;
}
function syncToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9999;box-shadow:0 6px 24px rgba(29,29,33,.25)';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
async function tryRestore() {
  try {
    const r = await apiFetch('/api/backup');
    if (!r.ok) return;
    const cloud = await r.json();
    if (!cloud || !cloud[LS]) return; // облако пустое — локальное уйдёт туда само (sendBackup)
    let changed = false;
    // прогресс, избранное, словарь — объединяем (union, ничего не теряем)
    for (const k of ['tingli-progress-v1', 'tingli-favs-v1', 'tingli-dict-v1', 'tingli-manual-v1']) {
      if (!cloud[k]) continue;
      let cv, lv;
      try { cv = JSON.parse(cloud[k]); } catch (e) { continue; }
      try { lv = JSON.parse(localStorage.getItem(k) || ((k === 'tingli-progress-v1' || k === 'tingli-manual-v1') ? '{}' : '[]')); } catch (e) { lv = null; }
      let nv = null;
      if (k === 'tingli-progress-v1') nv = mergeProgress(lv || {}, cv);
      else if (k === 'tingli-manual-v1') nv = mergeMan(lv || {}, cv);
      else if (k === 'tingli-favs-v1') nv = Array.from(new Set([...(lv || []), ...(cv || [])]));
      else if (k === 'tingli-dict-v1') { const seen = new Set((lv || []).map(w => w.zh)); nv = (lv || []).concat((cv || []).filter(w => !seen.has(w.zh))); }
      const ns = JSON.stringify(nv);
      if (localStorage.getItem(k) !== ns) { try { localStorage.setItem(k, ns); } catch (e) {} changed = true; }
    }
    // прочие tingli-* ключи облака — подтягиваем, если локально их нет
    for (const k in cloud) {
      if (k.indexOf('tingli-') !== 0) continue;
      if (localStorage.getItem(k) === null) { try { localStorage.setItem(k, cloud[k]); } catch (e) {} changed = true; }
    }
    if (!changed) return;
    prog = load(); man = loadMan();
    syncToast('☁️ Прогресс синхронизирован');
    sendBackup(); // облако = объединение
    const cur = typeof tab !== 'undefined' ? tab : 'lessons';
    if (cur === 'sched') renderCourses();
    else if (cur === 'sched') renderCourses(); else if (cur === 'lessons') renderUnits(); else if (cur === 'mine') renderMine();
    else if (cur === 'idv') renderIdv(); else if (cur === 'team') renderTeam(); else if (cur === 'favs') renderFavs();
    else renderDict();
  } catch (e) {}
}

const DICT_KEY = 'tingli-dict-v1';
function dictLoad() { try { return JSON.parse(localStorage.getItem(DICT_KEY)) || []; } catch (e) { return []; } }
function dictSave(d) { try { saveLocal(DICT_KEY, JSON.stringify(d)); } catch (e) {} }
function dictHas(zh) { return dictLoad().some(w => w.zh === zh); }

/* ===== мост в приложение «Мои слова» (cidian) =====
   Оба приложения живут на одном адресе, поэтому передаём через localStorage:
   кладём слова в очередь cidian-inbox-v1, а «Мои слова» при открытии их забирает. */
const CIDIAN_INBOX = 'cidian-inbox-v1';
function cidianQueue() { try { return JSON.parse(localStorage.getItem(CIDIAN_INBOX)) || []; } catch (e) { return []; } }
function cidianSend(items, label) {
  const q = cidianQueue(); let added = 0, dup = 0;
  items.forEach(it => {
    const h = String(it.zh || it.hanzi || '').trim(); if (!h) return;
    if (q.some(x => x.hanzi === h)) { dup++; return; }
    q.push({ hanzi: h, pinyin: String(it.py || it.pinyin || '').trim(), ru: String(it.ru || it.translation || '').trim(), src: label || '', ts: Date.now() });
    added++;
  });
  try { localStorage.setItem(CIDIAN_INBOX, JSON.stringify(q)); } catch (e) {}
  try { apiFetch('/api/cidian-inbox', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(q) }); } catch (e) {}
  return { added: added, dup: dup, total: q.length };
}
function cidianToast(msg) {

  const d = document.createElement('div'); d.id = 'tlToast'; d.className = 'tl-toast';
  d.innerHTML = '<div>' + esc(msg) + '</div><div><a href="/cidian/" target="_self">Открыть «Мои слова» →</a></div>';

const ICO_FRAZ = '句', ICO_WORD = '词', ICO_HW = '业', ICO_TEXT = '文', ICO_DLG = '话', ICO_LISTEN = '听', ICO_CHECK = '检';
function hasTxt(part) { return !!(part && part.text && String(part.text).trim()); }
function isDlg(part) {
  const t = (part.title || ''), tz = (part.titleZh || '');

}

function partNum(part) {

  if (part.kind === 'hw' || part.kind === 'record_hw') return ICO_HW;

  if (!hasTxt(part) && part.audio) return ICO_LISTEN;   // слушать без скрипта / задание на прослушивание

let _rec = null, _chunks = [], _recBlob = null, _recT0 = 0, _recTimer = null;
