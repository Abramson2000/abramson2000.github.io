}
async function speakToggle() {
  const btn = document.getElementById('speakRec');
  if (_rec && _rec.state === 'recording') { try { _rec.stop(); } catch (e) {} return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    speakMsg('Этот браузер не умеет записывать звук — открой в Safari или Chrome.', true); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { speakMsg('Нет доступа к микрофону — разреши его для этого сайта.', true); return; }
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
  let mime = '';
  for (const t of types) { try { if (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { mime = t; break; } } catch (e) {} }
  try { _rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (e) { _rec = new MediaRecorder(stream); }
  _chunks = [];
  _rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) _chunks.push(ev.data); };
  _rec.onstop = () => {
    try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    _recBlob = new Blob(_chunks, { type: (_rec && _rec.mimeType) || 'audio/webm' });
    const a = document.getElementById('speakAud');
    if (a) { try { a.src = URL.createObjectURL(_recBlob); a.style.display = 'block'; } catch (e) {} }
    const cb = document.getElementById('speakCheck');
    if (cb) cb.disabled = !(_recBlob && _recBlob.size > 1200);
    const pb = document.getElementById('speakPb'); if (pb) pb.textContent = '';
    clearInterval(_recTimer);
    speakMsg('Записано ' + Math.max(1, Math.round((_recBlob ? _recBlob.size : 0) / 1024)) + ' КБ. Послушай себя и жми «Проверить ИИ».');
    if (btn) btn.textContent = '🎤 Записать заново';
  };
  _rec.start();
  _recT0 = Date.now();
  if (btn) btn.textContent = '⏹ Остановить';
  speakMsg('Говори по-китайски, не спеша. Потом нажми «Остановить».');
  _recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - _recT0) / 1000);
    const pb = document.getElementById('speakPb');

async function speakSend() {

    });
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) throw new Error((j && j.error) || 'не удалось распознать запись');
    const heard = String(j.text || '').trim();

function shuffleArr(a) { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

function matchPick(side, k) {
  const ms = matchState;

  const tile = s => document.querySelector(`#match${s} .match-tile[data-k="${k}"]`);
  if (side === 'l') {
    ms.selL = k;
    document.querySelectorAll('#matchL .match-tile').forEach(el => el.classList.toggle('sel', +el.dataset.k === k));
    return;
  }
  // side === 'r'
  if (ms.selL === null) {
    const r0 = tile('R');
    r0.classList.add('badflash'); setTimeout(() => r0.classList.remove('badflash'), 450);
    return;
  }
  if (ms.selL === k) {
    // верно — пара собрана
    ms.done.add(k);
    const lt = tile('L'), rt = tile('R');
    lt.classList.remove('sel'); lt.classList.add('matched'); rt.classList.add('matched');
    const pair = curPart.pairs[k];
    document.getElementById('matchDone').insertAdjacentHTML('afterbegin',
      `<div class="mpair"><span class="zh">${esc(pair.l)}</span><span class="eq">=</span><span class="ru">${esc(pair.r)}</span></div>`);
    ms.selL = null;
    if (ms.done.size === curPart.pairs.length) {
      const end = document.getElementById('matchEnd');

      end.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else {
    // неверно
    const lt = document.querySelector(`#matchL .match-tile[data-k="${ms.selL}"]`);
    const rt = tile('R');
    [lt, rt].forEach(el => { el.classList.add('badflash'); setTimeout(() => el.classList.remove('badflash'), 450); });
    lt.classList.remove('sel');
    ms.selL = null;
  }
}

  prog[curUnit.unit][curPart.id] = { done: true };
  save(prog);
  openUnit(curUnit.unit);
}
function openTask(unitRef, partRef, ti) {
  const u = (typeof unitRef === 'object' && unitRef !== null) ? unitRef : ALL_UNITS.find(x => x.unit === unitRef);
  const part = (typeof partRef === 'object' && partRef !== null) ? partRef : u.parts.find(p => p.id === partRef);
  curUnit = u; curPart = part; curTi = ti;
  const t = part.tasks[ti];
  showTabbar(false);
  if ((u.src === 'idv' || u.src === 'team')) ensureLessonAudio(u, part); else showPlayer(!!part.audio);
  const total = part.tasks.length;
  const dots = part.tasks.map((x, i) => {
    const p = prog[u.unit] && prog[u.unit][part.id];
    const cls = p ? (p[i] === true ? 'tdot good' : p[i] === false ? 'tdot bad' : (i === ti ? 'tdot on' : 'tdot')) : (i === ti ? 'tdot on' : 'tdot');
    return `<div class="${cls}"></div>`;
  }).join('');
  const animCls = slideDir === 'prev' ? 'anim-prev' : 'anim-next';
  slideDir = 'next';
  app.innerHTML = `
    <div class="topbar"><button class="back" onclick="goBack()">←</button>
      <div><div class="u-title">${esc(part.title)}</div><div class="u-sub">${esc(u.zh || '')}</div></div></div>
    <div class="task-head">
      <div class="task-count">Задание ${ti + 1} из ${total}</div>
      <div class="task-dots">${dots}</div>
      <button class="fav-btn ${isFav(u, part, ti) ? 'on' : ''}" id="favBtn" onclick="toggleFav()" title="В избранное">${isFav(u, part, ti) ? '⭐' : '☆'}</button>
    </div>
    <div class="task-card ${animCls}" id="taskCard">${taskHtml(u, part, t, ti)}</div>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevTask()">← Назад</button>
      <button class="nav-btn" onclick="nextTask()">Дальше →</button>
    </div>`;
  posRestore();
}

function nextTask() {
  slideDir = 'next';
  const u = curUnit, part = curPart;
  if (curTi < part.tasks.length - 1) { openTask(u.unit, part.id, curTi + 1); return; }
  const idx = u.parts.findIndex(p => p.id === part.id);
  for (let i = idx + 1; i < u.parts.length; i++) {
    if (u.parts[i].tasks) { if ((u.src === 'idv' || u.src === 'team')) ensureLessonAudio(u, u.parts[i]); else setPartAudio(u, u.parts[i]); openTask(u, u.parts[i], 0); return; }
  }
  openUnit(u.unit);
}
function prevTask() {
  slideDir = 'prev';
  const u = curUnit, part = curPart;
  if (curTi > 0) { openTask(u.unit, part.id, curTi - 1); return; }
  const idx = u.parts.findIndex(p => p.id === part.id);
  for (let i = idx - 1; i >= 0; i--) {
    if (u.parts[i].tasks) { if ((u.src === 'idv' || u.src === 'team')) ensureLessonAudio(u, u.parts[i]); else setPartAudio(u, u.parts[i]); openTask(u, u.parts[i], u.parts[i].tasks.length - 1); return; }
  }
  openUnit(u.unit);
}
function taskHtml(u, part, t, ti) {
  let body = '';
  const qru = (!part.audio && t.qRu) ? `<div class="task-qru">${esc(t.qRu)}</div>` : '';
  if (t.type === 'choice') {
    const opts = t.options.map((o, oi) => ({ o: String(o).replace(/^[A-ZА-Я]\.\s*/, ''), oi }));
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp; }
    const correctIdx = opts.findIndex(x => x.oi === t.answer);
    body = `
      <div class="task-q">${esc(t.q)}</div>
      ${qru}
      <div class="opts" data-correct="${correctIdx}">${opts.map((x, ni) => `
        <div class="opt zh-opt" data-oi="${ni}" onclick="pick(this)">
          <span class="letter">${'ABC'[ni]}</span><span>${esc(x.o)}</span></div>`).join('')}</div>`;
  } else if (t.type === 'fill') {
    body = `
      <div class="task-q">${esc(t.q).replace('____', '______')}</div>
      ${qru}
      <input class="fill zh-opt" placeholder="Введи ответ иероглифами" data-ans="${esc(t.answer)}">`;
  } else if (t.type === 'tf') {
    body = `
      <div class="task-q">${esc(t.q)}</div>
      ${qru}
      <div class="tf-btns">
        <button class="tf-btn" data-v="1" onclick="pickTf(this)">✓ Верно</button>
        <button class="tf-btn" data-v="0" onclick="pickTf(this)">✗ Неверно</button></div>`;
  }
  const hasText = part.text ? `<span class="link" onclick="document.getElementById('scriptBox').classList.toggle('show')">📄 Показать текст</span><div class="script zh-opt" id="scriptBox">${esc(part.text)}</div>` : '';
  return body + `
    <div class="task-result" id="taskResult"></div>
    <div class="btn-row">
      <button class="btn" onclick="checkTask()">Проверить</button>
      <button class="btn ghost" onclick="showAnswer()">Показать ответ</button>
    </div>

}

function pick(el) {
  el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}
function pickTf(el) {
  el.parentElement.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function getAnswer(t) {
  if (t.type === 'choice') {
    const sel = document.querySelector('#taskCard .opt.selected');
    return sel ? Number(sel.dataset.oi) : null;
  }
  if (t.type === 'fill') {
    const v = document.querySelector('#taskCard .fill').value.trim().replace(/\s+/g, '');
    return v || null;
  }
  if (t.type === 'tf') {
    const sel = document.querySelector('#taskCard .tf-btn.selected');
    return sel ? (sel.dataset.v === '1') : null;
  }
  return null;
}

function checkTask() {
  const t = curPart.tasks[curTi];
  const ans = getAnswer(t);
  const res = document.getElementById('taskResult');
  let correct = false;
  let fillBadMsg = null;
  if (t.type === 'choice') {
    const correctIdx = Number(document.querySelector('#taskCard .opts').dataset.correct);
    document.querySelectorAll('#taskCard .opt').forEach((o, oi) => {
      o.classList.remove('ok', 'bad');
      if (oi === correctIdx) o.classList.add('ok');
    });
    if (ans === correctIdx) correct = true;
    else if (ans !== null) document.querySelector(`#taskCard .opt[data-oi="${ans}"]`).classList.add('bad');
  } else if (t.type === 'fill') {
    const inp = document.querySelector('#taskCard .fill');
    inp.classList.remove('ok', 'bad');
    const normA = s => String(s).normalize('NFKC').replace(/[\s\u200B-\u200F\u2028\u2029\u202A-\u202E\u2060-\u206F\uFEFF\uFE00-\uFE0F，。！？、；：""''（）《》〈〉,.!?;:'"()…—\-·]/g, '');
    if (ans !== null && normA(ans) === normA(t.answer)) { correct = true; inp.classList.add('ok'); }
    else if (ans !== null) { inp.classList.add('bad'); fillBadMsg = '❌ Неверно. Ожидалось: «' + t.answer + '» (ты ввёл: «' + (inp.value || ' ') + '»)'; }
  } else if (t.type === 'tf') {
    document.querySelectorAll('#taskCard .tf-btn').forEach(b => {
      b.classList.remove('ok', 'bad');
      if ((b.dataset.v === '1') === t.answer) b.classList.add('ok');
    });
    if (ans === t.answer) correct = true;
    else if (ans !== null) document.querySelector(`#taskCard .tf-btn[data-v="${ans ? '1' : '0'}"]`).classList.add('bad');
  }
  res.textContent = correct ? '✅ Верно!' : (fillBadMsg || (ans === null ? '— Сначала введи ответ' : '❌ Неверно'));
  res.className = 'task-result ' + (correct ? 'ok' : 'bad');
  if (ans !== null) {
    prog[curUnit.unit] = prog[curUnit.unit] || {};
    prog[curUnit.unit][curPart.id] = prog[curUnit.unit][curPart.id] || {};
    prog[curUnit.unit][curPart.id][curTi] = correct;
    save(prog);
    renderDots();
  }
}

function toggleFav() {
  const k = favKey(curUnit, curPart, curTi);

/* ===== Устное ДЗ: пофразовая запись, сохранение на устройстве, отправка через Share Sheet ===== */
const REC_DB_NAME = 'tingli-local-recordings-v1';
const REC_DB_STORE = 'clips';
let recHwRecorder = null, recHwStream = null, recHwChunks = [], recHwIndex = -1, recHwUrls = {};

function recHwKey(u, p, i) { return u.unit + '-' + p.id + '-' + i; }
function recHwMetaKey(u, p, i) { return 'tingliLocalRecMeta-' + recHwKey(u, p, i); }
function recHwHasSync(u, p, i) { try { return !!localStorage.getItem(recHwMetaKey(u,p,i)); } catch (e) { return false; } }
function recHwAllDoneSync(u, p) { return !!(p && p.lines && p.lines.length) && p.lines.every(function (_,i) { return recHwHasSync(u,p,i); }); }

function recHwDb() {
  return new Promise(function (resolve, reject) {
    const q = indexedDB.open(REC_DB_NAME, 1);
    q.onupgradeneeded = function () { if (!q.result.objectStoreNames.contains(REC_DB_STORE)) q.result.createObjectStore(REC_DB_STORE); };
    q.onsuccess = function () { resolve(q.result); };
    q.onerror = function () { reject(q.error); };
  });
}
async function recHwPut(key, blob) {
  const db = await recHwDb();
  await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readwrite');
    tx.objectStore(REC_DB_STORE).put(blob, key);
    tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
  });
  try { db.close(); } catch (e) {}
}
async function recHwGet(key) {
  const db = await recHwDb();
  const v = await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readonly');
    const q = tx.objectStore(REC_DB_STORE).get(key);
    q.onsuccess = function () { resolve(q.result || null); }; q.onerror = function () { reject(q.error); };
  });
  try { db.close(); } catch (e) {}
  return v;
}
async function recHwDel(key) {
  const db = await recHwDb();
  await new Promise(function (resolve, reject) {
    const tx = db.transaction(REC_DB_STORE, 'readwrite');
    tx.objectStore(REC_DB_STORE).delete(key);
    tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
  });
  try { db.close(); } catch (e) {}
}
function recHwMetaWrite(u,p,i,blob) {
  const m = { mime: blob.type || 'audio/webm', size: blob.size || 0, ts: Date.now() };
  try { localStorage.setItem(recHwMetaKey(u,p,i), JSON.stringify(m)); } catch (e) {}
}
function recHwClearUrls() {
  Object.keys(recHwUrls).forEach(function (k) { try { URL.revokeObjectURL(recHwUrls[k]); } catch (e) {} });
  recHwUrls = {};
}
function renderRecordHw(u, part) {
  showTabbar(false); partAudioKey = null; showPlayer(false);
  curUnit = u; curPart = part;
  recHwClearUrls();
  const done = (part.lines || []).filter(function (_,i) { return recHwHasSync(u,part,i); }).length;
  app.innerHTML = '<div class="topbar"><button class="back" onclick="goBack()">←</button>' +
    '<div style="flex:1;min-width:0"><div class="u-title">' + esc(part.title) + '</div><div class="u-sub">' + esc(u.zh || '') + '</div></div></div>' +
    dueBarHtml(u, part) +
    '<div class="rec-hw-intro">' + esc(part.text || '') + '<br><b>Записи хранятся локально на этом устройстве.</b></div>' +
    (part.lines || []).map(function (line,i) {
      const saved = recHwHasSync(u,part,i);
      return '<div class="rec-hw-item"><div class="rec-hw-top"><div class="rec-hw-num">' + (i+1) + '</div><div class="rec-hw-phrase">' + esc(line) + '</div></div>' +
        '<div class="rec-hw-state' + (saved ? ' saved' : '') + '" id="recHwState-' + i + '">' + (saved ? '✓ Запись сохранена' : 'Ещё не записано') + '</div>' +
        '<div class="rec-hw-actions"><button class="rec-hw-b rec" id="recHwBtn-' + i + '" onclick="recHwToggle(' + i + ')">' + (saved ? '🎤 Перезаписать' : '🎤 Записать') + '</button>' +
        (saved ? '<button class="rec-hw-b del" onclick="recHwDelete(' + i + ')">Удалить</button>' : '') + '</div>' +
        '<audio class="rec-hw-audio" id="recHwAudio-' + i + '" controls></audio></div>';
    }).join('') +
    '<div class="rec-hw-share"><div class="rec-hw-progress">Готово: ' + done + '/' + (part.lines || []).length + '</div>' +
      '<button class="btn" onclick="recHwShare()">Отправить в Telegram</button>' +
      '<div class="rec-hw-fallback" id="recHwFallback">Откроется системное меню «Поделиться» — выбери Telegram.</div></div>';
  recHwHydrate(u, part);
  window.scrollTo(0,0);
}
async function recHwHydrate(u, part) {
  for (let i = 0; i < (part.lines || []).length; i++) {
    if (!recHwHasSync(u,part,i)) continue;
    try {
      const blob = await recHwGet(recHwKey(u,part,i));
      const a = document.getElementById('recHwAudio-' + i);
      if (!blob || !a) continue;
      const url = URL.createObjectURL(blob); recHwUrls[i] = url; a.src = url; a.style.display = 'block';
    } catch (e) {}
  }
}
async function recHwToggle(i) {
  if (recHwRecorder && recHwRecorder.state === 'recording') {
    if (recHwIndex === i) { try { recHwRecorder.stop(); } catch (e) {} }
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    alert('Запись звука недоступна в этом браузере. Открой Tingli в Safari или Chrome.'); return;
  }
  try { recHwStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { alert('Нет доступа к микрофону. Разреши микрофон для Tingli.'); return; }
  const types = ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
  let mime = '';
  for (const t of types) { try { if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { mime = t; break; } } catch (e) {} }
  try { recHwRecorder = mime ? new MediaRecorder(recHwStream,{mimeType:mime}) : new MediaRecorder(recHwStream); }
  catch (e) { recHwRecorder = new MediaRecorder(recHwStream); }
  recHwIndex = i; recHwChunks = [];
  recHwRecorder.ondataavailable = function (e) { if (e.data && e.data.size) recHwChunks.push(e.data); };
  recHwRecorder.onstop = async function () {
    const idx0 = recHwIndex;
    const type = (recHwRecorder && recHwRecorder.mimeType) || mime || 'audio/webm';
    const blob = new Blob(recHwChunks,{type:type});
    try { if (recHwStream) recHwStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    recHwStream = null; recHwRecorder = null; recHwIndex = -1;
    if (blob.size < 800) { alert('Запись слишком короткая. Запиши фразу ещё раз.'); renderRecordHw(curUnit,curPart); return; }
    await recHwPut(recHwKey(curUnit,curPart,idx0), blob);
    recHwMetaWrite(curUnit,curPart,idx0,blob);
    renderRecordHw(curUnit,curPart);
  };
  recHwRecorder.start();
  const b = document.getElementById('recHwBtn-' + i); if (b) b.textContent = '⏹ Остановить';
  const s = document.getElementById('recHwState-' + i); if (s) { s.textContent = '● идёт запись…'; s.className = 'rec-hw-state live'; }
}
async function recHwDelete(i) {
  try { await recHwDel(recHwKey(curUnit,curPart,i)); } catch (e) {}
  try { localStorage.removeItem(recHwMetaKey(curUnit,curPart,i)); } catch (e) {}
  renderRecordHw(curUnit,curPart);
}
function recHwExt(mime) {
  mime = String(mime || '');
  if (mime.indexOf('mp4') >= 0 || mime.indexOf('m4a') >= 0) return 'm4a';
  if (mime.indexOf('ogg') >= 0) return 'ogg';
  if (mime.indexOf('mpeg') >= 0) return 'mp3';
  return 'webm';
}
async function recHwShare() {
  const lines = (curPart && curPart.lines) || [];
  const files = [];
  for (let i = 0; i < lines.length; i++) {
    if (!recHwHasSync(curUnit,curPart,i)) { alert('Сначала запиши все фразы. Не хватает записи № ' + (i+1)); return; }
    const blob = await recHwGet(recHwKey(curUnit,curPart,i));
    if (!blob) { alert('Не удалось найти запись № ' + (i+1) + ' на этом устройстве. Перезапиши её.'); return; }
    const ext = recHwExt(blob.type);
    files.push(new File([blob], 'Tingli_team_online-shopping_A_' + (i+1) + '.' + ext, {type:blob.type || 'audio/webm'}));
  }
  try {
    if (navigator.share && (!navigator.canShare || navigator.canShare({files:files}))) {
      await navigator.share({title:'团队 · 网上购物 · ДЗ роль A', text:'ДЗ Tingli: роль A, 4 фразы', files:files});
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const box = document.getElementById('recHwFallback');
  if (!box) return;
  box.innerHTML = 'Прямое меню «Поделиться» недоступно. Скачай записи и отправь их в Telegram:' +
    files.map(function (f) {
      const url = URL.createObjectURL(f);
      return '<a href="' + url + '" download="' + esc(f.name) + '">Скачать ' + esc(f.name) + '</a>';
    }).join('');
}

/* ===== Домашнее задание (hw): свободные ответы + сборка текста для учителя ===== */
function hwKey(unitN, partId, i) { return 'tingli-hw-' + unitN + '-' + partId + '-' + i; }
function hwLoad(unitN, partId, i) { try { return localStorage.getItem(hwKey(unitN, partId, i)) || ''; } catch (e) { return ''; } }

function dueKey(unitN, partId) { return 'tingli-due-' + unitN + '-' + partId; }
function dueGet(unitN, partId) { try { return localStorage.getItem(dueKey(unitN, partId)) || ''; } catch (e) { return ''; } }
function dueDays(d) { if (!d) return null; const p = String(d).split('-'); if (p.length !== 3) return null; const t = new Date(+p[0], +p[1] - 1, +p[2]); const n = new Date(); const t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()); return Math.round((t - t0) / 86400000); }
function dueFmt(d) { if (!d) return ''; const p = String(d).split('-'); return p.length === 3 ? (p[2] + '.' + p[1] + '.' + p[0].slice(2)) : d; }
function dueState(unitN, partId) {
  const d = dueGet(unitN, partId); if (!d) return '<span class="hw-due-state">не задан</span>';
  const n = dueDays(d); if (n === null) return '';
  let c = 'var(--ink-2)', t = '';
  if (n < 0) { c = 'var(--danger)'; t = 'просрочено на ' + (-n) + ' ' + dayWord(-n); }
  else if (n === 0) { c = 'var(--ochre)'; t = 'срок — сегодня!'; }
  else if (n === 1) { c = 'var(--ochre)'; t = 'остался 1 день'; }
  else if (n <= 4) { c = 'var(--ochre)'; t = 'осталось ' + n + ' ' + dayWord(n); }
  else { c = 'var(--jade)'; t = 'осталось ' + n + ' ' + dayWord(n); }
  return '<span class="hw-due-state" style="color:' + c + '">' + t + '</span>';
}
function dayWord(n) { const m = n % 10, h = n % 100; if (h >= 11 && h <= 14) return 'дней'; if (m === 1) return 'день'; if (m >= 2 && m <= 4) return 'дня'; return 'дней'; }
function hwAllDone(u, part) {
  if (!part.questions || !part.questions.length) return false;

function dueBadge(unitN, partId, done) {
  const d = dueGet(unitN, partId); if (!d) return '';
  const n = dueDays(d);
  let cls = '', txt = '⏰ до ' + dueFmt(d);
  if (done) { cls = 'done'; txt = '✅ ' + dueFmt(d); }
  else if (n === null) { txt = '⏰ до ' + dueFmt(d); }
  else if (n < 0) { cls = 'over'; txt = '⌛ ' + (-n) + ' ' + dayWord(-n) + ' просрочки'; }
  else if (n === 0) { cls = 'soon'; txt = '⏰ сегодня!'; }
  else if (n === 1) { cls = 'soon'; txt = '⏰ 1 день · до ' + dueFmt(d); }
  else { txt = '⏰ ' + n + ' ' + dayWord(n) + ' · до ' + dueFmt(d); }

}

/* счётчик ДЗ значком на иконке приложения (PWA Badging API) */
function appBadgeCount() {

const VHW_DB = 'tingli-voice-hw-v1', VHW_STORE = 'rec';
let _vhwRec = null, _vhwChunks = [], _vhwIdx = -1, _vhwStream = null;
function voiceHwFlagKey(unitN, partId) { return 'tingli-vhw-' + unitN + '-' + partId; }
function voiceHwFlags(unitN, partId, n) {
  try {
    const a = JSON.parse(localStorage.getItem(voiceHwFlagKey(unitN, partId)) || '[]');
    return Array.from({length:n}, (_,i) => !!a[i]);
  } catch(e) { return Array(n).fill(false); }
}
function voiceHwSetFlag(unitN, partId, i, val, n) {
  const a = voiceHwFlags(unitN, partId, n); a[i] = !!val;
  saveLocal(voiceHwFlagKey(unitN, partId), JSON.stringify(a));
  const answered = a.filter(Boolean).length;
  saveLocal('tingli-hwmeta-' + unitN + '-' + partId, JSON.stringify({n:n, done:answered === n, answered:answered}));
  updateAppBadge();
}
function voiceDb() {
  return new Promise((resolve,reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB недоступен'));
    const q = indexedDB.open(VHW_DB, 1);
    q.onupgradeneeded = () => { const db=q.result; if(!db.objectStoreNames.contains(VHW_STORE)) db.createObjectStore(VHW_STORE); };
    q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error || new Error('DB error'));
  });
}
function voiceRecKey(unitN, partId, i) { return unitN + '-' + partId + '-' + i; }
async function voicePut(unitN, partId, i, blob) {
  const db=await voiceDb();
  await new Promise((resolve,reject) => { const tx=db.transaction(VHW_STORE,'readwrite'); tx.objectStore(VHW_STORE).put({blob:blob,type:blob.type,ts:Date.now()}, voiceRecKey(unitN,partId,i)); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
  db.close();
}
async function voiceGet(unitN, partId, i) {
  try {
    const db=await voiceDb();
    const v=await new Promise((resolve,reject)=>{ const tx=db.transaction(VHW_STORE,'readonly'); const q=tx.objectStore(VHW_STORE).get(voiceRecKey(unitN,partId,i)); q.onsuccess=()=>resolve(q.result||null); q.onerror=()=>reject(q.error); });
    db.close(); return v;
  } catch(e) { return null; }
}
async function voiceDel(unitN, partId, i) {
  try {
    const db=await voiceDb();
    await new Promise((resolve,reject)=>{ const tx=db.transaction(VHW_STORE,'readwrite'); tx.objectStore(VHW_STORE).delete(voiceRecKey(unitN,partId,i)); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
    db.close();
  } catch(e) {}
}
function voiceExt(type) {
  type=String(type||'').toLowerCase();
  if(type.indexOf('mp4')>=0 || type.indexOf('m4a')>=0) return 'm4a';
  if(type.indexOf('mpeg')>=0 || type.indexOf('mp3')>=0) return 'mp3';
  if(type.indexOf('ogg')>=0) return 'ogg';
  return 'webm';
}
function voiceFile(rec, i) {
  const ext=voiceExt(rec && (rec.type || (rec.blob && rec.blob.type)));
  return new File([rec.blob], 'Tingli_214_A' + (i+1) + '.' + ext, {type:(rec.type || rec.blob.type || 'audio/webm')});
}
function voiceFallbackDownload(file) {
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function voiceHwRefresh() {
  if(!curPart || !curPart.voiceHomework) return;
  const flags=voiceHwFlags(curUnit.unit,curPart.id,curPart.questions.length);
  for(let i=0;i<curPart.questions.length;i++){
    const rec=await voiceGet(curUnit.unit,curPart.id,i);

      if(au){au.src=URL.createObjectURL(rec.blob);au.style.display='block';}

async function voiceHwToggle(i) {
  if(_vhwRec && _vhwRec.state==='recording'){
    if(_vhwIdx===i){ try{_vhwRec.stop();}catch(e){} }
    else alert('Сначала останови текущую запись.');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ alert('На этом устройстве запись через браузер недоступна.'); return; }
  try { _vhwStream=await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ alert('Разреши доступ к микрофону для Tingli.'); return; }
  const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/mpeg']; let mime='';
  for(const t of types){try{if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)){mime=t;break;}}catch(e){}}
  try{_vhwRec=mime?new MediaRecorder(_vhwStream,{mimeType:mime}):new MediaRecorder(_vhwStream);}catch(e){_vhwRec=new MediaRecorder(_vhwStream);}
  _vhwChunks=[]; _vhwIdx=i;
  const btn=document.getElementById('vhwRec'+i), st=document.getElementById('vhwState'+i);
  _vhwRec.ondataavailable=e=>{if(e.data&&e.data.size)_vhwChunks.push(e.data);};
  _vhwRec.onstop=async()=>{
    try{_vhwStream.getTracks().forEach(t=>t.stop());}catch(e){}
    const blob=new Blob(_vhwChunks,{type:_vhwRec.mimeType||mime||'audio/webm'});
    if(blob.size>1000){
      await voicePut(curUnit.unit,curPart.id,i,blob);
      voiceHwSetFlag(curUnit.unit,curPart.id,i,true,curPart.questions.length);
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    }
    _vhwRec=null; _vhwIdx=-1; _vhwStream=null;
    await voiceHwRefresh();
    const b=document.getElementById('vhwRec'+i); if(b)b.textContent='🎙 Перезаписать';
  };
  _vhwRec.start();
  if(btn) btn.textContent='⏹ Остановить и сохранить';
  if(st){st.textContent='● идёт запись…';st.className='vhw-state';}
}
async function voiceHwDelete(i){

/* ===== ИИ-проверка ответов (DeepSeek через /api/tingli-check) ===== */
async function hwCheck(i) {
  const part = curPart;
  const q0 = part.questions[i];
  const q = typeof q0 === 'string' ? q0 : q0.q;
  const a = hwLoad(curUnit.unit, part.id, i).trim();
  const btn = document.querySelector('.hw-chk[data-i="' + i + '"]');
  const vd = document.querySelector('.hw-vd[data-i="' + i + '"]');
  if (!vd) return;
  if (!a) { vd.textContent = '— Сначала напиши ответ'; vd.className = 'hw-vd bad'; return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Проверяю…'; }
  vd.textContent = ''; vd.className = 'hw-vd';
  try {
    const r = await apiFetch('/api/tingli-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q, a, text: part.fullText || '' })
    });

function swPost(msg, onProgress) {
  return new Promise((resolve) => {
    if (!('serviceWorker' in navigator)) return resolve(null);
    const send = (sw) => {
      if (!sw) return resolve(null);
      let ch;
      try { ch = new MessageChannel(); } catch (e) { return resolve(null); }
      ch.port1.onmessage = (e) => {
        const d = e.data || {};
        if (d.type === 'progress') { if (onProgress) onProgress(d); return; }
        resolve(d);
      };
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { return resolve(null); }
      setTimeout(() => resolve(null), 30000);
    };
    navigator.serviceWorker.ready
      .then((reg) => send(reg.active || navigator.serviceWorker.controller))
      .catch(() => send(navigator.serviceWorker.controller));
  });
}

      sub = await crsPushWithTimeout(reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: crsB64ToU8(key) }), 20000, 'Браузер не завершил создание push-подписки');
    }

    crsPushSetStatus('Шаг 4/4: сохраняю подписку на сервере…');
    const body = JSON.stringify({ sub: sub.toJSON(), tz: CRS_LOCAL_TZ, ver: APP_VER, reminders: crsUpcoming().slice(0, 200) });
    const r = await crsPushWithTimeout(crsApi('/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body }), 15000, 'Сервер не подтвердил сохранение подписки');
    const j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.ok !== true) throw new Error((j && j.error) || ('сервер ответил HTTP ' + r.status));

    const st = crsStore(); st.push = { on: true, at: Date.now(), synced: j.reminderCount || 0 }; crsSave(st);
    crsPushSetStatus('Web Push подключён. Сервер подтвердил подписку и сохранил ' + (j.reminderCount || 0) + ' напоминаний.');
  } catch (e) {
    try { const st = crsStore(); st.push = { on: false, at: Date.now() }; crsSave(st, true); } catch (saveErr) {}
    const detail = String(e && e.message ? e.message : e).slice(0, 240);
    console.error('Tingli Web Push activation failed:', detail);
    try { localStorage.setItem('tingli-push-enable-error-v1', detail + ' | ' + new Date().toISOString()); } catch (storeErr) {}
    try { crsPushSetStatus('Подключение не удалось: ' + detail + '. Подписка не активна.'); }
    catch (uiErr) { alert('Tingli: Web Push не подключён. ' + detail); }
  } finally {
    crsPushEnableBusy = false;
    const currentButton = document.getElementById('crs-push-enable');
    if (currentButton) { currentButton.disabled = false; currentButton.textContent = 'Включить Web Push'; }
  }
}
let crsPushRefreshTimer = null;
function crsPushRefreshSoon() {
  if (crsPushRefreshTimer) clearTimeout(crsPushRefreshTimer);
  crsPushRefreshTimer = setTimeout(crsPushRefresh, 2500);
}
async function crsPushRefresh() {
  try {
    if (!crsPushSupported() || Notification.permission !== 'granted') return;
    const st = crsStore();
    if (!(st.push && st.push.on)) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { st.push = { on: false, at: Date.now() }; crsSave(st, true); return; }
    const r = await crsApi('/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ sub: sub.toJSON(), tz: CRS_LOCAL_TZ, ver: APP_VER, reminders: crsUpcoming().slice(0, 200) })
    });
    const j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.ok !== true) throw new Error('server did not confirm schedule sync');
    st.push.synced = j.reminderCount || 0; st.push.lastSync = Date.now();
    try { localStorage.setItem(CRS_LS, JSON.stringify(st)); crsCache = st; } catch (e) {}
  } catch (e) {
    try { localStorage.setItem('tingli-push-sync-error-v1', String(e && e.message || e) + ' | ' + new Date().toISOString()); } catch (x) {}
  }
}
async function crsPushDisable() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { try { await crsApi('/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ endpoint: sub.endpoint }) }); } catch (e) {} await sub.unsubscribe(); }
  } catch (e) {}
  const st = crsStore(); st.push = { on: false, at: Date.now() }; crsSave(st);
  crsPushStatusSheet('Подписка снята. Напоминания будут только внутри приложения.');
}
function crsPushStatusSheet(msg) {
  const st = crsStore();
  const s = crsPushStatus();
  const base = (typeof Notification !== 'undefined' && Notification.permission) ? Notification.permission : 'нет';
  crsSheet('Напоминания', '<div class="crs-note" id="crs-push-status" role="status" aria-live="polite">' + esc(msg) + '</div>' +
    '<div class="crs-note" id="crs-push-state">Web Push: ' + (crsPushSupported() ? 'поддерживается' : 'не поддерживается') + ' · разрешение: ' + esc(base) + ' · подписка: ' + ((st.push && st.push.on) ? 'сохранена' : 'нет') + '</div>' +
    '<div class="crs-note">iPhone: установи Tingli на экран «Домой» и включи системные уведомления. Доставка push требует интернет-соединения.</div>' +
    '<div class="crs-lbl">Напоминания о занятиях</div><div class="crs-chips">' +
      '<button class="crs-chip' + (st.rem.lessons.on ? ' on' : '') + '" onclick="crsRemToggle(\'lessons\')">' + (st.rem.lessons.on ? 'включены' : 'выключены') + '</button>' +
      CRS_OFFSETS.map(function (o) {
        return '<button class="crs-chip' + ((st.rem.lessons.offsets || []).indexOf(o.m) >= 0 ? ' on' : '') + '" onclick="crsRemOff(\'lessons\',' + o.m + ')">' + o.t + '</button>';
      }).join('') + '</div>' +
    '<div class="crs-lbl">Напоминания о ДЗ</div><div class="crs-chips">' +
      '<button class="crs-chip' + (st.rem.hw.on ? ' on' : '') + '" onclick="crsRemToggle(\'hw\')">' + (st.rem.hw.on ? 'включены' : 'выключены') + '</button>' +
      CRS_OFFSETS.map(function (o) {
        return '<button class="crs-chip' + ((st.rem.hw.offsets || []).indexOf(o.m) >= 0 ? ' on' : '') + '" onclick="crsRemOff(\'hw\',' + o.m + ')">' + o.t + '</button>';
      }).join('') + '</div>' +
    '<div class="crs-note">Дальше: ' + (crsUpcoming().slice(0, 3).map(function (r) { return crsRemWord(r.when) + ' — ' + r.title; }).join('; ') || 'пока нечего напоминать') + '</div>' +
    '<div class="crs-actions crs-sticky"><button id="crs-push-enable" class="crs-b p" onclick="crsPushEnable()" style="flex:1">Включить Web Push</button>' +
    '<button class="crs-b s" onclick="crsPushDisable()">Снять подписку</button></div>');
}
function crsRemToggle(g) { const st = crsStore(); st.rem[g].on = !st.rem[g].on; crsSave(st); crsPushStatusSheet('Настройка сохранена.'); }
function crsRemOff(g, m) { const st = crsStore(); const a = st.rem[g].offsets || []; const i = a.indexOf(m); if (i < 0) a.push(m); else a.splice(i, 1); st.rem[g].offsets = a; crsSave(st); crsPushStatusSheet('Настройка сохранена.'); }

/* ---------- склейка с приложением ---------- */
function sbToggle() {
  if (document.body.classList.contains('sb-open')) sbClose(); else sbOpen();
}
function crsBoot() {
  try { crsStore(); } catch (e) {}
  try { crsCloudPull(); } catch (e) {}
  setTimeout(function () {
    try { crsPushSyncReminders(); } catch (e) {}
    try { crsPushRefreshSoon(); } catch (e) {}
  }, 2000);
}
document.addEventListener('DOMContentLoaded', crsBoot);
let crsLastResumePull = 0;
function crsRefreshOnResume() {
  if (document.visibilityState === 'hidden') return;
  const now = Date.now();
  if (now - crsLastResumePull < 15000) return;
  crsLastResumePull = now;
  crsPullOnce = false;
  crsCloudPull();
}
window.addEventListener('focus', crsRefreshOnResume);
document.addEventListener('visibilitychange', crsRefreshOnResume);
window.addEventListener('online', crsRefreshOnResume);
/* ================= /CRS_BLOCK_V3 (часть 4) ================= */

goTab('sched');
tryRestore();
updateAppBadge();
// Web Push links can open a specific existing Tingli unit or part.
try {
  const pushParams = new URLSearchParams(location.search);
  const pushUnit = Number(pushParams.get('unit'));
  const pushPartRaw = pushParams.get('part');
  if (Number.isInteger(pushUnit) && pushUnit > 0) setTimeout(function () {
    if (pushPartRaw !== null && Number.isInteger(Number(pushPartRaw)) && typeof openPart === 'function') openPart(pushUnit, Number(pushPartRaw));
    else if (typeof openUnit === 'function') openUnit(pushUnit);
    const clean = new URL(location.href); clean.searchParams.delete('unit'); clean.searchParams.delete('part');
    history.replaceState(null, '', clean.href);
  }, 180);
} catch (e) {}
// Service Worker: офлайн-режим
try { localStorage.removeItem('tingli-offline-v1'); } catch (e) {}
if ('serviceWorker' in navigator) {
  const SW_BUILD = 'msg-2';
  navigator.serviceWorker.register('sw.js?v=' + SW_BUILD, { updateViaCache: 'none' }).catch(() => {});
  navigator.serviceWorker.ready.then(() => offlineRefreshStatus()).catch(() => {});
}
</script>
